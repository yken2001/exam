若番薯細胞內液體的濃度可以用「相當於多少濃度的食鹽水」來表示，最可能是下列何者？`,options:[`0%，因為在清水中質量增加最多`,`介於 1% 和 2% 之間`,`介於 2% 和 4% 之間`,`高於 4%`],answer:`B`,explanation:`【解析】外界濃度低於細胞內時，水分進入細胞，番薯條質量增加；外界濃度較高時水分流出，質量減少。質量由增加（1%）變成減少（2%），表示在 1% 和 2% 之間有某個濃度會使質量不變，這就是與細胞內液體濃度相當的濃度。(A) 在清水中質量增加最多，正表示細胞內濃度比清水高；(C) 2% 和 4% 時質量都減少，表示這些濃度都比細胞內高；(D) 若細胞內濃度高於 4%，在 4% 食鹽水中質量應該增加。故選 (B)。`},{qNo:14,stem:`下列哪一種變化屬於化學變化？`,options:[`冰塊放在室溫下融化成水`,`酒精打開瓶蓋後逐漸揮發`,`砂糖加熱後變成黑褐色的焦糖`,`食鹽放入水中溶解`],answer:`C`,explanation:`【解析】砂糖加熱焦化變黑，產生了與原來性質不同的新物質，屬於化學變化。(A) 融化只是狀態改變；(B) 揮發是液態變成氣態；(D) 溶解後把水蒸乾仍可得到食鹽，沒有產生新物質，這三者都是物理變化。故選 (C)。`},{qNo:15,stem:`右圖是甲、乙、丙三種物質的質量與體積關係（都不溶於水，水的密度為 1 g/cm³）。下列敘述何者正確？`,options:[`把丙放入水中，丙會浮在水面上`,`甲的質量越大，甲的密度就越大`,`取相同質量時，甲的體積最大`,`把乙切成一半，乙的密度變成原來的一半`],answer:`A`,explanation:`【解析】由圖讀出：甲 20 cm³ 時 54 g，密度 2.7 g/cm³；乙 20 cm³ 時 20 g，密度 1.0 g/cm³；丙 20 cm³ 時 16 g，密度 0.8 g/cm³。丙的密度比水小，會浮在水面上。(B) 同一種物質的質量與體積成正比，圖形是通過原點的直線，密度固定不變；(C) 甲的密度最大，相同質量時體積最小；(D) 密度是物質的特性，切成一半後質量和體積都減半，密度不變。故選 (A)。`,figure:`ai/904/science/q15.png`},{qNo:16,stem:`媽媽有 150 公克、重量百分濃度 20% 的糖水，想加水稀釋成 10% 的糖水。需要加入多少公克的水？`,options:[`75 公克`,`300 公克`,`30 公克`,`150 公克`],answer:`D`,explanation:`【解析】150 公克 20% 糖水中含糖 150 × 20%＝30 公克。稀釋時糖的質量不變，10% 糖水的總質量為 30 ÷ 10%＝300 公克，所以要加水 300 − 150＝150 公克。(A) 75 公克是把「濃度減半」誤以為「加入原溶液一半的水」；(B) 300 公克是稀釋後溶液的總質量，不是要加入的水量；(C) 30 公克是溶液中糖的質量。故選 (D)。`},{qNo:17,stem:`鈉原子（Na）失去 1 個電子後，變成鈉離子（Na⁺）。與鈉原子相比，鈉離子的組成有什麼不同？`,options:[`質子數少 1 個，電子數相同`,`質子數和電子數都少 1 個`,`質子數相同，電子數少 1 個`,`中子數少 1 個，所以帶 1 個正電`],answer:`C`,explanation:`【解析】原子變成離子時，原子核（質子、中子）不變，只有電子數改變。鈉原子有 11 個質子、11 個電子，失去 1 個電子後剩 10 個電子，正電比負電多 1，所以帶 1 個正電。(A) 質子在原子核中，形成離子時不會改變；(B) 只有電子數改變；(D) 中子不帶電，中子數也沒有改變，帶正電是因為少了 1 個電子。故選 (C)。`},{qNo:18,stem:`小翔每次取 50 mL 同一瓶稀鹽酸，加入不同質量的碳酸鈣粉末，充分反應後測量產生的二氧化碳質量：
| 碳酸鈣（g） | 2 | 4 | 6 | 8 | 10 |
| 二氧化碳（g） | 0.88 | 1.76 | 2.64 | 3.08 | 3.08 |
若改取 100 mL 同一瓶稀鹽酸，加入 12 公克碳酸鈣粉末，充分反應後最多可產生多少公克二氧化碳？`,options:[`6.16 公克`,`3.08 公克`,`5.28 公克`,`4.40 公克`],answer:`C`,explanation:`【解析】碳酸鈣不足時，每 1 公克碳酸鈣產生 0.44 公克二氧化碳。50 mL 鹽酸最多產生 3.08 公克，可反應的碳酸鈣為 3.08 ÷ 0.44＝7 公克。100 mL 鹽酸可反應 14 公克碳酸鈣，加入的 12 公克會完全反應，產生 12 × 0.44＝5.28 公克二氧化碳。(A) 6.16 是把 3.08 直接乘以 2，但這時碳酸鈣只有 12 公克，不足 14 公克，碳酸鈣才是用完的一方；(B) 鹽酸加倍，能反應的碳酸鈣也加倍，產量不會停在 3.08；(D) 4.40 是只讓 10 公克碳酸鈣反應的結果。故選 (C)。`},{qNo:19,stem:`取 10 mL、pH 值為 2 的稀鹽酸，加入蒸餾水稀釋成 1000 mL。稀釋後溶液的 pH 值最可能是下列何者？`,options:[`等於 7`,`大於 2，但小於 7`,`大於 7`,`小於 2`],answer:`B`,explanation:`【解析】加水稀釋時，溶液中的氫離子總數不變，但體積變大，氫離子濃度變小，酸性減弱，pH 值變大；但溶液中仍有鹽酸，仍是酸性，pH 值小於 7。(A) 加水只能使酸性變弱，不會使溶液變成中性；(C) 水本身是中性，加水不可能使溶液變成鹼性；(D) 氫離子濃度變小，pH 值應變大而不是變小。故選 (B)。`},{qNo:20,stem:`右圖甲～丁的方框中，●、○ 和灰色圓分別代表三種不同元素的原子，相連在一起的原子表示一個分子。哪一個方框表示「由兩種化合物組成的混合物」？`,options:[`丁`,`乙`,`丙`,`甲`],answer:`C`,explanation:`【解析】丙中有兩種分子：一種由黑、白兩種原子組成，另一種由一個灰色原子和兩個白色原子組成。兩種分子都含有不同種類的原子，都是化合物，混在一起就是兩種化合物組成的混合物。(A) 丁也是混合物，但兩種分子分別只由一種原子組成（●● 和 ○○），是兩種元素組成的混合物；(B) 乙只有一種分子，是純物質（化合物）；(D) 甲只有一種原子，是元素。故選 (C)。`,figure:`ai/904/science/q20.png`},{qNo:21,stem:`小明在一條筆直的走道上行走，他與起點的距離和時間的關係如右圖。關於小明在 0～10 秒內的運動，下列敘述何者正確？`,options:[`0～10 秒的平均速率為 0 m/s；6～10 秒的運動方向與 0～4 秒相反`,`0～10 秒的平均速率為 1.6 m/s；6～10 秒的運動方向與 0～4 秒相反`,`0～10 秒的平均速率為 1.6 m/s；6～10 秒的運動方向與 0～4 秒相同`,`0～10 秒的平均速率為 2 m/s；6～10 秒的運動方向與 0～4 秒相反`],answer:`B`,explanation:`【解析】0～4 秒離起點越來越遠，走了 8 m；4～6 秒距離不變，停在原地；6～10 秒距離由 8 m 減為 0，表示往回走 8 m，方向與 0～4 秒相反。平均速率＝總路徑長 ÷ 總時間＝(8＋8) ÷ 10＝1.6 m/s。(A) 0 是用位移（回到起點，位移為 0）計算的平均速度，不是平均速率；(C) 6～10 秒距離在減少，是往回走；(D) 2 m/s 是行走時（0～4 秒或 6～10 秒）的速率，平均速率要把停留的 2 秒也算進總時間。故選 (B)。`,figure:`ai/904/science/q21.png`},{qNo:22,stem:`質量 2 公斤的木塊放在水平桌面上，用水平拉力拉動。拉力為 6 牛頓時，木塊恰好等速前進；把拉力增加為 10 牛頓（摩擦力大小不變），木塊的加速度大小為多少？`,options:[`5 m/s²`,`3 m/s²`,`2 m/s²`,`8 m/s²`],answer:`C`,explanation:`【解析】等速前進時木塊所受合力為 0，摩擦力等於拉力 6 牛頓。拉力增為 10 牛頓時，合力＝10 − 6＝4 牛頓，加速度＝合力 ÷ 質量＝4 ÷ 2＝2 m/s²。(A) 5 是用 10 ÷ 2，忽略了摩擦力；(B) 3 是用 6 ÷ 2，把等速時的拉力當成合力；(D) 8 是把拉力和摩擦力相加（16 ÷ 2），摩擦力的方向與拉力相反，應該相減。故選 (C)。`},{qNo:23,stem:`一艘貨船從河口的淡水區駛入密度較大的海水區，船上載的貨物不變。與在淡水中相比，船在海水中所受的浮力及船身的位置有什麼變化？`,options:[`浮力變大，船身會稍微上浮`,`浮力不變，船身會稍微上浮`,`浮力變大，船身會稍微下沉`,`浮力不變，船身會稍微下沉`],answer:`B`,explanation:`【解析】船漂浮時，浮力等於船和貨物的總重量，總重量不變，所以浮力不變。由「浮力＝液體密度 × 沒入液體的體積」，海水密度較大，排開較少體積的海水就能產生相同的浮力，所以船身沒入水中的部分變少，稍微上浮。(A) 漂浮時浮力等於重量，重量不變，浮力不會變大；(C) 浮力不變，且海水密度大，船身會上浮而不是下沉；(D) 浮力不變正確，但密度較大的液體中沒入的體積較少，船身應上浮。故選 (B)。`},{qNo:24,stem:`工人用一個動滑輪，把重量為 40 公斤重的貨物等速提高 1.5 公尺（滑輪與繩子的重量、摩擦力都不計）。下列敘述何者正確？`,options:[`拉力為 20 公斤重，繩子要拉 3 公尺，對貨物作的功與直接把它提高相同`,`拉力為 20 公斤重，繩子只要拉 1.5 公尺，作的功只有直接提高的一半`,`拉力為 40 公斤重，繩子要拉 1.5 公尺，作的功與直接提高相同`,`拉力為 20 公斤重，繩子要拉 3 公尺，作的功是直接提高的 2 倍`],answer:`A`,explanation:`【解析】動滑輪由兩段繩子共同拉住貨物，拉力只要貨物重量的一半，20 公斤重；但貨物升高 1.5 公尺時，兩段繩子都要縮短 1.5 公尺，所以繩子要拉 3 公尺。拉力作功＝20 × 3＝60 公斤重·公尺，等於直接提高的 40 × 1.5＝60 公斤重·公尺：省力，但不省功。(B) 省了力就要多移動距離，繩子要拉 3 公尺，功也沒有變少；(C) 拉力 40 公斤重、拉繩 1.5 公尺是定滑輪的情形；(D) 20 × 3＝60，與直接提高的功相同，不是 2 倍。故選 (A)。`},{qNo:25,stem:`家中的冷氣機通常裝在靠近天花板的牆面高處，主要是利用下列哪一個原理？`,options:[`冷空氣的密度較小會上升，使室內空氣產生對流`,`熱主要以傳導的方式由高處傳到低處`,`冷空氣在高處較不容易以輻射的方式散失`,`冷空氣的密度較大會下沉，使室內空氣產生對流`],answer:`D`,explanation:`【解析】冷氣機吹出的冷空氣密度較大而下沉，室內較熱的空氣密度較小而上升，被冷氣機吸入冷卻，如此形成對流，使整個房間較快變涼。(A) 冷空氣密度較大，會下沉不會上升；(B) 空氣是熱的不良導體，房間降溫主要靠對流而非傳導；(C) 冷氣機裝高處與輻射無關。故選 (D)。`},{qNo:26,stem:`舞台上只用綠色光照射一位穿白色上衣、紅色裙子的演員。觀眾看到這位演員的上衣和裙子分別是什麼顏色？`,options:[`上衣白色、裙子紅色`,`上衣綠色、裙子紅色`,`上衣綠色、裙子黑色`,`上衣白色、裙子黑色`],answer:`C`,explanation:`【解析】物體的顏色決定於它反射的色光。白色上衣能反射各種色光，只照綠光時反射綠光，看起來是綠色；紅色裙子只反射紅光，會吸收綠光，沒有光反射到眼睛，看起來是黑色。(A) 這是在白光下看到的顏色；(B) 紅色裙子沒有紅光可以反射，不會呈現紅色；(D) 白色上衣只能反射照到它的綠光，看起來是綠色而不是白色。故選 (C)。`},{qNo:27,stem:`小華家某個插座迴路的電壓為 110 V，裝有 15 A 的無熔絲開關（通過的總電流超過 15 A 就會跳脫斷電）。此迴路上有下列電器：

若只同時使用其中兩種電器，哪一種組合會使無熔絲開關跳脫？`,options:[`電暖器和電風扇`,`吹風機和電風扇`,`電鍋和電風扇`,`電鍋和吹風機`],answer:`D`,explanation:`【解析】家用電器都是並聯，每個電器的電流＝功率 ÷ 電壓：電鍋 8 A、吹風機 10 A、電暖器 12 A、電風扇 0.5 A。總電流等於各電器電流的和：電鍋＋吹風機＝18 A，超過 15 A 會跳脫。(A) 電暖器功率最大，但加上電風扇只有 12.5 A；(B) 吹風機＋電風扇＝10.5 A；(C) 電鍋＋電風扇＝8.5 A，都不超過 15 A。故選 (D)。`},{qNo:28,stem:`小安用標示 1000 W 的電熱水壺，把 1 公斤、20°C 的水加熱到 80°C，實際用了 5 分鐘。已知水的比熱為 1 cal/g·°C，1 卡＝4.2 焦耳。這段時間內，水吸收的熱量約占電熱水壺消耗電能的百分之多少？`,options:[`16%`,`20%`,`100%，因為能量守恆`,`84%`],answer:`D`,explanation:`【解析】水吸收的熱量＝1000 g × 1 cal/g·°C × (80 − 20)°C＝60000 卡＝60000 × 4.2＝252000 焦耳。消耗的電能＝1000 W × 300 秒＝300000 焦耳。252000 ÷ 300000＝0.84，約 84%。(A) 16% 是散失到壺身和空氣中的比例；(B) 20% 是沒有把「卡」換算成「焦耳」就直接相除（60000 ÷ 300000）；(C) 能量守恆是指總能量不變，但有一部分電能變成壺身與周圍空氣的熱，沒有全部被水吸收。故選 (D)。`},{qNo:29,stem:`一條直導線沿南北方向水平放置，正下方放一個指北針，指北針靜止時 N 極指向北方，與導線平行。當導線通以由南向北的電流時，指北針的 N 極會如何偏轉？（地磁的影響仍存在）`,options:[`向西偏轉`,`向東偏轉`,`不偏轉，因為電流方向與指針方向平行`,`轉 180°，改為指向南方`],answer:`A`,explanation:`【解析】依右手定則，右手拇指指向電流方向（向北），四指彎曲的方向就是磁場方向：導線正下方的磁場方向朝西。指北針 N 極受到向西的磁力，加上原本的地磁作用，會由北方向西偏轉。(B) 方向判斷反了；電流若改為由北向南，N 極才會向東偏；(C) 電流產生的磁場環繞導線，在導線下方是東西方向，與指針垂直，會使指針偏轉；(D) 導線下方的磁場方向是朝西，不是朝南，且仍有地磁作用，N 極只會偏向西方。故選 (A)。`},{qNo:30,stem:`右圖是用同一部儀器、相同設定記錄到的甲、乙兩個聲音的波形。與乙相比，甲聲音的響度和音調為何？`,options:[`響度較大，音調較低`,`響度較大，音調較高`,`響度較小，音調較低`,`響度較小，音調較高`],answer:`A`,explanation:`【解析】振幅越大，響度越大；相同時間內振動的次數越多（頻率越高），音調越高。甲的振幅是乙的 2 倍，響度較大；相同時間內甲振動 2 次、乙振動 4 次，甲的頻率較低，音調較低。(B) 甲在相同時間內的波數較少，頻率較低，音調較低；(C) 甲的振幅較大，響度較大；(D) 響度和音調都判斷反了。故選 (A)。`,figure:`ai/904/science/q30.png`},{qNo:31,stem:`野柳地質公園的「女王頭」是一塊蕈狀岩：上方的岩層較堅硬，下方較軟。數十年來，女王頭的「頸部」越來越細。造成頸部變細的主要作用是下列何者？`,options:[`板塊互相擠壓，使岩層隆起變形`,`沉積物不斷堆積，經壓密與膠結作用`,`地底岩漿侵入岩層後冷卻凝固`,`風化與侵蝕作用，較軟的岩層被侵蝕得較快`],answer:`D`,explanation:`【解析】女王頭長期受到風吹、雨淋、海浪與鹽分作用，岩石逐漸崩解（風化）並被帶走（侵蝕）。頸部的岩層較軟，被侵蝕得比上方硬岩快，所以越來越細，這是差異侵蝕的結果。(A) 板塊擠壓會使岩層隆起或褶皺，不會使頸部變細；(B) 沉積、壓密與膠結是形成沉積岩的過程，會使物質增加而不是減少；(C) 岩漿冷卻形成的是火成岩，與頸部變細無關。故選 (D)。`},{qNo:32,stem:`下表是太陽系部分行星與太陽的平均距離和公轉週期：

同一年的 12 月 22 日，這四個城市中哪一個的白晝最長？`,options:[`赫爾辛基`,`雪梨`,`新加坡`,`臺北`],answer:`B`,explanation:`【解析】6 月 21 日太陽直射北回歸線，北半球緯度越高白晝越長，南半球則白晝較短（雪梨不到 10 小時）。12 月 22 日太陽直射南回歸線，情形正好相反：南半球的雪梨白晝最長（約 14 時 25 分），赫爾辛基不到 6 小時，新加坡在赤道附近全年約 12 小時，臺北約 10 時半。(A) 赫爾辛基夏至白晝最長，但冬至時白晝反而最短；(C) 新加坡接近赤道，全年白晝都約 12 小時，比此時的雪梨短；(D) 12 月時臺北位於北半球，白晝短於 12 小時。故選 (B)。`},{qNo:35,stem:`「清除積水」能減少屈公病傳播，最主要的原因是下列何者？`,options:[`斑蚊把卵產在積水中，幼蟲（孑孓）在水中生活，清除積水可減少下一代成蚊`,`屈公病毒生活在積水中，清除積水病毒就無法存活`,`清除積水可以直接殺死已經會飛的成蚊`,`清除積水可以使人體對屈公病毒產生抵抗力`],answer:`A`,explanation:`【解析】斑蚊的卵和幼蟲（孑孓）、蛹都要在水中發育。清除積水就是清除孳生源，讓蚊子無法完成生活史，下一代成蚊減少，病毒的傳播也跟著減少。(B) 屈公病毒是藉著蚊子叮咬，在人和蚊子體內傳播，不是生活在積水中；(C) 已經會飛的成蚊要靠噴藥、捕蚊等方式撲滅，清積水針對的是卵和幼蟲；(D) 人體對病毒產生抵抗力要靠免疫反應，與清除積水無關。故選 (A)。`},{qNo:36,stem:`關於「以蚊治蚊」的兩種方法，下列敘述何者正確？`,options:[`絕育雄蚊會搶著叮咬人體，減少雌蚊吸血的機會；兩種幼蟲是競爭關係`,`絕育雄蚊與雌蚊交配後，雌蚊產下的卵無法發育成下一代；華麗巨蚊幼蟲與病媒蚊幼蟲是捕食關係`,`絕育雄蚊與雌蚊交配後，雌蚊產下的卵無法發育成下一代；兩種幼蟲是寄生關係`,`絕育雄蚊會把不能生育的特徵遺傳給下一代，使蚊子逐代減少；兩種幼蟲是捕食關係`],answer:`B`,explanation:`【解析】雌蚊與不能生育的雄蚊交配，產下的卵無法孵化，病媒蚊的下一代就會減少。華麗巨蚊的幼蟲吃掉病媒蚊的幼蟲，一方是捕食者、一方是獵物，屬於捕食關係。(A) 文中說明雄蚊不叮人吸血，且吃掉對方屬於捕食，不是競爭；(C) 寄生是寄生者生活在寄主身上或體內、從寄主獲得養分，「吃掉」對方是捕食；(D) 絕育雄蚊不能產生後代，就無法把特徵遺傳下去，減少的原因是雌蚊的卵無法發育。故選 (B)。`},{qNo:37,stem:`治療前，KJ 必須嚴格限制蛋白質的攝取，最主要的原因是下列何者？`,options:[`蛋白質無法在他的小腸中被消化吸收，會堆積在消化道`,`他的腎臟無法把尿素排出體外，所以要減少尿素的產生`,`蛋白質分解會產生氨，他的肝臟無法有效地把氨轉變成尿素，氨會在血液中累積`,`蛋白質進入血液後會直接變成尿素，傷害他的腦部`],answer:`C`,explanation:`【解析】文中說明 CPS1 酵素負責把蛋白質分解產生的氨轉變成尿素。KJ 缺乏這種酵素，吃進越多蛋白質，產生的氨越多，又無法轉變成尿素，氨便在血液中累積，傷害腦部。(A) 他的問題在肝臟處理氨，不在小腸的消化吸收；(B) 他的困難是「製造」尿素，不是腎臟排出尿素；(D) 傷害腦部的是累積的氨，而尿素正是無法順利產生的物質。故選 (C)。`},{qNo:38,stem:`根據上文，下列敘述何者最合理？`,options:[`藥物由靜脈注射，所以 KJ 全身每一個細胞的 CPS1 基因都會被修正`,`基因是由蛋白質構成的，所以修正基因就是直接改變 CPS1 酵素的構造`,`這次治療修正的是肝臟細胞中的基因，KJ 將來產生的精子仍可能帶有出錯的 CPS1 基因`,`KJ 的疾病是出生後吃了太多蛋白質，使基因發生突變所造成的`],answer:`C`,explanation:`【解析】藥物被肝臟細胞吸收，修正的是肝細胞的基因；精子由睪丸中的細胞經減數分裂產生，這些細胞的基因沒有被修正，所以 KJ 將來的精子仍可能帶有出錯的基因，可能傳給下一代。(A) 文中說明藥物由肝臟細胞吸收，不是全身每個細胞都被修正；(B) 基因位於 DNA 上，修正的是 DNA 的鹼基，再由基因決定製造出正常的酵素；(D) KJ 出生不久就被診斷出這種病，基因缺陷是與生俱來的，不是飲食造成的。故選 (C)。`},{qNo:39,stem:`關於這次地震的成因，下列敘述何者最合理？`,options:[`菲律賓海板塊與歐亞板塊互相遠離，使地殼張裂而產生地震`,`地底的岩漿上升噴出地表，引起火山爆發而產生地震`,`太平洋板塊與歐亞板塊在嘉義地底張裂分離而產生地震`,`菲律賓海板塊與歐亞板塊互相擠壓，岩層累積的能量突然釋放，使岩層斷裂錯動`],answer:`D`,explanation:`【解析】臺灣位於菲律賓海板塊與歐亞板塊的聚合交界，兩板塊互相擠壓，岩層長期累積應力，超過岩石能承受的限度時突然斷裂錯動，釋放能量產生地震。這次震源深度不到 10 公里，屬於淺層地震。(A) 兩板塊在臺灣是互相聚合擠壓，不是互相遠離；(B) 嘉義地區沒有火山活動，這次是構造性地震；(C) 臺灣附近與歐亞板塊交界的主要是菲律賓海板塊，且是擠壓而非張裂。故選 (D)。`},{qNo:40,stem:`根據表中資料，下列推論何者正確？`,options:[`臺北市的震度為 2 級，表示臺北市測到的地震規模為 2`,`震度 5 弱地區受到的搖晃程度，比 6 弱地區更劇烈`,`同一縣內不同地點的震度可能不同`,`臺中市與花蓮縣的震度相同，表示兩地與震央的距離相同`],answer:`C`,explanation:`【解析】表中嘉義縣大埔為 6 弱、番路為 5 弱，同一縣內各地震度不同。震度表示各地搖晃的劇烈程度，受到與震央的距離、地質條件等因素影響。(A) 一次地震只有一個規模（6.4），各地不同的是震度；(B) 震度分級中 6 弱比 5 弱高，6 弱地區搖晃得更劇烈；(D) 震度除了與距離有關，也受地質條件等因素影響，震度相同不能推知距離相同。故選 (C)。`},{qNo:41,stem:`丹娜絲登陸後短短幾小時就由中度颱風減弱為輕度颱風，下列何者是最合理的解釋？`,options:[`登陸後颱風中心的氣壓變得更低，使風力減弱`,`登陸後失去溫暖海面供應的大量水氣，又受到高山地形阻擋，結構被破壞`,`颱風的能量主要來自陽光直接照射，深夜登陸照不到陽光而減弱`,`登陸後颱風移動的速度變慢，所以風力跟著減弱`],answer:`B`,explanation:`【解析】颱風的能量主要來自溫暖海面蒸發的大量水氣，水氣上升凝結時放出熱量。登陸後水氣供應大減，地面摩擦與中央山脈又破壞了颱風的環流結構，所以強度迅速減弱。(A) 颱風中心氣壓越低，與周圍的氣壓差越大，風力越強；減弱時中心氣壓是升高；(C) 颱風的能量來源是水氣凝結放出的熱，不是陽光直接照射，夜間在海上的颱風仍可增強；(D) 颱風風力的大小主要取決於中心與四周的氣壓差，不是由移動速度決定；丹娜絲減弱是因為失去水氣來源並受地形破壞。故選 (B)。`},{qNo:42,stem:`颱風是一個強烈的低氣壓。在北半球，颱風範圍內近地面的空氣如何流動？`,options:[`以逆時針方向旋轉，向中心輻合後上升，上升的空氣冷卻凝結成雲而降雨`,`以順時針方向旋轉，向中心輻合後上升，上升的空氣冷卻凝結成雲而降雨`,`以逆時針方向旋轉，由中心向外輻散並下沉，使天氣晴朗`,`以順時針方向旋轉，由中心向外輻散並下沉，使天氣晴朗`],answer:`A`,explanation:`【解析】低氣壓中心的氣壓較低，近地面空氣由四周流向中心（輻合），在北半球受地球自轉影響呈逆時針方向旋轉；輻合的空氣在中心附近上升，冷卻凝結成雲，帶來強風豪雨。(B) 北半球低氣壓的風向是逆時針，順時針是北半球高氣壓；(C) 向外輻散並下沉是高氣壓的特徵；(D) 這是北半球高氣壓的情形。故選 (A)。`},{qNo:43,stem:`根據紀錄，月出時刻平均每天約延後多久？造成這種現象的主要原因是什麼？`,options:[`約 50 分鐘；月球繞地球公轉的方向與地球自轉的方向相反`,`約 50 分鐘；月球繞地球公轉的方向與地球自轉的方向相同`,`約 40 分鐘；月球繞地球公轉的方向與地球自轉的方向相同`,`約 1 小時；地球繞太陽公轉，使每天的時間變長`],answer:`B`,explanation:`【解析】第一天到第五天共 4 天，月出由 08:55 延後到 12:17，共 202 分鐘，平均每天約 202 ÷ 4 ≈ 50 分鐘。月球每天在軌道上向東移動約 13°，與地球自轉方向相同，地球要多轉一些（約 50 分鐘）才能再次看到月亮升起。(A) 時間計算正確，但月球公轉與地球自轉的方向相同（都是由西向東）；(C) 202 ÷ 4 約 50，不是 40；(D) 每天延後約 50 分鐘，不到 1 小時，且原因是月球公轉而不是地球公轉。故選 (B)。`},{qNo:44,stem:`第五天傍晚約 18 時太陽剛下山時，小芸看到的上弦月最可能位於天空的哪個方向？月亮明亮的一面朝向哪一邊？`,options:[`位於南方天空，明亮的一面朝向東方`,`位於南方天空，明亮的一面朝向西方`,`位於東方地平線附近，明亮的一面朝向西方`,`位於西方地平線附近，明亮的一面朝向東方`],answer:`B`,explanation:`【解析】上弦月約在中午前後升起（第五天月出 12:17），約 6 小時後的傍晚約在南方天空最高處附近。月亮明亮的一面是被太陽照亮的一面，傍晚太陽在西方，所以亮面朝西。(A) 位置正確，但亮面應朝向太陽所在的西方；(C) 傍晚剛升起、位於東方地平線附近的是滿月；(D) 傍晚位於西方低空的是農曆初二、三的眉月，而且亮面也會朝向西方的太陽。故選 (B)。`},{qNo:45,stem:`石頭的重量為多少？`,options:[`95 gw`,`90 gw`,`35 gw`,`45 gw`],answer:`D`,explanation:`【解析】由圖可知，在 60 gw 以內，每增加 10 gw，彈簧伸長 2 cm，原長為 10 cm。掛石頭時全長 19 cm，伸長量＝19 − 10＝9 cm，石頭重＝9 ÷ 2 × 10＝45 gw。(A) 95 是把彈簧全長 19 cm 當成伸長量計算；(B) 90 是誤以為每伸長 1 cm 代表 10 gw；(C) 35 是把掛 10 gw 時的長度 12 cm 誤當成原長（19 − 12＝7 cm），彈簧的原長是不掛砝碼時的 10 cm。故選 (D)。`},{qNo:46,stem:`石頭的密度約為多少 g/cm³？（水的密度為 1 g/cm³）`,options:[`1.8`,`2.25`,`0.44`,`1.25`],answer:`B`,explanation:`【解析】石頭在水中時彈簧伸長 5 cm，視重為 25 gw，所以浮力＝45 − 25＝20 gw。完全浸入水中時，排開水的重量等於浮力，排開水的體積為 20 cm³，就是石頭的體積。密度＝45 g ÷ 20 cm³＝2.25 g/cm³。(A) 1.8 是把水中的視重 25 gw 當成體積（45 ÷ 25）；(C) 0.44 是把體積除以質量（20 ÷ 45），倒過來算了；(D) 1.25 是用視重除以浮力（25 ÷ 20）。故選 (B)。`},{qNo:47,stem:`小廷想用這條彈簧測量一個約 80 gw 的物體，老師說這樣測得的結果不準確。根據右圖，最主要的原因是什麼？`,options:[`所掛重量超過約 60 gw 後，彈簧伸長量與所掛重量不再成正比，無法用原來的比例換算`,`所掛重量超過 60 gw 後，彈簧的伸長量反而變小`,`彈簧的伸長量與所掛重量成反比，重量越大越難測量`,`只要彈簧沒有斷，伸長量都與所掛重量成正比，老師的說法不對`],answer:`A`,explanation:`【解析】由圖可知，0～60 gw 時圖形是直線，每 10 gw 伸長 2 cm；超過 60 gw 後，每 10 gw 伸長 3 cm、4 cm，圖形變成向上彎曲，表示已超過彈簧的彈性限度，伸長量與外力不再成正比，用原來的比例換算會產生誤差，彈簧也可能無法恢復原長。(B) 超過 60 gw 後伸長得更多，不是變小；(C) 在彈性限度內，伸長量與重量成正比，不是反比；(D) 圖中 60 gw 以後已不再是直線，超過彈性限度後就不成正比。故選 (A)。`},{qNo:48,stem:`依據實驗結果，鎂、鋅、X、銅四種金屬的活性由大到小排列為何？`,options:[`X＞鎂＞鋅＞銅`,`鎂＞X＞鋅＞銅`,`鎂＞鋅＞X＞銅`,`銅＞鋅＞X＞鎂`],answer:`B`,explanation:`【解析】各組都以銅為另一片金屬，電壓越大表示該金屬與銅的活性相差越大，也就是活性越大。電壓大小為鎂（1.6 V）＞X（1.2 V）＞鋅（0.9 V），銅的活性最小，所以活性為鎂＞X＞鋅＞銅。(A) X 的電壓 1.2 V 比鎂的 1.6 V 小，活性應比鎂小；(C) X 的電壓比鋅大，活性應比鋅大；(D) 把順序完全弄反了，電壓越大表示活性越大。故選 (B)。`},{qNo:49,stem:`關於「鋅–銅」檸檬電池，下列敘述何者正確？`,options:[`銅片是負極，電子經由導線從銅片流向鋅片`,`鋅片是負極，電子經由導線從銅片流向鋅片`,`鋅片是負極，電子經由檸檬汁從鋅片流向銅片`,`鋅片是負極，電子經由導線從鋅片流向銅片`],answer:`D`,explanation:`【解析】鋅的活性比銅大，鋅失去電子成為負極。電子由負極經外部導線流向正極（銅片），在電壓計中產生讀數。(A) 活性較大的鋅才是負極；(B) 電子由負極流出，應從鋅片流向銅片；(C) 電子經由外部導線流動，檸檬汁中是靠離子移動來導電。故選 (D)。`},{qNo:50,stem:`若把 X 和鋅兩種金屬片插入同一顆檸檬中組成電池，哪一種金屬是負極？電壓最接近多少？`,options:[`鋅是負極；約 0.3 V`,`X 是負極；約 0.3 V`,`X 是負極；約 2.1 V`,`鋅是負極；約 2.1 V`],answer:`B`,explanation:`【解析】X 的活性比鋅大，X 失去電子成為負極。由「鋅–鐵」0.4 V 恰好等於「鋅–銅」0.9 V 減去「鐵–銅」0.5 V，可知兩種金屬組成的電池電壓約等於它們分別與銅組成電池的電壓差，所以 X–鋅約為 1.2 − 0.9＝0.3 V。(A) 電壓的推算正確，但活性較大的 X 才是負極；(C) 2.1 V 是把兩個電壓相加，應該相減；(D) 負極和電壓都判斷錯了。故選 (B)。`}],verification:[`2026-10-09 依 SPEC_AI2_AI3.md 的 AI-4（會考水準）規格出題，參照 114／115 年真題；數值答案由 tools/ai_sets/ai4_science.py 計算並以 check 驗證，7 張附圖依數據繪製並經檢視。`,`2026-10-09 獨立作答者 1（Claude Opus，看不到答案）50/50、獨立作答者 2（Claude Sonnet）50/50 與答案卷一致，0 題有異議；兩者皆核對附圖與數據相符。難度（同一評分標準）：114 年真題 2.62、本卷 Opus 2.30／Sonnet 2.44。`,`2026-10-09 獨立事實查核：2025 嘉義大埔地震震度表、颱風丹娜絲、佛山屈公病、KJ 個人化基因編輯、晝長表逐筆確認；刪去「嘉南近 30 年」一句、基因修正改為「其中一個」、土星距離改 9.54 AU、解析刪去超出國中範圍的「被氧化」，答案不變。tools/check_ai_set.py 0 問題。`,`2026-10-09 最終複查（定稿前）：獨立稽核者（Claude Opus）拿答案與解析逐題核對（答案唯一性、計算、事實、附圖、文字），另由 Claude Opus 與 Claude Sonnet 各自重新盲解全卷，答案全部與答案卷一致；稽核指出的解析措辭、誘答與解析不一致、真實事件的相對時間（改為確切年份）與文言異文（以多版本比對後採通行本）均已修正，修正過的題目再由兩個模型重新盲解一致；答案卷未變動。`]},uo={set:`AI-4`,year:904,subject:`社會`,title:`AI-4 社會模擬卷（會考水準）`,difficulty:`會考水準`,note:`由 AI 依會考社會科（歷史、地理、公民各 18 題）命題範圍編寫的模擬卷，非會考真題。難度定位「會考水準」：題數、題型與難度分布比照近年會考，以史料判讀、地圖與統計資料、公民情境為主，並以 2025–2026 年真實時事（洛杉磯野火、新臺幣急升、「基隆 400」、育嬰留職停薪以日申請）為素材（來源見 topics）。計算題答案由程式驗證，附圖由程式依題目數據繪製（tools/ai_sets/ai4_social.py）。`,topics:[`時事：2025 年 1 月洛杉磯野火（1/7 起、帕利塞茲與伊頓兩場最嚴重、燒毀或損壞建築 18,000 棟以上、官方統計 31 人死亡、聖塔安娜風陣風可達每小時約 100 英里、2022–23 與 2023–24 雨季雨多草木茂盛、2024 年夏末後乾燥、有紀錄以來最乾的雨季開端）: https://en.wikipedia.org/wiki/January_2025_Southern_California_wildfires`,`同上，起火日、死亡人數（Eaton 19、Palisades 12）與聖塔安娜風: https://www.foxla.com/news/california-wildfires-gallery-one-year-later`,`洛杉磯市中心氣候平年值（NOAA 1991–2020，各月日均溫與降水量）: https://en.wikipedia.org/wiki/Climate_of_Los_Angeles`,`時事：2025 年 5 月新臺幣急升（4/30 收 32.017、5/2 收 31.064 升 9.53 角、5/5 收 30.145 升 9.19 角）: https://technews.tw/?p=1378950 ；https://www.ctee.com.tw/news/20250505701380-430302`,`時事：基隆市 2026「基隆 400」系列活動，紀念 1626 年西班牙船隊登陸和平島（社寮島）、建聖薩爾瓦多城: https://www.mirrormedia.mg/story/20251230cnt004 ；https://www.1111.com.tw/news/jobns/164361`,`時事：「育嬰留職停薪以日申請」2026/1/1 上路（子女滿 3 歲前最長 2 年、其中合計 30 日可按日申請、期間仍有八成薪資補貼、30 人以下事業單位逾 97%、小型企業雇主獎勵）: https://www.ey.gov.tw/Page/448DE008087A1971/6df7b592-6113-4020-bab8-de4487f6f187 ；https://www.1111.com.tw/news/163831/amp/ ；https://www.mol.gov.tw/1607/1632/1633/85924/post`,`史料原文（維基文庫逐字核對）：《晉書·劉毅傳》「上品無寒門，下品無勢族」: https://zh.wikisource.org/w/index.php?title=%E6%99%89%E6%9B%B8/%E5%8D%B7045&action=raw`,`歷史（課綱範圍）：荷蘭贌社、清代水圳、日治公共衛生、十大建設、北魏孝文帝漢化、唐代長安、魏晉九品官人法與隋唐科舉、辛亥革命、改革開放、馬戛爾尼使節團、漢摩拉比法典、哥倫布大交換、雅典民主、一戰與英國婦女投票權（1918 年 30 歲以上）、1960 非洲年、西班牙與荷蘭在臺灣北部`,`地理（課綱範圍）：澎湖玄武岩方山、西伯利亞河川凌汛、中國熟制、印度資訊服務業、薩赫爾沙漠化、大自流盆地、美國陽光帶、雪山隧道、新加坡、彭巴草原、荷蘭圩田、日本太平洋帶狀工業帶、北極航道、等高線（虛構地形）、地中海型氣候、時區`,`公民（課綱範圍）：勞動三權、社會保險與社會救助、監察院審計權、國家賠償、肖像權、子女姓氏（民法第 1059 條）、公聽會、鄉鎮市調解（調解條例第 27 條）、告訴乃論（刑事訴訟法第 237、238 條）、直接稅與間接稅、聯合行為（公平交易法）、我族中心主義、個人資料保護、地方預算（虛構數據）、匯率、育嬰留職停薪`],groups:[{from:43,to:44,passage:`附圖為某山區的等高線地形圖（虛構地形，等高距 20 公尺），▲為山頂，甲、乙、丙、丁為四個地點，虛線 X 為一條登山步道。請根據圖回答問題。`,figure:`ai/904/social/q43.png`},{from:45,to:47,passage:`2026 年，基隆市以「基隆 400」為主題舉辦系列活動，紀念 1626 年西班牙船隊經三貂角，占領社寮島（今和平島），並在島上興建聖薩爾瓦多城。此後西班牙人又在淡水興建聖多明哥城，並派遣傳教士在北部傳布天主教。1642 年，盤據臺灣南部的另一個歐洲勢力北上，攻下聖薩爾瓦多城，西班牙人從此離開臺灣。

繳費，由政府經審核後提供，屬於「社會救助」。(A) 兩者對調了；(B) 陳伯伯沒有繳保費，生活扶助不是保險給付；(D) 阿珠有按月繳費，健保不是經審核才給予的救助。故選 (C)。`},{qNo:7,stem:`日治初期，臺灣常爆發鼠疫、霍亂、瘧疾等傳染病。臺灣總督府陸續在都市興建自來水與下水道、推動預防接種、要求住家定期大掃除，並設立醫學校培養醫師。此後臺灣的傳染病死亡人數逐漸下降。關於這些措施，下列敘述何者最適當？`,options:[`這些措施是由臺灣人自行組織推動，目的在爭取臺灣自治`,`改善衛生環境有利於日本人在臺灣生活與統治，也使臺灣人的死亡率下降`,`這些措施是延續清末劉銘傳的新政，由清朝官員主持`,`這些措施使臺灣人口在日治時期持續減少`],answer:`B`,explanation:`【解析】總督府推動公共衛生，一方面是為了讓來臺的日本官員、軍人能安心生活，便於統治與開發；另一方面傳染病減少，也使臺灣人的死亡率下降。(A) 這些是殖民政府由上而下推動的政策，並非臺灣人爭取自治的行動；(C) 1895 年後臺灣已由日本統治，不可能由清朝官員主持；(D) 死亡率下降會使人口增加，日治時期臺灣人口是持續成長的。故選 (B)。`},{qNo:8,stem:`下表為中國三個地區的農業與氣候資料：

根據表中資料推論，下列敘述何者最合理？`,options:[`甲地冬季嚴寒，小麥難以在田中過冬，因此在春天播種`,`乙地冬季氣溫低於 0°C，因此一年只能收穫一次`,`丙地冬季寒冷乾燥，因此以耐旱的作物為主`,`由甲到丙，緯度逐漸升高，作物的生長季也越長`],answer:`A`,explanation:`【解析】甲地 1 月均溫約 −17°C，冬季嚴寒，秋播的小麥無法過冬，只能春天播種、秋天收穫，所以是一年一熟的春小麥區（相當於東北）。(B) 表中乙地是兩年三熟，比一年一熟多；冬小麥可以在冬季低溫中過冬；(C) 丙地 1 月均溫約 14°C，冬季溫暖，並以需水量多的稻米為主，不是耐旱作物；(D) 由甲到丙 1 月氣溫越來越高、生長季越長，表示緯度是逐漸「降低」。故選 (A)。`},{qNo:9,stem:`某市興建運動中心，完工後被發現經費的使用有浮報的情形。依我國憲政體制，負責審核政府各機關經費支出是否合法、正確的「審計權」，屬於哪一個機關？`,options:[`立法院`,`行政院`,`監察院`,`司法院`],answer:`C`,explanation:`【解析】我國的審計權屬於監察院，由監察院下設的審計部審核各機關的財務收支。(A) 立法院負責「審議預算」（決定錢可以怎麼用），但事後審核經費是否用得合法是審計權；(B) 行政院負責編列預算與執行，是被審計的對象；(D) 司法院掌理審判，不負責審核政府帳目。故選 (C)。`},{qNo:10,stem:`閱讀下列兩則資料：

從甲到乙，最能反映選拔官員方式的哪一種轉變？`,options:[`由考試選才，轉向依家世背景推薦人才`,`由世襲貴族擔任官員，轉向皇帝直接任命宦官`,`由重視家世門第，逐漸轉向以考試成績選拔人才`,`由地方百姓選舉官員，轉向中央以抽籤決定`],answer:`C`,explanation:`【解析】甲是魏晉九品官人法的弊病：評定人才的品第被世家大族把持，上品沒有出身寒微的人，下品沒有權勢家族的子弟，選官看門第。乙是隋唐實施的科舉，以考試選才，一般讀書人也有機會做官。(A) 方向說反了；(B) 科舉是考試制度，不是任命宦官；(D) 中國古代沒有由百姓選舉官員的制度，科舉也不是抽籤。故選 (C)。`},{qNo:11,stem:`印度南部的班加羅爾聚集了大量資訊科技公司，被稱為「印度的矽谷」。美國某家軟體公司把客服與程式維修的工作，交給班加羅爾的公司處理。美國員工下班前把問題傳給印度，印度工程師在當地白天處理，美國員工隔天上班就能拿到結果。印度能承接這類工作的有利條件，最可能是下列何者？`,options:[`與美國位於相近的時區，方便即時溝通`,`鐵礦、煤礦豐富，可以就地取得原料`,`位於麻六甲海峽旁，海運便利`,`英語普及、資訊人才多，且與美國有約半天的時差`],answer:`D`,explanation:`【解析】資訊服務業需要人才與溝通能力。印度受過英國殖民，英語普及，又培養大量資訊人才；美印兩地相差約半天，美國的夜晚正是印度的白天，工作可以「接力」進行，題目描述的正是這個優勢。(A) 文中的接力方式正是利用兩地時差很大，不是時區相近；(B) 軟體與客服服務不需要礦產原料；(C) 麻六甲海峽在馬來半島與蘇門答臘之間，而且網路服務不靠海運。故選 (D)。`},{qNo:12,stem:`依我國民法規定，子女的姓氏應如何決定？`,options:[`父母在出生登記前，以書面約定子女從父姓或從母姓`,`子女一律從父姓`,`子女一律從母姓`,`由祖父母決定子女從父姓或母姓`],answer:`A`,explanation:`【解析】民法規定，父母應於子女出生登記前，以書面約定子女從父姓或母姓（未約定或約定不成時，於戶政事務所抽籤決定），以落實性別平等。(B)(C) 現行法律沒有「一律」從父姓或從母姓的規定；(D) 法律規定由父母約定，不是由祖父母決定。故選 (A)。`},{qNo:13,stem:`1973 年第一次石油危機爆發，國際油價大漲，臺灣許多工廠的原料與能源成本上升。政府在 1970 年代推動十大建設，包括中山高速公路、鐵路電氣化、臺中港、核能發電廠、一貫作業鋼鐵廠、石油化學工業等。這些建設最主要的目標是下列何者？`,options:[`設立加工出口區，以低廉工資吸引外資發展勞力密集產業`,`設立科學園區，發展半導體等高科技產業`,`推動土地改革，讓佃農擁有自己耕種的土地`,`改善交通與能源等基礎設施，並發展鋼鐵、石化等重化工業`],answer:`D`,explanation:`【解析】十大建設以交通（高速公路、鐵路電氣化、港口、機場）、能源（核能電廠）和重化工業（鋼鐵、造船、石化）為主，目的是解決當時交通與能源不足的瓶頸，並提升工業的層次。(A) 加工出口區是 1960 年代的政策；(B) 新竹科學園區在 1980 年設立；(C) 土地改革是 1950 年前後的政策。都與題目的年代與內容不符。故選 (D)。`},{qNo:14,stem:`非洲撒哈拉沙漠南緣的薩赫爾地區，近數十年來人口快速增加。居民為了取得糧食與燃料，擴大放牧牲畜、砍伐樹木，加上降雨不穩定，草原逐漸退化成類似沙漠的景觀。近年當地多國合作種植橫越非洲的林帶，希望阻止這種情形繼續擴大。這種現象稱為下列何者？`,options:[`沙漠化`,`都市化`,`土壤鹽化`,`溫室效應`],answer:`A`,explanation:`【解析】原本有植被的乾燥地區，因過度放牧、砍伐與氣候變化，使土地退化成類似沙漠的景觀，稱為沙漠化，薩赫爾地區是典型的例子。(B) 都市化是人口集中到都市；(C) 土壤鹽化多因不當灌溉使鹽分累積在地表，題目描述的是放牧與砍伐造成植被消失；(D) 溫室效應是大氣中溫室氣體使地表溫度升高，不是土地退化現象的名稱。故選 (A)。`},{qNo:15,stem:`小美騎腳踏車經過市區道路時，因為路面有一處大坑洞，市政府長期沒有修補也沒有設置警示標誌，她因此摔倒受傷。她想向負責管理道路的市政府請求賠償醫藥費，最適合依據下列哪一部法律？`,options:[`國家賠償法`,`消費者保護法`,`訴願法`,`刑法`],answer:`A`,explanation:`【解析】國家賠償法規定，公共設施因設置或管理有欠缺，使人民生命、身體或財產受損害時，國家應負損害賠償責任。道路坑洞未修補又無警示，屬於管理有欠缺。(B) 消費者保護法處理消費者與企業經營者之間的爭議，市政府管理道路不是販售商品；(C) 訴願是對違法或不當的「行政處分」請求撤銷，小美要的是賠償損害；(D) 刑法處理犯罪與刑罰，無法讓她得到醫藥費賠償。故選 (A)。`},{qNo:16,stem:`唐代長安城人口眾多，城內街道呈棋盤狀，東西兩市是主要的商業區。其中西市聚集了許多來自中亞、西亞的商人，有人在城中開設酒店；城中也可見到祆教、景教等外來宗教的寺院；日本、新羅則多次派遣使節與留學生到長安學習。根據上述，下列推論何者最適當？`,options:[`唐代實施海禁，外國人只能在長安居住`,`唐代對外交流頻繁，長安是一座國際性的大都市`,`唐代的文化主要是由日本、新羅傳入`,`唐代強迫百姓改信外來宗教`],answer:`B`,explanation:`【解析】外國商人來長安經商、外來宗教在城中設寺、鄰國派人前來學習，都顯示唐代對外開放、文化交流熱絡，長安是當時的國際大都會。(A) 文中沒有「海禁」，外國人能在城中經商、傳教，顯示開放而非限制；(C) 日本、新羅是派人「到長安學習」，文化交流的主要方向是由唐傳到日本、新羅；(D) 外來宗教設寺只表示宗教傳布受到容許，不代表朝廷強迫人民改信。故選 (B)。`},{qNo:17,stem:`澳洲中東部的大自流盆地降雨稀少，地表河流常常乾涸，但當地仍發展出大規模的牧羊、牧牛業。這主要是因為下列何者？`,options:[`夏季受季風影響，降雨十分豐沛`,`有高山冰河的融水可以引來灌溉`,`可以鑿井抽取地下水，供牲畜飲用`,`位於大分水嶺東側的迎風坡，地形雨多`],answer:`C`,explanation:`【解析】大自流盆地雖然乾燥，但地底蘊藏豐富的地下水，鑿井後地下水可以自行湧出或抽出，提供牲畜飲水，因此成為重要的畜牧區。(A) 題目說明當地降雨稀少；(B) 澳洲沒有大規模的高山冰河；(D) 大分水嶺東側迎風坡多雨，但大自流盆地位在山脈「西側」的背風內陸，降雨少。故選 (C)。`},{qNo:18,stem:`小琪在餐廳偷拍隔壁桌陌生人吃飯時的狼狽模樣，未經對方同意就上傳到社群網站，還加上嘲笑對方的文字。小琪的行為最可能侵害了對方的哪些權利？`,options:[`著作權與專利權`,`財產權與工作權`,`肖像權與名譽權`,`受教育權與參政權`],answer:`C`,explanation:`【解析】未經同意公開他人的照片，可能侵害肖像權；加上嘲笑的文字貶低他人的社會評價，可能侵害名譽權。(A) 照片的著作權屬於拍攝者小琪，對方被侵害的不是著作權，也與專利無關；(B) 對方沒有財物損失，也沒有被限制工作；(D) 與受教育、選舉等權利無關。故選 (C)。`},{qNo:19,stem:`某部古代法典有這樣的條文：「如果有人弄瞎了自由民的眼睛，他的眼睛也要被弄瞎」、「如果建築師蓋的房子不堅固而倒塌，壓死了屋主，建築師要被處死」。這部法典刻在石碑上，是目前所知較早且完整的成文法典之一。它出自下列哪一個古文明？`,options:[`兩河流域文明`,`古埃及文明`,`古印度文明`,`中國商朝`],answer:`A`,explanation:`【解析】「以眼還眼」的對等報復原則，是兩河流域（美索不達米亞）古巴比倫王國《漢摩拉比法典》的特色，法典刻在石柱上。(B) 古埃及文明在尼羅河流域，以金字塔、象形文字著名；(C) 古印度文明以種姓制度著名；(D) 商朝以甲骨文、青銅器著名，都沒有這部法典。故選 (A)。`},{qNo:20,stem:`2006 年國道 5 號（含雪山隧道）通車後，臺北到宜蘭不必再走蜿蜒的北宜公路，車程大幅縮短。通車之後，宜蘭最可能出現下列哪一種變化？`,options:[`假日前往宜蘭的觀光人潮增加，也有人住在宜蘭、到臺北上班`,`宜蘭與臺北之間的時間距離變長`,`宜蘭冬季受東北季風影響而降雨的情形減少`,`宜蘭的人口大量移往臺北，觀光客減少`],answer:`A`,explanation:`【解析】交通改善使兩地的「時間距離」縮短，臺北民眾到宜蘭旅遊更方便，宜蘭的觀光業因此成長；也有人選擇住在房價較低的宜蘭，通勤到臺北上班。(B) 車程縮短，時間距離是變短；(C) 隧道改變的是交通，不會改變季風與地形造成的降雨；(D) 交通便利後到宜蘭觀光的人增加，而不是減少。故選 (A)。`},{qNo:21,stem:`某市政府規劃在河濱公園興建一座大型停車場。市府在決定之前舉辦公聽會，邀請附近居民、環保團體、商家與專家學者發表意見，並將發言內容公開在網站上。市府舉辦公聽會的主要意義是下列何者？`,options:[`由出席公聽會的人投票，直接決定是否興建`,`公聽會的結論對市政府具有法律上的拘束力`,`讓利害關係人參與公共政策的討論，使決策考慮得更周全`,`只有市議員才能在公聽會中發言`],answer:`C`,explanation:`【解析】公聽會是在政策決定前，讓受影響的居民、團體與專家表達意見的管道，政府可藉此了解各方看法、修正規劃，屬於公民參與公共事務的方式。(A) 公聽會是蒐集意見，不是投票表決；(B) 公聽會的意見供政府參考，並沒有法律上的拘束力；(D) 題目中居民、團體、學者都能發言，並不限市議員。故選 (C)。`},{qNo:22,stem:`1911 年武昌起義後，各省紛紛響應，宣布脫離清廷；1912 年中華民國成立，清帝宣布退位。這一連串事件在中國歷史上最重要的意義是下列何者？`,options:[`建立君主立憲制度，由皇帝與國會共同治國`,`中國從此廢除了所有與列強簽訂的不平等條約`,`結束了兩千多年的帝制，建立共和政體`,`完成全國統一，結束各地軍閥割據的局面`],answer:`C`,explanation:`【解析】辛亥革命推翻清朝，結束自秦朝以來兩千多年的君主專制，建立中華民國，是亞洲較早建立的共和國。(A) 君主立憲是清末立憲派的主張，革命的結果是推翻皇帝、建立共和；(B) 不平等條約到 1940 年代才陸續廢除；(D) 民國初年反而出現軍閥割據，北伐後才大致統一。故選 (C)。`},{qNo:23,stem:`20 世紀後期，美國南部與西南部的「陽光帶」人口與產業成長快速，許多電子、航太等高科技產業移入，例如德州的休士頓設有太空中心、亞利桑那州的鳳凰城一帶聚集了半導體工廠；而東北部五大湖一帶的傳統鋼鐵工業則逐漸衰退。陽光帶吸引產業移入的原因，最可能是下列何者？`,options:[`蘊藏豐富的鐵礦與煤礦，適合發展鋼鐵業`,`位於五大湖沿岸，水運便利`,`冬季寒冷，有利於電子產品的散熱`,`氣候溫暖宜人，土地取得較容易，能吸引企業與人才移入`],answer:`D`,explanation:`【解析】陽光帶氣候溫暖、陽光充足，生活環境吸引人才；土地較便宜、空間大，也適合新興產業設廠，因此吸引高科技產業移入。(A) 鐵、煤資源與鋼鐵業是五大湖區傳統工業的條件，而高科技產業不靠這些原料；(B) 五大湖位於美國東北部，不在陽光帶；(C) 陽光帶氣候溫暖，冬季並不寒冷。故選 (D)。`},{qNo:24,stem:`小婷家樓上住戶的浴室漏水，使小婷家的天花板發霉損壞。雙方對賠償金額談不攏，小婷不想花太多時間與金錢打官司，於是向區公所的調解委員會申請調解。最後雙方達成協議，調解書也送經法院核定。關於這件事，下列敘述何者正確？`,options:[`調解由法官主持，並由法官作出判決`,`經法院核定的調解與確定判決有相同效力，對方若不履行，可以聲請強制執行`,`調解成立後，雙方仍可就同一件事再向法院起訴`,`這是刑事案件，必須由檢察官提起公訴`],answer:`B`,explanation:`【解析】依鄉鎮市調解條例，調解經法院核定後，民事調解與民事確定判決有同一效力，當事人不得就同一事件再起訴；對方不履行時可以聲請強制執行。(A) 調解由鄉鎮市（區）公所的調解委員主持，促成雙方協議，不是法官判決；(C) 調解經法院核定後，就同一事件不得再行起訴；(D) 漏水損壞屬於民事上的損害賠償糾紛，不是由檢察官起訴的刑事案件。故選 (B)。`},{qNo:25,stem:`1980 年，中國在深圳、珠海、汕頭、廈門設立經濟特區，以減稅與土地優惠吸引外國企業投資設廠；農村也逐步實施「包產到戶」，農民繳交規定的數量後，剩餘的農產品可以自行出售。這些政策與之前相比，最主要的改變是下列何者？`,options:[`成立人民公社，將土地與生產工具收歸集體所有`,`發動文化大革命，批判傳統文化與知識分子`,`關閉沿海港口，減少與外國的經濟往來`,`引進市場機制與外資，由計畫經濟逐漸轉向市場經濟`],answer:`D`,explanation:`【解析】經濟特區引進外資，包產到戶讓農民可以自行出售剩餘農產品、增加生產誘因，這是 1978 年後「改革開放」的內容，使中國從計畫經濟逐步轉向市場經濟。(A) 人民公社是 1950 年代末大躍進時期的集體化政策，方向相反；(B) 文化大革命發生在 1966–1976 年，不是經濟改革；(C) 設立經濟特區是對外開放，不是關閉港口。故選 (D)。`},{qNo:26,stem:`新加坡國土面積小、天然資源缺乏，卻發展成為世界重要的港口與轉口貿易中心。下列何者是新加坡最主要的區位優勢？`,options:[`位於湄公河出海口，有廣大的腹地`,`位於麻六甲海峽南端，扼守太平洋與印度洋之間的航運要道`,`國內石油蘊藏豐富，可以大量出口`,`位於南海北端，扼守臺灣海峽的出入口`],answer:`B`,explanation:`【解析】新加坡位於馬來半島南端、麻六甲海峽的出入口，往來東亞與印度洋、歐洲的船隻多經過這裡，因此發展成重要的港口與轉口貿易中心。(A) 湄公河從越南南部出海，不在新加坡；(C) 新加坡缺乏天然資源，不是產油國；(D) 新加坡位於南海的「南」端，與臺灣海峽相距很遠。故選 (B)。`},{qNo:27,stem:`下表是四種租稅的說明：
| 租稅 | 說明 |
| 甲 | 綜合所得稅：依個人一年的所得課稅 |
| 乙 | 營業稅：商店銷售商品時課徵，通常已包含在售價中 |
| 丙 | 貨物稅：汽車、飲料等貨物出廠時課徵，成本會反映在售價上 |

其中哪些租稅的負擔，最容易由業者轉嫁給消費者，屬於「間接稅」？`,options:[`乙、丙`,`甲、乙`,`甲、丁`,`丙、丁`],answer:`A`,explanation:`【解析】間接稅是納稅義務人可以把稅負轉嫁給他人的租稅，例如營業稅、貨物稅，業者把稅加在售價裡，實際上由消費者負擔；直接稅則由納稅人自己負擔，例如所得稅、房屋稅。(B)(C) 含甲（所得稅，由賺取所得的人自己負擔，屬於直接稅）；(C)(D) 含丁（房屋稅，由房屋所有人負擔，也是直接稅）。故選 (A)。`},{qNo:28,stem:`1793 年，英國派遣馬戛爾尼使節團到中國，希望清廷增開通商口岸、降低關稅，並互派使節常駐。乾隆皇帝在給英王的回信中表示，中國物產豐富，不需要依賴外國的貨物，拒絕了英國的要求。當時清廷只開放廣州一地與西方國家通商。根據上述，下列敘述何者最適當？`,options:[`清廷以天朝自居，對西方的通商要求採取限制的態度`,`英國使節團被拒後，立即發動鴉片戰爭`,`清廷同意英國的要求，開放五個通商口岸`,`當時中國已與英國建立平等的外交關係`],answer:`A`,explanation:`【解析】乾隆認為中國物產豐盈、不需外國貨物，只准在廣州一口通商，反映清廷以「天朝」自居、輕視對外貿易，對西方採取限制的態度。(B) 鴉片戰爭在 1840 年爆發，距離使節團來華約半個世紀；(C) 開放五口通商是 1842 年南京條約的內容，當時清廷拒絕了英國；(D) 清廷拒絕互派使節，以天朝上國看待英國，雙方並不是平等的外交關係。故選 (A)。`},{qNo:29,stem:`阿根廷東部的彭巴草原地勢平坦、土壤肥沃，屬於溫帶草原氣候。19 世紀後期鐵路與冷凍船出現後，當地發展成世界重要的小麥與牛肉輸出地區。下列何者最能說明彭巴草原的農業特色？`,options:[`以家庭為單位種植稻米，生產的糧食主要供自己食用`,`以大規模、機械化的方式種植小麥與飼養肉牛，產品大量出口`,`牧民隨季節逐水草遷移，以放牧駱駝、山羊為生`,`以種植咖啡、甘蔗等熱帶作物為主的栽培業`],answer:`B`,explanation:`【解析】彭巴草原地廣人稀、地形平坦，適合大規模機械化經營，以小麥和肉牛為主，透過鐵路與冷凍船運到歐洲等市場，屬於商業性農牧業。(A) 自給性稻作多見於季風亞洲，且題目說產品大量輸出；(C) 逐水草遷移的游牧多見於乾燥地區；(D) 熱帶栽培業分布在熱帶地區，彭巴草原屬溫帶。故選 (B)。`},{qNo:30,stem:`某國中開設越南語、印尼語等新住民語文課程，並在「多元文化週」邀請新住民家長介紹家鄉的飲食與節慶，希望同學認識彼此家庭的語言與文化。有位同學說：「那些國家比較落後，學他們的語言沒有用。」這位同學的說法最能反映下列哪一種態度？`,options:[`尊重不同文化差異的文化相對觀點`,`透過交流使不同文化互相融合`,`積極保存其他文化的文化資產`,`以自身文化的標準評價其他文化的我族中心主義`],answer:`D`,explanation:`【解析】用自己的標準斷定別的文化「落後」、沒有價值，就是我族中心主義。(A) 文化相對觀點是從其他文化本身的脈絡去理解、尊重差異，與這位同學的說法相反；(B) 他否定學習對方語言，並沒有交流融合的意思；(C) 他認為學那些語言沒有用，不是要保存其他文化。故選 (D)。`},{qNo:31,stem:`16 世紀以後，原產於某地的玉米、馬鈴薯、番薯陸續傳入歐洲與亞洲，因為適應力強、產量高，成為許多地區的重要糧食，使人口增加。這些作物原產於何處？又是在什麼背景下傳出的？`,options:[`美洲；十字軍東征時帶回歐洲`,`美洲；新航路開闢後東西半球之間的物種交流`,`東南亞；鄭和下西洋時帶回中國`,`非洲；工業革命後以輪船運往各地`],answer:`B`,explanation:`【解析】玉米、馬鈴薯、番薯原產於美洲。15 世紀末哥倫布抵達美洲、新航路開闢後，東西半球的作物、牲畜與疾病大量交流（哥倫布大交換），這些作物才傳到歐洲、亞洲。(A) 十字軍東征在 11–13 世紀，當時歐洲人還不知道美洲；(C) 這些作物不是原產於東南亞，鄭和航行也早於美洲作物外傳；(D) 作物原產地不是非洲，傳出的時間也早於 18 世紀後期的工業革命。故選 (B)。`},{qNo:32,stem:`荷蘭位於萊茵河等河川下游的三角洲地帶，有大片國土低於海平面，居民興建堤防圍住海灣或湖泊，再用風車把積水抽出，造出大片新生地（圩田），現在多用來發展酪農業與花卉園藝。荷蘭人能長期利用風車抽水，主要是利用當地的哪一項自然條件？`,options:[`全年盛行西風，風力穩定`,`夏季吹季風，冬季幾乎無風`,`地勢起伏大，河水落差大`,`位於赤道附近的無風帶`],answer:`A`,explanation:`【解析】荷蘭位於西歐的溫帶海洋性氣候區，全年受盛行西風吹拂，風力穩定，適合利用風車作為動力抽水。(B) 西歐不是季風氣候區；(C) 荷蘭地勢低平，不是地勢起伏大；(D) 荷蘭位於北緯 50 多度，遠離赤道。故選 (A)。`},{qNo:33,stem:`附圖為某市（虛構）2026 年度總預算的歲出結構。根據圖中資料與我國的制度，下列敘述何者正確？`,options:[`社會福利支出約 300 億元；這份預算經市長核定後即可執行`,`教育科學文化支出約 360 億元；這份預算須經立法院審議通過`,`經濟發展支出約 150 億元；這份預算須經市議會審議通過`,`社會福利支出約 300 億元；這份預算須經市議會審議通過`],answer:`D`,explanation:`【解析】社會福利支出約 1,200 × 25%＝300 億元。直轄市、縣（市）的總預算由市（縣）政府編列，必須送市（縣）議會審議通過後才能執行。(A) 金額正確，但地方預算不能只由市長核定，必須經議會審議；(B) 教育科學文化支出 1,200 × 30%＝360 億元雖然正確，但審議地方預算的是市議會，立法院審議的是中央政府總預算；(C) 經濟發展支出應為 1,200 × 15%＝180 億元，不是 150 億元。故選 (D)。`,figure:`ai/904/social/q33.png`},{qNo:34,stem:`西元前 5 世紀的雅典，成年男性公民可以出席公民大會，直接討論並表決城邦大事；許多官職以抽籤方式產生，擔任公職的人還可以領取津貼。不過，婦女、奴隸和外邦人都沒有公民權。根據上述，下列敘述何者最適當？`,options:[`雅典實行代議民主，由人民選出議員代為決定政事`,`雅典所有居民都享有平等的政治權利`,`雅典實行直接民主，但能參與政治的只是居民中的一部分人`,`雅典由國王決定城邦大事，人民只能表示意見`],answer:`C`,explanation:`【解析】公民親自出席大會、直接表決，是直接民主；但婦女、奴隸、外邦人被排除在外，有政治權利的只是成年男性公民，占居民的少數。(A) 雅典公民是親自參與表決，不是選出代表；(B) 婦女、奴隸和外邦人沒有公民權，政治權利並不平等；(D) 城邦大事由公民大會表決，不是由國王決定。故選 (C)。`},{qNo:35,stem:`日本的主要工業區多集中在太平洋沿岸，從東京一帶向西延伸到北九州，稱為「太平洋帶狀工業帶」。這些工業區多位在沿海，最主要的原因是下列何者？`,options:[`太平洋沿岸蘊藏豐富的鐵礦與煤礦，可以就地取得原料`,`太平洋沿岸地勢高峻，河川落差大，適合發展水力發電`,`太平洋沿岸距離中國大陸最近，便於從中國進口原料`,`日本礦產資源缺乏，原料多從海外進口，沿海港口便於原料進口與產品出口`],answer:`D`,explanation:`【解析】日本礦產缺乏，發展「加工貿易」：從海外進口原料、加工製造後再出口。工業區設在沿海港口附近，可以減少運輸成本；太平洋沿岸又有東京、大阪等大都市，人口多、市場大。(A) 日本礦產缺乏，原料仰賴進口；(B) 工業區多在沿海平原，並非靠地勢高峻發電；(C) 面向中國大陸的是日本海、東海一側，太平洋沿岸並不是距離中國最近的地方，原料也來自世界各地。故選 (D)。`},{qNo:36,stem:`某手搖飲料店推出會員制度，顧客必須留下姓名和手機號碼才能集點。後來店家未經顧客同意，就把會員名單賣給補習班做廣告行銷。店家的行為最可能違反下列哪一部法律？`,options:[`公平交易法`,`著作權法`,`勞動基準法`,`個人資料保護法`],answer:`D`,explanation:`【解析】姓名、手機號碼都是個人資料。店家蒐集個資應在告知的特定目的範圍內使用，未經同意把會員資料賣給他人行銷，可能違反個人資料保護法。(A) 公平交易法規範聯合壟斷、不實廣告等妨礙公平競爭的行為；(B) 著作權法保障創作；(C) 勞動基準法規範勞雇關係，與顧客資料無關。故選 (D)。`},{qNo:37,stem:`第一次世界大戰期間，英國大量男性上戰場，數十萬名婦女進入兵工廠工作，也擔任電車司機、護士等原本多由男性擔任的職務。1918 年，英國國會通過法律，讓 30 歲以上、符合一定條件的婦女擁有投票權。這段歷史最能說明下列何者？`,options:[`一戰結束後，英國男女已經享有完全相同的投票權`,`戰爭時期的全民動員，提升了婦女的社會地位與參與政治的機會`,`婦女投票權是戰勝國在巴黎和會中要求德國實施的`,`英國婦女是到第一次世界大戰時才第一次進入工廠工作`],answer:`B`,explanation:`【解析】一戰是動員全國人力物力的「總體戰」，婦女投入生產與服務，貢獻受到肯定，1918 年英國便給予部分婦女投票權。(A) 文中只有 30 歲以上、符合條件的婦女才有投票權，與男性並不相同；(C) 這是英國國會通過的國內法律，與巴黎和會無關；(D) 工業革命時期已有大量婦女在紡織工廠工作，並不是一戰時才開始。故選 (B)。`},{qNo:38,stem:`全球暖化使北極海的海冰面積縮小，夏季時船隻可以沿著俄羅斯北方的海岸航行，經白令海峽往來東亞與歐洲，俄羅斯稱這條航線為「北方海航道」。與傳統經過麻六甲海峽、蘇伊士運河的航線相比，這條北方航線最主要的優點是下列何者？`,options:[`航行距離較短`,`全年都可以通航`,`沿途港口多，補給方便`,`海上氣候溫暖，不必擔心冰山與海冰`],answer:`A`,explanation:`【解析】東亞與歐洲都在北半球中高緯度，從北極海一側航行，比繞經南方的麻六甲海峽與蘇伊士運河距離短得多，可節省時間與燃料。(B) 題目說是「夏季時」才能通航，冬季海冰仍多；(C) 北極海沿岸人口稀少，港口與補給設施遠少於傳統航線；(D) 北極海氣候寒冷，仍要面對海冰，常需要破冰船協助。故選 (A)。`},{qNo:39,stem:`依我國法律，普通傷害罪屬於「告訴乃論」之罪，被害人應在知道犯人是誰之時起 6 個月內提出告訴。2026 年 3 月 10 日，阿哲在籃球場與人發生爭執被打傷，他當天就知道打人的是社區籃球隊裡已經高中畢業的阿峰（已滿 18 歲）。關於這件事，下列敘述何者正確？`,options:[`若阿哲拖到 2026 年 12 月才提出告訴，已超過期限，檢察官無法追訴阿峰的傷害罪`,`告訴乃論之罪必須由警察主動提出告訴，阿哲不必自己提出`,`阿哲提出告訴之後，就不能再撤回告訴`,`阿峰打人只需負民事賠償責任，不會有刑事責任`],answer:`A`,explanation:`【解析】告訴乃論之罪須由被害人提出告訴，檢察官才能追訴。阿哲在 3 月 10 日就知道犯人，6 個月的期限到 9 月上旬就屆滿，12 月才提出已經超過期限。(B) 告訴是由被害人（或法律規定的人）提出，不是由警察提出；(C) 告訴乃論之罪，告訴人在第一審辯論終結前可以撤回告訴；(D) 打傷人可能構成刑法的傷害罪，要負刑事責任，同時也可能要負民事賠償責任。故選 (A)。`},{qNo:40,stem:`1960 年，非洲有 17 個國家宣布獨立，這一年因此被稱為「非洲年」。這些國家在獨立以前，大多是何種身分？`,options:[`蘇聯的加盟共和國`,`歐洲國家的殖民地`,`美國的州`,`中國的藩屬國`],answer:`B`,explanation:`【解析】19 世紀末歐洲列強瓜分非洲，非洲大多成為英、法、比利時等國的殖民地；二次大戰後民族主義高漲，1960 年有 17 國獨立，多數原為法國殖民地。(A) 蘇聯的加盟共和國在東歐、中亞一帶，不在非洲；(C) 美國沒有把非洲國家納為州；(D) 這些國家不是中國的藩屬。故選 (B)。`},{qNo:41,stem:`某地區三家主要的桶裝瓦斯行私下約定，同一天把每桶瓦斯的價格調漲 100 元，並約定彼此不搶對方的客戶，使當地居民幾乎沒有其他選擇。有居民發現三家同時漲價，向主管機關檢舉。關於這件事，下列敘述何者最適當？`,options:[`屬於業者自由定價，法律不加以規範`,`屬於消費爭議，應依消費者保護法由消保官判處業者刑罰`,`三家業者都是小商家，因此屬於獨占`,`屬於聯合行為，可能違反公平交易法，由公平交易委員會調查處理`],answer:`D`,explanation:`【解析】互為競爭者的業者共同約定價格、劃分客戶，限制了市場競爭，稱為「聯合行為」，原則上為公平交易法所禁止，由公平交易委員會調查處分。(A) 業者可以各自決定價格，但「共同約定」漲價、不互搶客戶會妨礙競爭，受法律規範；(B) 消保官負責消費者保護事務，不能判處刑罰，判刑屬於法院；(C) 獨占是指單一事業不受競爭，題目是三家業者聯合，屬於聯合行為而非獨占。故選 (D)。`},{qNo:42,stem:`清代乾隆年間，郭錫瑠集資開鑿水圳，引新店溪的溪水灌溉臺北盆地的農田，後人稱為「瑠公圳」；清代前期彰化平原也有施世榜開鑿的八堡圳。這些水圳多由民間出資興建，再向使用圳水的農民收取「水租」。這類水利設施在清代陸續出現，最主要的影響是下列何者？`,options:[`使臺灣成為以茶葉為最主要出口品的地區`,`使原住民改以狩獵鹿群為主要生計`,`提供日治時期工廠所需的水力發電`,`許多旱田改為水田，稻米產量增加，還能運銷到中國大陸`],answer:`D`,explanation:`【解析】水圳使灌溉用水穩定，許多旱田可以改為水田種稻，稻米產量大增，除了供應島內，還輸往福建等缺糧地區。(A) 茶葉成為主要出口品是 1860 年代開港通商以後的事，與水圳無關；(B) 漢人開墾使鹿場減少，原住民的狩獵生計反而受到壓縮；(C) 水力發電是日治時期以後的建設，清代水圳是灌溉用。故選 (D)。`},{qNo:43,stem:`下大雨時，雨水最可能在哪一個地點匯集成溪流？判斷的依據為何？`,options:[`甲；該處等高線向山腳（低處）方向彎曲凸出，是山谷`,`乙；該處等高線向山頂（高處）方向彎曲凸出，是山谷`,`丙；該處等高線最密集，坡度最陡`,`丁；該處等高線較稀疏，地勢平緩`],answer:`B`,explanation:`【解析】山谷的等高線會向「高處」彎曲凸出（V 字形的尖端指向上游），兩側山坡的雨水流入谷底而匯集成溪流。圖中乙處的等高線向山頂方向凸出，是山谷。(A) 甲處等高線向「低處」凸出，是稜線（山脊），不是山谷，雨水會從稜線向兩側分流；(C) 等高線密集只表示坡度陡，雨水會順坡流下，但丙處等高線沒有向高處彎曲，不是谷地；(D) 等高線稀疏只表示坡度平緩，丁處位於一般的山坡上，不是山谷。故選 (B)。`},{qNo:44,stem:`沿著步道 X 從山頂往西北方走下山，與從山頂經丁往東南方走下山相比，步道 X 的坡度有什麼特色？`,options:[`步道 X 經過的等高線較密集，坡度較緩`,`步道 X 經過的等高線較稀疏，坡度較陡`,`步道 X 經過的等高線較密集，坡度較陡`,`等高線的疏密與坡度無關，無法判斷`],answer:`C`,explanation:`【解析】在相同的水平距離內，經過的等高線越多（越密集），高度變化越大，坡度越陡。(A) 等高線密集代表坡度陡，不是緩；(B) 等高線稀疏代表坡度緩；(D) 等高線的疏密正是判斷坡度陡緩的依據。故選 (C)。`},{qNo:45,stem:`1642 年北上攻下聖薩爾瓦多城的歐洲勢力是下列何者？`,options:[`葡萄牙`,`英國`,`荷蘭`,`法國`],answer:`C`,explanation:`【解析】荷蘭人 1624 年起以大員（今臺南安平）為據點，1642 年北上驅逐西班牙人，取得臺灣北部。(A) 葡萄牙在東亞的據點是澳門，沒有占領臺灣；(B) 1642 年攻下北臺灣的是荷蘭人，不是英國人；(D) 法國曾在 1884 年清法戰爭時攻打基隆，但與 17 世紀無關。故選 (C)。`},{qNo:46,stem:`根據文中與附圖，西班牙人占領雞籠（今基隆）最主要的目的，最可能是下列何者？`,options:[`雞籠一帶盛產甘蔗，西班牙人想就地製糖運往歐洲`,`以雞籠為基地，協助明朝驅逐盤據澳門的葡萄牙人`,`為了躲避荷蘭的攻擊，把在馬尼拉的根據地全部遷到雞籠`,`以馬尼拉為據點的西班牙，想在通往中國、日本的航線上取得據點，與占據大員的荷蘭競爭`],answer:`D`,explanation:`【解析】西班牙以菲律賓的馬尼拉為根據地，與中國、日本進行貿易。荷蘭人占領大員後，可能威脅馬尼拉通往中國、日本的航線；由圖可見雞籠位在馬尼拉北方、靠近中國沿海與日本的航路上，西班牙人占領雞籠，正是為了取得據點、與荷蘭競爭東亞貿易（也兼有傳教的目的）。(A) 臺灣的甘蔗主要種在南部平原，而且西班牙人在北部的目的是貿易與傳教；(B) 西班牙並沒有協助明朝攻打澳門；(C) 西班牙在菲律賓的根據地一直是馬尼拉，雞籠只是前進據點。故選 (D)。`},{qNo:47,stem:`淡水的「紅毛城」原本是西班牙人所建的聖多明哥城，後來卻被稱為「紅毛城」。這個名稱最可能的由來是下列何者？`,options:[`西班牙人離開後，荷蘭人在原址重建城堡，當時漢人稱荷蘭人為「紅毛」`,`興建城堡的西班牙人多半有紅色頭髮`,`城堡一開始就是用紅色磚塊砌成`,`日治時期日本人依城牆的顏色重新命名`],answer:`A`,explanation:`【解析】依文中，1642 年荷蘭人北上驅逐西班牙人；荷蘭人隨後在淡水原址重建城堡。當時漢人稱荷蘭人為「紅毛」，城堡因此被稱為紅毛城。(B) 「紅毛」是當時對荷蘭人的稱呼，不是指西班牙人；(C) 名稱來自對荷蘭人的稱呼，與建材顏色無關；(D) 「紅毛城」的名稱早在清代就已出現，並非日治時期才命名。故選 (A)。`},{qNo:48,stem:`根據氣候圖判斷，洛杉磯屬於哪一種氣候類型？`,options:[`溫帶海洋性氣候，全年溫和、各月都有降雨`,`熱帶莽原氣候，夏季多雨、冬季乾燥`,`地中海型氣候，夏季乾燥少雨、冬季降雨較多`,`溫帶季風氣候，夏季高溫多雨、冬季寒冷乾燥`],answer:`C`,explanation:`【解析】圖中 6～9 月幾乎沒有降雨，降雨集中在 12～3 月，夏乾冬雨，氣溫全年溫和，是地中海型氣候的特色。(A) 溫帶海洋性氣候各月都有降雨，但洛杉磯夏季幾乎無雨；(B) 熱帶莽原是夏雨冬乾，與洛杉磯正好相反，而且洛杉磯最冷月均溫只有約 14°C，不是熱帶；(D) 溫帶季風氣候是夏雨型，冬季寒冷乾燥，與圖中冬季多雨不符。故選 (C)。`},{qNo:49,stem:`專家指出，這次野火發生的時間「很不尋常」。根據氣候圖與文中資訊，下列哪一項說法最能支持這個看法？`,options:[`1 月原本是洛杉磯一年中雨量較多的時期，這次卻因降雨極少而草木乾枯`,`1 月是洛杉磯一年中氣溫最高的月份，高溫使草木容易起火`,`洛杉磯冬季本來就幾乎不下雨，野火多半發生在冬季`,`聖塔安娜風是從太平洋吹來的潮濕海風，通常會帶來降雨`],answer:`A`,explanation:`【解析】由氣候圖可知洛杉磯是夏乾冬雨，1 月平均降雨約 84 mm，原本是雨季；文中指出這一季雨季的開頭是有紀錄以來最乾的一次，草木乾枯，才使野火在雨季中延燒，因此不尋常。(B) 圖中氣溫最高的是 8 月，1 月是較冷的月份；(C) 洛杉磯是冬季多雨、夏季乾燥，說法與圖相反；(D) 文中說聖塔安娜風是由內陸吹向海岸、又乾又強的風。故選 (A)。`},{qNo:50,stem:`洛杉磯採用以西經 120 度為中央經線的標準時間（1 月時沒有實施日光節約時間），臺灣採用東經 120 度為中央經線的標準時間。若某電視臺在洛杉磯當地時間 1 月 7 日晚上 8 時進行火災現場直播，當時臺灣是幾月幾日幾時？`,options:[`1 月 7 日凌晨 4 時`,`1 月 8 日中午 12 時`,`1 月 8 日凌晨 4 時`,`1 月 7 日中午 12 時`],answer:`B`,explanation:`【解析】兩地中央經線相差 120＋120＝240 度，每 15 度差 1 小時，共差 16 小時。臺灣在東邊，時間較早到來，所以臺灣時間＝洛杉磯時間＋16 小時：1 月 7 日 20 時＋16 小時＝1 月 8 日 12 時。(A) 把時差的方向弄反，用減的；(C) 只算了 8 小時的時差（只看單邊經度）；(D) 時刻正確但忘了跨日，應為 1 月 8 日。故選 (B)。`},{qNo:51,stem:`某出口商在 4 月 30 日與 5 月 5 日各收到美國客戶支付的貨款 2 萬美元，都在當天依收盤匯率全數換成新臺幣。關於這段期間的匯率變化與兩筆貨款，下列敘述何者正確？`,options:[`新臺幣貶值；5 月 5 日那筆比 4 月 30 日那筆少換得 37,440 元`,`新臺幣升值；5 月 5 日那筆比 4 月 30 日那筆少換得 37,440 元`,`新臺幣升值；5 月 5 日那筆比 4 月 30 日那筆多換得 37,440 元`,`新臺幣升值；5 月 5 日那筆比 4 月 30 日那筆少換得 18,380 元`],answer:`B`,explanation:`【解析】1 美元能換到的新臺幣從 32.017 元減少為 30.145 元，表示美元變得「便宜」、新臺幣價值提高，也就是新臺幣升值。2 萬美元在 4 月 30 日可換 640,340 元，5 月 5 日只能換 602,900 元，少了 20,000 ×（32.017－30.145）＝37,440 元。(A) 1 美元換到的新臺幣變少，是新臺幣升值而不是貶值；(C) 換到的新臺幣是變少，不是變多；(D) 這是用 5 月 2 日與 5 月 5 日的匯率相減，比較的日期錯了。故選 (B)。`},{qNo:52,stem:`若新臺幣兌美元維持在 5 月 5 日的匯率水準，與 4 月 30 日相比，下列哪一種人最可能因此受惠？`,options:[`產品以美元計價、賣到美國的電子零件出口商`,`帳戶中有美元存款、打算換回新臺幣使用的民眾`,`以美國旅客為主要客源、招攬他們來臺觀光的旅行社`,`暑假要帶孩子到美國遊學、需用新臺幣兌換美元支付學費的家庭`],answer:`D`,explanation:`【解析】新臺幣升值後，用較少的新臺幣就能換到同樣多的美元，因此需要支付美元的人（出國留學、旅遊、進口商）受惠。(A) 出口商收到美元貨款，換回的新臺幣變少，收入減少；(B) 美元存款換回新臺幣時能換到的錢變少；(C) 美國旅客要用更多美元才能換到同樣的新臺幣，來臺旅遊變貴，可能減少來臺。故選 (D)。`},{qNo:53,stem:`從公民的角度來看，這項新制最能體現下列哪一項理念？`,options:[`薪資完全由市場決定，政府不介入勞資關係`,`育兒的成本應完全由家庭自行負擔`,`協助受僱者兼顧工作與家庭照顧，鼓勵父母共同分擔育兒責任`,`以提高企業生產效率為唯一目標，減少員工請假`],answer:`C`,explanation:`【解析】讓受僱者可以按日請育嬰假、期間有補貼，又獎勵雇主配合，目的是讓父母能兼顧工作與照顧孩子，營造友善育兒的職場。(A) 新制由政府立法並提供補貼與獎勵，正是政府介入勞動關係；(B) 政府提供八成補貼，分擔了部分育兒成本；(D) 新制讓員工更方便請假照顧孩子，並非以減少請假為目標。故選 (C)。`},{qNo:54,stem:`小芸在一家員工 20 人的公司上班，2026 年時她的孩子 2 歲。依文中的新制，下列敘述何者正確？`,options:[`以日申請的那幾天，公司仍須照常付給她全額薪水`,`因為公司員工未滿 30 人，她不能以日申請育嬰留職停薪`,`她可以只請 1 天育嬰留職停薪照顧生病的孩子，以日申請的部分合計最多 30 日`,`孩子滿 3 歲以後，她仍可以日申請，而且天數不受限制`],answer:`C`,explanation:`【解析】依文中，子女滿 3 歲前，受僱者可在最長 2 年的育嬰留職停薪中，以「日」為單位申請合計不超過 30 日，孩子 2 歲的小芸符合條件。(A) 育嬰留職停薪期間雇主不支付薪水，她領的是政府提供、約投保薪資八成的補貼；(B) 30 人以下是政府發給「雇主」獎勵金的考量，並沒有限制小公司的員工申請；(D) 新制適用於子女滿 3 歲前，以日申請的部分合計也以 30 日為上限。故選 (C)。`}],verification:[`2026-10-09 依 SPEC_AI2_AI3.md 的 AI-4（會考水準）規格出題，參照 114／115 年真題；避開 AI-2／AI-3 社會已用的題材；4 張附圖（預算圓餅圖、等高線圖、東亞港口示意圖、洛杉磯氣候圖）依數據繪製並經檢視。`,`2026-10-09 獨立作答者 1（Claude Opus，看不到答案）54/54、獨立作答者 2（Claude Sonnet）54/54 與答案卷一致，0 題有異議。難度（同一評分標準）：114 年真題 2.26、本卷 Opus 1.78／Sonnet 2.26。`,`2026-10-09 獨立事實查核：洛杉磯野火與 1991–2020 氣候平年值逐月、新臺幣收盤匯率、育嬰留停以日申請、基隆 400、民法、鄉鎮市調解條例、刑訴告訴期間逐條確認；修正國家賠償法第 3 條（2019 年修法後無「公有」）、英國來臺時間的解析、西班牙經三貂角占領社寮島，答案不變。tools/check_ai_set.py 0 問題。`,`2026-10-09 最終複查（定稿前）：獨立稽核者（Claude Opus）拿答案與解析逐題核對（答案唯一性、計算、事實、附圖、文字），另由 Claude Opus 與 Claude Sonnet 各自重新盲解全卷，答案全部與答案卷一致；稽核指出的解析措辭、誘答與解析不一致、真實事件的相對時間（改為確切年份）與文言異文（以多版本比對後採通行本）均已修正，修正過的題目再由兩個模型重新盲解一致；答案卷未變動。`]},fo=`./`,po=e=>String(e).padStart(2,`0`);function mo(e){return e.items.map(t=>{let n=e.groups.find(e=>t.qNo>=e.from&&t.qNo<=e.to);return{id:`${e.subject}-${e.year}-${t.qNo}`,subject:e.subject,year:e.year,qNo:t.qNo,groupId:n?`${e.subject}-${e.year}-g${n.from}-${n.to}`:void 0,text:{stem:t.stem,options:t.options,passage:n?.passage,passageTranslation:n?.translation,figure:t.figure?fo+t.figure:void 0,passageFigure:n?.figure?fo+n.figure:void 0},audioPath:e.subject===`英聽`?`${fo}audio/listening/${e.year}/a${po(t.qNo)}.wav`:void 0,explanation:t.explanation,correctAnswer:t.answer,optionCount:t.options.length}})}var ho=Object.values(Object.assign({"./ai/ai1_chinese.json":Va,"./ai/ai1_english.json"
