丁、只要是 30 層以上的高樓，在任何地震中都一定比低矮的房屋危險。
其中哪些推論合理？`,options:[`甲、乙`,`乙、丙`,`甲、乙、丁`,`甲、丙`],answer:`A`,explanation:`【解析】規模代表地震本身釋放的能量，一次地震只有一個規模（甲）；震度是各地實際搖晃的程度，一般隨距離減小，但文中指出曼谷的軟弱黏土層會放大長週期地震波，高樓又容易與它共振，使搖晃加劇（乙）。丙不合理：地震波傳播時能量會逐漸減弱，曼谷的災情是地質放大與共振造成的；丁不合理：文中說明的是長週期地震波與高樓擺盪週期相近時才容易共振，不能推論任何地震中高樓都一定較危險。(B) 丙不合理，且漏掉了甲；(C) 丁推論過度；(D) 丙不合理，且漏掉了乙。故選 (A)。`},{qNo:28,stem:`假設地震波由震源傳到曼谷的路徑長約 1000 公里，P 波平均速率約 7 公里／秒，S 波約 4 公里／秒（示意數值）。曼谷的 P 波與 S 波抵達時間約相差多少秒？`,options:[`約 107 秒`,`約 250 秒`,`約 143 秒`,`約 333 秒`],answer:`A`,explanation:`【解析】P 波需 1000 ÷ 7 ≈ 143 秒，S 波需 1000 ÷ 4＝250 秒，兩者相差約 250 − 143＝107 秒。地震預警就是利用先到的 P 波發出警報，爭取強烈搖晃的 S 波抵達前的時間。(B) 250 秒是 S 波傳到曼谷所需的時間；(C) 143 秒是 P 波傳到曼谷所需的時間；(D) 333 秒是把兩速率相減（7 − 4＝3）再去除距離，時間差不能這樣計算。故選 (A)。`},{qNo:29,stem:`太空船位於離地球最遠處時，地面控制中心發出一道無線電指令，太空船收到後立即回覆。從發出指令到收到回覆，至少需要多少時間？`,options:[`約 1.4 秒`,`約 0.0027 秒`,`約 2.7 秒`,`約 45 分鐘`],answer:`C`,explanation:`【解析】單程時間＝距離 ÷ 速率＝406771000 公尺 ÷ (3 × 10⁸ 公尺／秒) ≈ 1.36 秒；一來一回約 2.7 秒。(A) 1.4 秒只是單程，指令送達後還要等回覆傳回；(B) 0.0027 秒是把距離的「公里」當成「公尺」計算；(D) 45 分鐘是把速率誤用為每秒 300 公里所得到的結果（406771 × 2 ÷ 300 ≈ 2712 秒）。故選 (C)。`},{qNo:30,stem:`太空船繞到月球背面時，與地球的通訊會中斷。最主要的原因是什麼？`,options:[`月球背面沒有空氣，電磁波無法在真空中傳播`,`月球背面終年照不到陽光、溫度極低，使通訊設備無法運作`,`太空船在月球背面時離地球太遠，超過電磁波能傳播的最遠距離`,`電磁波沿直線傳播，月球位於太空船與地球之間時擋住了訊號`],answer:`D`,explanation:`【解析】無線電波和光一樣沿直線傳播，無法穿透月球。太空船在月球背面時，地球與太空船之間被月球擋住，訊號無法直接傳達；繞出月球後通訊就恢復了。(A) 電磁波可以在真空中傳播，地球到月球之間本來就幾乎是真空；(B) 月球背面並非終年黑暗，月球自轉時背面也有白天與黑夜；(C) 電磁波沒有「最遠傳播距離」，且太空船在其他相近距離時通訊正常。故選 (D)。`},{qNo:31,stem:`假設月球繞地球公轉的週期不變（約 27.3 天），但月球自轉的週期變成公轉週期的一半（自轉方向不變）。在這種情況下，下列敘述何者正確？`,options:[`在一次公轉的期間內，地球上的人可以輪流看到月球表面的各個部分`,`地球上的人仍然只能看到月球的同一面`,`月相由新月到下一次新月的週期會變成原來的一半`,`月球將不再有月相的變化`],answer:`A`,explanation:`【解析】現在月球自轉與公轉週期相同，所以總是同一面朝向地球。若自轉加快為公轉的 2 倍，月球繞地球一圈時自己轉了兩圈，相對於地球多轉了一圈，朝向地球的那一面會不斷改變，地球上的人可以輪流看到月球的各個部分。(B) 只有自轉與公轉週期相同時才會永遠同一面朝向地球；(C)、(D) 月相是由太陽、地球、月球三者的相對位置決定，與月球的公轉有關，與自轉快慢無關，所以月相仍會變化，週期也不變。故選 (A)。`},{qNo:32,stem:`根據右圖，下列敘述何者正確？`,options:[`2015 到 2025 年平均每年增加約 2.6 ppm，其中以 2015 到 2016 年增加最多`,`2015 到 2025 年平均每年增加約 2.6 ppm，其中以 2023 到 2024 年增加最多`,`2015 到 2025 年共增加約 26 ppm，相當於增加了約 26%`,`2015 到 2025 年平均每年增加約 26 ppm，其中以 2023 到 2024 年增加最多`],answer:`B`,explanation:`【解析】十年共增加 427.35 − 401.01＝26.34 ppm，平均每年約 2.63 ppm。逐年增加量中，2023→2024 年為 3.53 ppm 最多，2015→2016 年的 3.40 ppm 居次。(A) 2015→2016 年的增加量是第二多，比 2023→2024 年少；(C) 增加約 26 ppm，但相對於約 401 ppm 只增加了約 6.6%，不是 26%；(D) 平均每年增加約 2.6 ppm，26 ppm 是十年的總增加量。故選 (B)。`},{qNo:33,stem:`綜合右圖與 WMO 的資料，下列推論何者最合理？`,options:[`2025 年的二氧化碳濃度比 2024 年低，所以 2025 年的氣溫排名在 2023、2024 年之後`,`只要出現反聖嬰現象，當年的全球平均氣溫就一定會比前一年高`,`2025 年即使受到使氣溫偏低的反聖嬰影響，仍是最熱的年份之一，這與溫室氣體濃度持續上升的趨勢相符`,`2025 年比工業化前高的 1.44°C，全部是由 2024 到 2025 年二氧化碳增加的 2.74 ppm 所造成`],answer:`C`,explanation:`【解析】圖中二氧化碳濃度逐年上升，2025 年達約 427 ppm 的最高值；WMO 指出 2025 年有使氣溫偏低的反聖嬰，卻仍名列最熱年份之一。兩份資料一起看，與溫室氣體持續累積、使全球氣溫維持在高檔的趨勢一致。(A) 圖中 2025 年（427.35 ppm）比 2024 年（424.61 ppm）高；(B) 文中說反聖嬰會使氣溫「偏低」，不是使氣溫升高；(D) 1.44°C 是與 1850–1900 年相比的長期累積結果，不是一年內增加的 2.74 ppm 所造成，資料也無法證明「全部」來自二氧化碳。故選 (C)。`},{qNo:34,stem:`海洋會吸收大氣中一部分的二氧化碳。綜合上述資料與所學，下列四項敘述：
甲、二氧化碳溶於海水會形成碳酸，使海水的 pH 值略為下降。
乙、海水溫度升高時，二氧化碳在海水中的溶解度變大，所以全球暖化會使海洋吸收更多二氧化碳。
丙、海水的酸性增強，不利於珊瑚和貝類形成碳酸鈣的骨骼或外殼。
丁、海洋吸收二氧化碳的作用已完全抵銷人類的排放，所以大氣中二氧化碳的濃度不再上升。
其中哪些正確？`,options:[`甲、乙、丙`,`乙、丁`,`甲、丙、丁`,`甲、丙`],answer:`D`,explanation:`【解析】二氧化碳溶於水會生成碳酸，釋出氫離子，使 pH 值下降（海水仍略呈鹼性，但鹼性變弱，稱為海洋酸化）（甲）；碳酸鈣遇酸會溶解，酸性增強時，珊瑚、貝類較難形成並維持碳酸鈣的骨骼或外殼（丙）。乙錯誤：氣體在水中的溶解度隨溫度升高而變小，海水變暖反而較難溶入二氧化碳；丁錯誤：圖中大氣二氧化碳濃度每年仍持續上升，可見海洋吸收的量並沒有抵銷排放。(A) 乙錯誤；(B) 乙、丁都錯誤；(C) 丁與圖中資料矛盾。故選 (D)。`},{qNo:35,stem:`以近日點時的速率前進，3I/ATLAS 每秒約移動多少公里？以這個速率走完地球到太陽的平均距離（約 1.5 億公里），大約需要幾天？`,options:[`約 4100 公里；約 25 天`,`約 68 公里；約 610 天`,`約 68 公里；約 2.5 天`,`約 68 公里；約 25 天`],answer:`D`,explanation:`【解析】每小時 246000 公里 ÷ 3600 秒 ≈ 68.3 公里／秒。所需時間＝150000000 ÷ 246000 ≈ 610 小時，610 ÷ 24 ≈ 25.4 天，約 25 天。(A) 4100 是 246000 ÷ 60，得到的是「每分鐘」的距離；(B) 610 是「小時」數，還要除以 24 才是天數；(C) 2.5 天是換算時少了一個 10 倍。故選 (D)。`},{qNo:36,stem:`假設 3I/ATLAS 的質量不變，比較它在近日點與剛被發現時的動能，並說明原因，下列何者正確？`,options:[`動能約增加 24%；它靠近太陽時，太陽的引力與運動方向的夾角小於 90°，對它作正功使動能增加`,`動能約增加 11%；它靠近太陽時，太陽的引力與運動方向的夾角小於 90°，對它作正功使動能增加`,`動能約增加 24%；它靠近太陽時質量變大，所以動能增加`,`動能不變；它在太空中不受任何力，速率的變化只是測量誤差`],answer:`A`,explanation:`【解析】動能＝½mv²，與速率的平方成正比：(24.6 ÷ 22.1)² ≈ 1.239，約增加 24%。彗星接近太陽時，太陽引力與運動方向的夾角小於 90°，引力對它作正功，重力位能轉換成動能，速率變大；離開時夾角大於 90°，引力對它作負功，動能又轉回位能，所以離開太陽系時速率會回到與進入時相同。(B) 速率增加約 11%（24.6 ÷ 22.1 ≈ 1.11），但動能與速率的平方成正比，增加約 24%；(C) 題目假設質量不變，速率變大才是動能增加的原因；(D) 彗星受到太陽的引力作用，文中速率由 22.1 萬增加到 24.6 萬公里／小時是真實的變化。故選 (A)。`},{qNo:37,stem:`從湖水滿水位到 24 日，堰塞湖流失的水約有多少公噸？約占原來最大蓄水量的多少？`,options:[`約 6800 萬公噸；約 1/4`,`約 1 億 1400 萬公噸；約 5/4`,`約 6800 萬公噸；約 3/4`,`約 6800 公噸；約 3/4`],answer:`C`,explanation:`【解析】流失的水＝9100 − 2300＝6800 萬立方公尺，約 6800 萬公噸；6800 ÷ 9100 ≈ 0.75，約為 3/4（剩下約 1/4）。(A) 1/4 是「剩下」的比例，不是流失的比例；(B) 1 億 1400 萬是把兩數相加，流失量應該相減；(D) 漏掉了「萬」這個單位。故選 (C)。`},{qNo:38,stem:`天然壩靠近底部的部分承受的水壓最大，也最容易被湖水滲透、破壞。假設壩體上有一點原本位於水面下 150 公尺處，關於壩體受到的水壓，下列敘述何者正確？（不考慮大氣壓力，湖水密度均勻）`,options:[`湖水的總體積越大，壩底受到的水壓就越大；蓄水量降為約 1/4 後，該點的水壓也降為約 1/4`,`壩體某處受到的水壓只與它在水面下的深度和水的密度有關；水位下降 80 公尺後，該點的水壓約變為原來的 7/15`,`水壓只會向下作用，所以壩體只承受上方湖水向下的壓力`,`壩體某處受到的水壓只與它在水面下的深度和水的密度有關；水位下降 80 公尺後，該點的水壓約變為原來的 8/15`],answer:`B`,explanation:`【解析】液體壓力＝深度 × 液體密度，與液體的總體積或容器形狀無關。水位下降 80 公尺後，該點的深度由 150 公尺變為 70 公尺，水壓變為原來的 70／150＝7/15。(A) 水壓與總體積無關，蓄水量減少的比例與水壓減少的比例不同；(C) 液體內部各方向都有壓力，壩體主要承受湖水向側面推的壓力；(D) 8/15 是用下降的 80 公尺計算，但水壓應由剩下的深度 70 公尺決定。故選 (B)。`},{qNo:39,stem:`洪水夾帶的泥砂大量堆積在溪流流出山谷後的平原地帶。沿著出谷口往下游的方向，這些沉積物最可能有什麼分布特徵？原因為何？`,options:[`靠近谷口處以細泥為主，越往下游顆粒越粗；因為細泥較輕，最先停下來`,`各種大小的顆粒均勻混在一起沉積；因為平原地勢比山谷高，水流在谷口被擋住`,`靠近谷口處以較大的礫石為主，越往下游顆粒越細；因為出谷後坡度變緩、河道變寬，流速減慢，搬運能力逐漸下降`,`最大的石塊被搬到最遠的下游；因為流速越慢，搬運能力越強`],answer:`C`,explanation:`【解析】河水的流速越快，能搬運的顆粒越大。溪流出谷口後坡度變緩、水流散開，流速明顯減慢，搬運能力下降，最大最重的礫石先沉積在谷口附近，較細的砂、泥被帶到較遠處才沉積，形成由粗到細的分布（沖積扇）。(A) 細泥較輕，需要流速很慢時才會沉積，應被帶到較遠處；(B) 平原地勢比山谷低，水才會往下游流，沉積物也會依顆粒大小分選；(D) 流速越慢，搬運能力越弱，不是越強。故選 (C)。`},{qNo:40,stem:`開關 S 閉合時，四個燈泡的亮度關係為何？`,options:[`L₁＞L₂＝L₃＞L₄`,`L₄＞L₁＞L₂＝L₃`,`L₁＝L₄＞L₂＝L₃`,`L₄＞L₂＝L₃＞L₁`],answer:`B`,explanation:`【解析】L₄ 直接接在電池兩端，電壓等於電池電壓 V。另一路是 L₁ 與（L₂、L₃ 並聯）串聯：並聯部分電阻為 R/2，這一路總電阻 1.5R，L₁ 兩端電壓為 V × R ÷ 1.5R＝2V/3，L₂、L₃ 兩端各為 V/3。電阻相同時，電壓越大，電功率越大，所以 L₄＞L₁＞L₂＝L₃。(A) 誤以為電流先經過的 L₁ 最亮、電流「用到最後」才到 L₄，但 L₄ 與另一路並聯，兩端電壓最大；(C) L₁ 只分到 2V/3，比 L₄ 的 V 小；(D) L₂、L₃ 分走了 L₁ 的電流，各自只有 V/3，比 L₁ 暗。故選 (B)。`},{qNo:41,stem:`將開關 S 打開後，L₁、L₂、L₄ 的亮度與 S 閉合時相比，各有什麼變化？`,options:[`L₁、L₂ 都變亮，L₄ 不變`,`L₁ 變暗，L₂ 變亮，L₄ 不變`,`L₁ 變亮，L₂ 變暗，L₄ 變亮`,`L₁、L₂、L₄ 都變暗`],answer:`B`,explanation:`【解析】S 打開後 L₃ 不亮，L₁ 與 L₂ 串聯，總電阻由 1.5R 增為 2R，L₁、L₂ 兩端各分得 V/2。L₁ 由 2V/3 降為 V/2，變暗；L₂ 由 V/3 升為 V/2，變亮。L₄ 仍直接接在電池兩端，電壓仍為 V，亮度不變。(A) 這一路總電阻變大，電流變小，L₁ 會變暗而不是變亮；(C) 說反了，而且 L₄ 兩端電壓不受另一路影響；(D) L₂ 分到的電壓由 V/3 增為 V/2，會變亮，L₄ 亮度不變。故選 (B)。`},{qNo:42,stem:`光照強度為 1 千勒克斯時，下列敘述何者正確？`,options:[`植物甲在此光照下不進行光合作用`,`植物乙在此光照下只進行光合作用，不進行呼吸作用`,`植物甲的淨氧氣釋放速率為 0，表示植物甲已經死亡`,`植物甲光合作用產生氧氣的速率等於呼吸作用消耗氧氣的速率`],answer:`D`,explanation:`【解析】由圖，光照 1 千勒克斯時植物甲的淨氧氣釋放速率為 0，表示光合作用產生的氧氣恰好等於呼吸作用消耗的氧氣。(A) 淨值為 0 是兩種作用速率相等，不是沒有光合作用（光照 0 時淨值為 −2，才只有呼吸作用）；(B) 植物不論有沒有光照都會進行呼吸作用，乙的淨值為正，只表示光合作用大於呼吸作用；(C) 活的植物才會進行光合作用和呼吸作用，淨值為 0 不代表死亡。故選 (D)。`},{qNo:43,stem:`光照強度為 4 千勒克斯時，植物甲、乙「光合作用產生氧氣」的速率分別為多少（相對值）？`,options:[`甲 6，乙 4`,`甲 4，乙 3`,`甲 8，乙 5`,`甲 6，乙 5`],answer:`C`,explanation:`【解析】光合作用產生氧氣的速率＝淨氧氣釋放速率＋呼吸作用速率。呼吸作用速率可由光照 0 時的淨值得知：甲 2、乙 1。光照 4 時，甲淨值 6，光合作用＝6＋2＝8；乙淨值 4，光合作用＝4＋1＝5。(A) 6 和 4 是圖上讀到的淨值，沒有加回呼吸作用消耗的氧氣；(B) 把呼吸作用速率從淨值中再減一次，方向弄反了；(D) 甲沒有加回呼吸作用的 2。故選 (C)。`},{qNo:44,stem:`放入 0.30 公克鎂帶的那一瓶，反應停止後哪一種反應物有剩餘？剩下多少？`,options:[`鹽酸有剩餘，鎂已完全反應`,`鎂有剩餘，約剩 0.24 公克`,`鎂有剩餘，約剩 0.06 公克`,`兩者都恰好完全反應，沒有剩餘`],answer:`C`,explanation:`【解析】由圖，鎂帶在 0.24 公克以前，氫氣體積與鎂的質量成正比；超過 0.24 公克後氫氣固定為 240 mL，表示 50 mL 鹽酸最多只能與 0.24 公克鎂反應。放入 0.30 公克時鹽酸已用完，鎂剩下 0.30 − 0.24＝0.06 公克。(A) 若鎂完全反應，0.30 公克應產生 300 mL 氫氣，但只得到 240 mL，可見鹽酸不足；(B) 0.24 公克是「參與反應」的鎂，不是剩下的；(D) 恰好完全反應的是 0.24 公克那一瓶。故選 (C)。`},{qNo:45,stem:`若改用 50 mL、濃度為原來 2 倍的稀鹽酸，放入 0.36 公克鎂帶，反應完全後最多可產生多少毫升氫氣（同溫同壓）？`,options:[`480 mL`,`360 mL`,`240 mL`,`720 mL`],answer:`B`,explanation:`【解析】鹽酸濃度加倍、體積不變，所含的 HCl 加倍，最多可與 0.48 公克鎂反應。放入的鎂只有 0.36 公克，這次鎂不足，產生的氫氣由鎂的量決定：由圖可知每 0.06 公克鎂產生 60 mL 氫氣，0.36 公克可產生 360 mL。(A) 480 mL 是鹽酸能產生的最大量，但鎂只有 0.36 公克，不足以全部反應；(C) 240 mL 是原濃度鹽酸時的最大量，鹽酸加倍後不再是限制因素；(D) 720 mL 是把鎂限制下的產量 360 mL 錯誤地再加倍，但鎂只有 0.36 公克，最多只能產生 360 mL。故選 (B)。`},{qNo:46,stem:`根據上文，下列四項敘述：
甲、過去認為胸腺淘汰可能攻擊自身的 T 細胞就足以防止自體免疫，後來的發現顯示還需要調節性 T 細胞的作用。
乙、調節性 T 細胞的主要功能是直接殺死入侵的病原體。
丙、FOXP3 基因突變的小鼠出現自體免疫症狀，是因為免疫反應無法被適當地抑制。
丁、表中第一組注射生理食鹽水，是為了提供調節性 T 細胞所需的養分。
其中哪些正確？`,options:[`甲、丙`,`甲、乙、丙`,`丙、丁`,`甲、丙、丁`],answer:`A`,explanation:`【解析】文中說過去認為胸腺淘汰「就足以」防止自體免疫，但後來發現還需要調節性 T 細胞在胸腺以外抑制過度的免疫反應（甲）；FOXP3 是調節性 T 細胞發育所必需的，突變小鼠缺乏調節性 T 細胞，免疫反應無法被抑制而攻擊自身（丙）。乙錯誤：調節性 T 細胞的作用是「抑制」其他免疫細胞過度反應，不是攻擊病原體；丁錯誤：第一組注射生理食鹽水是對照組，用來排除「注射」這個動作本身造成的影響，而且這組小鼠根本沒有調節性 T 細胞。(B) 乙錯誤；(C) 丁錯誤，且漏掉了甲；(D) 丁錯誤。故選 (A)。`},{qNo:47,stem:`有人質疑：第二組出現症狀的比例下降，可能只是因為「注射了任何來自正常小鼠的 T 細胞」，不一定是調節性 T 細胞的作用。要回應這個質疑，最適合再增加下列哪一組？`,options:[`注射等量取自正常小鼠、但不是調節性 T 細胞的其他 T 細胞`,`注射兩倍量取自正常小鼠的調節性 T 細胞`,`不做任何處理，直接觀察 8 週`,`改用正常小鼠，注射生理食鹽水`],answer:`A`,explanation:`【解析】要確認效果來自「調節性 T 細胞」而不是「任何 T 細胞」，新增的組別應只改變注射的細胞種類，其他條件（細胞來源、數量、受試小鼠）都和第二組相同。若注射其他 T 細胞的小鼠仍大多發病，就能支持是調節性 T 細胞發揮作用。(B) 只改變調節性 T 細胞的量，仍無法區分是不是任何 T 細胞都有效；(C) 不處理的組別與第一組的作用類似，只能說明注射生理食鹽水本身沒有影響；(D) 改用正常小鼠後，受試小鼠本身就有調節性 T 細胞，與質疑的問題無關。故選 (A)。`},{qNo:48,stem:`根據調節性 T 細胞的作用，下列哪一種治療構想在原理上最合理？`,options:[`對於器官移植的患者，設法減少調節性 T 細胞，以避免排斥移植的器官`,`對於癌症患者，設法增加腫瘤附近的調節性 T 細胞，使免疫系統更強力地攻擊癌細胞`,`對於細菌感染的患者，注射調節性 T 細胞來取代抗生素殺死細菌`,`對於自體免疫疾病（例如第一型糖尿病）的患者，設法增加調節性 T 細胞的數量或活性`],answer:`D`,explanation:`【解析】自體免疫疾病是免疫系統過度攻擊自身組織，增加能「抑制過度反應」的調節性 T 細胞，在原理上可以減輕病情。(A) 器官排斥是免疫系統攻擊移植的器官，減少調節性 T 細胞會使攻擊更強烈，方向相反；(B) 增加調節性 T 細胞會抑制免疫反應，使免疫系統對癌細胞的攻擊減弱，方向也相反；(C) 調節性 T 細胞不會殺死細菌，而且會抑制免疫反應。故選 (D)。`},{qNo:49,stem:`下列哪一個推論，其比較的組別與得到的結論都正確？`,options:[`比較乙和戊：溫度較高時，酵母菌產生的氣體較多`,`比較甲和戊：在此範圍內，葡萄糖濃度較高時，30 分鐘內產生的氣體較多`,`比較丙和丁：加熱過的酵母菌不能利用葡萄糖`,`比較甲和丙：酵母菌在 35°C 時的活性最高`],answer:`B`,explanation:`【解析】甲和戊只有葡萄糖濃度不同（5% 與 10%），其他條件相同，戊的氣球較大，表示在此範圍內濃度較高時產生的氣體較多。(A) 乙和戊的溫度與葡萄糖濃度都不同，無法單獨判斷溫度的影響，應比較甲和乙；(C) 丙沒有葡萄糖、丁的酵母加熱過，兩個條件都不同；(D) 甲和丙差在有無葡萄糖，而且實驗只做了 20°C 和 35°C，無法知道活性最高的溫度。故選 (B)。`},{qNo:50,stem:`關於這個實驗，下列四項敘述：
一、使澄清石灰水變混濁的氣體是二氧化碳。
二、裝清水（沒有葡萄糖）的丙瓶，氣球沒有膨脹，表示酵母菌在清水中已經全部死亡。
三、酵母事先經 80°C 加熱的丁瓶沒有產生氣體，可能是高溫破壞了酵母菌體內的酵素，使酵母菌無法分解葡萄糖。

就法治原則而言，這項命令最主要的問題是什麼？`,options:[`保護青少年不屬於公共利益，任何限制都違憲`,`行政命令效力高於法律，不必經立法機關同意`,`限制自由並處罰鍰，須有法律或法律明確授權`,`只要目的正當，行政機關可自行限制任何自由`],answer:`C`,explanation:`【解析】依該國憲法，限制人民自由權利須「以法律」為之（法律保留原則）；處罰鍰更是對人民的不利處分，必須有法律或法律具體明確的授權。部會在沒有法律授權下自行以命令規定並處罰，違反法律保留。A保護青少年身心健康可以屬於公共利益，問題不在目的，而在缺乏法律依據；B法律的位階高於命令，命令不得牴觸法律；D即使目的正當，限制人民自由仍須有法律依據並符合比例原則。故選 (C)。`},{qNo:22,stem:`6 歲的小弟與 15 歲的哥哥，在公園玩耍時各自闖了禍：小弟丟石頭打破了路人甲的手機（法院認定他行為時沒有識別能力）；哥哥騎腳踏車邊騎邊看手機，撞傷了路人乙（法院認定他行為時有識別能力）。假設兩兄弟的父母都無法證明自己已盡相當的監督責任。
依我國民法，下列敘述何者正確？`,options:[`甲的損失由父母賠償；乙的損失由哥哥與父母連帶賠償`,`兩人都未成年，兩件損失都只能由路人自行負擔`,`甲的損失由小弟與父母連帶賠償；乙的損失只由父母賠償`,`兩件損失都只由兄弟本人賠償，父母不必負擔責任`],answer:`A`,explanation:`【解析】民法第 187 條：無行為能力人或限制行為能力人不法侵害他人權利，以「行為時有識別能力」為限，與法定代理人連帶負損害賠償責任；行為時無識別能力者，由法定代理人負責。所以小弟（無識別能力）造成的損失由父母賠償；哥哥（有識別能力）由他與父母連帶賠償。題目也排除了父母已盡監督責任而免責的情形。B未成年不代表被害人只能自認倒楣；C把兩人的情形弄反了；D父母未能證明已盡監督責任，仍須負責。故選 (A)。`},{qNo:23,stem:`國內生產毛額（GDP）是指一個國家「境內」在一定期間內，所生產的最終商品與勞務的市場價值。下列哪一項會計入 2026 年我國的 GDP？`,options:[`小明的媽媽在家為家人煮飯、打掃的家務勞動`,`外籍工程師在臺灣工廠參與生產、當年出口的晶片`,`2026 年轉售一輛 2020 年生產的二手車的車價`,`臺灣企業在越南工廠生產、運回臺灣銷售的球鞋`],answer:`B`,explanation:`【解析】GDP 看的是「在哪裡生產」與「是否為當期市場生產」，而不是生產者的國籍或企業的國籍。外籍工程師在臺灣境內參與生產、2026 年出口的晶片，屬於當年在我國境內生產並經市場交易的產品（出口也計入 GDP）。A家務勞動沒有經過市場交易，不計入 GDP；C二手車是 2020 年生產的，已計入當年的 GDP，轉售的車價不能重複計算；D生產地在越南，計入越南的 GDP；運回臺灣銷售屬於我國的進口，企業國籍也不是判斷標準。故選 (B)。`},{qNo:24,stem:`資料一的作者說舊志「竟以島夷海寇視之」，他批評的是什麼？`,options:[`舊志過度重視荷蘭人的貢獻，忽略清朝的經營`,`舊志以清朝為中心，視荷、鄭為外夷海盜而不載`,`舊志把原住民寫成海寇，卻詳細記載鄭氏事蹟`,`舊志只記載鄭氏時期，未記載清朝經營的史事`],answer:`B`,explanation:`【解析】資料一說舊志「僅隷有清一朝，荷人鄭氏之事，闕而弗錄，竟以島夷海寇視之」：舊志只記清朝一代，把荷蘭與鄭氏時期的事缺漏不記，甚至把他們當成外夷與海盜。連橫要寫一部「起自隋代，終於割讓」的通史來補足。A正好相反，舊志是漏記荷蘭時期；C「島夷海寇」指的是荷人、鄭氏，而且舊志並未詳記鄭氏；D把「僅隷有清一朝」讀反了。故選 (B)。`},{qNo:25,stem:`資料二中的「我國」最可能是指哪一個國家？`,options:[`清朝`,`中華民國`,`日本`,`荷蘭`],answer:`C`,explanation:`【解析】兩篇序文都作於大正七年，大正是日本的年號，可知成書於日治時期（1918 年）。資料二把荷、鄭、清都當成過去的統治者，又說「臺灣今日當我國圖南關門」，把臺灣視為「我國」向南發展的門戶，配合當時日本的南進構想，所以「我國」是統治臺灣的日本（資料二的作者尾崎秀真是日本人）。A資料二用「忽而清」把清朝列為已經過去的統治者，而且清朝在 1912 年已經結束；B1918 年中華民國雖已建立，但臺灣當時由日本統治，不是中華民國的領土，談不上是中華民國「圖南」的門戶；D「西踞荷爭」是十七世紀的往事，荷蘭早已離開臺灣。故選 (C)。`},{qNo:26,stem:`比較兩則資料的觀點，下列敘述何者正確？`,options:[`資料一批評舊志偏重清朝；資料二以本國立場強調臺灣地位`,`兩則資料都主張臺灣的歷史，應從清朝統治臺灣時開始記載`,`資料一肯定舊志的記載完整可信，只惋惜其文采不足以傳世`,`資料二認為臺灣面積狹小，在東西文化交流上的地位無足輕重`],answer:`A`,explanation:`【解析】資料一的重點在「舊志誤謬……荷人鄭氏之事，闕而弗錄」，所以要寫一部從隋代到割讓的完整通史；資料二把臺灣放在「我國圖南」的國家發展角度，稱臺灣是東西文化交會的樞紐、「世界的臺灣」。B資料一「起自隋代」，資料二也說「始於隋之大業六年」，都不是從清朝開始；C資料一說舊志「誤謬」「闕而弗錄」，並不認為記載完整；D資料二說臺灣是「東西文化潮流折衝樞紐」，「臺灣雖小，業成為世界的臺灣」，是肯定臺灣的重要。故選 (A)。`},{qNo:27,stem:`依資料一，下列哪一個地點位在條約所割讓的「澎湖列島」範圍內？`,options:[`東經 120.2 度、北緯 23.0 度`,`東經 119.6 度、北緯 23.6 度`,`東經 118.3 度、北緯 24.4 度`,`東經 119.9 度、北緯 26.2 度`],answer:`B`,explanation:`【解析】條約以經緯度界定澎湖列島：東經 119 度到 120 度、北緯 23 度到 24 度之間。只有（東經 119.6 度、北緯 23.6 度）同時落在兩個範圍內（約為今澎湖馬公附近）。A經度超過 120 度，約在臺灣本島的臺南一帶；C經度不到 119 度，約在金門一帶；D緯度超過 24 度，約在馬祖一帶。故選 (B)。`},{qNo:28,stem:`1896 年 3 月，一位住在臺南、從未離開臺灣的商人想了解自己的處境。依資料一第五款，下列說明何者正確？`,options:[`條約一簽訂就自動成為日本臣民，不能再選擇遷出`,`可以繼續留在臺灣，並且永久保留清朝國籍身分`,`須在 1895 年底前離開臺灣，否則財產將被沒收`,`仍可變賣產業遷往清國；期滿未遷出才視為日本臣民`],answer:`D`,explanation:`【解析】第五款給予「批准互換之後限二年」的期限：1895 年 5 月 8 日批准互換，期限到 1897 年 5 月 8 日。1896 年 3 月還在期限內，他可以「任便變賣所有產業，退去界外」；期限屆滿仍未遷徙者，才「酌宜視為日本臣民」。A忽略了兩年的選擇期間；B期限屆滿仍留在臺灣者將被視為日本臣民，不能永久保留清朝國籍；C條約給的是兩年期限，而且是准許變賣產業，並沒有沒收財產的規定。故選 (D)。`},{qNo:29,stem:`關於「臺灣民主國」的成立，資料二與資料三的說法有何不同？`,options:[`資料二宣布與清朝斷絕關係；資料三稱讚唐忠於清朝`,`兩則資料都主張臺灣應接受馬關條約，歸日本統治`,`資料二自稱仍尊奉清朝；資料三認為此舉並非忠於清朝`,`資料二是日本政府的命令；資料三是清朝官員的奏摺`],answer:`C`,explanation:`【解析】資料二說「今雖自立為國，感念舊恩，仍奉正朔，遙作屏藩」，表示自立是為了拒絕割讓，仍承認清朝為正統；資料三的作者是日本官員，認為唐巡撫「獨立倡亂」「寔非所以忠於清朝」，對同一件事的評價完全不同，反映作者立場對史料觀點的影響。A把兩則資料的立場都弄反了；B資料二說「臺民忠義，誓不服從」，是反對割讓給日本；D資料二是唐景崧的告示，資料三是日本官員下村宏的序文。故選 (C)。`},{qNo:30,stem:`依文中線索推算，這篇文章發表的年份，與下列哪一個事件發生在同一年？`,options:[`武昌起義爆發，南方各省紛紛響應宣布獨立`,`日本關東軍在瀋陽附近發動九一八事變`,`康有為、梁啟超等人推動戊戌變法維新`,`北京學生為反對巴黎和會決議而發起五四運動`],answer:`D`,explanation:`【解析】「用德先生的意思廢了君主」指 1912 年中華民國建立、清帝退位，結束君主制度；1912 年是第一年，「第八年的開始」就是 1919 年初。1919 年 5 月因巴黎和會把德國在山東的權益交給日本，北京學生發起五四運動。A武昌起義在 1911 年，君主尚未廢除；B九一八事變在 1931 年；C戊戌變法在 1898 年，都不是 1919 年。故選 (D)。`},{qNo:31,stem:`作者為什麼說擁護「德先生」就「不得不反對」舊倫理、舊政治？下列解讀何者最符合文意？`,options:[`唯有恢復孔子的學說，才能建立真正的民主制度`,`傳統禮教的上下尊卑，與民主的自由平等互相衝突`,`科學方法可以證明舊政治正確，所以應該保留`,`作者真心承認本誌犯了滔天大罪，願意接受懲罰`],answer:`B`,explanation:`【解析】文章在回應外界指控《新青年》「破壞孔教、禮法」等罪狀，作者把這些「罪」歸因於擁護民主與科學：民主重視個人自由、平等，與講究三綱五常、君臣尊卑的舊禮教與君主政治衝突，所以要擁護民主就必須反對舊倫理、舊政治。A文中明說要「反對孔敎」；C賽先生（科學）對應的是反對舊藝術、舊宗教，不是證明舊政治正確；D「滔天的大罪」是反諷的說法，作者說「本誌同人本來無罪」，並非真心認罪。故選 (B)。`},{qNo:32,stem:`地震發生時，臺灣是幾時幾分？`,options:[`13 時 50 分`,`14 時 20 分`,`11 時 20 分`,`15 時 20 分`],answer:`B`,explanation:`【解析】臺灣（UTC+8）比緬甸（UTC+6:30）快 1 小時 30 分，12 時 50 分＋1 小時 30 分＝14 時 20 分。A是誤以為兩地只差 1 小時（例如把緬甸當成與泰國一樣的 UTC+7）；C是把時差方向弄反，用減的；D是把時差誤算成 2 小時 30 分。故選 (B)。`},{qNo:33,stem:`就斷層兩側的相對運動方式而言，實皆斷層與下列哪一處最相似？`,options:[`美國加州聖安德列斯斷層，兩側沿水平方向錯動`,`喜馬拉雅山脈，印度板塊與歐亞板塊碰撞隆起`,`東非大裂谷，兩側板塊互相張裂而逐漸分離`,`日本東側海溝，海洋板塊隱沒到大陸板塊下`],answer:`A`,explanation:`【解析】題目問的是「運動方式」：實皆斷層兩側主要沿水平方向錯移，屬於錯動型；聖安德列斯斷層是太平洋板塊與北美板塊沿水平方向錯動的交界，兩者最相似。B是常見誘答：緬甸雖然也受到印度板塊推擠歐亞板塊的影響，但喜馬拉雅山是兩板塊碰撞擠壓（聚合型）造成的隆起，與水平錯移不同；C是張裂型；D是隱沒（聚合型），都不是水平錯動。故選 (A)。`},{qNo:34,stem:`依據文中資訊，下列推論何者最合理？`,options:[`曼谷大樓倒塌，表示曼谷也位在實皆斷層上`,`強震災害可能跨越國界，遠離震央處也需防震`,`震源越深破壞越嚴重，因此這次災情才會慘重`,`實皆斷層兩側以上下錯動為主，形成高大斷崖`],answer:`B`,explanation:`【解析】震央在緬甸，約 1,000 公里外的泰國曼谷仍有大樓倒塌，顯示強震的災害可能跨越國界，遠方地區也不能忽視防震。A文中只說曼谷距震央約 1,000 公里，沒有說曼谷位在實皆斷層上，這是過度推論；C這次是震源約 10 公里的淺層地震，一般而言震源越淺，地表搖晃與破壞越劇烈；D與文中「主要是沿水平方向互相錯移」矛盾。故選 (B)。`},{qNo:35,stem:`馬太鞍溪堰塞湖的形成，與下列哪一組自然條件最相關？`,options:[`河川下游坡度平緩，泥沙大量堆積形成三角洲`,`山區陡峭、岩層破碎，颱風豪雨引發大規模崩塌`,`冰河消融後，冰河搬運的岩屑堵塞了谷地`,`火山噴發的熔岩流向谷地，阻斷了河道`],answer:`B`,explanation:`【解析】臺灣山地陡峭、地質破碎，颱風豪雨容易引發大規模山崩；崩落的土石堵塞河道，上游河水被攔蓄，就形成堰塞湖。資料也說明是颱風外圍環流豪雨造成山區崩塌。A三角洲是河口的堆積地形，不會堵住上游河道；C臺灣沒有現代冰河作用；D文中說是山崩土石堵塞，並非火山熔岩。故選 (B)。`},{qNo:36,stem:`依《災害防救法》，災害發生或有發生之虞時，地方政府應勸告或強制居民撤離，並作適當安置。強制撤離限制了居民的居住遷徙自由，卻仍被認為符合憲法，最主要的理由是下列何者？`,options:[`為避免緊急危難、保護生命所必要，且有法律明定`,`居住遷徙自由不受憲法保障，政府可以任意限制`,`只要縣長認為有需要，即使無法律依據也可強制`,`撤離主要為保護政府財產，與居民生命安全無關`],answer:`A`,explanation:`【解析】憲法第 23 條允許為「避免緊急危難」等目的、在必要範圍內「以法律」限制人民的自由權利。堰塞湖潰決或溢流後洪水很快抵達下游，預防性撤離是保護生命的必要手段，《災害防救法》也有明文規定，因此合憲。B居住遷徙自由是憲法明文保障的權利；C限制人民自由須有法律依據（法律保留），不能只憑首長的意思；D法律明定撤離的目的是保護人民生命、財產安全。故選 (A)。`},{qNo:37,stem:`假設堰塞湖溢流後，洪水抵達直線距離 11.5 公里外的某個下游聚落需要 40 分鐘。下列推論何者最合理？`,options:[`平均流速最多約每小時 17 公里，因實際流路短於直線`,`平均流速約每小時 0.29 公里，比步行速度還慢`,`平均流速至少約每小時 17 公里，因實際流路不短於直線`,`平均流速約每小時 460 公里，接近高鐵速度`],answer:`C`,explanation:`【解析】以直線距離估算：11.5 公里 ÷（40/60）小時≈17.25 公里／小時。但洪水沿彎曲的河道流動，實際流路一定大於或等於直線距離，所以實際平均流速「至少」約每小時 17 公里。這也說明撤離必須提前進行，等看到洪水再跑就來不及。A數字對，但推理方向錯，實際流路不可能比兩點間的直線距離短；B是 11.5 ÷ 40 得到每「分鐘」約 0.29 公里，單位誤當成每小時；D是把距離與時間相乘，算法錯誤。故選 (C)。`},{qNo:38,stem:`依資料一，下列推論何者最合理？`,options:[`雖有反聖嬰降溫，2025 年仍名列最熱年份，暖化趨勢未變`,`2015 到 2025 年是最熱的 11 年，表示每年都比前一年熱`,`全球平均升溫 1.44°C，表示地球上每個地方都升溫 1.44°C`,`反聖嬰現象使 2025 年全球氣溫低於工業化前的平均`],answer:`A`,explanation:`【解析】反聖嬰（拉尼娜）會暫時使全球氣溫略降，但 2025 年在這種情況下仍名列最熱的三年之一，說明短期的自然變動沒有扭轉長期暖化趨勢。B「最熱的 11 年都在 2015–2025 年」只表示這些年份排在前 11 名，不代表逐年上升（例如 2025 年並非最熱的一年）；C1.44°C 是全球平均值，各地升溫幅度不同；D與「比工業化前高約 1.44°C」矛盾。故選 (A)。`},{qNo:39,stem:`資料三提到，28 家業者撤案或被駁回後改按一般費率繳費，使實收金額增加。這項事實最能說明我國碳費制度的哪一項設計？`,options:[`碳費依企業的營業額計算，與排放量多寡無關`,`以較低優惠費率為誘因，鼓勵業者自主減量`,`所有製造業不論排放多少，都必須繳交碳費`,`優惠費率一經申請便自動適用，不需經過審核`],answer:`B`,explanation:`【解析】碳費依排放量計價，一般費率每公噸 300 元；提出自主減量計畫並經核定才能適用 50 元或 100 元的優惠費率。業者撤案或被駁回就回到一般費率，可見優惠費率是鼓勵減量的誘因，也有審核把關。A資料說明碳費是「每公噸」計價，依排放量計算；C徵收對象是年排放 2.5 萬公噸以上的業者，並非所有製造業；D有業者「被駁回」，表示需要審核。故選 (B)。`},{qNo:40,stem:`依資料三計算，下列敘述何者正確？`,options:[`半導體業的廠數，約占所有繳費廠數的四成以上`,`半導體業每廠平均繳費，低於所有繳費廠的平均`,`實際收取的碳費，比原先預估的金額少了約一成`,`半導體業繳費逾總額四成，每廠平均也高於整體`],answer:`D`,explanation:`【解析】半導體業繳費占總額：22 ÷ 49.7≈44%，超過四成；平均每廠：半導體業 22 億 ÷ 123≈1,789 萬元，全部 49.7 億 ÷ 461≈1,078 萬元，半導體業較高。A半導體廠數占比為 123 ÷ 461≈27%，未達四成，是把「金額比重」和「廠數比重」混淆；B算錯，半導體業平均每廠繳費較高；C實收 49.7 億元比預估 45 億元多約 10%，是多收而不是少收。故選 (D)。`},{qNo:41,stem:`COP30 選在亞馬遜地區舉行，最能凸顯熱帶雨林在因應氣候變遷上的哪一項角色？`,options:[`吸收並儲存大量二氧化碳，濫伐會釋碳加劇暖化`,`雨林地區蘊藏大量石油，是全球主要的石油產地`,`雨林能將陽光全部反射回太空，使地球降溫`,`雨林地區的高溫，是造成全球暖化的主要原因`],answer:`A`,explanation:`【解析】熱帶雨林行光合作用吸收大量二氧化碳，並把碳儲存在植物與土壤中，是重要的「碳匯」；一旦砍伐、焚燒，儲存的碳會釋放到大氣中。因此保護雨林、減少毀林是氣候大會關注的議題。B全球主要石油產地在西亞等地區，與雨林的氣候角色無關；C深色的森林反射率低，吸收陽光較多，並非把陽光全部反射；D全球暖化主要來自人類排放的溫室氣體，雨林本身的高溫並非暖化的原因。故選 (A)。`},{qNo:42,stem:`一位保加利亞教師原本月薪 1,955.83 列弗，換成歐元後月薪變為 1,000 歐元。若物價也依相同匯率換算，下列敘述何者正確？`,options:[`月薪數字由約 1,956 變成 1,000，購買力約減半`,`保加利亞可自行調降歐元利率，使他的薪水增加`,`購買力不因換幣而改變，在歐元區各國消費免換匯`,`改用歐元後，保加利亞便不再是歐盟的會員國`],answer:`C`,explanation:`【解析】1,955.83 ÷ 1.95583＝1,000，薪水與物價都按同一個固定匯率換算，數字變小但能買到的東西不變（購買力不變）。改用共同貨幣後，在歐元區各國消費免去換匯，也能直接比較價格。A是只看數字大小的「貨幣幻覺」，物價也一起換算，購買力沒有減半；B資料說明歐元區利率由歐洲中央銀行統一決定，保加利亞不能自行調整；D加入歐元區是歐盟成員進一步的整合，並未退出歐盟。故選 (C)。`},{qNo:43,stem:`依資料一，保加利亞改用歐元後，最明顯地交出了哪一方面政策的自主權？`,options:[`貨幣發行與利率等貨幣政策`,`本國所得稅稅率等租稅政策`,`本國最低工資等勞動政策`,`國會議員選舉等內政事務`],answer:`A`,explanation:`【解析】使用共同貨幣後，貨幣的發行與利率由歐洲中央銀行統一決定，成員國不能再依本國景氣自行調整，這是加入歐元區最主要的代價。B租稅屬財政政策，仍由各成員國自行決定；C最低工資屬各國的勞動政策；D國會選舉是國家的內政，與使用歐元無關。故選 (A)。`},{qNo:44,stem:`東帝汶位於帝汶島東半部，首都帝力約在南緯 8.5 度。關於東帝汶與東協，下列敘述何者正確？`,options:[`它是東協第一個領土位在南半球的會員國`,`它並非東協第一個擁有南半球領土的會員國`,`它加入後，東協才首度有中南半島以外的島國`,`它與越南陸地相鄰，位於中南半島的東部`],answer:`B`,explanation:`【解析】帝力在南緯 8.5 度，位於南半球；但東協原本的會員國印尼跨越赤道，爪哇島、峇里島等都在赤道以南（例如雅加達約在南緯 6 度），所以東帝汶並非第一個擁有南半球領土的會員國。A是常見誘答，忽略了印尼的領土本來就延伸到南半球；C菲律賓、印尼、新加坡等島嶼國家早已是東協成員；D東帝汶在帝汶島上，與印尼共享帝汶島，並不在中南半島。故選 (B)。`},{qNo:45,stem:`三項公投中，哪些案通過？`,options:[`只有第一案`,`只有第二案`,`第一案與第二案`,`第一案與第三案`],answer:`A`,explanation:`【解析】通過門檻：同意票多於不同意票，且同意票達 2,000 萬 × 1/4＝500 萬。第一案 520 萬＞480 萬，且 520 萬≧500 萬，通過；第二案同意票是不同意票的 3 倍，但 450 萬未達 500 萬，不通過；第三案同意票 600 萬雖達門檻，但少於不同意票 700 萬，不通過。B只看同意與不同意的比例，忽略了門檻；C同樣漏看第二案未達門檻；D只看同意票是否達門檻，忽略第三案同意票少於不同意票。故選 (A)。`},{qNo:46,stem:`若第三案中有 120 萬名原本投不同意票的人改為不去投票，其他票數不變，結果會如何？`,options:[`通過，因同意票多於不同意票且達門檻`,`不通過，因投票人數減少使門檻提高`,`不通過，因同意票未超過投票人數一半`,`無法判斷，須重算投票權人總額才知道`],answer:`A`,explanation:`【解析】不同意票變為 700 − 120＝580 萬，同意票 600 萬＞580 萬，且 600 萬≧500 萬，所以通過。這題的轉折是：反對者「不去投票」反而讓提案通過，因為門檻是看同意票占「投票權人總額」的比例，不會因投票的人變少而改變。B門檻以投票權人總額（2,000 萬）計算，與實際投票人數無關；C法律沒有「同意票須超過投票人數一半」的規定，何況 600 ÷（600＋580）≈51% 也已超過一半；D投票權人總額是固定的 2,000 萬人，不受是否投票影響。故選 (A)。`},{qNo:47,stem:`有人說：「在這種門檻設計下，反對者乾脆不去投票，一定比去投不同意票更能讓公投不通過。」依題目的規定與表中資料判斷，下列說明何者正確？`,options:[`正確，反對者不投票會使投票率未達一半而不通過`,`正確，第一案若再多 50 萬張不同意票仍會通過`,`正確，第二案只要不同意票減為 0 票就會通過`,`不正確，反對者不投票不會減少同意票，無助於否決`],answer:`D`,explanation:`【解析】現行門檻看的是「同意票是否多於不同意票」與「同意票是否達投票權人總額的四分之一」。反對者不投票，同意票不會因此減少，不同意票卻變少，只會讓通過更容易（前一題的第三案就是例子），所以這個說法不正確。A題目的規定中沒有「投票率須達一半」的門檻，這是把其他制度的規定套用進來；B第一案若不同意票增加 50 萬，變成 530 萬，多於同意票 520 萬，就不會通過；C第二案同意票只有 450 萬，未達 500 萬門檻，不同意票再少也不會通過。故選 (D)。`},{qNo:48,stem:`資料一、資料二的發言者，最可能分別代表哪一國？`,options:[`蘇聯；美國`,`英國；中華人民共和國`,`美國；中華人民共和國`,`美國；蘇聯`],answer:`D`,explanation:`【解析】資料一把世界分成「自由選舉、個人自由」與「少數人壓迫」兩種生活方式，宣示支持抵抗外來壓力的「自由人民」，是 1947 年美國總統杜魯門的演說（杜魯門主義）；資料二批評「援助歐洲的計畫」（馬歇爾計畫）是要讓歐洲依附某一強國、對抗「東方民主國家」，是蘇聯陣營的立場。A把兩者對調；B、C的中華人民共和國在 1949 年才成立，不可能在 1947 年發言，而且資料一的發言者是「總統在國會」演說，英國是內閣制，沒有總統。故選 (D)。`},{qNo:49,stem:`資料二所批評的援助計畫實施後，最可能產生下列哪一項結果？`,options:[`東歐國家大量接受援助，蘇聯在東歐的影響消失`,`美、蘇兩國因此結盟，共同出資重建統一的德國`,`西歐經濟逐漸復甦，東、西歐陣營對立更加鮮明`,`援助計畫使得第二次世界大戰得以提早結束`],answer:`C`,explanation:`【解析】馬歇爾計畫援助西歐重建，西歐經濟逐漸復甦；蘇聯拒絕參加，也不讓東歐國家接受，另組經濟互助組織，歐洲因此分裂為東、西兩大陣營，冷戰對立更加明顯。A蘇聯阻止東歐國家接受援助，東歐仍在蘇聯控制下；B美蘇在德國問題上對立，後來德國分裂為東、西德；D資料是 1947 年的發言，第二次世界大戰已在 1945 年結束。故選 (C)。`},{qNo:50,stem:`依表中資料，下列敘述何者正確？`,options:[`乙年每一組所得都增加，所以分配比甲年更平均`,`甲年五等分位倍數為 7 倍，乙年縮小為 6 倍`,`乙年最低所得組的平均每戶所得比甲年減少`,`各組所得都增加，但倍數由 6 倍擴大為 7 倍`],answer:`D`,explanation:`【解析】甲年：210 ÷ 35＝6；乙年：252 ÷ 36＝7。各組所得雖然都增加，最高組增加得更多，差距反而擴大。A是常見迷思，所得普遍增加不代表分配更平均；B把兩年的倍數對調了；C最低組由 35 萬增為 36 萬，是增加。故選 (D)。`},{qNo:51,stem:`若以乙年為基準，政府考慮下列四種做法（其他條件不變），哪一種能使五等分位倍數降到 5 倍以下？`,options:[`向最高組每戶多課 20 萬，全數轉給最低組各戶`,`最低組每戶補助 10 萬元，財源來自發行公債`,`所有家庭每戶一律補助 10 萬元，人人受惠`,`向最高組每戶多課 30 萬，全數用於興建道路`],answer:`A`,explanation:`【解析】因各組戶數相同，最高組每戶多繳 20 萬，剛好可讓最低組每戶增加 20 萬：（252 − 20）÷（36＋20）＝232 ÷ 56≈4.14，低於 5 倍。B252 ÷（36＋10）≈5.48；C（252＋10）÷（36＋10）≈5.70，人人補助相同金額，倍數下降有限；D（252 − 30）÷ 36≈6.17，只減少高所得而未增加低所得的可支配所得，倍數仍高於 5。這題的關鍵是：同時「減少高所得組」並「增加低所得組」的所得移轉，縮小差距的效果最大。故選 (A)。`},{qNo:52,stem:`三地中，哪一地位在南半球？判斷的依據為何？`,options:[`甲地，全年高溫多雨，符合南半球特徵`,`乙地，1 月前後最熱、7 月前後最冷`,`丙地，冬季均溫低於 0°C，位置偏南`,`乙地，三地中全年降水總量最少`],answer:`B`,explanation:`【解析】南、北半球季節相反：乙地 1、2 月約 24°C 最熱，7 月約 13°C 最冷，可知 1 月是夏季，位於南半球。A全年高溫多雨表示位在赤道附近，無法據此判斷是南半球；C丙地 1 月最冷、7 月最熱，是北半球；D地點雖然正確，但理由錯誤，乙地全年降水約 727 mm，比丙地約 675 mm 還多，並不是最少，而且降水多寡也不能判斷南北半球。故選 (B)。`},{qNo:53,stem:`某農企業想在三地中選一地，在「當地夏季」進行露天的葡萄採收，採收期需要乾燥少雨的天氣。下列哪一個選擇最適當？`,options:[`乙地，在 7 月前後採收`,`丙地，在 7 月前後採收`,`甲地，在 1 月前後採收`,`乙地，在 2 月前後採收`],answer:`D`,explanation:`【解析】乙地是南半球的地中海型氣候，夏乾冬雨：1、2 月是夏季，降水只有 10 mm 左右，最適合採收；這也正是地中海型氣候區盛產葡萄的原因。A乙地 7 月是冬季，降水 135 mm，是雨季；B丙地 7 月雖是夏季，卻是全年降水最多的月份（85 mm）；C甲地終年多雨，1 月降水約 250 mm，也沒有明顯的夏季。故選 (D)。`},{qNo:54,stem:`關於三地的氣溫年較差（最熱月均溫 − 最冷月均溫），下列敘述何者正確？`,options:[`甲地年較差三地中最大，因為位在赤道附近`,`乙地的年較差約 11°C，大於丙地的年較差`,`丙地年較差約 27°C，是三地中最大`,`丙地年較差大，是因為全年降水量三地最多`],answer:`C`,explanation:`【解析】依圖讀出：甲地約 0.8°C、乙地約 11°C、丙地約 27°C（19 −（−8））。丙地冬冷夏熱，年較差最大，符合中高緯度大陸內部的特徵。A赤道附近終年高溫，年較差最小；B乙地約 11°C，小於丙地；D丙地全年降水約 675 mm，三地中最少（甲地約 2540 mm 最多），而且年較差大小主要與緯度、海陸位置有關。故選 (C)。`}],verification:[`2026-10-09 依 SPEC_AI2_AI3.md 出題（ 滄州南一寺臨河干，山門圮於河，二石獸並沉焉。閱十餘歲，僧募金重修，求二石獸於水中，竟不可得。以為順流下矣。棹數小舟，曳鐵鈀尋十餘里，無跡。一講學家設帳寺中，聞之笑曰：「爾輩不能究物理，是非木柿，豈能為暴漲攜之去？乃石性堅重，沙性鬆浮，湮於沙上，漸沉漸深耳。沿河求之，不亦顛乎？」眾服為確論。一老河兵聞之，又笑曰：「凡河中失石，當求之於上流。蓋石性堅重，沙性鬆浮，水不能衝石，其反激之力，必於石下迎水處齧沙為坎穴。漸激漸深，至石之半，石必倒擲坎穴中。如是再齧，石又再轉，轉轉不已，遂反溯流逆上矣。求之下流，固顛；求之地中，不更顛乎？」如其言，果得於數里外。然則天下之事，但知其一，不知其二者多矣，可據理臆斷歟？
——紀昀《閱微草堂筆記》
（注：圮：倒塌。閱：經過。棹：划船。鈀：耙子。設帳：教書。木柿：削下來的木片。湮：埋沒。顛：荒唐、錯誤。河兵：管理河道的兵士。齧：侵蝕。坎穴：坑洞。溯流：逆著水流。臆斷：主觀地推斷。）`,translation:`滄州南邊有一座寺廟靠近河岸，山門倒塌在河裡，門前兩隻石獸一起沉入河中。過了十多年，僧人募款重修山門，到水中尋找兩隻石獸，始終找不到，以為石獸順著水流到下游去了，便划著幾艘小船，拖著鐵耙找了十多里，沒有蹤跡。一位在寺中教書的講學家聽了，笑著說：「你們不懂得推究事物的道理。這不是木片，怎麼會被暴漲的河水帶走呢？石頭的性質堅硬沉重，沙的性質鬆散浮動，石獸埋沒在沙中，只會愈沉愈深罷了。沿著河往下游找，不是很荒唐嗎？」大家都佩服這是正確的論斷。一位老河兵聽了，又笑著說：「凡是河中失落的石頭，都應該到上游去找。因為石頭堅硬沉重，沙鬆散浮動，水沖不動石頭，水流反衝的力量，一定會在石頭底下迎著水流的地方把沙沖刷成坑洞。愈沖愈深，到了石頭的一半，石頭一定會倒向坑洞中。像這樣再沖刷，石頭又再翻轉，不停翻轉，就反而逆流往上游去了。到下游找，固然荒唐；在原地往下挖，不是更荒唐嗎？」照他的話去找，果然在幾里外找到了。既然如此，那麼天下的事，只知道一方面、不知道另一方面的情形很多，怎麼可以只根據某個道理就主觀推斷呢？`},{from:22,to:23,passage:`閱讀下文，回答問題：
錢思公雖生長富貴，而少所嗜好。在西洛時，嘗語僚屬言：「平生惟好讀書。坐則讀經史，臥則讀小說，上廁則閱小辭，蓋未嘗頃刻釋卷也。」謝希深亦言：「宋公垂同在史院，每走廁，必挾書以往，諷誦之聲琅然聞於遠近，其篤學如此。」余因謂希深曰：「余平生所作文章，多在三上，乃馬上、枕上、廁上也。」蓋惟此尤可以屬思爾。
——歐陽脩《歸田錄》
（注：錢思公：錢惟演。西洛：洛陽。僚屬：部屬。小辭：短小的詞曲。釋卷：放下書本。謝希深、宋公垂：皆人名。史院：編修史書的官署。諷誦：誦讀。琅然：聲音清朗響亮。屬思：構思文章。）`,translation:`錢思公雖然生長在富貴人家，卻很少有特別的嗜好。他在洛陽時，曾對部屬說：「我這輩子只喜歡讀書。坐著就讀經書史書，躺著就讀小說，上廁所就讀短小的詞曲，從來沒有片刻放下書本。」謝希深也說：「宋公垂和我一同在史院任職，每次上廁所，一定夾著書去，誦讀的聲音清朗響亮，遠近都聽得到，他就是這樣專心好學。」我於是對謝希深說：「我平生所寫的文章，大多是在『三上』構思的，就是馬上、枕上、廁上。」大概只有在這些時候，特別能夠專心構思吧。`},{from:24,to:26,passage:`閱讀下文與圖表，回答問題：
日本漢字能力檢定協會從 1995 年起，每年向大眾徵求一個最能代表當年社會氛圍的漢字，在 12 月 12 日「漢字之日」於京都清水寺公布，並由住持以毛筆寫在大張和紙上。2025 年的結果揭曉：「熊」字第一次當選。這一年，日本各地頻頻有熊出沒，甚至闖進市區，造成人員傷亡，不少活動因此取消、學校停課；此外，日文把貓熊寫作「熊猫」，貓熊返還中國的新聞也受到關注。第二名的「米」反映了米價持續上漲；第三名的「高」，則與物價高漲、氣溫創新高等現象有關。（圖中「万」是日文漢字，即「萬」。）`,figure:`ai/904/chinese/q24_kanji.png`},{from:27,to:30,passage:`閱讀下文，回答問題：
　　港邊的風總是帶著鹹味。小時候，每逢暑假，我就被送到阿嬤家。阿嬤不出海，她的工作是補網。
　　清晨漁船回港，一張張破了洞的漁網被拖上岸，攤在廣場上，像一片片灰綠色的海。阿嬤戴著斗笠，坐在小板凳上，左手拉住網目，右手的梭子穿過去、繞一圈、拉緊，再穿過去。她的動作不快，卻從不停下來。
　　我起初覺得好玩，搶著要學。阿嬤遞給我一支梭子，教我先把破口周圍扯爛的線剪掉：「破的所在無修齊，補上去嘛會閣破。」我嫌麻煩，直接把線往破洞上纏，纏成一團，看起來倒也堵住了。阿嬤看了一眼，沒說話，拿起剪刀把我纏的線全剪了。
　　那天下午，我氣得躲到堤防上，看海看到太陽下山。阿嬤沒有來找我，只在晚飯時多夾了一塊魚給我。
　　第二天，我又坐回小板凳上。這一次，我照阿嬤說的，先剪、再量、再一目一目地補。一個拳頭大的破洞，我補了整整一個早上，手指被線勒出一道道紅痕。阿嬤拿起來對著太陽看了看，說：「這目歪去矣，毋過袂漏魚。」那是她第一次稱讚我。
　　後來我才知道，一張網破了，漁人不會輕易丟掉，因為新網要花大錢，而且舊網用起來順手。網上的每一個補丁，都記著一次風浪、一次礁石，或是一條掙扎得特別兇的大魚。阿嬤說，看網就知道這艘船去過哪裡。
　　長大以後，我到城市工作，常常想起那些網。和朋友吵架、工作出了差錯時，我總急著找個方法把事情「堵住」，卻很少先停下來，把破口周圍扯爛的地方修齊。好幾次，問題看似解決了，沒多久又從同一個地方裂開。
　　去年阿嬤過世，我回到港邊。廣場上仍攤著漁網，補網的人換成了幾位外籍漁工，他們低著頭，梭子穿過去、繞一圈、拉緊。我站在旁邊看了很久，那節奏我還記得。
　　我想，阿嬤教我的，從來不只是補網。
（注：「破的所在無修齊，補上去嘛會閣破」：破的地方不修整齊，補上去也會再破。「這目歪去矣，毋過袂漏魚」：這一目歪了，但是不會漏魚。）`},{from:31,to:33,passage:`閱讀下列甲、乙二文，回答問題：
【甲】
　　英國牛津大學出版社在 2025 年 12 月 1 日公布年度代表詞：rage bait（憤怒誘餌）。這個詞指的是「刻意設計來激起憤怒或不滿的網路內容」，發布的目的通常是增加某個網頁或社群貼文的流量與互動。牛津先選出三個候選詞，開放超過三萬人投票，再由專家綜合投票結果、網友的討論與語料資料做出決定。據統計，這個詞在過去一年裡的使用量成為原來的三倍。製造憤怒的人未必真的憤怒，他們要的是你停下來、留言、轉傳——在網路上，注意力就是收入。
【乙】
　　美國韋氏詞典在 2025 年 12 月 15 日公布年度詞：slop。這個字在十八世紀原指「軟泥」，後來泛指沒有什麼價值的東西；韋氏詞典為它加上的新義是「通常藉由人工智慧大量產生的低品質數位內容」。韋氏詞典的總裁形容，在面對人工智慧時，這幾乎是一個帶點「反抗」意味的字。同一年，劍橋詞典選出的年度詞是 parasocial（準社會關係的），指人對素未謀面的名人、書籍或影視中的虛構角色，甚至對人工智慧，所產生的單方面情感連結。`},{from:34,to:35,passage:`閱讀下文，回答問題：
趙人患鼠，乞貓於中山，中山人予之貓，貓善捕鼠及雞，月餘，鼠盡而其雞亦盡，其子患之，告其父曰：「盍去諸？」其父曰：「是非若所知也，吾之患在鼠，不在乎無雞。夫有鼠則竊吾食，毀吾衣，穿吾垣墉，壞傷吾器用，吾將饑寒焉。不病於無雞乎？無雞者弗食雞則已耳，去饑寒猶遠，若之何而去夫貓也？」
——劉基《郁離子》
（注：中山：國名。盍去諸：何不把牠除去呢。若：你。垣墉：牆壁。病：憂慮、困擾。已：罷了。去：距離。）`,translation:`有個趙國人苦於鼠患，到中山國要貓，中山人給了他一隻貓。這隻貓很會捉老鼠，也會捉雞。過了一個多月，老鼠捉光了，他的雞也被吃光了。他的兒子為此發愁，對父親說：「何不把貓趕走呢？」父親說：「這不是你懂的。我們的禍患在於老鼠，不在於沒有雞。有老鼠，就會偷我們的糧食，咬壞我們的衣服，挖穿我們的牆壁，毀壞我們的器具，我們就要挨餓受凍了。這不比沒有雞更令人憂慮嗎？沒有雞，不吃雞就是了，離挨餓受凍還遠得很，為什麼要把那隻貓趕走呢？」`},{from:36,to:37,passage:`閱讀下文，回答問題：
　　蜜蜂找到花蜜後，怎麼告訴同伴花在哪裡？奧地利科學家馮．弗里希長期觀察發現，負責偵察的工蜂回到蜂巢後，會在直立的巢脾上「跳舞」。
　　如果花源離蜂巢很近，牠跳的是「圓舞」：繞著小圈子轉，一會兒向左、一會兒向右。圓舞只告訴同伴「附近有食物」，並不指出方向；同伴便飛出蜂巢在周圍搜尋，憑著舞者身上沾染的花香找到目標。
　　如果花源較遠，牠就改跳「搖擺舞」：先沿一條直線前進，同時快速搖擺腹部，接著向一側繞回起點，再走一次直線，然後向另一側繞回，路線像一個「8」字。直線前進的方向代表花源的方位：巢脾上的「正上方」代表太陽所在的方向，若直線偏向正上方右邊 40 度，就表示花源在太陽方向右邊 40 度的地方。直線搖擺持續的時間愈長，代表花源愈遠。
　　蜜蜂不會說話，舞蹈卻同時傳達了「多遠」與「哪個方向」。馮．弗里希也因為這項研究，在 1973 年與另外兩位學者共同獲得諾貝爾生理學或醫學獎。`},{from:38,to:39,passage:`閱讀下文，回答問題：
　　2025 年 10 月 9 日，瑞典學院宣布將諾貝爾文學獎頒給匈牙利作家卡勒斯納霍凱，肯定他的作品「在末日般的恐懼之中，再次確認了藝術的力量」。他是繼 2002 年的凱爾泰斯之後，第二位獲得此獎的匈牙利作家。
　　卡勒斯納霍凱生於 1954 年。他在 1985 年出版第一部小說《撒旦探戈》，後來由導演貝拉．塔爾改編成長達七個多小時的電影。他的小說以極長的句子聞名，一個句子有時延續一整章，很少出現句號，讀者必須屏氣凝神，跟著文字一路向前。他的一位英文譯者說，這些句子對她而言就像河流，因此原文沒有句號的地方，她絕不自行加上句號。
　　這位作家也和中華文化結下不解之緣。他從 1991 年起多次以記者身分前往中國，曾為了撰寫詩仙李白的專題報導，循著李白的足跡走訪十多座城市；回到匈牙利後，甚至要求家人改用筷子吃飯。`},{from:40,to:42,passage:`閱讀下文，回答問題：
　　地名像一枚枚貼在土地上的郵票，蓋著不同時代的郵戳。
　　高雄的「鹽埕」，字面上就是曬鹽的場地。清代這裡原是海邊的鹽田，後來發展成熱鬧的商業區，商行林立，名字卻仍記得它最初的樣子。臺北的「六張犁」、臺中的「四張犁」，則記錄了拓墾的規模：一「張」犁大約可以耕作五甲田地，地名中的數字，就是當年開墾土地的大小。
　　有些地名的改變，透露了統治者的用意。「諸羅」在清乾隆年間改名「嘉義」，是皇帝要嘉許當地軍民守城的「義」行；高雄舊稱「打狗」，萬華舊稱「艋舺」，日治時期因為日文讀音相近，分別改成「高雄」與「萬華」，字面變得雅致，舊名原來的意思卻被藏了起來。
　　地名一旦改了，久而久之，人們便只記得新名字。現在走在萬華街頭，年輕人未必知道「艋舺」原是平埔族語「獨木舟」的意思，那是淡水河上舟楫往來的年代留下的印記。
　　因此，讀地名不能只讀字面。漂亮的名字未必比樸素的名字更有價值；一個看似土氣的舊名，可能正保存著先民謀生的方式、族群的語言與土地的記憶。保存舊地名，不一定要把名字改回去，而是在路牌旁、在課本裡、在我們說故事的時候，讓它們繼續被唸出來。`}],items:[{qNo:1,stem:`下列各組「」內的字，何者讀音相同？`,options:[`「酗」酒鬧事／「旭」日東昇`,`「遏」止歪風／「謁」見師長`,`「湍」急溪流／「揣」測心意`,`「贍」養父母／「瞻」仰遺容`],answer:`A`,explanation:`【解析】「酗」與「旭」都讀作ㄒㄩˋ，讀音相同。（B）「遏」讀ㄜˋ，「謁」讀ㄧㄝˋ；（C）「湍」讀ㄊㄨㄢ，「揣」讀ㄔㄨㄞˇ；（D）「贍」讀ㄕㄢˋ，「瞻」讀ㄓㄢ。故選 (A)。`},{qNo:2,stem:`下列文句，何者沒有錯別字？`,options:[`雖然連輸兩場，球員們仍再接再勵，終於扳回一城。`,`颱風過後，志工們按部就班地清理街道，一點也不敢馬虎。`,`這次決賽，我們要一股作氣，拿下睽違十年的冠軍。`,`他默守成規，不肯嘗試新方法，難怪業績停滯不前。`],answer:`B`,explanation:`【解析】「按部就班」書寫正確，全句沒有錯字。（A）「再接再勵」應作「再接再厲」，「厲」是磨利，比喻再一次奮勇向前；（C）「一股作氣」應作「一鼓作氣」，指作戰時第一次擊鼓最能振奮士氣；（D）「默守成規」應作「墨守成規」，典故出自墨子善於守城。故選 (B)。`},{qNo:3,stem:`下列文句「」中的字，何者是「恰巧」的意思？`,options:[`規定一改再改，讓大家無所「適」從`,`這雙鞋穿起來非常舒「適」，走一整天也不累`,`我們抵達鹿港時，「適」逢媽祖遶境，街上人山人海`,`這份工作很「適」合喜歡與人互動的他`],answer:`C`,explanation:`【解析】「適逢」是恰巧遇上，「適」是恰巧、正好。（A）「無所適從」是不知道該聽從誰、往哪裡去，「適」是往、歸向；（B）「舒適」是舒服；（D）「適合」是相合、相宜，不是恰巧。故選 (C)。`},{qNo:4,stem:`下列文句中的成語，何者使用最恰當？`,options:[`志工們這一年來的善行罄竹難書，令人由衷感佩。`,`這位老師傅修理鐘錶的手藝已到爐火純青的境界，再精細的零件都難不倒他。`,`開學第一天，首當其衝的工作就是把教室打掃乾淨。`,`七月流火，正午的柏油路熱得像要融化一般。`],answer:`B`,explanation:`【解析】「爐火純青」比喻技藝、學問達到純熟完美的地步，用來形容老師傅的手藝恰當。（A）「罄竹難書」是罪狀多得寫不完，只能用於壞事，不能稱讚善行；（C）「首當其衝」是最先受到攻擊或遭遇災難，不是「首先要做」；（D）「七月流火」原指夏曆（農曆）七月大火星（心宿二）向西沉落，天氣漸漸轉涼，不是形容天氣炎熱。故選 (B)。`},{qNo:5,stem:`「時間是一位不說話的雕刻師，在每個人的臉上留下作品。」這句話把時間比喻成雕刻師。下列文句，何者也使用了「譬喻」？`,options:[`風在窗外輕輕敲門，想進來聽我們說故事。`,`夕陽像一顆熟透的橘子，緩緩沉入海平面。`,`他的嗓門大得連隔壁鎮的人都聽得見。`,`多一分努力，就少一分遺憾。`],answer:`B`,explanation:`【解析】以「像」連接夕陽與熟透的橘子，用橘子的顏色與形狀說明夕陽，是譬喻（明喻）。（A）讓「風」像人一樣敲門、想聽故事，是轉化（擬人），沒有拿另一事物來比方；（C）誇大嗓門的音量，是誇飾；（D）「多」與「少」、「努力」與「遺憾」相對，是映襯，沒有譬喻。故選 (B)。`},{qNo:6,stem:`下列文句中的標點符號，何者使用最恰當？`,options:[`你到底是要去圖書館，還是要直接回家？`,`我不知道他為什麼到現在還沒到？`,`這次旅行，我們去了：臺中、彰化和南投三個縣市。`,`媽媽在市場買了蘋果；香蕉和葡萄。`],answer:`A`,explanation:`【解析】「是……還是……」是選擇問句，句末用問號恰當。（B）全句是陳述「我不知道」這件事，不是發問，句末應用句號；（C）「去了」與後面的地名之間不需停頓，不應使用冒號；（D）蘋果、香蕉、葡萄是並列的詞語，應使用頓號，不是分號。故選 (A)。`},{qNo:7,stem:`「許多人以為仙人掌不需要照顧，（甲）結果不是根部腐爛，就是長得歪歪斜斜。（乙）於是買回家後便隨手擺在角落，想到才澆一次水，（丙）其實，仙人掌雖然耐旱，卻需要充足的陽光和排水良好的土壤。（丁）只要掌握這兩點，它就能長得健康挺拔。」上文（甲）～（丁）依文意排列，最恰當的順序是下列何者？`,options:[`甲乙丙丁`,`乙丙甲丁`,`丙丁乙甲`,`乙甲丙丁`],answer:`D`,explanation:`【解析】首句「以為不需要照顧」，「於是」隨手擺放（乙），造成「結果」根部腐爛或長歪（甲）；接著以「其實」說明正確的照顧需求（丙），丁的「這兩點」指的就是丙所說的陽光與土壤，所以丙、丁必須相連。（A）甲的「結果」前面還沒有說明原因，無法緊接首句；（B）丙插在乙、甲之間，丁的「這兩點」就無法緊接在丙之後，前後指涉不清；（C）先說「其實……只要掌握這兩點」，再回頭說「於是買回家後……」，前後順序顛倒。故選 (D)。`},{qNo:8,stem:`下列文句，何者沒有語病？`,options:[`經過這次比賽，他明白了團隊合作的重要。`,`大約有將近三百人參加了這場路跑活動。`,`透過這次參訪，使我們了解了濕地的生態。`,`我們應該盡量避免不要在走廊上奔跑。`],answer:`A`,explanation:`【解析】主語「他」、動詞「明白」、受詞「團隊合作的重要」完整，沒有語病。（B）「大約」與「將近」都表示估計，意思重複；（C）「透過……，使我們……」使句子缺少主語，應刪去「透過」或「使」；（D）「避免」與「不要」連用，變成避免「不奔跑」，意思相反。故選 (A)。`},{qNo:9,stem:`下列題辭的使用，何者恰當？`,options:[`祝賀奶奶八十大壽：「福壽全歸」`,`祝賀表姊新婚：「弄璋之喜」`,`祝賀鄰居新居落成：「鴻圖大展」`,`祝賀叔叔的診所開業：「杏林春暖」`],answer:`D`,explanation:`【解析】「杏林春暖」用以稱頌醫者，適合賀診所、醫院開業。（A）「福壽全歸」是哀輓高壽長者過世的輓辭，不可用來祝壽；（B）「弄璋之喜」是賀人生男孩，不適合賀新婚；（C）「鴻圖大展」是賀商店、公司開業，賀新居落成宜用「美輪美奐」等。故選 (D)。`},{qNo:10,stem:`楊萬里〈閑居初夏午睡起〉：「梅子留酸軟齒牙，芭蕉分綠與窗紗。

下列何者最接近詩人此時的心境？`,options:[`感嘆自己年華老去，羨慕孩子無憂無慮而心生感傷`,`午睡醒來意興慵懶，悠閒地看著孩子追捉柳絮`,`午睡被孩子的嬉鬧聲吵醒，心中頗感厭煩`,`藉著觀看孩子遊戲，排遣客居他鄉的思念之情`],answer:`B`,explanation:`【解析】夏日漫長，午睡醒來「無情思」，提不起做事的興致，便「閑看」孩子捉柳絮，表現閒適慵懶的心境。（A）詩中只寫「閑看」，沒有感嘆年老或感傷的字句；（C）詩中沒有寫被吵醒，「閑看」也看不出厭煩；（D）題目是「閑居」，詩中沒有客居他鄉、思念家鄉的內容。故選 (B)。`},{qNo:11,stem:`「薛譚學謳於秦青，未窮青之技，自謂盡之，遂辭歸。秦青弗止，餞於郊衢，撫節悲歌，聲振林木，響遏行雲。薛譚乃謝求反，終身不敢言歸。」——《列子·湯問》
（注：謳：唱歌。窮：盡。餞：設酒宴送行。郊衢：城外的大路。撫節：打著拍子。遏：阻止。謝：道歉。反：同「返」。）
根據本文，薛譚最後「終身不敢言歸」，原因是什麼？`,options:[`聽了秦青的歌聲，才明白自己還沒有學到老師全部的本事`,`秦青不肯讓他回家，在城外設宴極力挽留他`,`他被秦青悲傷的歌聲感動，捨不得與老師分離`,`他擔心回家以後，沒有人願意聽他唱歌`],answer:`A`,explanation:`【解析】薛譚「未窮青之技，自謂盡之」，以為學完了；聽到秦青「聲振林木，響遏行雲」的歌聲，才知道自己差得還遠，於是道歉請求回來繼續學習，從此再也不敢說要回去。（B）「秦青弗止」是秦青沒有阻止他，設宴是為他送行，不是挽留；（C）歌聲讓他折服的是技藝的高超，文中沒有說他捨不得分離；（D）文中沒有提到回家後有沒有人聽他唱歌。故選 (A)。`},{qNo:12,stem:`小安把作文拿給姊姊看。姊姊讀完後說：「開頭很吸引人，結尾也很有力量，要是中間那三段也能這樣就好了。」姊姊的意思，最可能是下列何者？`,options:[`整篇作文都寫得很好，不需要修改`,`中間三段寫得太短，應該再加長一些`,`開頭和結尾應該改得和中間三段一樣`,`中間三段寫得不夠好，還需要修改`],answer:`D`,explanation:`【解析】姊姊先稱讚開頭和結尾，再說「要是中間那三段也能這樣就好了」，委婉表示中間三段沒有達到開頭、結尾的水準。（A）忽略了「要是……就好了」所表達的不足；（B）姊姊沒有提到篇幅長短，「這樣」指的是吸引人、有力量；（C）姊姊是希望中間向開頭、結尾看齊，方向正好相反。故選 (D)。`},{qNo:13,stem:`「真正的勇敢，不是不害怕，而是害怕的時候，仍然去做該做的事。」下列哪一個例子，最能支持這段話的觀點？`,options:[`天生膽大的他，玩高空彈跳時一點也不緊張`,`有懼高症的消防員，在火場中仍一次次爬上雲梯救人`,`她因為害怕上臺，便請同學代替她上臺報告`,`他為了證明自己不怕黑，半夜獨自到廢棄的工廠探險`],answer:`B`,explanation:`【解析】消防員怕高（害怕），卻仍爬上雲梯救人（做該做的事），正符合「害怕時仍去做該做的事」。（A）他根本不害怕，正是這段話所說「不是不害怕」的那一種；（C）她因害怕而逃避，沒有去做該做的事；（D）半夜到廢棄工廠只是為了逞強，不是「該做的事」。故選 (B)。`},{qNo:14,stem:`「他對名利看得很『淡』。」句中的「淡」是「不看重、不熱衷」的意思。下列「」中的「淡」，何者意思與此相同？`,options:[`這鍋湯煮得太「淡」了，再加一點鹽吧`,`颱風季節一過，就是這家民宿的「淡」季`,`這場比賽的輸贏，教練看得很「淡」，更在意球員有沒有盡力`,`她喜歡穿「淡」藍色的衣服`],answer:`C`,explanation:`【解析】把輸贏「看得很淡」是不看重輸贏，與題幹相同。（A）湯「淡」是味道不濃、鹹味不足；（B）「淡季」是生意清淡、客人少的時期；（D）「淡藍色」是顏色淺。故選 (C)。`},{qNo:15,stem:`「以前出門靠紙本地圖，走錯路時，得停下來辨認方向，或向路邊的店家問路。那些繞遠的路，常讓我意外看見一間老書店、一棵開滿花的樹。如今手機導航把每個轉角都算好了，我們很少迷路，卻也很少記得自己走過的路——眼睛盯著螢幕上的藍色箭頭，城市成了一連串的『前方兩百公尺右轉』。我並不想丟掉導航，只是偶爾，我會故意關掉它，讓自己走錯一兩次。」這段文字中，作者的主要看法是下列何者？`,options:[`導航常常算錯路線，不如紙本地圖可靠`,`導航帶來便利，卻也減少了人們認識沿途風景的機會`,`應該完全放棄導航，回到使用紙本地圖的時代`,`向陌生人問路，是出門旅行最大的樂趣`],answer:`B`,explanation:`【解析】作者肯定導航讓人「很少迷路」，但也指出人們因此「很少記得自己走過的路」，錯過繞路時的意外發現，所以偶爾故意關掉導航。（A）文中沒有說導航會算錯，反而說它「把每個轉角都算好了」；（C）作者明說「我並不想丟掉導航」；（D）問路只是過去迷路時的做法之一，不是本段的重點。故選 (B)。`},{qNo:16,stem:`「晴天時，你把我收在角落／像收起一句不必說的話／直到雨落下來／你才想起／有些守護／總要等到淋濕的那天／才被看見」——〈傘〉
這首詩藉「傘」所要表達的意涵，最可能是下列何者？`,options:[`出門前要記得查看天氣，雨天一定要帶傘`,`說話要謹慎，不必要的話最好收起來不說`,`被忽略的人應該勇敢爭取別人的注意`,`默默付出的關懷，常要到需要的時候才被察覺`],answer:`D`,explanation:`【解析】傘在晴天被冷落，直到下雨才被想起；詩末點出「有些守護／總要等到淋濕的那天／才被看見」，以傘比喻平日不被注意、卻在需要時給予保護的人或關懷。（A）只停留在傘的實際用途，沒有讀出象徵意義；（B）「像收起一句不必說的話」是形容傘被收起的樣子，不是全詩的主旨；（C）詩中的傘只是靜靜等待，沒有爭取注意的意思。故選 (D)。`},{qNo:17,stem:`某市立圖書館公告：

五、室內禁止飲食，有蓋水壺除外。」
根據公告，下列何者的做法符合規定？`,options:[`小華預約週一晚上的時段，下班後到自修室讀書`,`小明為了讀一整天，同一天預約了上午和下午兩個時段`,`小美預約週六上午時段，8:50 報到，座位上放著一個有蓋水壺`,`小真離座去吃午餐，一個半小時後回來，繼續使用原座位`],answer:`C`,explanation:`【解析】週六有開放，8:50 報到未逾 30 分鐘，有蓋水壺也在允許之列，全部符合規定。（A）週一休館，無法使用；（B）每人每日限預約一個時段；（D）離座一個半小時，已超過 60 分鐘，視同放棄座位。故選 (C)。`},{qNo:18,stem:`「只有完成報名，才能參加這次的校外教學。」根據這句話，下列推論何者正確？`,options:[`小玲已經完成報名，所以她一定參加了校外教學`,`小傑參加了校外教學，可見他已經完成報名`,`沒有參加校外教學的人，一定都沒有完成報名`,`小安沒有完成報名，但他仍然可以參加校外教學`],answer:`B`,explanation:`【解析】「只有……才……」表示完成報名是參加的必要條件：凡是參加的人，必定已經報名。（A）報名是必要條件而非充分條件，報名了也可能因故沒有參加；（C）沒參加的人可能已報名、只是當天沒去，不能推論他們都沒報名；（D）沒報名就不能參加，與原句矛盾。故選 (B)。`},{qNo:19,stem:`關於尋找石獸的經過，下列敘述何者正確？`,options:[`寺僧先往下游尋找，後來依照老河兵的說法，在數里外找到石獸`,`寺僧依照講學家的說法，在原地挖掘沙土後找到石獸`,`講學家與老河兵都認為，石獸是被暴漲的河水沖往下游`,`寺僧划船拖著鐵耙，在下游十餘里處找到石獸`],answer:`A`,explanation:`【解析】寺僧先「棹數小舟，曳鐵鈀尋十餘里，無跡」；講學家主張在原地沙中尋找，眾人雖然佩服，但最後是「如其言（老河兵的話），果得於數里外」。（B）眾人只是佩服講學家的說法，石獸最後是照老河兵的話找到的；（C）講學家明說石獸「豈能為暴漲攜之去」，老河兵則主張往上游找，兩人都不認為石獸被沖往下游；（D）在下游找了十多里，結果是「無跡」。故選 (A)。`},{qNo:20,stem:`老河兵認為石獸會出現在上游，關鍵的理由是下列何者？`,options:[`石頭比沙重，石獸埋入沙中後只會愈沉愈深`,`水流把石獸迎水面下方的沙沖成坑洞，石獸一再倒入坑中，因而逐漸往上游移動`,`河水暴漲時水流方向倒轉，把石獸推往上游`,`石獸比木片輕，容易被水流帶往上游`],answer:`B`,explanation:`【解析】老河兵說水沖不動石頭，反衝的水流在「石下迎水處」把沙掏成坑洞，坑洞深到石頭一半時，石頭便倒向坑中；如此反覆，「轉轉不已」，石獸就逆流往上游移動了。（A）這是講學家的說法，老河兵認為在原地往下找「不更顛乎」；（C）文中沒有說水流方向會倒轉，石獸往上游移動是因為不斷翻轉；（D）文中說「石性堅重」，石獸並不輕，講學家還說「是非木柿」。故選 (B)。`},{qNo:21,stem:`作者藉這件事所要說明的道理，最接近下列何者？`,options:[`書本上的知識毫無用處，只有實際經驗才可靠`,`遺失東西的時候，應該先往上游的方向尋找`,`遇到困難時，集合眾人的意見就能順利解決`,`只憑片面的道理推斷事情，往往會出錯`],answer:`D`,explanation:`【解析】文末「天下之事，但知其一，不知其二者多矣，可據理臆斷歟」，指出講學家只知石性堅重、不知水流反激，說明只根據片面的道理主觀推斷，容易犯錯。（A）講學家錯在只知其一，並不是說書本知識毫無用處，說法過度；（B）只停留在本事的字面，「河中失石」的經驗不能推廣成所有失物；（C）「眾服為確論」反而說明眾人一起贊同的看法也可能是錯的。故選 (D)。`},{qNo:22,stem:`文中錢思公與宋公垂的共同點，是下列何者？`,options:[`都曾在史院擔任編修史書的工作`,`都習慣在騎馬時構思文章`,`都會利用上廁所的時間讀書`,`讀書時都會大聲誦讀，遠近皆聞`],answer:`C`,explanation:`【解析】錢思公「上廁則閱小辭」，宋公垂「每走廁，必挾書以往」，兩人都利用如廁時間讀書。（A）同在史院的是宋公垂與謝希深，文中沒有說錢思公在史院；（B）在「馬上」構思文章的是作者歐陽脩；（D）「諷誦之聲琅然聞於遠近」只用來形容宋公垂。故選 (C)。`},{qNo:23,stem:`歐陽脩說自己的文章「多在三上」。和錢思公、宋公垂相比，下列說法何者最恰當？`,options:[`三人都認為廁所是最適合讀書的地方`,`錢、宋二人利用零碎時間「讀書」，歐陽脩則利用零碎時間「構思」文章`,`歐陽脩認為自己比錢、宋二人更加用功`,`歐陽脩批評錢、宋二人讀書時不夠專心`],answer:`B`,explanation:`【解析】錢思公坐、臥、如廁都讀書，宋公垂如廁也挾書誦讀；歐陽脩則說文章多在馬上、枕上、廁上「屬思」，同樣把握零碎時間，但用來構思寫作。（A）歐陽脩的「三上」包括馬上、枕上，且是用來構思而非讀書，文中也沒有說廁所「最適合」；（C）文中沒有比較誰更用功，歐陽脩只是順著話題說出自己的習慣；（D）歐陽脩稱宋公垂「篤學」，是讚美而非批評。故選 (B)。`},{qNo:24,stem:`根據圖表，下列敘述何者正確？`,options:[`「熊」的票數占總票數的兩成以上`,`前三名的票數合計，超過總票數的一半`,`「熊」與「米」的票數相差不到 200 票`,`「高」的票數不到「脈」的兩倍`],answer:`C`,explanation:`【解析】23,346 − 23,166 ＝ 180 票，不到 200 票。（A）23,346 ÷ 189,122 ≈ 12.3%，約一成二，不到兩成；（B）前三名合計 64,812 票，約占 34%，不到一半；（D）「脈」的兩倍是 12,836 票，「高」有 18,300 票，已超過兩倍（約 2.9 倍）。故選 (C)。`},{qNo:25,stem:`文中提到「貓熊返還中國的新聞」，主要的用意是什麼？`,options:[`說明「熊」字也能讓人聯想到其他受到關注的新聞`,`說明「熊」字能當選，主要是因為民眾捨不得貓熊離開`,`說明熊出沒的新聞，其實不如貓熊的新聞受到關注`,`說明日文與中文書寫動物名稱的方式完全相同`],answer:`A`,explanation:`【解析】文中先說明熊出沒造成的影響，再以「此外」補充：日文的貓熊寫作「熊猫」，貓熊的新聞也受到關注，可見「熊」字同時連結了不只一件大事。（B）熊出沒才是文中第一個、也是著墨最多的理由，「此外」表示貓熊只是補充，不是主要原因；（C）文中沒有比較兩則新聞誰較受關注；（D）文中只說日文把貓熊寫作「熊猫」，沒有說兩種語言寫法完全相同，用意也不在比較語言。故選 (A)。`},{qNo:26,stem:`根據本文與圖表，下列推論何者最恰當？`,options:[`「熊」與「米」兩字受到關注的程度相當接近`,`超過半數的投票者選擇了「熊」字`,`「高」字的入選理由與天氣狀況無關`,`「熊」字在過去曾多次當選年度漢字`],answer:`A`,explanation:`【解析】「熊」只比「米」多 180 票，在近十九萬票中差距極小，可見兩字受關注的程度相當接近。（B）「熊」約占 12%，第一名不等於過半數；（C）文中說「高」與「氣溫創新高」有關；（D）文中說 2025 年是「熊」字「第一次當選」。故選 (A)。`},{qNo:27,stem:`關於「我」第一次補網的情形，下列敘述何者正確？`,options:[`阿嬤嚴厲地責備「我」做事草率`,`「我」補了一整個早上，手指被線勒出紅痕`,`沒有先修齊破口就直接纏線，結果被阿嬤全部剪掉`,`阿嬤到堤防上找「我」，帶「我」回家吃飯`],answer:`C`,explanation:`【解析】「我」嫌麻煩，沒有先剪掉破口周圍扯爛的線，直接把線纏成一團；阿嬤「沒說話，拿起剪刀把我纏的線全剪了」。（A）文中明說阿嬤「沒說話」；（B）補了一個早上、手指勒出紅痕，是第二天的事；（D）文中說「阿嬤沒有來找我」，只在晚飯時多夾了一塊魚給「我」。故選 (C)。`},{qNo:28,stem:`阿嬤說：「這目歪去矣，毋過袂漏魚。」由這句話最能看出阿嬤的什麼態度？`,options:[`重視網子是否確實發揮功用，不苛求外表完美`,`對成果並不滿意，要「我」拆掉重補一次`,`認為補網只要速度夠快就好`,`擔心「我」受傷，不希望「我」再碰梭子`],answer:`A`,explanation:`【解析】阿嬤指出「歪了」，卻肯定「不會漏魚」，作者也說「那是她第一次稱讚我」，可見阿嬤看重的是網子能不能用，而不是好不好看。（B）作者說這是阿嬤的稱讚，文中也沒有要「我」重補；（C）「我」補了整整一個早上，阿嬤仍然稱讚，可見她不以速度為標準，她自己也「動作不快」；（D）阿嬤的話針對補好的網，沒有提到「我」手上的紅痕或擔心受傷。故選 (A)。`},{qNo:29,stem:`關於本文的寫作手法，下列敘述何者最恰當？`,options:[`開頭先寫阿嬤過世，再倒敘童年學補網的往事`,`全文以阿嬤的口吻，敘述她一生在港邊補網的經歷`,`透過大量對話，呈現「我」與阿嬤之間激烈的爭吵`,`「梭子穿過去、繞一圈、拉緊」在文中前後出現，將童年回憶與現在連結起來`],answer:`D`,explanation:`【解析】補網的動作在第二段寫阿嬤，在倒數第二段寫外籍漁工，作者說「那節奏我還記得」，用同一個動作把童年與現在串在一起。（A）阿嬤過世寫在文章接近結尾處，開頭寫的是童年暑假，全文大致依時間先後敘述；（B）全文是以「我」的觀點敘述，阿嬤直接說出的話只有兩句；（C）文中對話很少，「我」生氣時是自己躲到堤防上，兩人並沒有爭吵。故選 (D)。`},{qNo:30,stem:`文末說「阿嬤教我的，從來不只是補網」。結合全文，阿嬤教給「我」的，最可能還包括下列何者？`,options:[`面對破損與問題時，先耐心處理根源，再一步步修補`,`做事要講求效率，才能跟上漁船進出港的節奏`,`學會一技之長，將來才能留在港邊謀生`,`和別人起衝突時，應該先低頭認錯`],answer:`A`,explanation:`【解析】阿嬤說「破的地方不修整齊，補上去也會再破」；長大後的「我」急著把問題「堵住」，卻沒有先修齊破口，結果問題「又從同一個地方裂開」。兩段前後呼應，可見阿嬤教的是處理問題要從根源著手、耐心修補。（B）阿嬤「動作不快」，「我」補一個破洞花了一早上，文章強調的不是效率；（C）「我」長大後到城市工作，並沒有留在港邊以補網謀生；（D）「低著頭」是寫漁工補網的樣子，文中沒有談到認錯，「我」的領悟是處理問題的方法。故選 (A)。`},{qNo:31,stem:`根據甲文，下列關於 rage bait 的敘述，何者正確？`,options:[`這類內容的目的，通常在於增加流量與互動`,`是牛津的專家直接選定，沒有參考大眾的意見`,`製作這類內容的人，都是真心對事情感到憤怒`,`是牛津從三萬多個候選詞中選出來的`],answer:`A`,explanation:`【解析】甲文說這類內容「發布的目的通常是增加某個網頁或社群貼文的流量與互動」，並說「注意力就是收入」。（B）牛津開放超過三萬人投票，專家再綜合投票結果與網友討論做決定，有參考大眾意見；（C）甲文明說「製造憤怒的人未必真的憤怒」；（D）候選詞只有三個，「三萬多」是投票的人數。故選 (A)。`},{qNo:32,stem:`乙文中，slop 的詞義從「軟泥」、「沒有什麼價值的東西」，到「人工智慧產生的低品質內容」，一路延續下來的特質最可能是下列何者？`,options:[`由機器製造`,`價值低、品質差`,`帶有反抗的意味`,`與網路社群有關`],answer:`B`,explanation:`【解析】軟泥是沒有用處的爛泥，後來泛指「沒有什麼價值的東西」，新義是「低品質」的數位內容，一路延續的是「沒有價值、品質低劣」的特質。（A）「由機器（人工智慧）產生」是新義才有的特點，軟泥並不是機器製造的；（C）「反抗」意味是總裁對這個字在人工智慧時代用法的形容，不是原義的特質；（D）軟泥與網路無關，網路是新義的使用場合。故選 (B)。`},{qNo:33,stem:`綜合甲、乙二文，關於 rage bait 與 slop 兩個詞，下列敘述何者最恰當？`,options:[`兩者都專指由人工智慧產生的內容`,`兩者都是由大眾投票直接決定的年度詞`,`兩者都是在 2025 年才出現的新詞`,`兩者都帶有負面評價，反映人們對某些網路內容的警覺`],answer:`D`,explanation:`【解析】rage bait 是刻意激起憤怒以換取流量的內容，甲文提醒「注意力就是收入」；slop 指低品質的內容，韋氏總裁說它帶點「反抗」意味。兩詞都是貶義，顯示人們開始警覺網路上這類內容。（A）甲文沒有說 rage bait 由人工智慧產生，專指人工智慧內容的只有 slop 的新義；（B）牛津雖開放投票，最後由專家綜合判斷；乙文沒有提到韋氏詞典舉辦投票；（C）rage bait 的使用量「在過去一年裡」成為三倍，表示之前就已有人使用；slop 在十八世紀就有了。故選 (D)。`},{qNo:34,stem:`父親不願意把貓趕走，主要是因為他認為：`,options:[`貓是中山人送的，不好意思退還`,`雞已經被吃光了，趕走貓也無法挽回`,`老鼠造成的損害，遠比沒有雞嚴重`,`貓不久之後就不會再捉雞了`],answer:`C`,explanation:`【解析】父親說「吾之患在鼠，不在乎無雞」：有老鼠會讓全家「饑寒」，沒有雞只是「弗食雞則已耳」，兩者輕重懸殊。（A）文中沒有提到人情上不好退還；（B）雞確實吃光了，但父親留貓的理由是鼠害更嚴重，不是無法挽回；（D）文中沒有說貓以後會不再捉雞。故選 (C)。`},{qNo:35,stem:`本文的寓意，最接近下列何者？`,options:[`做事要追求兩全其美，不可以有任何損失`,`做晚輩的應該聽從長輩的意見，不可多問`,`引進外來的幫手，往往會帶來更大的災害`,`處理事情要分清輕重，不要因為小的損失而放棄解決大的問題`],answer:`D`,explanation:`【解析】貓雖然吃了雞，卻解決了更嚴重的鼠患；父親權衡得失，寧可沒有雞也要留下貓，寓意是要分清輕重、兩害相權取其輕。（A）父親正是接受「沒有雞」的損失，並不追求兩全；（B）父親說「是非若所知也」，是說明道理，寓意不在晚輩順從；（C）貓除去了鼠患，帶來的好處大於損失，與這個說法相反。故選 (D)。`},{qNo:36,stem:`一隻偵察蜂跳搖擺舞時，直線前進的方向是巢脾的「正下方」。這表示花源在哪裡？`,options:[`就在蜂巢正下方的地面上`,`在太陽所在的方向`,`離蜂巢很近，同伴只要在附近搜尋即可`,`在與太陽相反的方向`],answer:`D`,explanation:`【解析】巢脾的「正上方」代表太陽的方向，直線偏離正上方多少度，花源就偏離太陽方向多少度；「正下方」與正上方相差 180 度，所以花源在背對太陽的方向。（A）巢脾上的方向代表的是水平方位，不是真的指地面上下；（B）朝「正上方」才代表太陽的方向；（C）跳搖擺舞表示花源較遠，花源很近時跳的是圓舞。故選 (D)。`},{qNo:37,stem:`甲蜂跳圓舞；乙蜂跳搖擺舞，每次直線搖擺約 1 秒；丙蜂也跳搖擺舞，每次直線搖擺約 3 秒，直線偏向正上方左邊 30 度。根據本文，下列推論何者正確？`,options:[`甲蜂的同伴可以從舞蹈中得知花源的方向`,`丙蜂發現的花源，在太陽方向右邊 30 度的地方`,`三隻蜂所發現的花源中，丙蜂發現的離蜂巢最遠`,`乙蜂發現的花源，比甲蜂發現的離蜂巢更近`],answer:`C`,explanation:`【解析】跳圓舞表示花源很近，跳搖擺舞表示較遠，且直線搖擺時間愈長愈遠；丙（3 秒）比乙（1 秒）遠，乙又比甲遠，所以丙最遠。（A）圓舞「並不指出方向」，同伴要靠花香自行搜尋；（B）直線偏向正上方「左邊」30 度，花源應在太陽方向左邊 30 度；（D）甲跳圓舞表示花源很近，乙跳搖擺舞表示較遠，乙的花源比甲遠。故選 (C)。`},{qNo:38,stem:`根據本文，下列敘述何者正確？`,options:[`他是第一位獲得諾貝爾文學獎的匈牙利作家`,`《撒旦探戈》是他獲得諾貝爾獎之後才出版的小說`,`他的英文譯者常在長句中加上句號，方便讀者閱讀`,`他曾為了撰寫李白的專題報導，走訪中國十多座城市`],answer:`D`,explanation:`【解析】文中說他「曾為了撰寫詩仙李白的專題報導，循著李白的足跡走訪十多座城市」。（A）他是繼 2002 年凱爾泰斯之後的「第二位」；（B）《撒旦探戈》在 1985 年出版，是他的第一部小說；（C）譯者說原文沒有句號的地方，她「絕不自行加上句號」。故選 (D)。`},{qNo:39,stem:`譯者說這些句子「就像河流」，最可能的意思是下列何者？`,options:[`句子大多在描寫河流與自然景物`,`句子連綿不斷地向前推進，任意斷開就會破壞原有的節奏`,`句子的意思模糊，像流水一樣難以捉摸`,`句子淺白流暢，讀者可以輕鬆地一口氣讀完`],answer:`B`,explanation:`【解析】河流一路向前、不會中斷；譯者因此「絕不自行加上句號」，可見她認為這些長句的連貫與節奏是作品的一部分，不能隨意切斷。（A）文中談的是句子的形式，沒有說內容在寫河流；（C）「像河流」強調的是連續流動，文中沒有說意思模糊；（D）文中說讀者「必須屏氣凝神」，可見並不輕鬆。故選 (B)。`},{qNo:40,stem:`根據本文，下列地名與其由來的配對，何者正確？`,options:[`嘉義——皇帝嘉許當地軍民守城的義行`,`鹽埕——此地後來發展成熱鬧的商業區`,`六張犁——當地有六戶人家合力開墾`,`萬華——原是平埔族語「獨木舟」的意思`],answer:`A`,explanation:`【解析】文中說「諸羅」改名「嘉義」，是皇帝要嘉許當地軍民守城的義行。（B）「鹽埕」得名於曬鹽的場地，發展成商業區是後來的事，不是地名的由來；（C）「張」是犁的單位，一張犁約可耕作五甲，數字代表開墾土地的大小，不是戶數；（D）意思是「獨木舟」的是舊名「艋舺」，「萬華」是日治時期依日文讀音改的名字。故選 (A)。`},{qNo:41,stem:`作者說地名像「蓋著不同時代的郵戳」的郵票，最主要的意思是什麼？`,options:[`地名常常因為郵寄信件的需要而更改`,`地名愈古老，愈有收藏與買賣的價值`,`地名留下了不同時期的歷史與生活痕跡`,`每個地名都只能代表某一個時代`],answer:`C`,explanation:`【解析】郵戳記錄了郵件經過的時間，作者以此比喻地名保存了不同時代的痕跡，如拓墾的規模、統治者的用意、族群的語言等。（A）把比喻當成事實，文中的改名原因與郵寄無關；（B）作者談的是地名保存的記憶，不是收藏或買賣的價值；（D）「不同時代的郵戳」表示一個地名可能疊著好幾個時代的印記，例如鹽埕從鹽田變成商業區，舊名仍留著鹽田的記憶。故選 (C)。`},{qNo:42,stem:`下列何者最符合作者對於舊地名的看法？`,options:[`應該把日治時期更改的地名全部改回原來的名字`,`舊地名比較樸素，因此比新地名更有價值`,`不一定要恢復舊名，而是讓舊名和背後的故事持續被認識`,`地名只要字面雅致，就能保存土地的記憶`],answer:`C`,explanation:`【解析】末段說「保存舊地名，不一定要把名字改回去」，而是在路牌、課本與說故事時「讓它們繼續被唸出來」。（A）與「不一定要把名字改回去」相反；（B）作者說「漂亮的名字未必比樸素的名字更有價值」，並不是反過來說樸素的一定更有價值，只是提醒不要以字面論高下；（D）作者指出改成雅致的字面後，「舊名原來的意思卻被藏了起來」，可見雅致不等於保存記憶。故選 (C)。`}],verification:[`2026-10-09 依 SPEC_AI2_AI3.md 的 AI-4（會考水準）規格出題，參照 114／115 年真題；文言文 5 篇皆與維基文庫原文逐字比對一致（歸田錄異體字『説』依臺灣標準字體作『說』）；附圖（今年漢字長條圖）依數據繪製並經檢視。`,`2026-10-09 獨立作答者 1（Claude Opus，看不到答案）42/42、獨立作答者 2（Claude Sonnet）42/42 與答案卷一致；Sonnet 指出第 7 題排序題分段標點不清，已改為每段自帶標點（答案不變）。難度（同一評分標準）：114 年真題 2.67、本卷 Opus 約 2.4／Sonnet 2.43。`,`2026-10-09 獨立事實查核：2025 今年の漢字「熊」票數、牛津／韋氏／劍橋年度詞、2025 諾貝爾文學獎、蜜蜂舞蹈、臺灣舊地名逐條確認；查無「臺中三張犁」，改為「四張犁」。tools/check_ai_set.py 0 問題。`,`2026-10-09 最終複查（定稿前）：獨立稽核者（Claude Opus）拿答案與解析逐題核對（答案唯一性、計算、事實、附圖、文字），另由 Claude Opus 與 Claude Sonnet 各自重新盲解全卷，答案全部與答案卷一致；稽核指出的解析措辭、誘答與解析不一致、真實事件的相對時間（改為確切年份）與文言異文（以多版本比對後採通行本）均已修正，修正過的題目再由兩個模型重新盲解一致；答案卷未變動。`]},oo={set:`AI-4`,year:904,subject:`英文`,title:`AI-4 英語（閱讀）模擬卷（會考水準）`,difficulty:`會考水準`,note:`由 AI 依近年會考英語科架構編寫，難度比照會考（平均約 2.5 級）：單題 15 題（語境中的字彙、語法、圖片與告示），題組 28 題（告示、email、新聞短文、活動表、故事、群組對話、雙文本與克漏字），並以 2025 年真實事件為素材；非會考真題。`,topics:[`北京亦莊人形機器人半程馬拉松（2025-04-19，因強風延後；21 台人形機器人參賽、6 台完賽；Tiangong Ultra 約 2 小時 40 分奪冠、是唯一在 3 小時 10 分時限內完賽者、途中跌倒一次並換三次電池；過熱、跌倒、需人員協助；男子人類冠軍約 1 小時 2 分）：https://en.wikipedia.org/wiki/Beijing_E-Town_Half-Marathon`,`同上，完賽 6 台、Tiangong Ultra 2:40:42、唯一在時限內完賽：https://www.irunfar.com/results-of-the-human-vs-robot-half-marathon-humans-still-tops`,`新顏色 olo（2025 年 4 月 Science Advances；UC Berkeley 與 University of Washington；Oz 系統以雷射只刺激 M 視錐細胞；5 人看見、含三位作者（受試者 10001R、10003L、20205R 為共同作者，含 Ren Ng 與 Austin Roorda）；極飽和的藍綠色；名稱來自 0-1-0；自然界沒有任何波長能只刺激 M 視錐；可能有助色盲研究）：https://optometry.berkeley.edu/novel-color/ ；受試者中三位為共同作者：https://pmc.ncbi.nlm.nih.gov/articles/PMC12007580/`,`同上，名稱來自二進位 010 Hi Grandpa,
Remember how I said I wanted a dog and Mom said no? Well, Mom found another way. Last Saturday, she took me to Happy Tails, an animal shelter near our home, and I signed up to help there every weekend this summer.
I thought I would play with cute puppies all day. I was wrong. First, a worker named Ms. Lin gave me a bucket and a brush, and I spent two hours cleaning dog cages. Then I washed forty food bowls. By lunchtime, my arms hurt and my clothes smelled terrible.
In the afternoon, Ms. Lin asked me to walk an old dog called Lucky. He is nine years old and moves slowly, and nobody has wanted him for over a year. At first, he wouldn't come near me. I sat beside him quietly and waited. After about twenty minutes, he put his head on my knee. I almost cried.
Ms. Lin says older dogs are usually the last to find a home because most people want puppies. So I've decided to make a short video about Lucky and share it online. Maybe someone out there will see how sweet he is.
Mom always says taking care of a pet is a big job. Now I understand what she means.
Love,
Annie

愛你的 Annie`},{from:21,to:23,passage:`On April 19, 2025, thousands of people ran a half marathon in Beijing, China. But the runners who got the most attention that day were not people at all. For the first time, 21 humanoid robots—machines that look and move like humans—joined a half marathon. Every robot had a team of human helpers who followed it along the way.
The race was about 21 kilometers long, and the robots had 3 hours and 10 minutes to finish it. That turned out to be very hard. Some robots fell down soon after the start. Others got too hot and had to stop so that their teams could cool them down. Many needed new batteries during the race. In the end, only six robots reached the finish line.
The winner was a robot called Tiangong Ultra. It finished in about 2 hours and 40 minutes, and it was the only robot that finished within the time limit. Even so, it fell once and needed its batteries changed three times. The fastest human runner, by the way, finished in about 1 hour and 2 minutes.
Some people laughed at the robots, and it is easy to see why. But for the engineers, the race was a useful test. It showed them clearly what their robots could not do yet—and what they need to work on next.
* humanoid 人形的；battery 電池；engineer 工程師`,translation:`2025 年 4 月 19 日，數千人在中國北京跑了一場半程馬拉松。不過那天最受注目的跑者根本不是人。人形機器人——外表和動作都像人的機器——第一次參加半程馬拉松，共有 21 台。每台機器人都有一組人類協助人員沿路跟著。

有些人嘲笑這些機器人，原因不難理解。但對工程師來說，這場比賽是一次有用的測試：它清楚地讓他們看到機器人還做不到什麼，以及接下來要改進什麼。`},{from:24,to:26,passage:`Kevin, 13, and his brother Sam, 7, are going to the Star Science Museum with their mother this Sunday. Kevin has a student card, but Sam doesn't. Here is their plan: Kevin will join Make Your Own Robot in the morning, and then the whole family will watch the 2:00 Star Show together.

To understand this, we need to know a little about our eyes. At the back of the eye, there are three kinds of cells that help us see colors. We can call them L cells, M cells, and S cells. Usually, light turns on two or three kinds of these cells at the same time, and our brain mixes the signals into a color. No light in the real world can turn on the M cells alone. Even pure green light turns on the L cells, too.
So the scientists built a machine called Oz. It sends tiny flashes of laser light into the eye and aims only at the M cells. Five people, including three of the scientists, tried it. All of them saw a blue-green color more vivid and intense than any color they had ever seen. The name "olo" comes from 0-1-0: the L cells are off (0), the M cells are on (1), and the S cells are off (0).
Sadly, you can't see olo on a phone screen or in a painting. When the study came out in 2025, the only way to see it was with Oz. The scientists hope their work can someday help people who are color-blind.
* cell 細胞；laser 雷射；signal 訊號；color-blind 色盲的`,translation:`天空是什麼顏色？當然是藍色。但如果是一種從來沒有人看過的顏色呢？2025 年 4 月，一組來自加州大學柏克萊分校和華盛頓大學的科學家說，他們找到了一種，並把它命名為「olo」。
要了解這件事，我們得先知道一點眼睛的知識。眼睛後方有三種幫助我們看見顏色的細胞，我們可以叫它們 L 細胞、M 細胞和 S 細胞。通常光線會同時啟動其中兩種或三種細胞，大腦再把訊號混合成一種顏色。現實世界中沒有任何光能「只」啟動 M 細胞，即使是純綠光，也會同時啟動 L 細胞。
於是科學家做了一台叫 Oz 的機器。它把極小的雷射閃光射進眼睛，只瞄準 M 細胞。五個人試過，其中包括三位科學家。他們全都看見一種比以往看過的任何顏色都更鮮豔、更濃烈的藍綠色。「olo」這個名字來自 0-1-0：L 細胞關（0）、M 細胞開（1）、S 細胞關（0）。
可惜的是，你無法在手機螢幕或畫作上看到 olo，在 2025 年研究發表時，唯一的方法就是透過 Oz。科學家希望這項研究有一天能幫助色盲的人。`},{from:30,to:32,passage:`The Note in the Library Book
When Mia borrowed an old book from the school library, a small piece of paper fell out. On it, someone had written in neat handwriting: "If you are reading this, you have good taste in books. Page 87 is my favorite part. —R."
Mia smiled and turned to page 87. It was the part where the main character, a shy girl, finally speaks up for her best friend. Mia read it twice. Then, on the back of the note, she wrote: "Mine too. But I think page 120 is even better. —M." She put the note back in the book and returned it.
Two weeks later, Mia borrowed the book again, just to check. The note was still there, but now it had a new line: "You're right about page 120. Have you read The Silver Door? —R."
For the rest of the school year, Mia and R. kept writing to each other in library books. They never met, and Mia never tried to find out who R. was. Somehow, that made it more fun.
On the last day of school, Mia went to return a book and found Mr. Reed, the old librarian, packing boxes. "I'm retiring," he said. "Forty years in this library." As she turned to leave, he added with a smile, "By the way, page 120 really is better."
Mia stopped at the door. Then she laughed all the way home.
* handwriting 筆跡；librarian 圖書館員；retire 退休`,translation:`圖書館書裡的紙條

兩個星期後，Mia 又借了那本書，只是想看看。紙條還在，但多了一行字：「你說得對，第 120 頁更好。你讀過《銀色的門》嗎？——R.」
這個學年剩下的時間，Mia 和 R. 一直在圖書館的書裡互相寫信。他們從沒見過面，Mia 也從沒試著查出 R. 是誰。不知為什麼，這樣反而更有趣。

Jenny（7:26）：太好了。還有記得——上課時一個字都不能提！`},{from:36,to:39,passage:`[Text A] The Little Monster Everyone Wants
With its big eyes, pointed ears, and a smile full of sharp teeth, Labubu does not look like a typical cute toy. Yet in 2025, this little monster became one of the hottest toys in the world. People waited in long lines outside stores, and new Labubu figures often sold out very quickly.
Labubu was created in 2015 by Kasing Lung, an artist born in Hong Kong. It started as one of the characters in his picture-book series The Monsters. In 2019, he began working with Pop Mart, a Chinese toy company, and Labubu figures started to be sold in "blind boxes." When you buy a blind box, you don't know which figure is inside until you open it. Most series also include a rare "secret" figure that very few buyers get.
The craze grew so wild that in May 2025, Pop Mart stopped selling Labubu in its UK stores for a while after reports of customers fighting. In June, a mint-green Labubu about 1.3 meters tall was sold at an auction in Beijing for more than US$150,000. Fake Labubus, sometimes called "Lafufus," also appeared everywhere.

[Text B] Ask Ms. Grace
Dear Ms. Grace,
I've spent almost all my savings on Labubu blind boxes. I've opened 14 boxes, but I keep getting the same figures, and I still don't have the secret one. All my friends say it's the best. My mom says I'm wasting money. Should I keep trying?
—Jay, 14

Dear Jay,
Blind boxes are made to keep you buying "just one more." Before you buy the next box, ask yourself: Do I really like this toy, or do I just like the feeling of opening the box? Here are two ideas. First, set a limit—for example, one box a month. Second, trade your extra figures with friends. Many collectors swap the ones they have two of. You might get the one you want without buying another box.
—Ms. Grace
* figure 公仔；auction 拍賣；collector 收藏者`,translation:`【文本 A】人人都想要的小怪獸

Labubu 是香港出生的藝術家龍家昇（Kasing Lung）在 2015 年創造的，原本是他的繪本系列《The Monsters》裡的角色之一。2019 年，他開始和中國玩具公司泡泡瑪特合作，Labubu 公仔開始以「盲盒」販售。買盲盒時，要打開才知道裡面是哪一個公仔。大部分系列還有一個很少人能抽到的稀有「隱藏款」。
這股熱潮瘋狂到 2025 年 5 月，因為傳出顧客打架，泡泡瑪特一度暫停在英國門市販售 Labubu。6 月，一隻約 1.3 公尺高的薄荷綠 Labubu 在北京的拍賣會上以超過 15 萬美元賣出。被稱為「Lafufu」的仿冒 Labubu 也到處都是。

親愛的 Jay：

So I became her teacher. It was harder than I thought. She pressed the screen too hard, and she was always afraid of __41__. "What if I touch the wrong thing and the phone breaks?" she asked again and again.

* beep 嗶嗶響；beginner 初學者`,translation:`去年，我奶奶決定學用智慧型手機。「家裡每個人都在家族群組裡傳照片和訊息，」她說，「我受夠了每次都是最後一個知道家裡的消息。」

【解析】句子的主要動詞是 is，空格到 1990 是修飾 The bridge 的形容詞片語。橋是「被建造」的，用過去分詞 built（＝which was built）。(A) building 是現在分詞，表示橋主動在蓋東西；(C) was built 是完整的動詞，句子會有兩個主要動詞（was built、is）；(D) builds 也是動詞，同樣不能再接 is。故選 (B)。`},{qNo:5,stem:`Mom: Are you done with your science report?
Jack: Not yet. I ______ on it since four o'clock, and I still have two pages to write.`,options:[`worked`,`have worked`,`will work`,`am working`],answer:`B`,explanation:`【中譯】媽媽：你的自然報告寫完了嗎？Jack：還沒。我從四點就開始寫了，還有兩頁要寫。
【解析】since four o'clock 表示「從四點到現在」持續的動作，要用現在完成式 have worked。(A) worked 是過去式，不能和 since 連用來表示持續到現在；(C) will work 是未來式；(D) 現在進行式也不和 since 連用。故選 (B)。`},{qNo:6,stem:`Of all the students in my class, Amy lives ______ from school. It takes her an hour to get here by bus.`,options:[`the farthest`,`farther`,`far`,`most far`],answer:`A`,explanation:`【中譯】在我們班所有學生中，Amy 住得離學校最遠，她搭公車要一小時才能到。
【解析】Of all the students in my class 是在全班中比較，要用最高級 the farthest。(B) farther 是比較級，用於兩者比較；(C) far 是原級，沒有比較的意思；(D) far 的最高級是 farthest，沒有 most far 的說法。故選 (A)。`},{qNo:7,stem:`A: Would you mind if I opened the window?
B: ______ It's really hot in here.`,options:[`Yes, I would. Thank you.`,`Sorry, I can't open it.`,`Of course not. I'm cold.`,`Not at all. Go ahead.`],answer:`D`,explanation:`【中譯】A：你介意我打開窗戶嗎？B：一點也不，請開吧。這裡真的很熱。
【解析】Would you mind…? 問的是「你介意嗎」，同意要用否定回答 Not at all（一點也不介意）。B 接著說「這裡真熱」，表示希望開窗。(A) Yes, I would 是「我介意」，和「很熱」的理由矛盾；(B) A 是要自己開窗，不是請 B 開，B 回答「我打不開」答非所問；(C) Of course not 雖然表示不介意，但「我很冷」與後面「這裡真的很熱」矛盾。故選 (D)。`},{qNo:8,stem:`Your sister hardly ever eats breakfast, ______?`,options:[`doesn't she`,`does she`,`is she`,`isn't she`],answer:`B`,explanation:`【中譯】你妹妹幾乎從不吃早餐，對吧？
【解析】hardly ever（幾乎從不）有否定意味，所以前句視為否定句，附加問句用肯定；動詞 eats 是一般動詞現在式第三人稱單數，用 does。故用 does she。(A) doesn't she 是把前句誤當肯定句；(C) is she、(D) isn't she 助動詞用錯，前句沒有 be 動詞。故選 (B)。`},{qNo:9,stem:`Do you still remember the restaurant ______ we had dinner on your birthday?`,options:[`which`,`who`,`when`,`where`],answer:`D`,explanation:`【中譯】你還記得我們在你生日時吃晚餐的那家餐廳嗎？
【解析】空格後的子句 we had dinner on your birthday 已經完整，缺的是「在那家餐廳」這個地點，用關係副詞 where（＝at which）。(A) which 後面的子句要缺主詞或受詞，這裡不缺，要寫成 at which 才可以；(B) who 用來指人；(C) when 用來指時間，先行詞 restaurant 是地點。故選 (D)。`},{qNo:10,stem:`______ it rained hard all morning, the baseball game still started on time.`,options:[`Because`,`Although`,`If`,`Unless`],answer:`B`,explanation:`【中譯】雖然整個早上都下大雨，棒球比賽還是準時開始了。
【解析】下大雨和比賽「還是」準時開始是相反的情況，用表示讓步的 Although（雖然）。(A) Because 表示因果，下雨不會是準時開打的原因；(C) If 是假設條件，但句子說的是已經發生的事；(D) Unless（除非）語意不通。故選 (B)。`},{qNo:11,stem:`A sign at a swimming pool says:
"Open Tuesday to Sunday, 9 a.m. to 9 p.m. (closed on Mondays for cleaning)
Children under 10 must swim with an adult.
No food or drinks in the pool area."
Which of the following is allowed?`,options:[`A 12-year-old boy swimming by himself on Saturday morning.`,`An 8-year-old girl swimming by herself on Sunday afternoon.`,`A family having lunch next to the pool on Friday.`,`Two high school students swimming together on Monday evening.`],answer:`A`,explanation:`【中譯】游泳池的告示：「週二到週日上午 9 點到晚上 9 點開放（週一清潔休館）。10 歲以下兒童必須有大人陪同游泳。泳池區禁止飲食。」下列何者是允許的？
【解析】12 歲已經不是「10 歲以下」，可以自己游；星期六上午也在開放時間內。(B) 8 歲未滿 10 歲，必須有大人陪；(C) 泳池區禁止飲食；(D) 星期一休館。故選 (A)。`},{qNo:12,stem:`Grandma's story about how she came to Taipei with only a small bag and worked hard to raise five children was so ______ that many of us had tears in our eyes.`,options:[`boring`,`confusing`,`silly`,`touching`],answer:`D`,explanation:`【中譯】奶奶說她當年只帶著一個小包包來到臺北，辛苦工作養大五個孩子，這個故事太感人了，我們很多人都眼眶泛淚。
【解析】辛苦養大五個孩子的故事讓人「眼眶泛淚」，是令人感動的，選 touching（感人的）。(A) boring（無聊的）、(B) confusing（令人困惑的）、(C) silly（愚蠢的）都不會讓人感動落淚，也不符合故事的內容。故選 (D)。`},{qNo:13,stem:`There ______ be a bookstore on this corner. Now it's a coffee shop.`,options:[`is used to`,`used to`,`uses to`,`was used to`],answer:`B`,explanation:`【中譯】這個街角以前有一家書店，現在變成咖啡店了。
【解析】「以前有、現在沒有」用 used to＋原形動詞（過去曾經），There used to be… 是「以前有……」。(A) be used to＋V-ing 是「習慣於」，後面不能接原形 be；(C) 沒有 uses to 的用法；(D) was used to 是「被用來」或「（過去）習慣」，都不合語意。故選 (B)。`},{qNo:14,stem:`This box is ______ heavy for me to carry by myself. Can you give me a hand?`,options:[`so`,`very`,`too`,`enough`],answer:`C`,explanation:`【中譯】這個箱子太重了，我一個人搬不動，你可以幫我一下嗎？
【解析】too＋形容詞＋for 人＋to V 表示「太……而不能……」，需要別人幫忙，選 too。(A) so 要接 that 子句（so heavy that I can't…）；(B) very heavy 不能接 to carry 表示「搬不動」；(D) enough 要放在形容詞後面（heavy enough），而且意思是「夠重」，不合語意。故選 (C)。`},{qNo:15,stem:`Most of my classmates go to cram school after class. ______, I go home and read the books I like.`,options:[`Besides`,`Instead`,`For example`,`As a result`],answer:`B`,explanation:`【中譯】我大部分的同學放學後都去補習班。我則是回家讀自己喜歡的書。
【解析】同學去補習班，我「不去補習班，而是」回家看書，用 Instead（取而代之、反而）。(A) Besides（此外）用來補充同方向的事，但「我回家」是和同學不同的選擇；(C) For example 後面應該舉「同學去補習」的例子；(D) As a result 表示結果，同學去補習不會造成我回家看書。故選 (B)。`},{qNo:16,stem:`What must people do when they rent a bike?`,options:[`Pay NT$100 before they ride.`,`Buy a helmet at the counter.`,`Rent the bike before 10:00 a.m.`,`Leave an ID card at the counter.`],answer:`D`,explanation:`【中譯】租腳踏車時必須做什麼？
【解析】RULES 第一條：租車時要把身分證件留在櫃檯。(A) 100 元是晚上 8 點後還車的加收費用，不是租車前要付的；(B) 安全帽是免費的，不用買；(C) 上午 10 點前是平日打折的時段，不是規定。故選 (D)。`},{qNo:17,stem:`On Saturday, Leo, 14, rents a regular bike, and his sister Amy, 9, rents a kids' bike. They both ride from 2:00 to 4:00 p.m. and return the bikes on time. How much do they pay in all?`,options:[`NT$220`,`NT$120`,`NT$165`,`NT$132`],answer:`C`,explanation:`【中譯】星期六，14 歲的 Leo 租一般腳踏車，9 歲的妹妹 Amy 租兒童腳踏車，兩人都從下午 2 點騎到 4 點並準時還車。他們總共要付多少錢？
【解析】一般車 2 小時：第一小時 50 元，之後的 1 小時是 2 個「半小時」，30×2＝60，Leo 付 110 元；兒童車是一般車價格的一半，Amy 付 55 元；合計 165 元。(A) 220 元是忘了兒童車半價；(B) 120 元是把「每多半小時 30 元」看成「每多一小時 30 元」；(D) 132 元是又打了八折，但打折只限週一到週五上午 10 點前，星期六下午沒有折扣。故選 (C)。`},{qNo:18,stem:`What did Annie do first on her first day at Happy Tails?`,options:[`She washed food bowls.`,`She cleaned dog cages.`,`She walked an old dog.`,`She played with puppies.`],answer:`B`,explanation:`【中譯】Annie 在快樂尾巴的第一天，最先做了什麼？
【解析】第二段：First（首先）她花了兩個小時清狗籠。(A) 洗飼料碗是 Then（接著）才做的；(C) 帶老狗散步是下午的事；(D) 和小狗玩只是她原本以為會做的事（I thought…I was wrong），實際上沒有。故選 (B)。`},{qNo:19,stem:`Why does Annie want to make a video about Lucky?`,options:[`She hopes it will help Lucky find a family.`,`She wants to show Mom that she is ready to have a dog.`,`She wants people to give money to Happy Tails.`,`She wants to show how hard the work at the shelter is.`],answer:`A`,explanation:`【中譯】Annie 為什麼想幫 Lucky 拍影片？
【解析】林小姐說老狗通常最後才找到家，Annie「所以」決定拍片，並說「也許有人會看到牠有多可愛」——目的是讓 Lucky 被領養。(B) 文中沒有說她拍片是要說服媽媽讓她養狗；(C) 文中沒有提到募款；(D) 工作辛苦是第二段的內容，和拍 Lucky 的影片無關。故選 (A)。`},{qNo:20,stem:`What does Annie mean when she says, "Now I understand what she means"?`,options:[`She has found out that most people prefer puppies.`,`She has learned that caring for animals takes a lot of work.`,`She agrees that Lucky is too old to find a home.`,`She thinks she should stop helping at the shelter.`],answer:`B`,explanation:`【中譯】Annie 說「現在我懂她的意思了」，是什麼意思？
【解析】she 指媽媽，媽媽說的是「照顧寵物是一件大工程」。Annie 在收容所清籠子、洗碗、手臂痠痛，才真正體會照顧動物很辛苦。(A) 大部分人想要小狗是林小姐說的話，不是媽媽的意思；(C) Annie 反而想幫 Lucky 找家，並不認為牠找不到；(D) 她報名整個暑假每週末都去，文中沒有想放棄的意思。故選 (B)。`},{qNo:21,stem:`What is true about the robots in the race?`,options:[`They ran the whole race without any help from people.`,`Tiangong Ultra was the only robot that finished the race.`,`They had to finish the race in less than two hours.`,`Most of them did not reach the finish line.`],answer:`D`,explanation:`【中譯】關於參賽的機器人，何者正確？
【解析】21 台機器人只有 6 台抵達終點，大部分沒有跑完。(A) 每台機器人都有人類協助人員跟著，還要幫忙降溫、換電池；(B) 共有 6 台完賽，Tiangong Ultra 是「唯一在時限內」完賽的，不是唯一完賽的——這是粗心容易選的陷阱；(C) 時限是 3 小時 10 分，不是兩小時。故選 (D)。`},{qNo:22,stem:`About how much more time did Tiangong Ultra need to finish the race than the fastest human runner?`,options:[`About 30 minutes`,`About 2 hours and 8 minutes`,`About 1 hour and 38 minutes`,`About 1 hour and 40 minutes`],answer:`C`,explanation:`【中譯】Tiangong Ultra 跑完全程，比最快的人類跑者大約多花了多少時間？
【解析】Tiangong Ultra 約 2 小時 40 分（160 分鐘），最快的人類約 1 小時 2 分（62 分鐘），相差 160－62＝98 分鐘，即 1 小時 38 分。(A) 30 分鐘是時限 3 小時 10 分減去 Tiangong Ultra 的成績；(B) 2 小時 8 分是時限減去人類的成績；(D) 1 小時 40 分是把人類成績當成剛好 1 小時。故選 (C)。`},{qNo:23,stem:`What does the writer think about the race?`,options:[`It showed that robots will soon run faster than people.`,`It was a waste of time because most of the robots fell down.`,`Robots and humans should not run in the same race again.`,`It was useful because it showed what the robots still need to improve.`],answer:`D`,explanation:`【中譯】作者對這場比賽有什麼看法？
【解析】最後一段：雖然有人嘲笑，但對工程師來說這是「有用的測試」，清楚顯示機器人還做不到什麼、接下來要改進什麼。(A) 文中最快的人類比機器人快了一個半小時以上，作者沒有說機器人很快就會超越人類；(B) 作者說的是「有人」嘲笑，自己的看法是比賽有用；(C) 文中沒有這樣的主張。故選 (D)。`},{qNo:24,stem:`Besides the Star Show, which program can Sam join on Sunday?`,options:[`Make Your Own Robot`,`Kitchen Chemistry`,`Dinosaur Bones Tour`,`Night at the Museum`],answer:`C`,explanation:`【中譯】除了星空秀，Sam 星期日還可以參加哪一項活動？
【解析】Sam 7 歲，恐龍骨骼導覽「不限年齡」，可以參加。(A) 自己做機器人限 10–15 歲；(B) 廚房化學限 12 歲以上；(D) 博物館之夜只在星期六，而且限 8–12 歲，Sam 兩個條件都不符合。故選 (C)。`},{qNo:25,stem:`How much will the family pay for the programs in their plan?`,options:[`NT$400`,`NT$500`,`NT$450`,`NT$300`],answer:`A`,explanation:`【中譯】依照他們的計畫，全家參加活動總共要付多少錢？
【解析】Kevin 自己做機器人 200 元，持學生證折 50 元，付 150 元；星空秀三人：Kevin 100－50＝50 元，Sam 和媽媽沒有學生證各 100 元。合計 150＋50＋100＋100＝400 元。(B) 500 元是完全沒有算學生證折扣；(C) 450 元是只折了一次 50 元，但折扣是「每項」收費活動都折；(D) 300 元是漏算了媽媽的星空秀門票。故選 (A)。`},{qNo:26,stem:`Kevin also wants to join Kitchen Chemistry on Sunday. Why is that a problem with their plan?`,options:[`It happens at the same time as the 2:00 Star Show.`,`Kevin is too young to join it.`,`It is held only on Saturdays.`,`It takes place in the same room as Make Your Own Robot.`],answer:`A`,explanation:`【中譯】Kevin 星期日也想參加廚房化學，這和他們的計畫有什麼衝突？
【解析】廚房化學是 1:30–3:00，計畫中全家要看 2:00–2:40 的星空秀，時間重疊。(B) 廚房化學限 12 歲以上，Kevin 13 歲可以參加；(C) 只在星期六的是博物館之夜；(D) 廚房化學在 105 教室，自己做機器人在 201 教室，而且時間也不同。故選 (A)。`},{qNo:27,stem:`Why can't people see olo in everyday life?`,options:[`It only appears in the sky at certain times of the day.`,`Most people are color-blind to blue-green colors.`,`No light in the real world can turn on only the M cells.`,`Phone screens are not bright enough to show it.`],answer:`C`,explanation:`【中譯】為什麼人們在日常生活中看不到 olo？
【解析】olo 是「只有 M 細胞開」才看得到的顏色，而第二段說現實世界中沒有任何光能只啟動 M 細胞（連純綠光也會啟動 L 細胞），所以只能靠 Oz 機器。(A) 開頭的天空只是引言，olo 和天空無關；(B) 文中說科學家「希望幫助色盲的人」，並沒有說大部分人是藍綠色盲；(D) 文中說手機上看不到，但原因不是亮度，而是任何螢幕發出的光都會同時啟動其他細胞——這是只看到最後一段的陷阱。故選 (C)。`},{qNo:28,stem:`In the third paragraph, what does "it" in "tried it" mean?`,options:[`The machine called Oz.`,`The color olo.`,`Pure green light.`,`The back of the eye.`],answer:`A`,explanation:`【中譯】第三段 tried it 中的 it 指的是什麼？
【解析】前一句說科學家做了一台叫 Oz 的機器、把雷射射進眼睛，接著「五個人試用了它」，it 指的是這台機器 Oz。(B) olo 是他們試用之後「看到」的顏色，不是被試用的東西；(C) 純綠光是第二段的例子；(D) 眼睛後方是細胞所在的位置，不能被「試用」。故選 (A)。`},{qNo:29,stem:`If the scientists could turn on ONLY the L cells and the S cells, what would they probably call that color, following the same way of naming?`,options:[`olo`,`llo`,`oll`,`lol`],answer:`D`,explanation:`【中譯】如果科學家能「只」啟動 L 細胞和 S 細胞，照同樣的命名方式，他們大概會把那個顏色叫做什麼？
【解析】olo 來自 0-1-0，依序代表 L、M、S，開是 1（寫成 l）、關是 0（寫成 o）。L 開、M 關、S 開是 1-0-1，寫成 lol。(A) olo 是只有 M 開；(B) llo 是 L、M 開，S 關；(C) oll 是 M、S 開，L 關。故選 (D)。`},{qNo:30,stem:`What did Mia do after she read the first note?`,options:[`She wrote a reply on the note and put it back in the book.`,`She showed the note to the librarian.`,`She tried to find out who had written the note.`,`She borrowed The Silver Door right away.`],answer:`A`,explanation:`【中譯】Mia 讀了第一張紙條之後做了什麼？
【解析】第二段：她翻到第 87 頁讀完，就在紙條背面寫了回覆，再把紙條放回書裡還書。(B) 文中沒有說她把紙條拿給圖書館員看；(C) 第四段說她從沒試著查出 R. 是誰；(D) 《銀色的門》是後來 R. 在第二次的紙條上推薦的書，文中也沒說她去借。故選 (A)。`},{qNo:31,stem:`Who was most likely R.?`,options:[`Mr. Reed, the librarian.`,`A shy girl in Mia's class.`,`The writer of The Silver Door.`,`A student who left the school that year.`],answer:`A`,explanation:`【中譯】R. 最可能是誰？

us 與 Claude Sonnet 各自重新盲解全卷，答案全部與答案卷一致；稽核指出的解析措辭、誘答與解析不一致、真實事件的相對時間（改為確切年份）與文言異文（以多版本比對後採通行本）均已修正，修正過的題目再由兩個模型重新盲解一致；答案卷未變動。`]},so={set:`AI-4`,year:904,subject:`英聽`,title:`AI-4 英語（聽力）模擬卷（會考水準）`,difficulty:`會考水準`,note:`由 AI 依心測中心英語聽力架構（辨識句意 3 題、基本問答 8 題、言談理解 10 題，三選一）編寫，非會考真題；難度比照近年會考（平均約 2.5 級）：對話與廣播長度和會考相當，含計畫改變、言外之意、慣用語、簡單金額計算，誘答選項多用錄音中出現過的字詞或別的細節。第一部分的圖片由程式繪製（tools/ai_sets/ai4_listening.py），語音以錄音稿合成（非會考原音）。`,topics:[`Netflix 動畫電影 KPop Demon Hunters（2025/6 上線）成為 Netflix 史上觀看次數最多的電影：https://www.koreajoongangdaily.com/entertainment/kpop-demon-hunters-becomes-most-watched-film-on-netflix-with-236-million-views/12114967`,`主題曲 "Golden"（HUNTR/X）2025 年登上 Billboard Hot 100 第一名，2026/2/1 獲葛萊美最佳影視歌曲獎，為第一首得到葛萊美獎的 K-pop 歌曲：https://au.variety.com/2026/music/global/kpop-demons-hunters-grammy-win-32586/`,`撐竿跳 Armand Duplantis 2025/9/15 在東京世界田徑錦標賽跳過 6.30 公尺，第 14 次刷新世界紀錄並衛冕：https://www.news4jax.com/sports/2025/09/15/duplantis-breaks-pole-vault-world-record-for-14th-time-to-capture-third-world-championship-title/`,`Labubu 熱潮（2025）：香港藝術家龍家昇（Kasing Lung）創作，泡泡瑪特（Pop Mart）以盲盒販售，打開才知道是哪一款，各地排隊搶購：https://www.nbcnews.com/pop-culture/pop-culture-news/labubu-craze-viral-lines-pop-mart-stores-rcna203213`,`2026 台灣燈會在嘉義（3/3–3/15），2026 為馬年，但主燈「光沐－世界的阿里山」以阿里山神木為意象、高約 21 公尺、每半小時展演；馬年元素在小提燈「喔熊馬抵嘉」（熊騎木馬）：https://www.ctee.com.tw/news/20260109701141-430104`,`2026 年農曆新年為 2/17，進入馬年：https://www.canada.ca/en/department-national-defence/maple-leaf/defence/2026/02/year-horse-lunar-new-year-2026.html`,`對話中的人物、班級出遊、診所留言、電影票價、捷運公園站／湖站與河濱自行車道新聞皆為虛構情境`],groups:[],items:[{qNo:1,stem:``,options:[``,``,``],answer:`B`,explanation:`【聽力稿】There are three apples and two bananas on the plate.

Question: What do these three people think of the new bike path?

【解析】三個人都支持：第一位覺得通勤更安全，第二位覺得值得、孩子可以安心騎車，第三位雖然不騎車也認為是好消息。(A)「花太多錢」是「有些人」的說法，女子接著說 But I think it's worth it，表示她不同意；(C) 第三位沒有腳踏車，卻也覺得是好消息，所以不是只有騎車的人會喜歡。故選 (B)。`,transcript:[[`N`,`Good evening. Next on the news, River City will build a new bike path along the river. It will open next spring. Let's hear what people think.`],[`M`,`I ride my bike to work every day. Right now, I have to ride next to cars and buses. The new path will make my trip much safer.`],[`W`,`Some people say it costs too much money. But I think it's worth it. My kids can finally ride their bikes on weekends, and I won't need to worry.`],[`M`,`I don't even have a bike, but I walk my dog by the river every morning. A nicer riverside is good news for everyone.`],[`Q`,`What do these three people think of the new bike path?`]]}],verification:[`2026-10-09 依 SPEC_AI2_AI3.md 的 AI-4（會考水準）規格出題，參照 114／115 年真題的題型與長度；第一部分 3 張圖由 tools/ai_sets/ai4_listening.py 繪製並經人工檢視，各只有一張符合。`,`2026-10-09 獨立作答者 1（Claude Opus，看不到答案）21/21、獨立作答者 2（Claude Sonnet）21/21 與答案卷一致，0 題有異議。難度（同一評分標準）：AI-1 1.90、本卷 Opus 2.38／Sonnet 2.19。`,`2026-10-09 時事（KPop Demon Hunters 與〈Golden〉葛萊美、Duplantis 6.30 公尺世界紀錄、Labubu、2026 台灣燈會、2026 農曆新年）由獨立查核者以網路來源逐條確認。tools/check_ai_set.py 0 問題；語音由 tools/gen_audio.py ai4 合成。`,`2026-10-09 最終複查（定稿前）：獨立稽核者（Claude Opus）拿答案與解析逐題核對（答案唯一性、計算、事實、附圖、文字），另由 Claude Opus 與 Claude Sonnet 各自重新盲解全卷，答案全部與答案卷一致；稽核指出的解析措辭、誘答與解析不一致、真實事件的相對時間（改為確切年份）與文言異文（以多版本比對後採通行本）均已修正，修正過的題目再由兩個模型重新盲解一致；答案卷未變動。`]},co={set:`AI-4`,year:904,subject:`數學`,title:`AI-4 數學模擬卷（會考水準）`,difficulty:`會考水準`,note:`由 AI 依會考數學科選擇題型編寫（非會考真題），難度定位「會考水準」：題數、題型與難度分布比照近年會考，有基本計算，也有圖形判讀、規則閱讀與兩到三步的幾何推理，並以 2025–2026 年真實時事（航海家 1 號、淡江大橋、撐竿跳世界紀錄、中職觀眾人數）為素材。每題答案均由程式以精確分數計算驗證（tools/ai_sets/ai4_math.py），附圖依題目數據繪製。`,topics:[`數與式：整數四則、根式、科學記號、因式分解、乘法公式、最大公因數與最小公倍數`,`方程式：二元一次聯立、一元二次方程式、不等式（團體票方案）`,`函數：一次函數圖形平移、二次函數圖形性質`,`數列：等差數列（紀錄進程）、等比數列`,`幾何：正多邊形內角、相似形比例尺、外心、平行四邊形與角平分線、切線與圓內接四邊形、平行線截比與面積、角柱表面積`,`統計與機率：中位數、平均數、成長率、取球機率`,`時事：航海家 1 號預計 2026 年 11 月中旬左右（EarthSky 推算為 11/18）成為第一個距地球 1 光日（約 259 億公里）的人造物體: https://earthsky.org/space/voyager-1-1-light-day-from-earth-november-17-18-2026/`,`時事：淡江大橋 2026/5/12 通車，主橋長 920 m、主跨 450 m、橋塔高約 211 m，世界最長單塔不對稱斜張橋: https://zh.wikipedia.org/wiki/淡江大橋 ；通車日: https://www.twreporter.org/a/photo-danjiang-bridge-opening`,`時事：杜普蘭蒂斯（Mondo Duplantis）撐竿跳世界紀錄進程，6.17 m（2020/2/8）到 6.31 m（2026/3/12 烏普薩拉，第 15 次），之前紀錄為 Lavillenie 6.16 m（2014）: https://en.wikipedia.org/wiki/Men%27s_pole_vault_world_record_progression`,`時事：同上，第 15 次世界紀錄 6.31 m 報導: https://www.philstar.com/sports/2026/03/13/2514027/duplantis-clears-631m-set-15th-pole-vault-world-record`,`時事：2025 年中職上半季 180 場、場均 9,373 人；各隊主場場均：中信兄弟 12,415、味全龍 10,168、富邦悍將 10,288（2024 年 7,307）、統一獅 7,793、樂天桃猿 8,317、台鋼雄鷹 7,255（中央社）: https://www.cna.com.tw/news/aspt/202507045002.aspx`],groups:[{from:12,to:13,passage:`瑞典撐竿跳選手杜普蘭蒂斯（Mondo Duplantis）在 2020 年 2 月第一次打破男子撐竿跳世界紀錄，在他之前的世界紀錄是 2014 年創下的 6.16 公尺。此後他一再刷新自己的紀錄，2025 年 9 月在東京世界田徑錦標賽跳過 6.30 公尺，2026 年 3 月 12 日又在瑞典跳過 6.31 公尺，創下他個人第 15 次世界紀錄。下表是他歷次創下的世界紀錄：

| 主場場均（人） | 12,415 | 10,168 | 10,288 | 7,793 | 8,317 | 7,255 |`}],items:[{qNo:1,stem:`計算 (−3)² − 4 × (−2) ÷ (−8) 之值為何？`,options:[`8`,`10`,`−1/8`,`−10`],answer:`A`,explanation:`【解析】先算乘方與乘除，再算加減：(−3)²＝9，4 × (−2) ÷ (−8)＝(−8) ÷ (−8)＝1，所以原式＝9 − 1＝8。(B) 是把 (−8) ÷ (−8) 的結果算成 −1（負負得正弄錯）；(C) 是先算 9 − 4×2 再除以 −8，違反「先乘除後加減」；(D) 是把 (−3)² 誤算成 −9。故選 (A)。`},{qNo:2,stem:`解二元一次聯立方程式 { x＋3y＝7，2x − y＝−7 }，得 x 值為何？`,options:[`2`,`−2`,`3`,`−3`],answer:`B`,explanation:`【解析】由第二式得 y＝2x＋7，代入第一式：x＋3(2x＋7)＝7，7x＋21＝7，x＝−2，再代回得 y＝3。(A) 是移項時正負號弄錯；(C) 是 y 的值，題目問的是 x；(D) 是 y 的值又把正負號弄錯。故選 (B)。`},{qNo:3,stem:`計算 (√50 − √8) × √2 的結果為何？`,options:[`2√21`,`3√2`,`6√2`,`6`],answer:`D`,explanation:`【解析】√50＝5√2，√8＝2√2，所以 √50 − √8＝3√2，再乘以 √2：3√2 × √2＝3 × 2＝6。(A) 是誤以為 √50 − √8＝√42，再乘 √2 得 √84＝2√21（根號不能這樣相減）；(B) 是只算到 √50 − √8＝3√2，忘了乘以 √2；(C) 是把 √2 × √2 算成 2√2。故選 (D)。`},{qNo:4,stem:`美國 NASA 於 1977 年發射的太空探測器「航海家 1 號」持續飛離太陽系，預計在 2026 年 11 月中旬左右，成為史上第一個與地球距離達到「1 光日」的人造物體。1 光日是指光在 1 天之內行進的距離。若光速以每秒 3 × 10⁵ 公里計算，1 光日約為多少公里？`,options:[`2.592 × 10¹⁰`,`2.592 × 10⁹`,`4.32 × 10⁸`,`1.08 × 10⁹`],answer:`A`,explanation:`【解析】1 天＝24 × 60 × 60＝86400 秒＝8.64 × 10⁴ 秒，1 光日＝3 × 10⁵ × 8.64 × 10⁴＝25.92 × 10⁹＝2.592 × 10¹⁰ 公里（NASA 公布的數字約 259 億公里，兩者相符）。(B) 是把 25.92 × 10⁹ 化成科學記號時，次方弄錯少了 1（係數變小，次方應該變大）；(C) 是只換算到「分鐘」（3 × 10⁵ × 24 × 60），但光速是每「秒」；(D) 是只乘了 1 小時的 3600 秒，那是 1 光時。故選 (A)。`},{qNo:5,stem:`若多項式 6x² − x − 15 可因式分解成 (2x＋a)(3x＋b)，其中 a、b 為整數，則 a＋b 之值為何？`,options:[`−2`,`2`,`8`,`−8`],answer:`A`,explanation:`【解析】(2x＋a)(3x＋b)＝6x²＋(2b＋3a)x＋ab。要 ab＝−15 且 2b＋3a＝−1，試得 a＝3、b＝−5：2×(−5)＋3×3＝−1。所以 6x² − x − 15＝(2x＋3)(3x − 5)，a＋b＝3＋(−5)＝−2。(B) 來自 (2x − 3)(3x＋5)，展開一次項是＋x，正負號相反；(C) 是 a − b 的值；(D) 是 b − a 的值，題目問的是兩數的和。故選 (A)。`},{qNo:6,stem:`化簡 (2x − 3)² − (x＋1)(x − 1) 的結果為何？`,options:[`3x² − 12x＋8`,`3x² − 6x＋10`,`3x² − 8`,`3x² − 12x＋10`],answer:`D`,explanation:`【解析】(2x − 3)²＝4x² − 12x＋9，(x＋1)(x − 1)＝x² − 1，相減時括號前是負號，每一項都要變號：4x² − 12x＋9 − x²＋1＝3x² − 12x＋10。(A) 是去括號時 −(x² − 1) 只變了第一項的號，寫成 −x² − 1；(B) 是 (2x − 3)² 的中間項漏乘 2，算成 −6x；(C) 是誤以為 (2x − 3)²＝4x² − 9。故選 (D)。`},{qNo:7,stem:`已知 a、b 皆為正整數，且 a、b 兩數的最大公因數為 6、最小公倍數為 72。關於 a、b 兩數，甲、乙兩人提出看法如下：

乙：a、b 兩數中一定有一個數是 72
對於甲、乙兩人的看法，下列判斷何者正確？`,options:[`甲正確，乙錯誤`,`甲、乙皆正確`,`甲、乙皆錯誤`,`甲錯誤，乙正確`],answer:`A`,explanation:`【解析】設 a＝6m、b＝6n，m、n 互質，最小公倍數 6mn＝72，得 mn＝12。m、n 互質的組合只有 1 與 12、3 與 4，所以 a、b 是 6 與 72，或 18 與 24。18＋24＝42，甲正確；18 與 24 都不是 72，乙錯誤。誤以為「最小公倍數一定是其中一數」或漏掉 3 與 4 這組的人，會判斷乙正確。(B)、(C)、(D) 都與上面的判斷不符。故選 (A)。`},{qNo:8,stem:`已知 x＝2 是一元二次方程式 x²＋ax − 10＝0 的一個解，則此方程式的另一個解為何？`,options:[`5`,`3`,`−5`,`−3`],answer:`C`,explanation:`【解析】把 x＝2 代入：4＋2a − 10＝0，a＝3。方程式為 x²＋3x − 10＝0，(x＋5)(x − 2)＝0，所以另一個解是 x＝−5。(A) 是因式分解成 (x − 5)(x＋2)，正負號放反了（代入 x＝2 檢查就會發現不合）；(B) 是 a 的值，不是方程式的解；(D) 是把 −a 誤當成另一個解。故選 (C)。`},{qNo:9,stem:`某遊樂園（虛構情境）的門票規定如下：

【甲】此函數圖形上某個點的 y 坐標為 9
【乙】此函數圖形與 x 軸的兩個交點，彼此的距離為 4
對於甲、乙兩人的看法，下列判斷何者正確？`,options:[`甲、乙皆正確`,`甲、乙皆錯誤`,`甲錯誤，乙正確`,`甲正確，乙錯誤`],answer:`C`,explanation:`【解析】y＝−2(x − 3)²＋8 的圖形開口向下，頂點 (3, 8) 是最高點，所以 y 坐標最大是 8，不可能是 9，甲錯誤。令 y＝0：(x − 3)²＝4，x − 3＝±2，x＝1 或 5，兩交點 (1, 0)、(5, 0) 的距離是 4，乙正確。若把頂點看成最低點（忽略 x² 前的負號），會誤判甲正確；若把 (x − 3)²＝4 解成 x − 3＝4、只得到一個交點，會誤判乙錯誤。(A)、(B)、(D) 都與上面的判斷不符。故選 (C)。`},{qNo:12,stem:`若以 n 表示「第 n 次」、h 表示該次世界紀錄的高度（公尺），則表中每一筆資料的 n 與 h 都符合下列哪一個關係式？`,options:[`h＝0.01n＋6.16`,`h＝0.01n＋6.17`,`h＝0.01n＋6.15`,`h＝0.1n＋6.16`],answer:`A`,explanation:`【解析】每次紀錄都比前一次高 1 公分＝0.01 公尺，第 1 次是 6.17，所以 h＝6.17＋0.01(n − 1)＝0.01n＋6.16（n＝0 時正好是之前的紀錄 6.16 公尺）。代入檢查：n＝15 時 h＝0.15＋6.16＝6.31，正確。(B) 是把首項 6.17 直接當常數項，n＝1 時會得到 6.18；(C) n＝1 時得 6.16，少了 1 公分；(D) 是把 1 公分誤換算成 0.1 公尺。故選 (A)。`},{qNo:13,stem:`哪一個年度他創下世界紀錄的次數最多？那一年他總共把世界紀錄提高了幾公分？`,options:[`2025 年，3 公分`,`2024 年，3 公分`,`2025 年，4 公分`,`2022 年，3 公分`],answer:`C`,explanation:`【解析】依年度數次數：2020 年 2 次、2022 年 3 次、2023 年 2 次、2024 年 3 次、2025 年 4 次、2026 年（到 3 月）1 次，2025 年最多。2025 年開始時的世界紀錄是 2024 年底的 6.26 公尺，2025 年底是 6.30 公尺，所以那一年提高了 4 公分。(A) 是用該年第一筆 6.27 去減，但 6.27 本身已經比原紀錄高了 1 公分；(B) 與 (D) 的 2024 年、2022 年各只有 3 次，不是最多。故選 (C)。`},{qNo:14,stem:`一個等比數列的第 2 項是 6，第 5 項是 −48，則此數列的第 4 項為何？`,options:[`−24`,`24`,`−12`,`96`],answer:`B`,explanation:`【解析】第 5 項 ÷ 第 2 項＝r³＝−48 ÷ 6＝−8，所以公比 r＝−2。第 3 項＝6 × (−2)＝−12，第 4 項＝(−12) × (−2)＝24（也可用第 5 項 ÷ r＝−48 ÷ (−2)＝24）。(A) 是把公比誤算成 2（忽略 −8 的負號），再由第 5 項 −48 ÷ 2 得 −24；(C) 是第 3 項；(D) 是第 6 項。故選 (B)。`},{qNo:15,stem:`一個正十二邊形的每一個內角是多少度？`,options:[`30°`,`165°`,`144°`,`150°`],answer:`D`,explanation:`【解析】正 n 邊形的內角和是 180°×(n − 2)，正十二邊形的內角和＝180°×10＝1800°，每個內角＝1800° ÷ 12＝150°（或用外角：360° ÷ 12＝30°，內角＝180° − 30°＝150°）。(A) 是每一個外角的度數；(B) 是把內角和誤算成 180°×11＝1980°（多算了一個三角形）；(C) 是正十邊形的內角。故選 (D)。`},{qNo:16,stem:`2026 年 5 月 12 日通車的淡江大橋，是全世界主跨最長的「單塔不對稱斜張橋」。它的主橋長 920 公尺，其中主跨長 450 公尺，主橋塔高約 211 公尺。某校美術社（虛構情境）依實物等比例縮小製作模型，模型中主跨的長度為 90 公分。依此比例，模型中的主橋塔應高多少公分？`,options:[`4.22 公分`,`422 公分`,`42.2 公分`,`約 20.6 公分`],answer:`C`,explanation:`【解析】450 公尺＝45000 公分，模型與實物的比例＝90：45000＝1：500。主橋塔 211 公尺＝21100 公分，模型高＝21100 ÷ 500＝42.2 公分。(A) 是把主跨 450 公尺誤換算成 450000 公分（多乘了 10），比例尺變成 1：5000，21100 ÷ 5000＝4.22；(B) 是把橋塔高 211 公尺誤換算成 211000 公分（多乘了 10），211000 ÷ 500＝422；(D) 是誤把模型的 90 公分對應到「主橋長 920 公尺」，但題目說 90 公分是主跨的長度，主跨是 450 公尺。故選 (C)。`},{qNo:17,stem:`如附圖，△ABC 中，∠A＝110°，O 點為△ABC 的外心（虛線為△ABC 的外接圓）。∠BOC 的度數為何？`,options:[`145°`,`70°`,`110°`,`140°`],answer:`D`,explanation:`【解析】外心是外接圓的圓心。∠A＝110° 是鈍角，A 在劣弧 BC 上，∠A 所對的是優弧 BC，所以優弧 BC＝2 × 110°＝220°，劣弧 BC＝360° − 220°＝140°，∠BOC 是劣弧 BC 所對的圓心角，等於 140°（外心 O 在三角形外部）。(A) 是把外心當成內心，用 90°＋110°÷2＝145° 計算；(B) 是 180° − 110°，那是優弧上一點所對的圓周角；(C) 是誤以為圓心角等於 ∠A。故選 (D)。`,figure:`ai/904/math/q17_circumcenter.png`},{qNo:18,stem:`如附圖，平行四邊形 ABCD 中，AE 平分 ∠BAD，且與 BC 交於 E 點。若 BE＝7，EC＝3，則平行四邊形 ABCD 的周長為何？`,options:[`26`,`34`,`40`,`28`],answer:`B`,explanation:`【解析】AD // BC，所以 ∠EAD＝∠AEB（內錯角）；又 AE 平分 ∠BAD，∠BAE＝∠EAD，因此 ∠BAE＝∠AEB，△ABE 是等腰三角形，AB＝BE＝7。BC＝7＋3＝10，周長＝2 × (7＋10)＝34。(A) 是誤以為 AB＝EC＝3；(C) 是把四邊都當成 10（平行四邊形不一定是菱形）；(D) 是把 BC 也當成 7，漏了 EC。故選 (B)。`,figure:`ai/904/math/q18_parallelogram.png`},{qNo:19,stem:`如附圖，PA、PB 分別與圓 O 相切於 A、B 兩點，C 點在劣弧 AB 上。若 ∠P＝50°，則 ∠ACB 的度數為何？`,options:[`65°`,`115°`,`130°`,`50°`],answer:`B`,explanation:`【解析】切線垂直於過切點的半徑，∠OAP＝∠OBP＝90°，四邊形 OAPB 的內角和 360°，所以 ∠AOB＝360° − 90° − 90° − 50°＝130°，劣弧 AB＝130°。C 在劣弧 AB 上，∠ACB 所對的是優弧 AB＝360° − 130°＝230°，所以 ∠ACB＝230° ÷ 2＝115°（也可以在優弧上取一點 D，∠ADB＝65°，圓內接四邊形 ADBC 對角互補，∠ACB＝180° − 65°＝115°）。(A) 是 C 在優弧上時的答案，但圖中 C 在劣弧上；(C) 是圓心角 ∠AOB；(D) 是誤以為 ∠ACB＝∠P。故選 (B)。`,figure:`ai/904/math/q19_tangents.png`},{qNo:20,stem:`如附圖，△ABC 的面積為 100，D、E 兩點分別在 AB、AC 上，且 DE // BC，AD：DB＝2：3。若 F 為 BC 上任意一點，則△DEF（灰色部分）的面積為何？`,options:[`16`,`36`,`30`,`24`],answer:`D`,explanation:`【解析】DE // BC，所以△ADE ~ △ABC，DE：BC＝AD：AB＝2：5。設△ABC 中 BC 上的高為 h，則 A 到 DE 的距離是 (2/5)h，DE 與 BC 之間的距離是 (3/5)h。△DEF 以 DE 為底，F 在 BC 上，所以高就是 DE 與 BC 之間的距離 (3/5)h，面積＝½ × (2/5)BC × (3/5)h＝(6/25) × (½ × BC × h)＝(6/25) × 100＝24，與 F 的位置無關。(A) 是△ADE 的面積 (2/5)² × 100＝16，△DEF 的高不是 A 到 DE 的距離；(B) 是誤用 (3/5)² × 100；(C) 是只乘了高的比 3/5 再除以 2，忘了底 DE 也只有 BC 的 2/5。故選 (D)。`,figure:`ai/904/math/q20_parallel.png`},{qNo:21,stem:`如附圖，一個直角柱的底面是直角三角形，兩股長分別為 6 公分、8 公分，柱高為 12 公分。這個直角柱的表面積是多少平方公分？`,options:[`336`,`312`,`288`,`216`],answer:`A`,explanation:`【解析】底面直角三角形的斜邊＝√(6²＋8²)＝10，底面積＝6 × 8 ÷ 2＝24。側面積＝底面周長 × 高＝(6＋8＋10) × 12＝288。表面積＝2 × 24＋288＝336 平方公分。(B) 是只算了一個底面；(C) 只算了側面積；(D) 是漏算了斜邊那一個側面（只用 6＋8 乘以高）。故選 (A)。`,figure:`ai/904/math/q21_prism.png`},{qNo:22,stem:`甲袋中有 1 顆紅球、2 顆白球，乙袋中有 2 顆紅球、1 顆白球，每顆球除顏色外都相同。從甲、乙兩袋中各任意抽出 1 顆球，抽出的兩顆球顏色相同的機率為何？`,options:[`4/9`,`5/9`,`1/2`,`2/9`],answer:`A`,explanation:`【解析】甲袋 3 顆、乙袋 3 顆，各抽 1 顆共有 3 × 3＝9 種等可能的結果。兩顆都是紅色：1 × 2＝2 種；兩顆都是白色：2 × 1＝2 種，所以顏色相同的機率＝(2＋2)/9＝4/9。(B) 是顏色「不同」的機率；(C) 是以為只有「相同」與「不同」兩種結果，所以各占一半，但這兩種結果發生的可能性並不相等；(D) 只算了兩顆都是紅色的情形。故選 (A)。`},{qNo:23,stem:`表中六隊主場場均的中位數是多少人？`,options:[`9,040.5 人`,`9,242.5 人`,`9,373 人`,`10,168 人`],answer:`B`,explanation:`【解析】由小到大排列：7,255、7,793、8,317、10,168、10,288、12,415。共 6 個數，中位數是第 3、4 個數的平均：(8,317＋10,168) ÷ 2＝9,242.5 人。(A) 是沒有先排序，直接取表中第 3、4 個數（富邦與統一）平均；(C) 是六隊的平均數 56,236 ÷ 6≈9,373，不是中位數；(D) 是只取了排序後的第 4 個數。故選 (B)。`},{qNo:24,stem:`假設上半季的 180 場比賽平均分配給六隊當主場（每隊主場場數相同），依表中數據估計，上半季全部比賽的觀眾總人次約為多少？`,options:[`約 337 萬人次`,`約 1012 萬人次`,`約 28 萬人次`,`約 169 萬人次`],answer:`D`,explanation:`【解析】每隊主場 180 ÷ 6＝30 場，每一場比賽只屬於一個主場球隊。總人次＝30 × (12,415＋10,168＋10,288＋7,793＋8,317＋7,255)＝30 × 56,236＝1,687,080≈169 萬（和「180 場 × 平均每場 9,373 人≈169 萬」一致）。(A) 是以為每隊比賽 60 場，用 60 × 56,236，但每場比賽有主、客兩隊，這樣每場都被算了兩次；(B) 是用 180 場乘以六隊場均的總和，每場只會有一個主場球隊的觀眾數，不能把六隊加起來再乘全部場數；(C) 是 30 × 9,373≈28 萬，只算了 30 場，那只是「一隊」的主場場數。故選 (D)。`},{qNo:25,stem:`根據上表與文中資料，下列敘述何者正確？`,options:[`主場場均高於 9,373 人的隊伍超過六隊的一半`,`中信兄弟的主場場均比台鋼雄鷹多了 75% 以上`,`富邦悍將的主場場均，2025 年上半季比 2024 年成長超過 40%`,`六隊主場場均的平均數小於中位數`],answer:`C`,explanation:`【解析】富邦：(10,288 − 7,307) ÷ 7,307＝2,981 ÷ 7,307≈0.408，成長約 40.8%，超過 40%，正確。(A) 高於 9,373 人的只有中信、味全、富邦 3 隊，恰好是一半，不是「超過一半」；(B) (12,415 − 7,255) ÷ 7,255＝5,160 ÷ 7,255≈0.711，只多了約 71%，不到 75%；(D) 平均數 56,236 ÷ 6≈9,372.7，中位數 9,242.5，平均數大於中位數。注意成長率要除以「原來的」7,307，若誤除以 10,288 會得到約 29%，而誤判富邦沒有超過 40%。故選 (C)。`}],verification:[`2026-10-09 依 SPEC_AI2_AI3.md 的 AI-4（會考水準）規格出題，參照 114／115 年真題；每題答案由 tools/ai_sets/ai4_math.py 以精確運算求得並以 check 驗證，6 張附圖依數據繪製並經檢視。`,`2026-10-09 獨立作答者 1（Claude Opus，看不到答案）25/25、獨立作答者 2（Claude Sonnet）25/25 與答案卷一致，0 題有異議；兩者皆實測附圖與數據相符。難度（同一評分標準）：114 年真題 2.76、本卷 Opus 2.80／Sonnet 2.64。`,`2026-10-09 獨立事實查核：航海家 1 號一光日、淡江大橋、Duplantis 15 次世界紀錄逐筆、2025 中職上半季各隊主場平均觀眾逐筆以網路來源確認。tools/check_ai_set.py 0 問題。`,`2026-10-09 最終複查（定稿前）：獨立稽核者（Claude Opus）拿答案與解析逐題核對（答案唯一性、計算、事實、附圖、文字），另由 Claude Opus 與 Claude Sonnet 各自重新盲解全卷，答案全部與答案卷一致；稽核指出的解析措辭、誘答與解析不一致、真實事件的相對時間（改為確切年份）與文言異文（以多版本比對後採通行本）均已修正，修正過的題目再由兩個模型重新盲解一致；答案卷未變動。`]},lo={set:`AI-4`,year:904,subject:`自然`,title:`AI-4 自然模擬卷（會考水準）`,difficulty:`會考水準`,note:`由 AI 依會考自然科（生物、理化、地科）命題範圍編寫的模擬卷，難度、題數與題型比照近年會考，非會考真題。包含實驗設計（操縱、控制、應變變因）、表格與圖表判讀，以及以 2025 年真實事件為素材的題組（來源見 topics）。數值題答案由程式計算驗證（tools/ai_sets/ai4_science.py），附圖由程式依題目數據繪製。`,topics:[`2025/1/21 00:17 嘉義縣大埔鄉規模 6.4 地震（震源深度 9.7 km、各地最大震度、菲律賓海板塊擠壓歐亞板塊）: https://www.gvm.com.tw/article/99581`,`同上，最大震度大埔 6 弱（中央社）: https://www.cna.com.tw/news/ahel/202501215004.aspx`,`2025/7/6 23:40 丹娜絲颱風由嘉義布袋登陸，1958 年有較完整紀錄以來首次由嘉義登陸、由臺灣海峽南部北上（公視）: https://news.pts.org.tw/article/761566`,`丹娜絲穿越雲林、南投，受中央山脈阻擋迅速減弱，7/7 05 時降為輕颱、06 時由桃竹交界出海（鏡週刊）: https://www.mirrormedia.mg/story/20250707edi031`,`2025 廣東佛山屈公病疫情（7/23 逾 2,600 例；屈公病由帶病毒的白線斑蚊或埃及斑蚊叮咬傳染，疾管署）: https://mohw.gov.tw/cp-16-83187-1.html`,`佛山 7/31 確診破 5000 例、清積水與成蚊消殺、中山大學釋放絕育雄蚊與不吸血的華麗巨蚊（幼蟲吃病媒蚊幼蟲）（中央社）: https://www.cna.com.tw/news/acn/202507310358.aspx`,`KJ Muldoon：嚴重 CPS1 缺乏症（無法清除氨）、費城兒童醫院與賓大約六個月內打造個人化基因編輯、脂質奈米顆粒靜脈注射由肝細胞吸收、2 月至 4 月共三劑、2025/5/15 NEJM 發表: https://www.nbcnews.com/health/health-news/pennsylvania-baby-first-receive-personalized-gene-therapy-rcna207100`,`同上，鹼基編輯修正單一 DNA 字母、可攝取較多蛋白質且用藥減少: https://www.smithsonianmag.com/smart-news/a-baby-with-a-rare-disease-is-the-first-to-receive-personalized-gene-therapy-180986652/`,`其他題目（細胞、遺傳、水分平衡、草履蟲培養、番薯條、各實驗數據、月出紀錄、檸檬電池電壓、彈簧實驗等）為虛構情境或依課本原理設計的數據；白晝長度由天文公式估算（日出日落以太陽上緣、大氣折射 0.833° 計）`],groups:[{from:35,to:36,passage:`2025 年 7 月起，中國廣東省佛山市爆發屈公病（又稱基孔肯雅熱）疫情，到 7 月底確診病例已超過 5000 例。屈公病由屈公病毒引起，和登革熱一樣，人是被帶有病毒的白線斑蚊或埃及斑蚊叮咬而感染，症狀包括發燒、關節疼痛等。
