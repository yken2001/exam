對於甲、乙兩人的看法，下列判斷何者正確？`,options:[`甲、乙皆正確`,`甲錯誤，乙正確`,`甲、乙皆錯誤`,`甲正確，乙錯誤`],answer:`D`,explanation:`【解析】n 除以 6 餘 5，表示 n＋1 是 6 的倍數；n 除以 4 餘 3，表示 n＋1 是 4 的倍數。所以 n＋1 是 6 與 4 的公倍數，也就是 12 的倍數（6 與 4 的最小公倍數是 12，不是 6×4＝24），n＋1＝12k，n＝12k − 1＝12(k − 1)＋11，除以 12 餘 11，甲正確。例如 n＝11：11÷6 餘 5、11÷4 餘 3，但 n＋1＝12 不是 24 的倍數，乙錯誤。(A) 與 (B) 是把「同時是 6 和 4 的倍數」誤當成「是 6×4＝24 的倍數」，但 6 與 4 有公因數 2；(C) 是沒有發現 n＋1 同時是 6 與 4 的倍數。故選 (D)。`},{qNo:2,stem:`若 x²＋kx − 24 可以因式分解成 (x＋p)(x＋q)，其中 k、p、q 都是整數，則 k 共有幾種可能的值？`,options:[`4 種`,`8 種`,`16 種`,`6 種`],answer:`B`,explanation:`【解析】(x＋p)(x＋q)＝x²＋(p＋q)x＋pq，所以 pq＝−24、k＝p＋q。pq＝−24 時 p、q 一正一負，p、q 兩數可能是 1 與 −24、−1 與 24、2 與 −12、−2 與 12、3 與 −8、−3 與 8、4 與 −6、−4 與 6，k 分別是 −23、23、−10、10、−5、5、−2、2，共 8 種。(A) 是只算了 k＞0 的情形；(C) 是把 (p, q) 與 (q, p) 當成不同的分解，但它們的 k 相同；(D) 是漏了 1 與 24 這一組因數。故選 (B)。`},{qNo:3,stem:`小宜用計算機算出正整數 n 的平方根，並把結果四捨五入到小數點後第一位，得到 7.3。符合這個條件的正整數 n 共有幾個？`,options:[`1 個`,`3 個`,`4 個`,`2 個`],answer:`D`,explanation:`【解析】√n 四捨五入到小數第一位是 7.3，表示 7.25 ≤ √n＜7.35，平方得 52.5625 ≤ n＜54.0225，所以 n＝53 或 54，共 2 個。(A) 是誤以為 7.3 ≤ √n＜7.4（即 53.29 ≤ n＜54.76，只有 54）；(B) 是把 52 也算進去，但 √52≈7.21，四捨五入是 7.2；(C) 是把 52 到 55 都算入，55 的平方根約 7.42，四捨五入是 7.4。故選 (D)。`},{qNo:4,stem:`2025 年日本大阪・關西世界博覽會的會期從 4 月 13 日開幕到 10 月 13 日閉幕（開幕日與閉幕日都算在會期內）。大會公布的總入場人次為 29,017,924，其中一般入場 25,578,986 人次。若以「總入場人次 ÷ 會期天數」計算平均每天的入場人次，並以科學記號表示（係數四捨五入到小數點後第二位），結果為何？`,options:[`1.58 × 10⁵`,`1.59 × 10⁵`,`1.39 × 10⁵`,`1.58 × 10⁴`],answer:`A`,explanation:`【解析】會期天數：4 月 13 日～30 日有 18 天，5～9 月有 31＋30＋31＋31＋30＝153 天，10 月 1 日～13 日有 13 天，共 18＋153＋13＝184 天（頭尾兩天都要算）。平均每天＝29,017,924 ÷ 184≈157,706，以科學記號表示約為 1.58 × 10⁵。(B) 是天數用「10 月 13 日 − 4 月 13 日」算成 183 天，少算了一天；(C) 是誤用一般入場人次 25,578,986；(D) 是 157,706 的位數數錯，10 的次方少了 1。故選 (A)。`},{qNo:5,stem:`2025 大阪世博的地標「大屋根環」是一座環狀木造建築，官方資料：內徑約 615 公尺、外徑約 675 公尺、寬約 30 公尺。若把它的俯視圖看成兩個同心圓之間的圓環（如附圖），則這個圓環的面積等於下列哪一個長方形的面積？`,options:[`寬 30 公尺，長等於「直徑 675 公尺的圓」的周長`,`寬 30 公尺，長等於「直徑 615 公尺的圓」的周長`,`寬 30 公尺，長等於「直徑 645 公尺的圓」的周長`,`寬 60 公尺，長等於「直徑 645 公尺的圓」的周長`],answer:`C`,explanation:`【解析】外圓半徑 337.5、內圓半徑 307.5，圓環面積＝π×337.5² − π×307.5²＝π×(337.5＋307.5)×(337.5 − 307.5)＝π×645×30＝(645π)×30。645π 正是直徑 645 公尺（寬度正中間）那個圓的周長，所以圓環面積等於「寬 30、長為中間圓周長」的長方形面積。官方說全周約 2,025 公尺，就是在寬度中心量的：645π≈2,026。(A) 用外圓周長會多算（外側較長）；(B) 用內圓周長會少算；(D) 把寬度誤當成兩直徑的差 675 − 615＝60，其實寬度是半徑差 30。故選 (C)。`,figure:`ai/902/math/q05_ring.png`},{qNo:6,stem:`勞動部公告：自 115 年 1 月 1 日起，每月最低工資由 28,590 元調整為 29,500 元，每小時最低工資由 190 元調整為 196 元。某位按時計酬的工讀生（虛構情境）在 115 年以每小時 196 元計薪，若他一個月的薪資要不低於每月最低工資 29,500 元，這個月至少要工作幾小時（以整數小時計）？`,options:[`150 小時`,`156 小時`,`151 小時`,`155 小時`],answer:`C`,explanation:`【解析】設工作 h 小時：196h ≥ 29,500，h ≥ 29,500 ÷ 196≈150.5，h 取整數，所以至少 151 小時（150 小時只有 29,400 元，不夠；151 小時是 29,596 元）。(A) 是把 150.5 無條件捨去，但 150 小時的薪資不到 29,500 元；(B) 與 (D) 是誤用舊的時薪 190 元（29,500 ÷ 190≈155.3），題目說的是 115 年的新時薪。故選 (C)。`},{qNo:7,stem:`某早餐店（虛構情境）每杯紅茶價格相同、每個麵包價格也相同。下表是四張收據，店員說其中恰有一張的金額打錯了，其餘三張都正確：
| 收據 | 紅茶 | 麵包 | 金額 |
| 第一張 | 3 杯 | 2 個 | 155 元 |
| 第二張 | 2 杯 | 3 個 | 170 元 |
| 第三張 | 1 杯 | 2 個 | 105 元 |
| 第四張 | 2 杯 | 1 個 | 95 元 |
若買 1 杯紅茶和 4 個麵包，正確的金額是多少元？`,options:[`185 元`,`135 元`,`178.75 元`,`545/3 元`],answer:`A`,explanation:`【解析】任取兩張收據可解出一組價格，再用另外兩張檢驗：正確的價格必須讓「恰好一張」不符合。由第一、二張：3t＋2b＝155、2t＋3b＝170，得紅茶 t＝25、麵包 b＝40；檢驗第三張 25＋80＝105 符合，第四張 50＋40＝90≠95 不符合，恰好一張錯，所以第四張打錯了。1 杯紅茶＋4 個麵包＝25＋160＝185 元。其他選項都是誤信了第四張：(B) 由第一、四張解出 t＝35、b＝25，但這樣第二張（145 元）與第三張（85 元）都不符，變成兩張錯；(C) 由第二、四張解出 t＝28.75、b＝37.5，第一、三張都不符；(D) 由第三、四張解出 t＝85/3、b＝115/3，第一、二張都不符。故選 (A)。`},{qNo:8,stem:`小芸（虛構情境）要印同一份講義，兩家影印店的收費如下：
| 店家 | 收費方式 |
| 甲店 | 每張 1.5 元；一次印 200 張以上（含 200 張），全部改為每張 1.2 元 |
| 乙店 | 先付會員費 120 元，之後每張 0.8 元 |
若她一次印下列張數，哪一種張數選乙店會比甲店便宜？`,options:[`250 張`,`180 張`,`300 張`,`160 張`],answer:`B`,explanation:`【解析】不到 200 張時，甲店 1.5n、乙店 120＋0.8n，乙便宜要 0.7n＞120，n＞171.4，所以 172～199 張選乙便宜；200 張以上甲店變成 1.2n，乙便宜要 0.4n＞120，n＞300，所以要 301 張以上乙才又便宜。180 張：甲 270 元、乙 264 元，乙便宜。(A) 250 張：甲 300 元、乙 320 元，甲便宜；(C) 300 張：兩家都是 360 元，一樣貴，不是「便宜」；(D) 160 張：甲 240 元、乙 248 元，甲便宜。這題的陷阱是忽略「滿 200 張全部降價」，以為張數越多乙一定越划算。故選 (B)。`},{qNo:9,stem:`如附圖，一塊長 20 公尺、寬 12 公尺的長方形花圃中，要鋪兩條互相垂直、寬度都是 x 公尺的步道（步道分別與花圃的邊平行），剩下的部分種花。若種花的面積是 180 平方公尺，則 x＝？`,options:[`30`,`2`,`15/8`,`3`],answer:`B`,explanation:`【解析】把四塊種花區拼在一起，恰好是一個長 (20 − x)、寬 (12 − x) 的長方形，所以 (20 − x)(12 − x)＝180，展開得 x² − 32x＋60＝0，(x − 2)(x − 30)＝0，x＝2 或 30。步道寬不能超過花圃的寬 12 公尺，所以 x＝2。(A) 是沒有檢查答案是否合理；(C) 是用 240 − 20x − 12x＝180 計算，忘了兩條步道交叉的那一塊被扣了兩次；(D) 代入檢驗：(20 − 3)(12 − 3)＝153≠180。故選 (B)。`,figure:`ai/902/math/q09_garden.png`},{qNo:10,stem:`甲、乙兩個水桶同時開始改變水量：甲桶以固定速率排水，乙桶以固定速率注水。附圖是兩桶水量（公升）與時間（分鐘）的關係圖，圖上標出了 (10, 80) 與 (5, 40) 兩點。兩桶水量相同時是第幾分鐘？當時水量是多少公升？`,options:[`第 12.5 分鐘，70 公升`,`第 12.5 分鐘，60 公升`,`第 10 分鐘，80 公升`,`第 15 分鐘，60 公升`],answer:`A`,explanation:`【解析】甲：10 分鐘從 120 降到 80，每分鐘減少 4 公升，y＝120 − 4t；乙：5 分鐘從 20 升到 40，每分鐘增加 4 公升，y＝20＋4t。120 − 4t＝20＋4t，t＝12.5，水量＝120 − 50＝70 公升。(B) 時間對，但水量誤取 0 與 120 的中點 60；(C) 是直接拿圖上標出的甲桶點 (10, 80)，那時乙桶只有 60 公升；(D) 第 15 分鐘甲 60 公升、乙 80 公升，並不相同。故選 (A)。`,figure:`ai/902/math/q10_tanks.png`},{qNo:11,stem:`公園噴水池的一道水柱，從噴口射出後的高度 y（公尺）是水平距離 x（公尺）的二次函數。工程人員測得以下數據：
| 水平距離 x | 0 | 1 | 2 | 3 |
| 高度 y | 1 | 2.4 | 3.4 | 4.0 |
這道水柱的最高點離地面多少公尺？`,options:[`4.0 公尺`,`4.2 公尺`,`4.6 公尺`,`4.4 公尺`],answer:`B`,explanation:`【解析】高度每次增加 1.4、1.0、0.6，差每次少 0.4（二次函數等距取點時，相鄰差會等差變化），所以接著增加 0.2、再來 −0.2……因此 x＝4 時 y＝4.2 是最高點，之後開始下降（x＝5 時又回到 4.0，與 x＝3 對稱）。也可以設 y＝ax²＋bx＋1，代入兩點解出 y＝−0.2x²＋1.6x＋1＝−0.2(x − 4)²＋4.2。(A) 是以為表中最大的數就是最高點；(C) 是以為每次都再增加 0.6（當成一次函數）；(D) 是把「差的變化量 0.4」誤當成下一次的增加量（4.0＋0.4）。故選 (B)。`},{qNo:12,stem:`阿哲（虛構情境）為了準備路跑開始練習：第 1 天跑 2 公里，之後每天都比前一天多跑 0.5 公里。他在第幾天跑完時，累計的總里程第一次超過 100 公里？那一天他跑了幾公里？`,options:[`第 17 天，10 公里`,`第 17 天，10.5 公里`,`第 16 天，9.5 公里`,`第 18 天，10.5 公里`],answer:`A`,explanation:`【解析】每天里程是首項 2、公差 0.5 的等差數列，前 n 天總和 Sₙ＝n[2×2＋(n − 1)×0.5]÷2。S₁₆＝16×(4＋7.5)÷2＝92（還沒超過），S₁₇＝17×(4＋8)÷2＝102（超過 100），所以是第 17 天；第 17 天跑 2＋16×0.5＝10 公里。(B) 是把第 n 天的里程寫成 2＋0.5n（公差的個數應是 n − 1）；(C) 第 16 天累計只有 92 公里；(D) 第 18 天已經不是「第一次」超過。故選 (A)。`},{qNo:13,stem:`如附圖，長方形紙片 ABCD 中，AB＝8、BC＝4。將紙片沿 EF 摺疊，使 C 點與 A 點重合，B 點落在 B'，其中 E 在 AB 上、F 在 CD 上。摺痕 EF 的長度為何？`,options:[`2√5`,`√5`,`5`,`4√5`],answer:`A`,explanation:`【解析】摺疊後 EC 與 EA 重合，所以 EA＝EC。設 AE＝x，則 EB＝8 − x，在直角△EBC 中 x²＝(8 − x)²＋4²，得 x＝5。摺痕 EF 是 AC 的垂直平分線，AC＝√(8²＋4²)＝4√5，AC 中點 O 到 A 的距離是 2√5，EO＝√(5² − (2√5)²)＝√5，再由對稱 FO＝EO，所以 EF＝2√5。(B) 只算了一半 EO；(C) 是 AE 的長；(D) 是對角線 AC 的長，摺痕並不等於對角線。故選 (A)。`,figure:`ai/902/math/q13_fold.png`},{qNo:14,stem:`木工師傅有一塊直角三角形木板，兩股長分別是 60 公分與 80 公分。他想從木板上切下一塊最大的正方形，考慮兩種放法（如附圖）：（甲）正方形的一個角放在直角處，兩邊貼著兩股；（乙）正方形的一邊貼著斜邊。兩種放法中，較大的正方形邊長為多少公分？`,options:[`1200/37 公分`,`30 公分`,`40 公分`,`240/7 公分`],answer:`D`,explanation:`【解析】（甲）設邊長 s，正方形上方剩下的小直角三角形與原三角形相似：(60 − s)/60＝s/80，得 140s＝4800，s＝240/7≈34.3。（乙）斜邊 100，斜邊上的高＝60×80÷100＝48。正方形與直角頂點之間的小三角形（底是正方形的一邊 s、高是 48 − s）與原三角形相似，對應「底：高」相同：s/100＝(48 − s)/48，得 s＝4800/148＝1200/37≈32.4。比較後（甲）較大，邊長 240/7 公分。(A) 是（乙）的結果，比較小；(B) 是把正方形邊長誤當成較短股的一半；(C) 是較長股的一半，這樣的正方形放不進三角形（40/60＋40/80＞1）。故選 (D)。`,figure:`ai/902/math/q14_squares.png`},{qNo:15,stem:`如附圖，AB 是圓 O 的直徑，C 是圓上一點，過 C 的切線與 AB 的延長線交於 P 點。若 ∠P＝34°，則 ∠CAB 的度數為何？`,options:[`56°`,`34°`,`28°`,`62°`],answer:`C`,explanation:`【解析】切線垂直於過切點的半徑，所以 ∠OCP＝90°。在△OCP 中，∠COP＝180° − 90° − 34°＝56°。∠CAB 是弧 CB 所對的圓周角，∠COB（即 ∠COP）是同弧所對的圓心角，所以 ∠CAB＝56°÷2＝28°。(A) 是圓心角 ∠COB，忘了除以 2；(B) 是誤以為 ∠CAB＝∠P；(D) 是 90° − 28°，是 ∠ABC 的度數（AB 為直徑，∠ACB＝90°）。故選 (C)。`,figure:`ai/902/math/q15_tangent.png`},{qNo:16,stem:`如附圖，一個長方體紙盒的長、寬、高分別是 5 公分、4 公分、3 公分，平放在桌上（螞蟻不能爬到盒子底面）。盒子的頂面剛塗了膠水，螞蟻也不能經過頂面。一隻螞蟻從頂點 A 沿著盒子的表面爬到頂點 G，牠爬行的最短路徑長是多少公分？`,options:[`√74 公分`,`√80 公分`,`√90 公分`,`√50 公分`],answer:`C`,explanation:`【解析】底面貼著桌子、頂面有膠水，螞蟻只能在四個側面上爬。G 是頂面的一個角，也在後面與右側面上，所以可以只走側面到達。把「前面＋右側面」（或「左側面＋後面」）展開成一個長 5＋4＝9、高 3 的長方形，A 與 G 是這個長方形的對角，最短路徑＝√(9²＋3²)＝√90。(A) √74 是經過頂面的走法（前面＋頂面展開，√[5²＋(3＋4)²]），在沒有限制時最短，但本題頂面不能走；(B) √80 是「左側面＋頂面」的走法，也經過頂面；(D) √50 是長方體的對角線 √(5²＋4²＋3²)，穿過盒子內部，螞蟻爬不到。故選 (C)。`,figure:`ai/902/math/q16_box.png`},{qNo:17,stem:`甲、乙、丙三個村莊之間的直線距離：甲村到乙村 5 公里、甲村到丙村 5 公里、乙村到丙村 8 公里。鄉公所要蓋一座水塔，使它到三個村莊的距離都相等。關於這座水塔，下列敘述何者正確？`,options:[`到每村 25/6 公里，位在三村連成的三角形內部`,`到每村 4 公里，位在乙丙兩村連線的中點`,`到每村 4/3 公里，位在三村連成的三角形內部`,`到每村 25/6 公里，位在三村連成的三角形外部`],answer:`D`,explanation:`【解析】到三個頂點距離相等的點是外心，在乙丙的垂直平分線上，也就是過甲且垂直乙丙的對稱軸上。乙丙中點 M 到甲的距離＝√(5² − 4²)＝3。設外心 O 在 M「往甲的方向」的距離為 y（y＜0 表示在另一側），則 O 到乙村的距離平方＝4²＋y²、O 到甲村的距離＝3 − y，兩者相等得 16＋y²＝9 − 6y＋y²，y＝−7/6，所以 O 在乙丙連線的另一側（三角形外部），到每村 3＋7/6＝25/6 公里。這是因為 5²＋5²＜8²，∠甲是鈍角，鈍角三角形的外心在外部。(A) 距離對，但鈍角三角形的外心不在內部；(B) 是把「直角三角形外心在斜邊中點」套用到這個三角形，但中點到甲村只有 3 公里，不等於 4 公里；(C) 是內切圓半徑（面積 12×2÷周長 18），那是到三「邊」距離相等的內心。故選 (D)。`},{qNo:18,stem:`某班（虛構情境）調查 12 位同學一週的課外閱讀時數（小時），結果如下：

【甲】至少有一顆骰子出現 6 點的機率是 1/3

對於甲、乙兩人的看法，下列判斷何者正確？`,options:[`甲、乙皆正確`,`甲正確，乙錯誤`,`甲錯誤，乙正確`,`甲、乙皆錯誤`],answer:`C`,explanation:`【解析】兩顆骰子共有 6×6＝36 種結果，機會相等。甲：至少一顆 6 點的有 (6,1)～(6,6) 6 種、(1,6)～(5,6) 5 種，共 11 種（(6,6) 只能算一次），機率 11/36，不是 1/3＝12/36，甲錯誤。乙：點數相同有 (1,1)～(6,6) 6 種；點數和為 7 有 (1,6)、(2,5)、(3,4)、(4,3)、(5,2)、(6,1) 6 種，兩者機率都是 6/36，乙正確。(A) 與 (B) 是把甲算成 1/6＋1/6＝1/3，重複計算了 (6,6)；(D) 是把點數和為 7 只算成 3 種（忽略 (1,6) 與 (6,1) 是不同結果）。故選 (C)。`},{qNo:20,stem:`一個長方體水箱，內部底面長 40 公分、寬 30 公分，裡面的水深 12 公分。把一個邊長 20 公分的正立方體鐵塊平放到水箱底部（水沒有溢出），水面會上升多少公分？`,options:[`6 公分`,`20/3 公分`,`18 公分`,`10 公分`],answer:`A`,explanation:`【解析】鐵塊高 20 公分，比原來的水深高，要先判斷會不會被淹沒。放入後水只能占「水箱底面 − 鐵塊底面」＝1200 − 400＝800 平方公分的底面積，水量 1200×12＝14400 立方公分不變，新水深＝14400÷800＝18 公分＜20 公分，鐵塊沒有被淹沒，所以水面上升 18 − 12＝6 公分。(B) 是以為鐵塊完全沉入水中，用鐵塊體積 8000÷1200 計算；(C) 是新的水深，不是上升的高度；(D) 是用鐵塊整個體積 8000 除以 800，但鐵塊在水面以上的部分沒有排開水。故選 (A)。`},{qNo:21,stem:`會員小柏（虛構情境）某次租借騎了 2 小時 40 分鐘，他這次要付多少元？`,options:[`80 元`,`50 元`,`60 元`,`70 元`],answer:`D`,explanation:`【解析】2 小時 40 分鐘＝160 分鐘，不足 30 分鐘以 30 分鐘計，共 6 個計費單位。前 4 個單位在 2 小時以內，每個 10 元，但第 1 個免費，付 3×10＝30 元；第 5、6 個單位在 2～4 小時之間，每個 20 元，付 40 元。合計 70 元。(A) 是忘了會員第一個 30 分鐘免費；(B) 是全部都用每 30 分鐘 10 元計算，沒注意超過 2 小時的費率較高；(C) 是把免費的 30 分鐘扣在較貴的時段，但免費的是「第一個」30 分鐘。故選 (D)。`},{qNo:22,stem:`會員小芳（虛構情境）某次租借付了 150 元。她這次騎乘的時間可能是下列何者？`,options:[`4 小時`,`4 小時 20 分鐘`,`4 小時 40 分鐘`,`7 小時 45 分鐘`],answer:`B`,explanation:`【解析】會員騎滿 4 小時（8 個單位）要付：前 2 小時 3×10＝30 元（第 1 個免費）＋2～4 小時 4×20＝80 元＝110 元。150 − 110＝40 元，正好是超過 4 小時後的 1 個單位，所以共 9 個單位，騎乘時間超過 4 小時、不超過 4 小時 30 分鐘，4 小時 20 分鐘符合。(A) 4 小時只要 110 元；(C) 4 小時 40 分鐘是 10 個單位，要 190 元；(D) 是把 150 元全部用每 30 分鐘 10 元回推（15 個單位再加免費 1 個），忽略了費率會隨時間提高，7 小時 45 分鐘其實要 430 元。故選 (B)。`},{qNo:23,stem:`依上述賽制，這屆世界盃全部共有幾場比賽？`,options:[`103 場`,`105 場`,`104 場`,`176 場`],answer:`C`,explanation:`【解析】小組賽每組 4 隊兩兩比賽 1 場，共 4×3÷2＝6 場，12 組共 72 場。單淘汰賽每場淘汰 1 隊，32 隊要淘汰到只剩冠軍，須淘汰 31 隊，共 31 場，再加季軍戰 1 場，共 32 場。全部 72＋32＝104 場。(A) 是忘了季軍戰；(B) 是把淘汰賽算成 32 場再加季軍戰（32 隊只需淘汰 31 隊）；(D) 是把小組賽算成每隊 3 場 × 48 隊＝144 場，每場被兩隊各算一次而重複計算。故選 (C)。`},{qNo:24,stem:`在某一組的小組賽中，排名第 3 的隊伍，積分最多可能是幾分？`,options:[`4 分`,`6 分`,`7 分`,`5 分`],answer:`B`,explanation:`【解析】6 場比賽中，每場分出勝負時兩隊共得 3 分，平手時共得 2 分，所以一組 4 隊的積分總和最多 6×3＝18 分。若第 3 名有 7 分以上，則第 1、2 名也都至少 7 分，三隊合計至少 21 分＞18，不可能。6 分則做得到：例如 A 勝 B、B 勝 C、C 勝 A，三隊又都贏 D，則 A、B、C 都是 6 分，依淨勝球排名，第 3 名仍有 6 分。所以最多 6 分。(A) 是以為第 3 名只能「一勝一和」；(C) 忽略了全組積分總和的限制；(D) 是 1 勝 2 和的積分，但 6 分也做得到，5 分並不是最多。故選 (B)。`},{qNo:25,stem:`在某一組的小組賽中，排名第 2 的隊伍，積分最少可能是幾分？`,options:[`2 分`,`3 分`,`1 分`,`0 分`],answer:`A`,explanation:`【解析】除了第 1 名以外的三隊，彼此之間還有 3 場比賽，這 3 場至少產生 3×2＝6 分（全部平手時最少）。若第 2 名只有 1 分以下，則第 2、3、4 名三隊合計最多 3 分，但他們彼此的 3 場就至少產生 6 分，矛盾，所以第 2 名至少 2 分。2 分做得到：甲隊贏其他三隊得 9 分，乙、丙、丁彼此三場都平手，各得 2 分，第 2 名就是 2 分。(B) 是想到「6 場全部平手，每隊 3 分」的情形，但那不是最少；(C) 與 (D) 會使第 2～4 名三隊合計不到 6 分，與他們彼此的三場比賽至少產生 6 分矛盾。故選 (A)。`}],verification:[`2026-10-09 依 SPEC_AI2_AI3.md 出題（作者收到真題校準提醒後加難）；每題答案由 tools/ai_sets/ai2_math.py 以精確運算求得並以 check 驗證，7 張附圖依數據繪製。`,`2026-10-09 獨立作答者 1（Claude Opus，看不到答案）25/25、獨立作答者 2（Claude Sonnet）25/25 與答案卷一致；兩者皆實測附圖與數據相符。難度（同一評分標準）：AI-1 1.76、114 年真題 2.76、本卷 Opus 3.36／Sonnet 3.24。`,`2026-10-09 獨立事實查核：大阪世博入場人數、大屋根環尺寸、115 年基本工資、2026 世界盃賽制逐條確認；修正「付費入場」為「一般入場」、同分排名規則寫法（答案不變）。tools/check_ai_set.py 0 問題。`,`2026-10-09 最終複查（定稿前）：獨立稽核者（Claude Opus）拿答案與解析逐題核對（答案唯一性、計算、事實、附圖、文字），另由 Claude Opus 與 Claude Sonnet 各自重新盲解全卷，答案全部與答案卷一致；稽核指出的解析措辭、誘答與解析不一致、真實事件的相對時間（改為確切年份）與文言異文（以多版本比對後採通行本）均已修正，修正過的題目再由兩個模型重新盲解一致；答案卷未變動。`]},Za={set:`AI-2`,year:902,subject:`自然`,title:`AI-2 自然模擬卷（進階）`,difficulty:`進階`,note:`由 AI 依會考自然科（生物、理化、地科）命題範圍編寫的進階卷，非會考真題。重點在實驗設計（操縱、控制、應變變因）、圖表判讀、多步驟計算與跨科整合，並以 2025–2026 年的真實科學新聞為素材（來源見 topics）；誘答選項取自常見迷思。數值題答案由程式計算驗證（tools/ai_sets/ai2_science.py），附圖由程式依題目數據繪製。`,topics:[`2025 堪察加半島外海規模 8.8 地震與跨太平洋海嘯（USGS 規模、深度 35 km、太平洋板塊隱沒於鄂霍次克板塊；PTWC 各站最大海嘯高度）: https://en.wikipedia.org/wiki/2025_Kamchatka_earthquake`,`同上，NWS 國際海嘯資訊中心事件摘要（卡胡盧伊 1.74 m、新月市 1.13 m、科柳莫 1.12 m、堪察加外海 DART 浮標 0.9 m）: https://www.weather.gov/itic-car/29july2025_kamtchatka_tsunami`,`2025/9/7–8 月全食臺灣各階段時刻（中央氣象署資料）: https://www.nownews.com/news/6727637`,`2026/3/3 元宵節月全食（月出帶食，食既 19:04、生光 20:03）: https://udn.com/news/story/7266/9  加入 30 mL 時 pH 約 12，氫氧化鈉過量，溶液呈鹼性。故選 (B)。`,figure:`ai/902/science/q27.png`},{qNo:28,stem:`某測站某日每 3 小時的觀測紀錄如下：

甲、10 月 2 日的第一次滿潮最可能在 04:00 前後。

其中哪些推論合理？`,options:[`甲、乙、丙`,`甲、丁`,`乙、丙、丁`,`甲、乙`],answer:`A`,explanation:`【解析】兩次滿潮相隔約 12 小時 25 分（03:10→15:35），下一次滿潮約在 15:35＋12:25＝隔天 04:00，滿潮每天約延後 50 分鐘，與月球每天約晚 50 分鐘通過同一位置相符（甲合理，丁不合理）。農曆十五前後太陽、地球、月球大致排成一直線，引潮力疊加，為大潮（乙）；約一週後為下弦月前後，太陽與月球的引潮力方向互相垂直而部分抵消，為小潮，潮差較小（丙）。(B) 丁不合理，且漏掉了乙、丙；(C) 丁不合理，且漏掉了甲；(D) 漏掉了合理的丙。故選 (A)。`},{qNo:31,stem:`夏至（6 月 21 日前後）正午，太陽直射北緯 23.5°（北回歸線，通過嘉義）。當天正午在臺北（約北緯 25°）和高雄（約北緯 22.6°）各立一根竿子，兩地竿影的方向分別為何？`,options:[`臺北、高雄的竿影都朝北`,`臺北竿影朝南；高雄竿影朝北`,`臺北、高雄都完全沒有竿影，因為臺灣都在北回歸線附近`,`臺北竿影朝北；高雄竿影朝南`],answer:`D`,explanation:`【解析】正午時太陽在正南方或正北方，竿影指向太陽的相反方向。夏至太陽直射北緯 23.5°：臺北在直射點的北方，正午太陽偏南，竿影朝北；高雄在直射點的南方，正午太陽偏北（仰角約 89°），竿影朝南。(A) 臺灣大多數日子竿影朝北，但高雄位於北回歸線以南，夏至前後太陽會在其北方；(B) 說反了；(C) 只有太陽直射的地方正午才幾乎沒有竿影，臺北和高雄都不在北緯 23.5°，仍有短短的竿影。故選 (D)。`},{qNo:32,stem:`下列哪一個地區的板塊交界類型，與這次地震發生處最相似？`,options:[`冰島：位於大西洋中洋脊上，兩側板塊互相分離`,`東非大裂谷：大陸板塊正在張裂、分離`,`臺灣東北外海的琉球海溝：菲律賓海板塊隱沒到歐亞板塊之下`,`臺灣海峽：位於歐亞板塊內部，離板塊交界較遠`],answer:`C`,explanation:`【解析】這次地震發生在太平洋板塊隱沒到鄂霍次克板塊之下的海溝附近，屬於聚合性板塊交界。琉球海溝也是一個板塊隱沒到另一個板塊之下，同樣是聚合性交界，並有海溝與火山島弧。(A) 中洋脊是板塊分離的張裂性交界；(B) 東非大裂谷也是張裂性交界；(D) 臺灣海峽位於板塊內部，不是板塊交界。故選 (C)。`},{qNo:33,stem:`依據文中的預報資料，海嘯橫越太平洋到夏威夷的平均速率最接近下列何者？`,options:[`約 245 公尺／秒`,`約 880 公尺／秒`,`約 15 公尺／秒`,`約 68 公尺／秒`],answer:`A`,explanation:`【解析】取距離約 5200 公里、時間 5.9 小時：平均速率＝5200 ÷ 5.9 ≈ 880 公里／小時。換算成公尺／秒：880 × 1000 ÷ 3600 ≈ 245，約 245 公尺／秒，和噴射客機的速率相近。（距離取 5100 或 5300 公里，結果約 240～250 公尺／秒。）(B) 880 是以「公里／小時」為單位的數值，沒有換算；(C) 約 15 是「公里／分鐘」的數值，單位弄錯；(D) 約 68 是把 245 公尺／秒又多除了一次 3.6。故選 (A)。`},{qNo:34,stem:`根據上文與表格，下列推論何者最合理？`,options:[`海嘯高度只由與震央的距離決定，距離越遠，海嘯越高`,`深海浮標離震央較近，測到的海嘯高度卻比夏威夷港口小，這與觀測處海水的深淺有關`,`在深海中航行的船隻會遇到比港口更高的海嘯，所以船隻應盡快駛入港口避難`,`智利距離震央最遠，所以智利測到的海嘯高度一定最小`],answer:`B`,explanation:`【解析】文中說明海嘯在深海波高小、到淺海才變高。深海浮標雖然離震央近，測到的只有 0.9 公尺；夏威夷港口位在淺水的海岸，測到 1.74 公尺，可見海水深淺會影響海嘯高度。(A) 智利比夏威夷遠得多，海嘯高度卻較小，「越遠越高」與資料不符；(C) 深海中海嘯波高小，船隻在深海反而較安全，駛入淺水港口會遇到較高的海嘯；(D) 智利的 1.12 公尺與新月市的 1.13 公尺幾乎相同，且比深海浮標的 0.9 公尺高，不是最小。故選 (B)。`},{qNo:35,stem:`根據表中資料與月食的原理，下列敘述何者正確？`,options:[`月全食時月面呈紅銅色，是因為月球本身在這時會發出紅光`,`2026 年這次在臺灣只能看到後半段，是因為月球那天比較晚才進入地球本影`,`兩次月食的「初虧」都發生在月亮剛從東方升起的時候`,`依表中時刻推算，2025 年這次全食階段約 83 分鐘，比 2026 年這次長約 24 分鐘`],answer:`D`,explanation:`【解析】全食階段是食既到生光：2025 年為 01:30～02:53，共 83 分鐘；2026 年為 19:04～20:03，共 59 分鐘，相差 24 分鐘。（表中時刻已四捨五入到分鐘；官方公布 2025 年這次全食約 1 小時 22 分，與 2026 年相比仍長二十多分鐘。）(A) 月球本身不發光，紅銅色是陽光經過地球大氣折射後照到月面的紅光；(B) 月食發生的時刻全世界相同，臺灣看不到前段是因為那時月亮還在地平線下、尚未升起；(C) 2025 年的初虧在凌晨 00:27，月亮早已升起並高掛天空，只有 2026 年的初虧約在月出時。故選 (D)。`},{qNo:36,stem:`2025 年 9 月 8 日 02:12（食甚）時，若有一位太空人站在月球面向地球的一側，抬頭看地球和太陽，他最可能看到什麼景象？`,options:[`看到地球整個面向他的一面都被太陽照亮，像一輪「滿地球」`,`看到月球的影子落在地球表面上`,`看到太陽在地球旁邊，地球呈現一半亮、一半暗`,`地球擋住了太陽，看到「日食」，地球的邊緣有一圈泛紅的光環`],answer:`D`,explanation:`【解析】月全食時太陽、地球、月球排成一直線，地球在中間，月球位於地球的本影中。站在月球上看，太陽正好被地球擋住，等於看到「地球遮住太陽」的日食；陽光經過地球大氣層折射，在地球邊緣形成一圈紅光，這也正是月面在月全食時呈紅銅色的原因。(A) 月球在地球背向太陽的一側，月球上的人看到的是地球「沒有被照亮」的夜晚半球，而不是亮面；(B) 月球的影子落到地球上是發生日食的情形，此時月球在太陽與地球之間，與月食的位置相反；(C) 三者排成一直線，從月球看太陽正好在地球後方，不會在地球旁邊。故選 (D)。`},{qNo:37,stem:`關於這個取水裝置，下列四項敘述：
甲、步驟乙中，水分子離開 MOF 的孔洞需要吸收熱量。
乙、步驟丙中，水蒸氣凝結成液態水時會放出熱量。
丙、整個過程中，水分子先被分解成氫和氧，再在集水板上重新化合成水。
丁、集水板的溫度越高，水蒸氣越容易在上面凝結。
其中哪些正確？`,options:[`乙、丙`,`甲、丁`,`甲、乙`,`甲、乙、丁`],answer:`C`,explanation:`【解析】步驟乙要靠陽光加熱，水分子才會離開孔洞，表示這個過程需要吸收熱量（甲）；氣態水凝結成液態水時會放出熱量（乙）。丙錯誤：水分子只是被吸附、脫附、改變狀態，沒有分解成氫和氧，屬於物理變化。丁錯誤：凝結時要把熱量放出去，集水板溫度越低，水蒸氣越容易凝結，所以集水板要保持較冷。(A) 丙錯誤，且漏掉了甲；(B) 丁錯誤，且漏掉了乙；(D) 丁錯誤。故選 (C)。`},{qNo:38,stem:`假設某沙漠夜晚氣溫 15°C、相對溼度 40%（虛構情境）。白天同一團空氣在水氣量不變的情況下被加熱到 35°C。每立方公尺空氣中的水氣量，以及白天這團空氣的相對溼度約為多少？`,options:[`約 5.1 公克；約 13%`,`約 5.1 公克；仍為 40%`,`約 5.1 公克；約 22%`,`約 15.8 公克；仍為 40%`],answer:`A`,explanation:`【解析】水氣量＝飽和水氣量 × 相對溼度＝12.8 × 40% ≈ 5.1 g/m³。加熱到 35°C 時水氣量不變，但飽和水氣量變為 39.6 g/m³，相對溼度＝5.1 ÷ 39.6 ≈ 13%。氣溫升高、空氣變得更乾，所以裝置要在夜晚（相對溼度較高時）吸附水氣。(B) 相對溼度會隨氣溫改變，水氣量不變而氣溫升高時相對溼度下降；(C) 22% 是除以 25°C 的飽和水氣量 23.0，氣溫用錯了；(D) 15.8 是用 35°C 的飽和水氣量乘以 40%，但夜晚的氣溫是 15°C。故選 (A)。`},{qNo:39,stem:`科學家是以腕足中段的鉤狀構造，而不是以「透明的身體」來確認這隻幼體的物種。最合理的原因是什麼？`,options:[`透明的身體是許多玻璃魷幼體共有、而且會隨成長改變的特徵，不能用來區分物種；腕足中段的鉤狀構造才是大王酸漿魷特有的特徵`,`透明的身體是大王酸漿魷特有的特徵，但因為影片不夠清楚，只好改用鉤狀構造`,`鉤狀構造表示牠與龍蝦、螃蟹一樣屬於節肢動物，所以能用來分類`,`生物分類主要依據生活環境和深度，鉤狀構造只是輔助的依據`],answer:`A`,explanation:`【解析】文中說玻璃魷一類的幼體多半透明，大王酸漿魷長大後也會變得不透明，所以「透明」既不是牠獨有，也不穩定，無法區分物種；2023 年的影片正因為看不清腕足上的鉤而無法確認，可見鉤狀構造才是辨認大王酸漿魷的關鍵特徵。(B) 透明是許多玻璃魷幼體共有的特徵，不是大王酸漿魷特有；(C) 大王酸漿魷是身體柔軟、不分節的軟體動物（與章魚、烏賊同類），有鉤不代表是節肢動物；(D) 分類主要依據生物本身的構造特徵與親緣關係，不是生活環境。故選 (A)。`},{qNo:40,stem:`拍攝時遙控潛水器位在約 600 公尺深處。若海水密度約為 1.03 g/cm³，此處海水所造成的壓力（不含大氣壓力）約為多少？`,options:[`約 0.618 公斤重／平方公分`,`約 618 公斤重／平方公分`,`約 61.8 公斤重／平方公分`,`約 58.3 公斤重／平方公分`],answer:`C`,explanation:`【解析】液體壓力＝深度 × 液體密度。600 公尺＝60000 公分，壓力＝60000 × 1.03＝61800 gw/cm²＝61.8 kgw/cm²，相當於每平方公分承受約 62 公斤重，所以潛水器必須非常堅固。(A) 0.618 是把深度用 600（公尺）直接代入、單位沒有換成公分；(B) 618 是在換算時多乘了 10；(D) 58.3 是誤用深度 ÷ 密度。故選 (C)。`},{qNo:41,stem:`根據實驗結果，下列推論何者正確？`,options:[`此植物經由上表皮散失的水分比下表皮多`,`此植物葉片下表皮的氣孔比上表皮多`,`水面上加油的目的是讓枝條吸水的速率變快`,`只要葉片上、下表皮都塗凡士林，枝條就完全不會散失水分`],answer:`B`,explanation:`【解析】封住下表皮的丙組只減少 0.9 公克，封住上表皮的乙組仍減少 3.4 公克，可見水分主要由下表皮散失，表示下表皮的氣孔較多。(A) 與資料相反，下表皮散失的水較多；(C) 加油是為了防止水從量筒水面直接蒸發，讓減少的水量都來自枝條；(D) 丁組兩面都塗仍減少 0.3 公克，水分還可以從莖等其他部位散失。故選 (B)。`},{qNo:42,stem:`若各組由莖等葉片以外部位散失的水量都相同，則經由葉片下表皮散失的水量約為多少公克？`,options:[`3.4 公克`,`3.7 公克`,`0.6 公克`,`3.1 公克`],answer:`D`,explanation:`【解析】甲組（全部可散失）4.0 公克＝上表皮＋下表皮＋其他部位；丙組（下表皮封住）0.9 公克＝上表皮＋其他部位，所以下表皮＝4.0 − 0.9＝3.1 公克。也可由乙組（上表皮封住，下表皮＋其他部位）3.4 減丁組（只有其他部位）0.3 得到 3.1 公克，兩種算法一致。(A) 3.4 公克還包含莖等其他部位散失的 0.3 公克；(B) 3.7 是 4.0 − 0.3，為上、下表皮合計；(C) 0.6 公克是上表皮散失的水量。故選 (D)。`},{qNo:43,stem:`兩車速度相同的時刻，以及此時兩車的位置關係，下列何者正確？`,options:[`第 5 秒；兩車並排`,`第 10 秒；B 車在 A 車前方`,`第 5 秒；B 車在 A 車前方 25 公尺`,`第 5 秒；A 車在 B 車前方 25 公尺`],answer:`D`,explanation:`【解析】由圖，B 車速度在第 5 秒時增加到 10 公尺／秒，與 A 車相同。位移是速度—時間圖下的面積：0～5 秒 A 車走 10 × 5＝50 公尺，B 車走 ½ × 5 × 10＝25 公尺，所以 A 車在前 25 公尺。在這之前 A 車一直比 B 車快，兩車距離越拉越大，第 5 秒時距離最大。(A) 速度相同不代表位置相同；(B) 第 10 秒時 B 車速度是 20 公尺／秒，兩車速度不同；(C) 0～5 秒 B 車一直比 A 車慢，不可能在前面。故選 (D)。`},{qNo:44,stem:`B 車在第幾秒時追上 A 車？`,options:[`第 5 秒`,`第 7.5 秒`,`第 10 秒`,`第 15 秒`],answer:`C`,explanation:`【解析】A 車的位移為 10t；B 車在 0～10 秒內的位移為圖下三角形面積 ½ × t × 2t＝t²。令 t²＝10t，得 t＝10 秒，此時兩車都走了 100 公尺（A：10 × 10；B：½ × 10 × 20）。(A) 第 5 秒只是兩車速度相同，此時 A 車還在前方 25 公尺；(B) 7.5 秒時 A 走 75 公尺、B 走 56.25 公尺，還沒追上；(D) 第 15 秒時 B 車已超前 A 車 50 公尺。故選 (C)。`},{qNo:45,stem:`液體甲與液體乙的比熱比（甲：乙）為何？`,options:[`2：1`,`3：2`,`1：1`,`1：2`],answer:`D`,explanation:`【解析】每分鐘吸收的熱量相同、質量相同時，溫度上升越快的物質比熱越小。甲每分鐘升高 10°C，乙每分鐘升高 5°C，由 H＝m × s × ΔT，比熱與溫度變化成反比，所以甲：乙＝5：10＝1：2。(A) 誤以為升溫快的比熱大，把比例倒過來了；(B) 3：2 是加熱 4 分鐘後的溫度比 60：40，溫度比不是比熱比；(C) 兩者吸熱相同但升溫不同，比熱不可能相同。故選 (D)。`},{qNo:46,stem:`若液體乙是水（比熱 1 cal/g·°C），則每個加熱器每分鐘放出多少熱量？液體甲的比熱為多少？`,options:[`4000 cal；0.5 cal/g·°C`,`1000 cal；0.5 cal/g·°C`,`1000 cal；2 cal/g·°C`,`2000 cal；1 cal/g·°C`],answer:`B`,explanation:`【解析】水每分鐘升高 5°C，吸收熱量＝200 × 1 × 5＝1000 cal，即加熱器每分鐘放出 1000 cal。甲每分鐘也吸收 1000 cal、升高 10°C：1000＝200 × s × 10，s＝0.5 cal/g·°C。(A) 4000 cal 是 4 分鐘的總熱量，不是每分鐘；(C) 比熱算反了，甲升溫較快，比熱應比水小；(D) 2000 cal 是把甲升高的 10°C 當成水的溫度變化。故選 (B)。`},{qNo:47,stem:`根據右圖，下列敘述何者正確？`,options:[`電阻甲的圖線較陡，所以甲的電阻比乙大`,`電阻甲為 10 Ω，比電阻乙小`,`電阻乙為 0.05 Ω`,`電壓為 0 時沒有電流，所以兩個電阻此時的電阻值都是 0`],answer:`B`,explanation:`【解析】由圖，6 V 時通過甲的電流為 0.6 A，R＝V ÷ I＝6 ÷ 0.6＝10 Ω；通過乙的電流為 0.3 A，R＝6 ÷ 0.3＝20 Ω。在「電流—電壓」圖中，圖線越陡表示相同電壓下電流越大，電阻越小。(A) 縱軸是電流，圖線越陡電阻越小，說反了；(C) 0.05 是 I ÷ V＝0.3 ÷ 6，算成了倒數；(D) 電阻是導體本身的性質，題目說明不隨電壓改變，電壓為 0 時只是沒有電流，電阻仍是 10 Ω 和 20 Ω。故選 (B)。`},{qNo:48,stem:`將電阻甲、乙串聯後接在 6 V 的電源上（電源內電阻不計），電路中的電流與電阻甲兩端的電壓各為多少？`,options:[`0.9 A；6 V`,`0.2 A；4 V`,`0.2 A；2 V`,`0.3 A；3 V`],answer:`C`,explanation:`【解析】串聯總電阻＝10＋20＝30 Ω，電流＝6 ÷ 30＝0.2 A。電阻甲兩端電壓＝0.2 × 10＝2 V（乙兩端為 4 V，合計 6 V）。(A) 0.9 A 是兩電阻「並聯」時的總電流，且串聯時甲兩端不是 6 V；(B) 4 V 是乙兩端的電壓，電阻較大的乙分到較多電壓；(D) 誤以為兩電阻平分電壓，但兩者電阻不同。故選 (C)。`},{qNo:49,stem:`比較甲、乙、丙三組的結果，下列敘述何者正確？`,options:[`增加二氧化錳的量可使反應變快，但不會增加最後產生的氧氣總量`,`二氧化錳越多，最後產生的氧氣總量越多`,`二氧化錳在反應中會被消耗，所以要加得越多越好`,`丙組沒有加二氧化錳，所以過氧化氫完全不會分解`],answer:`A`,explanation:`【解析】乙（2 公克）的曲線比甲（1 公克）上升得快，但兩者最後都收集到約 540 mL 氧氣，可見二氧化錳只改變反應速率，不影響產量，是催化劑。(B) 甲、乙最後的氧氣總量相同；(C) 反應後二氧化錳的質量不變，沒有被消耗；(D) 丙組曲線仍緩慢上升，表示沒有催化劑時過氧化氫也會分解，只是很慢。故選 (A)。`},{qNo:50,stem:`若要探討「過氧化氫的量」對產生的氧氣總量的影響，應比較哪兩組？由結果可得到什麼結論？`,options:[`甲和乙；過氧化氫的量越多，反應速率越快`,`甲和丁；過氧化氫的量變成 2 倍，產生的氧氣總量也變成約 2 倍`,`乙和丁；過氧化氫的量變成 2 倍，產生的氧氣總量也變成約 2 倍`,`丙和丁；過氧化氫的量越多，產生的氧氣總量越多`],answer:`B`,explanation:`【解析】甲和丁的二氧化錳都是 1 公克，只有過氧化氫溶液的體積（溶質的量）不同。丁最後約 1080 mL，是甲 540 mL 的 2 倍，可知產生的氧氣總量與過氧化氫的量成正比。(A) 甲和乙的過氧化氫一樣多，改變的是二氧化錳的量；(C) 乙和丁的過氧化氫量和二氧化錳量兩者都不同，不是公平的比較；(D) 丙和丁的過氧化氫量和有無催化劑都不同，也不能比較。故選 (B)。`}],verification:[`2026-10-09 依 SPEC_AI2_AI3.md 出題（作者收到真題校準提醒後加難）；數值答案由 tools/ai_sets/ai2_science.py 計算並以 check 驗證，8 張附圖依數據繪製並經檢視。`,`2026-10-09 獨立作答者 1（Claude Opus，看不到答案）50/50、獨立作答者 2（Claude Sonnet）50/50 與答案卷一致；兩者皆核對附圖與數據相符。難度（同一評分標準）：114 年真題 2.62、本卷 Opus 2.74／Sonnet 3.08。`,`2026-10-09 獨立事實查核：堪察加地震與海嘯、2025/9/8 與 2026/3/3 月全食時刻、2025 諾貝爾化學獎、大王酸漿魷影像逐條確認；震源深度因來源不一改寫為「淺源地震」，月全食時長註明依表推算（官方約 82 分），答案不變。tools/check_ai_set.py 0 問題。`,`2026-10-09 最終複查（定稿前）：獨立稽核者（Claude Opus）拿答案與解析逐題核對（答案唯一性、計算、事實、附圖、文字），另由 Claude Opus 與 Claude Sonnet 各自重新盲解全卷，答案全部與答案卷一致；稽核指出的解析措辭、誘答與解析不一致、真實事件的相對時間（改為確切年份）與文言異文（以多版本比對後採通行本）均已修正，修正過的題目再由兩個模型重新盲解一致；答案卷未變動。`]},Qa={set:`AI-2`,year:902,subject:`社會`,title:`AI-2 社會模擬卷（進階）`,difficulty:`進階`,note:`由 AI 依會考社會科（地理、歷史、公民）命題範圍編寫的進階練習卷，非會考真題。以閱讀理解為核心：史料判讀、統計表計算、因果推理與公民概念應用；時事素材（2025 年臺灣人口與出口、日本米價、2026 世界盃、2026 年最低工資）經查證，來源列於 topics；法規依 2026 年全國法規資料庫；史料原文取自維基文庫並逐字核對，標「（改寫）」者為改寫文字、標「示意」「虛構」者為虛構資料；計算題答案由程式驗證（tools/ai_sets/ai2_social.py）。`,topics:[`2025 年臺灣人口（年底 2,329 萬 9,132 人、65 歲以上 20.06%、0–14 歲 11.51%、15–64 歲 68.43%、全年出生 107,812 人、自然增加 −92,456 人）：聯合報 https://udn.com/news/story/7266/9254576`,`2024 年出生數 134,856 人、2025 年 11 月底人口結構：中央社 https://www.cna.com.tw/news/aipl/202512100123.aspx`,`2015 年底人口結構（0–14 歲 13.57%、15–64 歲 73.92%、65 歲以上 12.51%，內政部戶政司資料）：https://tnscg-agr.tainan.gov.tw/uploaded/105E1054119.pdf`,`2025 年臺灣出口（總額 6,407.5 億美元、對美 1,982.7 億美元占 30.9%、中國大陸及香港 1,704.8 億美元占 26.6%、東協 1,189.8 億美元、歐洲 412.9 億美元、日本 300.1 億美元）：科技新報引財政部 https://technews.tw/?p=1496641`,`日本 2024–2026 米價與備蓄米釋出（競標→隨意契約、2026 年 2 月仍高於 4,000 日圓）：時事通信社英文報導 https://english.adnkronos.com/2026/02/16/rice-prices-remain-high-in-japan-even-after-stockpile-releases/ ；日本首相官邸 https://japan.kantei.go.jp/103/statement/202505/26kaiken.html`,`2026 世界盃足球賽（美加墨合辦、48 隊、104 場、16 城市、6/11 阿茲特克體育場開幕、7/19 大都會人壽體育場決賽）：https://www.si.com/soccer/2024/02/04/fifa-announces-world-cup-2026-final-venue-match-schedule`,`墨西哥城海拔約 2,240 公尺、北緯約 19 度、UTC−6：https://en.wikipedia.org/wiki/Mexico_City`,`2026 年最低工資（月薪 28,590→29,500 元、時薪 190→196 元、CPI 年增率 1.76%）：https://news.pts.org.tw/article/772368 ；2027 年最低工資審議（30,900 元、205 元、送行政院核定）：https://finance.technews.tw/2026/09/25/minimum-wage-raised-11-years-subsidies-industry-support/`,`東德人口移往西德統計（1950: 197,887；1953: 331,390；1960: 199,188；1961: 207,026；1962: 21,365，西德資料）：https://germanhistorydocs.org/en/two-germanies-1961-1989/east-west-german-immigration-statistics-1961-1990.pdf`,`法規（全國法規資料庫，2026 年版）：公民投票法第 7、29 條 https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0020050 ；公職人員選舉罷免法第 14 條 https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=D0020010&flno=14 ；菸害防制法第 16、17 條 https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0070021 ；民法第 77 條、第 981 條（刪除）https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=B0000001&flno=77 ；刑法第 18 條 https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=C0000001&flno=18 ；少年事件處理法第 2 條 https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode= 依比較利益原則，下列敘述何者正確？`,options:[`甲國兩種產品的產量都較高，兩國間不需要貿易`,`甲國專門生產酒、乙國專門生產布，再互相交換`,`乙國生產 1 瓶酒的機會成本為 2 匹布，比甲國高`,`甲國專門生產布、乙國專門生產酒，再互相交換`],answer:`D`,explanation:`【解析】甲國生產 1 匹布要放棄 0.5 瓶酒，乙國要放棄 1 瓶酒，甲國生產布的機會成本較低；乙國生產 1 瓶酒只放棄 1 匹布，甲國卻要放棄 2 匹布，乙國生產酒的機會成本較低。依比較利益，甲國專產布、乙國專產酒再交換，雙方都能獲利。A是常見迷思：即使一國兩樣都較有效率（絕對利益），只要機會成本不同，貿易仍對雙方有利；B把分工方向弄反；C乙國生產 1 瓶酒的機會成本是 1 匹布，甲國是 2 匹布，乙國較低。故選 (D)。`},{qNo:33,stem:`某國（虛構）的個人所得稅採累進稅率：所得淨額 50 萬元以下的部分課 5%，超過 50 萬元至 120 萬元的部分課 12%，超過 120 萬元的部分課 20%。阿哲某一年的所得淨額為 80 萬元。
下列敘述何者正確？`,options:[`應繳稅額 6.1 萬元，平均稅率低於 12%`,`全部所得適用 12%，應繳稅額 9.6 萬元`,`全部所得適用 5%，應繳稅額為 4 萬元`,`應繳稅額 6.1 萬元，平均稅率等於 12%`],answer:`A`,explanation:`【解析】累進稅率是「分段計稅」：50 萬 × 5%＝2.5 萬，超過的 30 萬 × 12%＝3.6 萬，合計 6.1 萬元；平均稅率＝6.1 ÷ 80≈7.6%，低於最高適用的邊際稅率 12%。B是常見迷思，以為所得全部適用最高級距的稅率；C只用最低稅率計算；D稅額正確，但平均稅率算錯，12% 是最後一段所得適用的稅率，不是平均稅率。故選 (A)。`},{qNo:34,stem:`下列哪一項措施，最能體現「考量不同處境給予合理的差別待遇，以達到實質平等」的精神？`,options:[`會計職缺只錄用男性，理由是男性處理數字較為細心`,`規定一定規模以上的機關，須進用一定比例的身心障礙者`,`考試一律用相同試卷作答，視障考生也不另提供點字卷`,`公車對所有乘客收取相同票價，不另設任何優待方案`],answer:`B`,explanation:`【解析】身心障礙者在就業市場上處於不利處境，法律要求機關、企業定額進用，是以合理的差別待遇幫助他們獲得平等的工作機會，屬於實質平等。A雖然也是差別待遇，但理由出於性別刻板印象，與工作能力無關，屬於不合理的歧視；C、D都是不考慮處境差異的形式平等，C還會使視障考生無法公平應試。故選 (B)。`},{qNo:35,stem:`依表中資料計算，2015 年到 2025 年臺灣的扶養比變化，下列何者最接近？`,options:[`由約 26 上升到約 32`,`由約 17 上升到約 29`,`由約 35 上升到約 46`,`由約 92 上升到約 174`],answer:`C`,explanation:`【解析】2015 年扶養比＝（13.57＋12.51）÷ 73.92 × 100≈35.3；2025 年＝（11.51＋20.06）÷ 68.43 × 100≈46.1。表示每 100 位工作年齡人口要扶養的幼年與老年人口，由約 35 人增加到約 46 人。A是把依賴人口占「總人口」的百分比當成扶養比，分母用錯；B只算了老年人口（老年扶養比），漏掉幼年人口；D是老化指數，不是扶養比。故選 (C)。`},{qNo:36,stem:`依題組資料，下列推論何者正確？`,options:[`2025 年全年出生數，比 2024 年減少了將近一半之多`,`2025 年底老年人口已超過幼年人口的 1.5 倍`,`2025 年全年死亡人數少於出生人數，但人口仍減少`,`2015 到 2025 年間，15–64 歲人口所占的比例上升`],answer:`B`,explanation:`【解析】2025 年老化指數＝20.06 ÷ 11.51 × 100≈174，老年人口約是幼年人口的 1.74 倍，超過 1.5 倍。A出生數由 134,856 人減為 107,812 人，減少約 20%，不是將近一半；C自然增加數為負值，表示死亡人數多於出生人數；D15–64 歲比例由 73.92% 降為 68.43%，是下降。故選 (B)。`},{qNo:37,stem:`若政府希望在未來 5 年內，緩解 15–64 歲人口比例下降帶來的勞動力不足，下列哪一項政策的效果最直接？`,options:[`大幅提高生育津貼，鼓勵年輕家庭生育更多子女`,`延長國民義務教育年限，提升未來勞動力的素質`,`提供彈性工時與職訓，提高中高齡者與婦女勞動參與`,`降低 65 歲以上長者的健保保費，減輕生活負擔`],answer:`C`,explanation:`【解析】題目的關鍵是「5 年內」與「勞動力」。讓已經在工作年齡、或剛退出職場但仍有能力工作的中高齡者與婦女投入或留在職場，能立即增加勞動力。A是常見的誘答：鼓勵生育能改善長期的少子化，但新生兒要十幾年後才會成為勞動力，5 年內無法緩解缺工；B會延後青少年進入職場的時間，短期反而減少勞動力；D是照顧長者的福利措施，與增加勞動力無直接關係。故選 (C)。`},{qNo:38,stem:`依表中資料推算，2024 年臺灣對美國的出口值約為多少？`,options:[`約 436 億美元`,`約 1,114 億美元`,`約 1,470 億美元`,`約 1,905 億美元`],answer:`B`,explanation:`【解析】成長 78.0% 表示 2025 年是 2024 年的 1.78 倍，所以 2024 年≈1,982.7 ÷ 1.78≈1,113.9 億美元。A是用 1,982.7 ×（1 − 78%）計算，誤以為成長率可以直接從 2025 年的數值扣掉；C是誤用出口總值的成長率 34.9%；D是把 78.0% 當成 78 億美元直接相減。故選 (B)。`},{qNo:39,stem:`依題組資料，下列敘述何者正確？`,options:[`對美出口成長率遠高於對中港，使兩者占比順序翻轉`,`2025 年對中國大陸及香港的出口值比 2024 年減少`,`2025 年對東協的出口值已超過對中國大陸及香港`,`各主要出口地區中，2025 年對歐洲出口成長率最高`],answer:`A`,explanation:`【解析】2025 年對美國出口成長 78.0%，對中國大陸及香港只成長 13.2%；推算 2024 年對美約 1,114 億美元、對中港約 1,506 億美元，原本中港較多，2025 年美國反超，占比順序翻轉（財政部也指出這是 26 年來首見）。B對中國大陸及香港仍成長 13.2%，出口值是增加；C東協 1,189.8 億美元少於中港的 1,704.8 億美元；D歐洲的成長率 6.9% 是表中最低。故選 (A)。`},{qNo:40,stem:`有經濟學者提醒，2025 年的出口表現雖然亮眼，但也隱含風險。依表中資訊，下列哪一項風險提醒最有根據？`,options:[`出口總值較前一年下降，顯示臺灣產品已失去國際競爭力`,`對日本出口比重最高，容易受到日圓匯率大幅變動的影響`,`出口以農產品為主，容易受到氣候災害與動植物疫病影響`,`出口集中於 AI 產品與美國，易受單一市場變動衝擊`],answer:`D`,explanation:`【解析】表中對美出口大增 78%、占比升到 30.9%，成長又主要來自 AI 伺服器等資通產品；出口市場與產品越集中，一旦主要市場需求下滑或貿易政策（例如關稅）改變，受到的衝擊就越大，因此宜分散市場與產品。A出口總值是成長 34.9% 並創新高；B日本的比重約 4.7%，是表中最低；C資料顯示成長主要來自資通產品，並非農產品。故選 (D)。`},{qNo:41,stem:`序文寫成時「夷艘出江甫逾三月」，最可能是指剛結束不久的哪一場戰爭？`,options:[`英法聯軍`,`甲午戰爭`,`鴉片戰爭`,`八國聯軍`],answer:`C`,explanation:`【解析】序文寫於道光二十二年年底（約西元 1843 年初），書的資料又來自「前兩廣總督林尚書」（林則徐）所譯的《四洲志》。1842 年英軍艦隊駛入長江，清廷簽訂南京條約後英艦才撤出長江，所以是鴉片戰爭。A發生在 1856–1860 年（咸豐年間）；B發生在 1894–1895 年；D發生在 1900 年，都晚於道光年間。故選 (C)。`},{qNo:42,stem:`魏源認為這部書與過去的海圖書籍不同，最主要的差別是下列何者？`,options:[`由魏源親自航行到西洋各國實地考察寫成`,`專為西洋人而寫，向他們介紹中國的地理`,`只依據中國歷代史書記載，不採外國資料`,`大量參考西方人自己的著作來介紹西方各國`],answer:`D`,explanation:`【解析】「彼皆以中土人譚西洋，此則以西洋人譚西洋」意思是：過去的書都是中國人在談西洋，這部書則是根據西洋人（自己的著作）來談西洋；序文也說資料來自林則徐翻譯的西方著作《四洲志》與「近日夷圖夷語」。A序文沒有提到魏源到西洋實地考察；B是誤讀「以西洋人譚西洋」，此書是寫給中國人認識西洋的；C與「一據……西夷之《四洲志》」「近日夷圖夷語」矛盾。故選 (D)。`},{qNo:43,stem:`若有人依照「師夷長技以制夷」的主張推動改革，下列哪一項措施最符合這個主張？`,options:[`設立兵工廠、造船廠，仿造西式槍砲輪船`,`限定外國商人只能在廣州一處口岸通商`,`號召民眾以拳術對抗洋人，並焚燒教堂`,`頒布天朝田畝制度，主張平均分配土地`],answer:`A`,explanation:`【解析】「師夷長技以制夷」是學習西方的長處（特別是船堅砲利）來抵禦西方，後來自強運動設立江南製造局、福州船政局等，正是這個主張的實踐。B是鴉片戰爭前清廷限制通商的做法，並非學習西方；C是義和團排斥西方的行動；D是太平天國的土地制度，與學習西方技術無關。故選 (A)。`},{qNo:44,stem:`2025 年 6 月起平均售價下降，最適合用下列哪一項說明？`,options:[`消費者對米的需求增加，使得米的價格下跌`,`米直接上架，市場供給增加，使價格下跌`,`政府直接規定白米的最高售價，壓低了米價`,`農民的生產成本大幅降低，因此售價下跌`],answer:`B`,explanation:`【解析】政府把備蓄米直接賣給零售業者，貨架上的米變多，等於市場供給增加；在需求變化不大時，供給增加會使價格下跌。A需求增加會使價格上漲，而不是下跌；C資料中沒有提到政府規定最高價格，政府做的是增加供給；D資料沒有提到農民生產成本降低，而且之後還提到收購預付款提高。故選 (B)。`},{qNo:45,stem:`比較 2025 年 3 月與 5 月底兩種釋出方式的效果，最能得到下列哪一項結論？`,options:[`以競標方式釋出時，備蓄米的數量一定較少`,`2025 年 3 月時，米價已低於缺貨前的水準`,`2025 年 3 月時，政府仍禁止釋出備蓄米`,`釋出的米能否迅速進入零售端，影響降價效果`],answer:`D`,explanation:`【解析】兩次都在增加供給，差別在於 3 月的米要經過層層流通才上架，5 月底則直接賣給零售業者；資料顯示後者才使售價明顯下降，可見米要快速到達消費者面前，供給增加才會反映在零售價格上。A資料只說明流通過程不同，沒有比較兩次釋出的數量；B2025 年春天售價約為缺貨前的兩倍；C資料說明規則已修改，3 月已經以競標方式釋出。故選 (D)。`},{qNo:46,stem:`2025 年秋天新米產量增加，零售米價卻又上升。依據資料，下列哪一項解釋最合理？`,options:[`產量增加一定使價格立刻下跌，可見資料統計有誤`,`新米產量增加，代表消費者對米的需求已經減少`,`收購成本提高，產量雖增加，零售價仍可能上漲`,`政府在秋天大量收購新米作為備蓄米，推升米價`],answer:`C`,explanation:`【解析】這題的轉折在於「產量增加」不等於「零售端的供給條件變好」。農協為了搶收購而提高付給農民的預付款，使米在流通過程中的成本提高，零售業者取得米的價格也跟著上升；所以即使產量增加，零售價仍可能上漲。A是把「產量增加→價格下跌」當成必然的迷思，忽略成本等其他條件也在改變；B把生產面的產量與消費面的需求混為一談；D資料中並沒有政府在秋天收購新米的敘述，資料指出的原因是農協提高預付款。故選 (C)。`},{qNo:47,stem:`請願書批評當時的臺灣統治制度，最主要是認為它違反了下列哪一項原則？`,options:[`司法獨立：法官審判不應受到行政機關的干涉`,`罪刑法定：沒有法律明文規定的行為不得處罰`,`地方自治：鄉鎮首長應由當地居民直接選出`,`權力分立：行政權與立法權不應由同一機關掌握`],answer:`D`,explanation:`【解析】請願書指出帝國議會以「法律第六十三號」（六三法）授權臺灣總督以命令代替法律，使總督「掌握行政立法兩權」，批評的是行政、立法集中於一個機關，違反權力分立。A也是憲政原則，但請願書談的是行政與立法，沒有談到法院審判；B、C都不是文中批評的重點。故選 (D)。`},{qNo:48,stem:`依請願書的內容推算提出請願的時間，下列哪一項臺灣社會運動與它屬於同一時期？`,options:[`發生西來庵事件，以宗教號召民眾武力抗日`,`成立臺灣文化協會，舉辦演講以啟迪民智`,`發生霧社事件，賽德克族人起事反抗日人`,`響應皇民化運動，組織皇民奉公會的團體`],answer:`B`,explanation:`【解析】六三法於明治二十九年（1896 年）公布，「爾來已經二十有五年」，推得約為 1921 年；文中也提到第一次世界大戰（歐洲大戰）後國際聯盟成立的背景。1921 年林獻堂等人發起議會設置請願，同年成立臺灣文化協會，都屬於非武力的政治、文化社會運動。A西來庵事件發生於 1915 年，屬早期武裝抗日；C霧社事件發生於 1930 年；D皇民化運動是 1937 年以後的戰爭時期政策，都與 1921 年不同時期。故選 (B)。`},{qNo:49,stem:`若用今日我國的制度來類比，請願書中「臺灣議會」與「帝國議會」的關係，最接近下列哪一組機關之間的關係？`,options:[`立法院審議法律案與預算案；行政院執行法律並提出預算案`,`監察院彈劾違法失職的官員；立法院審議法律案與預算案`,`縣議會審議縣自治條例與預算；立法院審議全國法律與預算`,`憲法法庭審查法律是否違憲；立法院制定與修正全國法律`],answer:`C`,explanation:`【解析】請願者要的是由臺灣民選議員組成的議會，對「施行於臺灣之特別立法及臺灣預算」行使協贊權，並與帝國議會「相輔相成」：一個負責特定地區的立法與預算，一個負責整個國家，這與今日地方議會和立法院的分工最相近。A是立法與行政的分工，但臺灣議會與帝國議會都是民意（立法）機關，不是一立法一行政；B監察院的職權是監察而非立法；D憲法法庭是司法機關，負責違憲審查，不是另一個議會。故選 (C)。`},{qNo:50,stem:`若開幕戰在墨西哥城當地時間 6 月 11 日下午 1 時開賽，臺灣的球迷應在臺灣時間何時收看直播？`,options:[`6 月 12 日凌晨 3 時`,`6 月 11 日凌晨 3 時`,`6 月 12 日凌晨 1 時`,`6 月 10 日晚上 11 時`],answer:`A`,explanation:`【解析】墨西哥城比 UTC 慢 6 小時，臺灣比 UTC 快 8 小時，兩地相差 14 小時，臺灣較早。6 月 11 日 13 時＋14 小時＝6 月 12 日 3 時，也就是 6 月 12 日凌晨 3 時。B時刻對了，但跨過午夜後日期要加一天；C是誤用紐約的時差（相差 12 小時）；D是把時差方向弄反，用 13 時減 14 小時。故選 (A)。`},{qNo:51,stem:`墨西哥城位在熱帶的緯度，但 6、7 月白天的氣溫多半不像同緯度低地那樣炎熱。最主要的原因是下列何者？`,options:[`位於南半球，6、7 月正值冬季`,`沿岸有寒流經過，受海洋調節`,`緯度較高，太陽終年斜射地面`,`海拔高，氣溫隨高度增加而降低`],answer:`D`,explanation:`【解析】墨西哥城海拔約 2,240 公尺，氣溫大約每上升 100 公尺降低 0.6°C，比同緯度海邊低地涼爽許多，屬高地氣候。A北緯 19 度位於北半球，6、7 月是夏季；B墨西哥城位在內陸高原，不臨海；C北緯 19 度屬低緯度，太陽高度角大，並非緯度高。故選 (D)。`},{qNo:52,stem:`若一支巴西球隊從里約熱內盧（南緯約 23 度）出發，前往紐約（北緯約 41 度）參加 7 月 19 日的決賽，下列敘述何者正確？`,options:[`兩地都在西半球，因此季節相同、白晝等長`,`里約正值夏季、紐約是冬季，里約白晝較長`,`里約正值冬季、紐約是夏季，紐約白晝較長`,`太陽直射南回歸線，兩地正午太陽高度相同`],answer:`C`,explanation:`【解析】7 月太陽直射北半球（約北緯 20 度附近），北半球是夏季、白晝較長；南半球是冬季、白晝較短。所以南緯的里約熱內盧是冬季，北緯 41 度的紐約是夏季，白晝較長。A季節由南北半球決定，不是東西半球；B把南北半球的季節弄反；D7 月太陽直射北半球，並非南回歸線，兩地正午太陽高度也不同。故選 (C)。`},{qNo:53,stem:`若 2026 年物價上漲幅度與審議時參考的 CPI 年增率相同，領最低月薪的勞工，其薪資的實質購買力大約有什麼變化？`,options:[`約增加 4.9%`,`約增加 3.2%`,`約增加 1.4%`,`約減少 1.4%`],answer:`C`,explanation:`【解析】名目薪資增加約 3.18%，物價上漲 1.76%；實質購買力≈（1＋0.0318）÷（1＋0.0176）− 1≈1.40%，約增加 1.4%（也可用 3.18% − 1.76%≈1.4% 估算）。A是把薪資調幅與物價上漲率相加；B只看名目薪資，忽略物價上漲；D把方向弄反，薪資漲幅大於物價漲幅，購買力是增加。故選 (C)。`},{qNo:54,stem:`2026 年 3 月，17 歲的小芸在某餐廳以計時方式打工，當月正常工作 64 小時。依最低工資的規定，雇主當月至少應給付她多少工資？（不考慮加班費等其他項目）`,options:[`12,544 元`,`12,160 元`,`13,120 元`,`29,500 元`],answer:`A`,explanation:`【解析】2026 年的每小時最低工資是 196 元，64 × 196＝12,544 元。B是用 2025 年的舊時薪 190 元計算；C是誤用 2027 年起才適用的 205 元；D是月薪制的最低工資，計時人員應依每小時最低工資乘以工作時數計算。故選 (A)。`}],verification:[`2026-10-09 依 SPEC_AI2_AI3.md 出題（作者收到真題校準提醒後加難並平衡選項長度）；法條逐條核對全國法規資料庫，史料引文核對維基文庫。`,`2026-10-09 獨立作答：Claude Opus 54/54、Claude Sonnet 54/54 與答案卷一致。難度（同一評分標準）：114 年真題 2.26、本卷 Opus 2.24／Sonnet 2.50。`,`2026-10-09 獨立事實查核：法條（公投法、選罷法、菸害防制法、民法、刑法、少事法、憲訴法、訴願法）、2025 人口與出口統計、日本米價、2026 世界盃與墨西哥城、基本工資、東西德移民數字逐條確認；東京夢華錄、晉書劉毅傳的版本異文以「……」節略避開；日本米價時間、海國圖志序年月、臺北府與茶業因果、訴願送達機關、湄公河國界改寫措辭。`,`2026-10-09 修正後重新獨立作答：Claude Opus 54/54、Claude Sonnet 54/54 與答案卷一致（Sonnet 對第 24 題吸菸年齡的疑慮經查為 2023 年修法後的 20 歲，題目正確）。tools/check_ai_set.py 0 問題。`,`2026-10-09 最終複查（定稿前）：獨立稽核者（Claude Opus）拿答案與解析逐題核對（答案唯一性、計算、事實、附圖、文字），另由 Claude Opus 與 Claude Sonnet 各自重新盲解全卷，答案全部與答案卷一致；稽核指出的解析措辭、誘答與解析不一致、真實事件的相對時間（改為確切年份）與文言異文（以多版本比對後採通行本）均已修正，修正過的題目再由兩個模型重新盲解一致；答案卷未變動。`]},$a={set:`AI-3`,year:903,subject:`國文`,title:`AI-3 國文模擬卷（挑戰）`,difficulty:`挑戰`,note:`由 AI 依會考國文科題型與 SPEC_AI2_AI3.md 編寫（難度：挑戰，以長文、雙文本、文白對讀與推論為主），非會考真題；文言文逐字依維基文庫原文（《孟子·滕文公下》《說苑·善說》《說苑·建本》《夢溪筆談·權智》《列子·說符》《韓非子·外儲說左上》），白話文章、新詩與論說文為原創，時事題材（2026 世界盃擴軍、WMO 2025 年氣候資料、《人工智慧基本法》）已查證，來源見 topics（tools/ai_sets/ai3_chinese.py）。`,topics:[`《孟子·滕文公下》戴盈之章（月攘一雞）: https://zh.wikisource.org/w/index.php?title=%E5%AD%9F%E5%AD%90/%E6%BB%95%E6%96%87%E5%85%AC%E4%B8%8B&action=raw`,`《說苑·善說》惠子善譬: https://zh.wikisource.org/w/index.php?title=%E8%AA%AA%E8%8B%91/%E5%8D%B711&action=raw`,`《夢溪筆談·權智》陳述古辨盜（卷十三）: https://zh.wikisource.org/w/index.php?title=%E5%A4%A2%E6%BA%AA%E7%AD%86%E8%AB%87/%E5%8D%B713&action=raw`,`《列子·說符》邯鄲獻鳩（文白對讀）: https://zh.wikisource.org/w/index.php?title=%E5%88%97%E5%AD%90/%E8%AA%AA%E7%AC%A6%E7%AF%87&action=raw`,`《列子·說符》公子鋤笑鄰人: https://zh.wikisource.org/w/index.php?title=%E5%88%97%E5%AD%90/%E8%AA%AA%E7%AC%A6%E7%AF%87&action=raw`,`《韓非子·外儲說左上》李悝與秦人戰（含篇首綱要「小信成則大信立」句）: https://zh.wikisource.org/w/index.php?title=%E9%9F%93%E9%9D%9E%E5%AD%90/%E5%A4%96%E5%84%B2%E8%AA%AA%E5%B7%A6%E4%B8%8A&action=raw`,`《說苑·建本》屈建論一兔走街: https://zh.wikisource.org/w/index.php?title=%E8%AA%AA%E8%8B%91/%E5%8D%B703&action=raw`,`《說苑·建本》管仲論王者貴天: https://zh.wikisource.org/w/index.php?title=%E8%AA%AA%E8%8B%91/%E5%8D%B703&action=raw`,`2026 FIFA 世界盃：美加墨合辦、16 城市、48 隊（原 32 隊）、104 場（原 64 場）、12 組各 4 隊、前二名與 8 個最佳第三名晉級 32 強、維德角／古拉索／約旦／烏茲別克首度參賽: https://en.wikipedia.org/wiki/2026_FIFA_World_Cup`,`WMO 2026-01-14：2025 年高於 1850–1900 年平均 1.44 °C（±0.13）、八組資料集中 2 組列第二暖 6 組列第三暖、2023–2025 三年平均 1.48 °C、2015–2025 為最暖的 11 年、海面溫度比 2024 年低 0.12 °C、反聖嬰短暫降溫不逆轉長期趨勢、約九成多餘熱量存於海洋: https://wmo.int/news/media-centre/wmo-confirms-2025-was-one-of-warmest-years-record`,`《人工智慧基本法》2025-12-23 立法院三讀，列出含「透明與可解釋」在內的七項原則: https://technews.tw/2025/12/23/artificial-intelligence-basic-law/`],groups:[{from:19,to:21,passage:`閱讀下文，回答問題：
客謂梁王曰：「惠子之言事也善譬，王使無譬，則不能言矣。」王曰：「諾。」明日見，謂惠子曰：「願先生言事則直言耳，無譬也。」惠子曰：「今有人於此而不知彈者，曰：『彈之狀何若？』應曰：『彈之狀如彈。』……」王曰：「未諭也。」「於是更應曰：『彈之狀如弓而以竹為弦。』則知乎？」王曰：「可知矣。」惠子曰：「夫說者固以其所知，諭其所不知，而使人知之。今王曰無譬則不可矣。」王曰：「善。」
——《說苑·善說》
（注：彈：彈弓。諭：明白，使明白。「……」表示節略。「於是更應曰」到「則知乎」仍是惠子所說的話。）`,translation:`有個門客對梁王說：「惠子談論事情時很擅長用比喻，大王如果不准他用比喻，他就說不出話來了。」梁王說：「好。」第二天見到惠子，梁王對他說：「希望先生談論事情時直接說，不要用比喻。」惠子說：「假如這裡有一個不知道彈弓的人，問：『彈弓的樣子像什麼？』回答他：『彈弓的樣子就像彈弓。』他能明白嗎？」梁王說：「不明白。」「於是改口回答：『彈弓的樣子像弓，而用竹子做弦。』那他能知道嗎？」梁王說：「可以知道了。」惠子說：「說明事情的人，本來就是用對方已經知道的事物，來使他明白不知道的事物，從而讓他了解。現在大王說不准用比喻，那是不行的。」梁王說：「好。」`},{from:22,to:23,passage:`閱讀下文，回答問題：
陳述古密直知建州浦城縣日，有人失物，捕得莫知的為盜者。……引群囚立鐘前，自陳不為盜者，摸之則無聲；為盜者摸之則有聲。述古自率同職，禱鐘甚肅，祭訖，……乃陰使人以墨塗鐘，良久，引囚逐一令引手入帷摸之，出乃驗其手，皆有墨。唯有一囚無墨，訊之，遂承為盜。蓋恐鐘有聲，不敢摸也。
——沈括《夢溪筆談·權智》

（一）外婆的針線盒是一個生鏽的餅乾鐵盒，蓋子上印著早已停產的牌子。小時候我以為裡面裝的是餅乾，打開才發現是各色的線、幾顆不成對的鈕扣，和一枚磨得發亮的頂針。

（三）上了國中，我有了第一支手機。用了兩年，電池撐不過半天，我理所當然地想換新的。走進門市，店員翻過手機看了一眼：「這款電池是黏死的，換電池的錢都快可以買新機了。」我付錢時一點也不心疼，反正大家都是這樣。

關於本文，下列敘述何者最恰當？`,options:[`管仲認為君主應敬畏上天、按時祭祀，國家才能安定強盛`,`桓公仰而視天，表示他已經明白管仲所說的「天」就是百姓`,`管仲認為只要百姓不反對，君主就能使國家強大`,`桓公把「天」理解成頭上的天空，管仲藉此指出君主真正該重視的是百姓`],answer:`D`,explanation:`【解析】管仲說「貴天」，桓公卻抬頭看天，可見他以為是天空；管仲隨即說明「非謂蒼蒼莽莽之天也」，而是「君人者以百姓為天」，百姓的向背決定國家的安危存亡。（A）管仲明說所指的不是天空，文中也沒有談祭祀；（B）桓公抬頭看天，正顯示他誤解了，管仲才進一步解釋；（C）「與之則安，輔之則強」：百姓擁護只能使國家安定，要百姓輔助才能強大；百姓不反對，只是免於「非之則危」，推不出強大。故選 (D)。`},{qNo:18,stem:`甲：「讀書，是為了讓自己不被別人的話輕易說服。」
