關於甲、乙兩句話的關係，下列敘述何者最恰當？`,options:[`甲主張讀書使人固執己見，乙主張讀書使人順從他人，兩者對立`,`兩句都認為讀書的目的，在於學會說服別人`,`甲強調不輕信，乙強調肯接受更好的道理，兩者並不矛盾`,`甲重視知識的累積，乙重視口才的訓練`],answer:`C`,explanation:`【解析】甲的關鍵在「輕易」：不輕率地被說服；乙的關鍵在「更好的」：遇到更好的道理願意改變。能分辨哪些話不該信、哪些道理該接受，都是判斷力，兩句是互補的兩面。（A）甲反對的是「輕易」被說服，不是固執；乙接受的是「更好的道理」，不是順從他人；（B）兩句談的都是自己被說服與否，不是說服別人；（D）兩句都沒有談口才。故選 (C)。`},{qNo:19,stem:`關於本文，下列敘述何者最恰當？`,options:[`梁王要求惠子「直言」，是因為他平時總是聽不懂惠子所用的比喻`,`惠子不直接反駁，而是設例讓梁王自己說出「未諭」「可知」，再歸結道理`,`惠子以「彈之狀如彈」為例，說明比喻必須生動有趣才能打動人`,`梁王最後同意惠子用比喻，但要求他只能用梁王熟悉的事物作比`],answer:`B`,explanation:`【解析】惠子先假設兩種回答，讓梁王親口說出「未諭也」「可知矣」，再歸結「說者固以其所知，諭其所不知」，使梁王在不知不覺中承認比喻的必要。（A）梁王是聽了門客的建議才要求「無譬」，文中沒有說他聽不懂；（C）「彈之狀如彈」是反例，說明以未知解釋未知無效，重點不在生動有趣；（D）梁王只說「善」，文中沒有附加任何條件。故選 (B)。`},{qNo:20,stem:`依照惠子「以其所知，諭其所不知」的說法，下列哪一種說明方式最符合他的主張？`,options:[`向不懂網路的長輩說：「雲端就是雲端，用久了你就懂了。」`,`向小學生解釋心臟時說：「心臟就像一具不停運轉的離心式泵浦。」`,`向從沒看過雪的小朋友說：「雪摸起來像冷凍庫裡刮下來的冰霜，但更鬆軟。」`,`向剛來臺灣的外國朋友介紹臺語時，連續說出一串臺語詞彙示範`],answer:`C`,explanation:`【解析】惠子的方法是用「對方已知」的事物說明「對方未知」的事物。冷凍庫的冰霜是小朋友熟悉的，用來說明沒見過的雪，最符合。（A）「雲端就是雲端」正像「彈之狀如彈」，用未知解釋未知，對方仍不明白；（B）雖然用了比喻，但「離心式泵浦」是小學生不知道的事物，違反「以其所知」的原則，是最容易誤選的選項；（D）用對方聽不懂的臺語來介紹臺語，同樣是以未知說明未知。故選 (C)。`},{qNo:21,stem:`綜觀全文，門客的建議與事情最後的結果，兩者的關係最恰當的說明是哪一項？`,options:[`門客說惠子「善譬」是在稱讚他，希望梁王多聽惠子用比喻說話`,`門客想藉禁止比喻讓惠子無法發言，結果惠子反而藉此證明比喻不可廢`,`梁王接受門客的建議後，惠子在梁王面前從此不再使用比喻`,`門客與惠子事先串通好，一搭一唱，藉此讓梁王明白比喻的重要`],answer:`B`,explanation:`【解析】門客說「王使無譬，則不能言矣」，用意是讓梁王下令禁止比喻，使惠子說不出話；惠子卻用例子說明說理本來就要「以其所知，諭其所不知」，梁王最後說「善」，禁令反而成了惠子證明比喻價值的機會。（A）門客雖說惠子「善譬」，卻建議梁王禁止，可見不是要梁王多聽；（C）梁王最後說「善」，接受了惠子的說法，並非禁絕比喻；（D）文中沒有任何串通的線索。故選 (B)。`},{qNo:22,stem:`陳述古「自率同職，禱鐘甚肅」，最主要的用意是什麼？`,options:[`祈求神鐘保佑，希望鐘能在盜賊摸到時真的發出聲音`,`藉祭祀拖延時間，等待盜賊良心發現而主動自首`,`向同僚示範祭祀的禮儀，表示對地方神明的尊重`,`讓囚犯相信這口鐘真的靈驗，使心虛的盜賊不敢伸手去摸`],answer:`D`,explanation:`【解析】鐘能辨盜是陳述古編出來騙囚犯的說法，他親自帶著同僚莊重地祈禱，是要讓囚犯信以為真；盜賊相信鐘會響，才會「恐鐘有聲，不敢摸」，手上因此沒有墨而被認出。（A）陳述古暗中塗墨，靠的是檢查手上的墨，並不期待鐘真的會響；（B）盜賊是檢驗後「訊之，遂承為盜」，不是祭祀時主動自首；（C）祭祀是演給囚犯看的計策，不是為了示範禮儀。故選 (D)。`},{qNo:23,stem:`假設那名真正的盜賊事先知道了「鐘上塗墨」的祕密，下列哪一種做法，最能讓他的檢驗結果和沒有偷竊的人相同，因而不被認出？`,options:[`和其他人一樣伸手摸鐘，讓手上沾到墨`,`不去摸鐘，並把手藏在袖子裡`,`摸鐘時用力敲打，讓鐘發出聲響`,`摸完鐘後，趁沒人注意立刻把手上的墨擦乾淨`],answer:`A`,explanation:`【解析】陳述古辨認的依據是「手上有沒有墨」：沒偷的人放心去摸，手上都有墨；盜賊怕鐘響不敢摸，手上無墨而被識破。知道祕密的人只要照常摸鐘、讓手上沾墨，檢驗結果就與其他人相同。（B）不摸鐘，手上就沒有墨，正是被認出的原因；（C）依照陳述古事先宣稱的規則，鐘響代表是盜賊，反而自曝身分；（D）擦掉墨，出帳幕時手上無墨，結果和原本那名盜賊一樣，同樣會被認出。故選 (A)。`},{qNo:24,stem:`關於甲文，下列敘述何者最恰當？`,options:[`百姓獻鳩是出於對簡子的敬愛，並不在乎賞賜，門客誤會了百姓`,`百姓預期有賞而爭相捕鳩，許多鳩因此死去，好意反而造成傷害`,`門客認為放生是迷信，建議簡子改以賞賜百姓來表示恩德`,`門客建議簡子停止賞賜，改由自己派人捕鳩放生`],answer:`B`,explanation:`【解析】門客說「民知君之欲放之，故競而捕之，死者衆矣」：百姓知道簡子要放生並會厚賞，就爭著捕鳩，捕捉時死了很多；放生的恩德抵不過造成的過失。（A）簡子對獻鳩的百姓「厚賞之」，門客又點出百姓是「知君之欲放之」才「競而捕之」，可見百姓爭相捕鳩與迎合簡子、獲得賞賜有關，並非單純出於敬愛；（C）門客沒有否定放生的心意，而是建議「禁民勿捕」，也沒有主張改以賞賜表示恩德；（D）門客的建議是「禁民勿捕」，不是由簡子自己捕鳩。故選 (B)。`},{qNo:25,stem:`甲文「捕而放之，恩過不相補矣」的道理，最接近乙文中的哪一句話？`,options:[`第一個月，回收量大增`,`集滿點數就能兌換文具`,`福利社的瓶裝飲料也賣得特別好`,`學校原本想減少垃圾，結果製造了更多寶特瓶`],answer:`D`,explanation:`【解析】「恩過不相補」是說放生的恩德抵不過捕捉造成的傷害，好意反而帶來更大的害處；乙文「原本想減少垃圾，結果製造了更多寶特瓶」，同樣是本意良好、結果卻得不償失。（A）回收量增加是表面上的成效，相當於簡子收到很多鳩，還沒有說出害處大於好處；（B）只是說明獎勵辦法，相當於甲文的「厚賞之」，沒有說出結果；（C）是飲料多賣的現象，可作為瓶子變多的線索，但沒有表達「本意與結果相反、得不償失」的道理。故選 (D)。`},{qNo:26,stem:`若依照甲文門客「君如欲生之，不若禁民勿捕」的思路，乙文的學校最適合採取下列哪一種改進做法？`,options:[`提高每個寶特瓶可以兌換的點數，吸引更多同學參加`,`直接以減少寶特瓶使用為目標，不再以瓶子數量換點數`,`規定每人每天最多只能用五個寶特瓶換點數，避免有人大量囤積`,`請衛生股長嚴格檢查交來的瓶子是否清洗乾淨`],answer:`B`,explanation:`【解析】門客的思路是：既然真正的目的是讓鳩活著，就直接從源頭禁止捕捉，而不是獎勵「捕而放之」的結果。套用到學校，就是直接針對減少寶特瓶使用，停止獎勵瓶子數量。（A）提高獎勵會讓製造瓶子的誘因更強，問題更嚴重；（C）設上限只能減輕問題，仍是在獎勵「瓶子」這個結果，沒有回到源頭；（D）檢查清洗與否與反向誘因無關。故選 (B)。`},{qNo:27,stem:`第三段寫「我付錢時一點也不心疼，反正大家都是這樣」，在全文中主要的作用是什麼？`,options:[`呈現「我」原本習以為常的「壞了就換」心態，與後文的轉變形成對照`,`呈現「我」從小受外婆影響、懂得珍惜物品，只是迫於無奈才換新`,`藉店員的話批評手機業者，這是全文主要批判的對象`,`說明「我」當時其實已察覺換新並不妥當，只是不得不隨波逐流`],answer:`A`,explanation:`【解析】第三段寫「我」理所當然換新、毫不心疼，代表「壞了就換」的習慣；第四段起因外套而「停下來」，後來開始注意修理、把壞掉的舊手機送去檢查，前後形成對照，凸顯心態的轉變。（B）第二段「我」還嫌補過的褲子土氣、偷偷丟掉，第三段又「一點也不心疼」，看不出珍惜物品，也不是迫於無奈；（C）店員的話只交代換新的原因，全文重心在「修」的意義，並非批判業者；（D）「理所當然」「一點也不心疼」表示當時並未察覺不妥，轉變發生在後文。故選 (A)。`},{qNo:28,stem:`第五段「她把我會長大這件事，也一起縫了進去」，最能說明作者的哪一種體會？`,options:[`外婆預先把外套改大，好讓「我」長大以後還能穿`,`外婆的縫法高明，如今已很少人會，作者為這門傳統手藝的失傳而惋惜`,`外婆的修改包含了對「我」成長的預想與關愛，意義遠超過修好一件衣服`,`「我」穿了三年才發現兩公分，深深自責長期忽略外婆的心意`],answer:`C`,explanation:`【解析】老闆娘說外婆「故意多留了兩公分，等你長高，可以再放出來」，作者由此體會：外婆改衣時已想到孫子將來會長高，縫進去的是對「我」成長的期待與照顧。（A）外婆是把外套「改短」，只在袖口內側藏了兩公分，並不是把外套改大；（B）「很少人會了」是老闆娘的話，第五段的體會在外婆的心意，不在手藝失傳；（D）「說不出話」是深受感動，文中沒有自責的描寫。故選 (C)。`},{qNo:29,stem:`第七段作者對「修理不划算」這個說法，抱持什麼態度？`,options:[`承認它有一定的道理，但認為修理的價值不只在於金錢與時間`,`完全否定這個說法，認為它只是現代人不想動手修理的藉口`,`贊同修理確實不划算，只是因為懷念外婆才勉強修理`,`認為修理的價值主要在於省錢，只是一般人沒有察覺`],answer:`A`,explanation:`【解析】作者先說「這話我不能說它錯」（承認），再以「可是我常常想」轉折，指出被修過的東西承載了人的心意，價值不只是商品的價格。（B）作者明說「不能說它錯」，並未完全否定；（C）作者以「可是」提出另一種價值，並非單純贊同，也沒有說是勉強；（D）作者強調的是記憶與心意，不是省錢。故選 (A)。`},{qNo:30,stem:`第八段的手機最後沒有修好，作者仍然寫下這段經歷，最主要的用意是什麼？`,options:[`說明修理有時無法成功，因此第七段的看法需要修正`,`以手機修不好反襯外套能修好，強調衣物比手機等科技產品更值得修理`,`證明願意拆開檢查的小店，比原廠門市更專業可靠`,`顯示修理的意義不只在於修好物品，也在於保存與物品相連的記憶`],answer:`D`,explanation:`【解析】手機修不好，但照片救了回來，「外婆在陽臺上穿針」的畫面重新出現，呼應第七段「它記得是誰……」：修的過程保存了人與物之間的記憶，這正是作者認為修理的另一層價值。（A）這段經歷正好印證第七段的看法，並不是要修正它；（B）作者沒有比較衣物與科技產品哪一種更值得修；（C）文中沒有比較小店與原廠的專業程度。故選 (D)。`},{qNo:31,stem:`關於本文的結構與寫作手法，下列敘述何者最恰當？`,options:[`第六段列舉腳踏車店阿伯與老工友，說明修理是老一輩才有的技能`,`第八段照片中外婆穿針的畫面，呼應第一段的針線盒，表示「我」決定學習縫紉`,`結尾「剛剛好」是說外套經過修補，已經和新的一模一樣`,`結尾把袖口放出兩公分，呼應第四段外婆預留的用心，表示「我」接續了外婆的心意`],answer:`D`,explanation:`【解析】第四段老闆娘說外婆預留兩公分「等你長高，可以再放出來」，結尾「我」親手把袖口放出兩公分，「剛剛好」表示自己已長到外婆預想的身高，也接續完成了外婆的心意，前後呼應。（A）第六段還寫到有些國家討論讓人自己修理，作者自己也開始留意修理，並非說修理只屬於老一輩；（B）照片確實讓人想起外婆的針線，但文中沒有「我」決定學縫紉的情節，屬於過度推論；（C）「剛剛好」指的是長度合身，不是外套變得像新的。故選 (D)。`},{qNo:32,stem:`關於甲、乙兩文對 2026 年世界盃擴軍的看法，下列敘述何者最恰當？`,options:[`甲著眼於參與機會的擴大，乙則著眼於賽事品質、球員負荷與環境代價`,`甲以首次參賽的隊伍為例支持擴軍，乙則認為這些隊伍實力不足，拉低了比賽水準`,`乙文全盤否定擴軍，認為擴軍對任何國家都沒有好處`,`兩文都同意擴軍使小組賽的懸念降低，只是對此評價不同`],answer:`A`,explanation:`【解析】甲文以首次參賽的國家與孩子的夢想，支持讓更多國家參與；乙文雖承認「讓更多國家參賽固然可喜」，但強調場次增加、懸念降低與碳排放等代價。（B）乙文懸念降低的理由是晉級名額變多，並沒有批評首次參賽隊伍的實力；（C）乙文說「讓更多國家參賽固然可喜」，並非全盤否定；（D）「懸念降低」只出現在乙文，甲文沒有提到。故選 (A)。`},{qNo:33,stem:`乙文說「小組賽的懸念因此降低」。根據文中的賽制資料，下列哪一項推算最能支持這個說法？（擴軍前的賽制：32 隊分成 8 組，每組前兩名晉級 16 強）`,options:[`擴軍後比賽多了 40 場，所以每一場小組賽都變得更加重要`,`晉級比例由 16／32＝1／2 提高到 32／48＝2／3`,`擴軍前後每組都是 4 隊，所以小組賽的競爭程度完全相同`,`擴軍後分成 12 組，每組只有第一名能夠晉級，競爭反而更激烈`],answer:`B`,explanation:`【解析】16 ÷ 32 = 1/2，32 ÷ 48 = 2/3。晉級比例提高，連部分小組第三名也能晉級，被淘汰的壓力變小，正可支持「懸念降低」。（A）場次變多並不代表每場更重要，推論與乙文的說法方向相反；（C）每組隊數雖然相同，但晉級名額增加（多了 8 個第三名），競爭程度並不相同；（D）與文中「各組前兩名加上 8 個成績最好的第三名」的規定不符。故選 (B)。`},{qNo:34,stem:`若要檢驗甲文「擴軍讓更多國家有機會參與」的說法，下列哪一項資料最直接相關？`,options:[`本屆決賽在全球各地的電視與網路收視人數`,`本屆首次晉級的隊伍數，與各洲名額在擴軍前後的變化`,`本屆每場比賽的平均進球數與擴軍前的比較`,`各主辦城市球場的座位數與門票銷售情形`],answer:`B`,explanation:`【解析】要檢驗「更多國家有機會參與」，最直接的證據是有多少新面孔晉級、各洲名額是否增加。（A）收視人數反映關注程度，不是參賽國家的多寡；（C）進球數與比賽品質有關，較接近乙文的議題；（D）座位數與參賽國家數無關。故選 (B)。`},{qNo:35,stem:`根據資料，下列敘述何者正確？`,options:[`八組資料集中，沒有任何一組把 2025 年列為有紀錄以來最暖的一年`,`八組資料集一致認為，2025 年是有紀錄以來第三暖的一年`,`2023～2025 年的三年平均升溫幅度，低於 2025 年單一年的升溫幅度`,`2015 年以前，曾有某一年比 2015～2025 年中的每一年都暖`],answer:`A`,explanation:`【解析】2 組列第二暖、6 組列第三暖，2 + 6 = 8，所以沒有一組把 2025 年列為最暖。（B）有 2 組列為第二暖，看法並不一致；（C）三年平均 1.48°C 高於 2025 年的 1.44°C；（D）2015～2025 年是有紀錄以來最暖的 11 年，表示更早的任何一年都比這 11 年冷。故選 (A)。`},{qNo:36,stem:`有人看了資料後說：「2025 年的海面溫度比 2024 年低，可見全球暖化已經停止了。」根據資料，下列哪一項反駁最恰當？`,options:[`單一年份的下降可能是反聖嬰等短期因素所致，且 2015～2025 年仍是最暖的 11 年`,`海面溫度與全球暖化無關，判斷暖化只應看陸地的溫度`,`0.12°C 的差距小於誤差範圍，所以 2025 年的海面其實比 2024 年更暖`,`2025 年的升溫幅度已超過 1.5°C，暖化其實正在加速`],answer:`A`,explanation:`【解析】WMO 明白指出反聖嬰的短暫降溫「不會逆轉長期暖化的趨勢」，且 2015～2025 年這 11 年都是有紀錄以來最暖的年份，用一年的下降推論暖化停止並不成立。（B）資料指出多餘熱量約九成儲存在海洋，海洋正是暖化的重要指標；（C）誤差只有 ±0.03°C，0.12°C 的差距大於誤差，而且即使在誤差內也不能推出「更暖」；（D）資料的最佳估計是 1.44°C，低於 1.5°C，不能說「已超過 1.5°C」；而且單一年份的數值也無法說明暖化正在加速。故選 (A)。`},{qNo:37,stem:`資料中「1.44°C（誤差 ±0.13°C）」的意思，下列理解何者最恰當？`,options:[`2025 年世界各地的氣溫，都比 1850～1900 年高出 1.44°C`,`2025 年的全球平均地表溫度，比 2024 年高出 1.44°C`,`2025 年的全球氣溫每天都在 1.31°C 到 1.57°C 之間變動`,`最佳估計是 1.44°C，實際值可能落在約 1.31°C 到 1.57°C 之間`],answer:`D`,explanation:`【解析】1.44°C 是整合資料後的估計值，±0.13°C 表示估計的不確定範圍：1.44 − 0.13 = 1.31，1.44 + 0.13 = 1.57。（A）這是「全球平均」，不代表每個地方都升高同樣的幅度；（B）比較的基準是 1850～1900 年的平均，不是 2024 年；（C）誤差範圍是估計的不確定性，不是每天氣溫的變動。故選 (D)。`},{qNo:38,stem:`關於這首詩第二段與第三段的關係，下列敘述何者最恰當？`,options:[`先寫海的慷慨，再寫海的吝嗇，表達詩人對大海反覆無常的不滿`,`第二段寫人們珍惜海的禮物，第三段寫人們因失去而怨恨海`,`兩段都在描寫人們在海邊撿拾東西的樂趣`,`先寫人們的誤解，再藉漲潮加以翻轉，指出那些東西只是暫時交託`],answer:`D`,explanation:`【解析】第二段的「以為」透露那只是人們的想法；第三段以「直到……才明白」翻轉這個想法：東西被帶走，並不是海反悔，而是本來就只是「暫時」「保管」。（A）「輕輕帶走」「保管」語氣溫和，詩中沒有不滿；（B）第二段的人們「以為那是海不要的」，是誤解而不是珍惜禮物；第三段是領悟，沒有怨恨；（C）第三段寫的是領悟，不是撿拾的樂趣。故選 (D)。`},{qNo:39,stem:`若用這首詩來詮釋人生，下列哪一種體會最貼切？`,options:[`擁有的事物都只是暫時保管，應該珍惜，也不必執著占有`,`我們擁有的一切終將失去，所以不必珍惜`,`別人丟棄不要的東西，往往才是最有價值、最值得珍藏的`,`失去的東西就像潮水一樣，終究都會再回到我們身邊`],answer:`A`,explanation:`【解析】海留下的東西會在漲潮時「又被輕輕帶走」，詩人明白那只是「暫時」交給我們「保管」：保管意味著要好好對待，暫時意味著終將歸還，寄寓的是珍惜而不占有的態度。（B）前半「終將失去」與詩意相合，但「保管」含有珍惜、負責的意思，推出「不必珍惜」正好相反；（C）「海不要的」正是詩中被否定的誤解；（D）詩寫的是東西被帶走，方向相反。故選 (A)。`},{qNo:40,stem:`作者在第二段指出「全面禁止」最主要的缺點是什麼？`,options:[`使用 AI 會讓學生習慣抄答案，不再自己思考`,`全面禁止會讓學生失去學習使用新科技的寶貴機會`,`難以查證是否使用了 AI，反而讓守規矩的學生吃虧`,`老師必須花更多時間仔細批改每一份作業`],answer:`C`,explanation:`【解析】作者先承認禁止派的擔心「有道理」，再以「但」指出問題：禁令難以執行，老師無法確認，結果「守規矩的學生吃虧」。（A）這是主張禁止的老師提出的理由，作者並不認為它是禁止的缺點，是最容易誤選的選項；（B）文中沒有提到；（D）文中沒有提到批改時間。故選 (C)。`},{qNo:41,stem:`第五段在論證上採取了什麼方式？`,options:[`承認揭露制度無效，轉而支持全面禁止`,`預先回應可能的質疑，並重新界定規則的目的，以支持自己的主張`,`以統計數據說明說謊的學生只占少數`,`引用《人工智慧基本法》的條文，證明揭露 AI 使用是學生的法律義務`],answer:`B`,explanation:`【解析】作者先以「當然……也可能有人說謊」設想反方的質疑，再說「規則的目的不是讓違規變得不可能，而是讓誠實的人有路可走」，把評價規則的標準重新界定，因此揭露制度即使不完美仍值得採行。（A）作者仍主張揭露，並未改變立場；（C）文中沒有任何數據；（D）第一段只提到基本法有「透明與可解釋」原則，用來引出話題，並未說它規定學生必須揭露。故選 (B)。`},{qNo:42,stem:`下列哪一種情況，最能「削弱」作者在第四段提出的第二個好處？`,options:[`使用 AI 並揭露的學生，作業成績明顯進步`,`《人工智慧基本法》另有條文，規範開發 AI 的企業應負的責任`,`多數學生只套用固定格式的揭露說明，並未真的回頭檢查 AI 的答案`,`老師發現學生揭露的使用紀錄，確實有助於了解他們寫作業時的思考過程`],answer:`C`,explanation:`【解析】第二個好處的前提是：學生寫揭露說明時「必須回頭檢查 AI 的答案」。若學生只是套用固定格式、沒有真正檢查，這個好處就不成立。（A）成績進步與「揭露促使思考」沒有直接關係，無法削弱；（B）企業責任與學生作業的揭露無關；（D）這是支持第一個好處的情況，是加強而不是削弱。故選 (C)。`}],verification:[`2026-10-09 第一版經兩個模型盲解答案一致，但以 114 年真題校準後難度低於真題（真題 Opus 2.67；本卷 2.43），依 SPEC_AI2_AI3.md 重寫多數單題與題組題，並改正「正解常是最長選項」的線索。`,`2026-10-09 重寫後兩輪獨立作答答案皆一致；依「各版本有出入就避開」原則處理文言文：第 17 題（說苑公乘不仁，維基文庫有「舉曰」「公勝」等疑似訛字）整題換成說苑管仲「王者何貴」；第 5 題（韓非子李悝「其車／其軍」）、第 19–21 題（說苑惠子「則諭乎」）、第 22–23 題（夢溪筆談「以帷帷之／圍之」「辯／辨」）以「……」節略避開異文並改寫相關選項；第 14 題歧義句改為「他借了我一本書」。`,`2026-10-09 修正後重新獨立作答：Claude Opus 42/42、Claude Sonnet 42/42 與答案卷一致，0 題有異議。難度（同一評分標準）：114 年真題 2.67、本卷約 2.5。`,`2026-10-09 所有文言引文（每段「……」之間）以程式比對為維基文庫原文的連續子字串；時事（2026 世界盃、WMO 2025、人工智慧基本法）以網路來源確認。tools/check_ai_set.py 0 問題。`,`2026-10-09 最終複查（定稿前）：獨立稽核者（Claude Opus）拿答案與解析逐題核對（答案唯一性、計算、事實、附圖、文字），另由 Claude Opus 與 Claude Sonnet 各自重新盲解全卷，答案全部與答案卷一致；稽核指出的解析措辭、誘答與解析不一致、真實事件的相對時間（改為確切年份）與文言異文（以多版本比對後採通行本）均已修正，修正過的題目再由兩個模型重新盲解一致；答案卷未變動。`]},eo={set:`AI-3`,year:903,subject:`英文`,title:`AI-3 英語（閱讀）模擬卷（挑戰）`,difficulty:`挑戰`,note:`由 AI 依會考英語科架構編寫，難度高於會考：長篇（300–500 字）跨段推論、作者觀點與語氣、段落功能、指涉、「何者不正確／無法推知」、雙文本與表格整合、把文章的規則套用到新情況；誘答多為「細節對但人物或時間錯」「只對一半」「推論過頭」。以 2025–2026 年真實事件為素材；非會考真題。`,topics:[`溫布頓 2025 全面改用電子司線 Hawk-Eye Live（18 面球場、取消挑戰制度、約 147 年來首次沒有司線員）：https://africa.espn.com/tennis/story/_/id/41695328/wimbledon-replace-line-judges-ai-technology-2025`,`溫布頓 Kartal 對 Pavlyuchenkova 第四輪中央球場系統被誤關一局、重打該分、道歉、歸咎人為疏失並取消手動關閉功能：https://www.skysports.com/tennis/news/32498/13393402/wimbledon-officials-apologise-to-players-after-line-calling-technology-turned-off-in-malfunction-on-centre-court`,`Colossal Biosciences 2025 年 4 月宣布「恐狼」幼崽 Romulus、Remus、Khaleesi（13,000 年牙齒、72,000 年耳骨、14 個基因 20 處編輯、狗代孕、複製紅狼；灰狼為最近親屬是公司說法）：https://colossal.com/the-return-of-the-dire-wolf/`,`恐狼爭議（科學家批評仍是灰狼、無法向親代學習；公司稱目標是填補生態角色；滅絕逾一萬年）：https://www.npr.org/2025/04/08/nx-s1-5355686/dire-wolf-extinct-colossal-biosciences`,`澳洲 16 歲以下社群媒體禁令 2025-12-10 生效（罰款上限 4,950 萬澳幣、WhatsApp 與 Roblox 不在名單、AI 臉部年齡估計或上傳證件）：https://www.khaleejtimes.com/world/australia-bans-under-16s-from-social-media`,`澳洲禁令後續：2026 年 3 月（約三個月後）eSafety 檢查約 70% 原有帳號兒童仍活躍、2026 年 6 月政府擬將罰款上限加倍、部長稱 "not seeing improvements"：https://www.euronews.com/next/2026/06/29/fines-doubled-as-teens-outsmart-australias-world-first-social-media-ban`,`修理咖啡館（第一家 2009 年阿姆斯特丹，2016 年全球已逾千家）：https://en.wikipedia.org/wiki/Repair_Caf%C3%A9`,`保溫瓶裡的湯、植物聽音樂的科展報告與老師評語、「天分」一詞的迷思：虛構情境`],groups:[{from:16,to:19,passage:`[Text A] Wimbledon Says Goodbye to Line Judges
For almost 150 years, line judges were as much a part of Wimbledon as its grass courts and its rule that players must wear white. Dressed in smart uniforms, they stood around the court and shouted "Out!" or "Fault!" whenever a ball landed outside the lines. In 2025, their voices fell silent. For the first time, line calls on all 18 courts were made by a computer system called Hawk-Eye Live, which follows the ball with cameras and then plays a recorded voice to announce the call.
Supporters of the change say machines are simply more accurate. A serve can travel at more than 200 kilometers an hour, and even the sharpest human eye can miss by a few millimeters. With the new system, players no longer need to "challenge" a call and wait for a replay.
The system, however, did not have a perfect first year. During a fourth-round match on Centre Court between Britain's Sonay Kartal and Russia's Anastasia Pavlyuchenkova, a ball that was clearly out went uncalled, and the umpire ordered the point to be played again. It later turned out that the system had been switched off by mistake on part of the court for a whole game, and nobody had told the umpire. The club apologized to both players. It blamed "human error," not the technology, and changed its rules so that operators could no longer turn the system off by hand.
The incident left an uncomfortable question. If the people running the machine can make mistakes, has human error really been removed—or has it just been moved somewhere the players can't see it?

[Text B] Readers' Comments
TennisDad_88: My daughter plays in a junior league, and the arguments over line calls never end. Kids cry, parents shout. If a machine made the calls, half of those fights would never start. Well done, Wimbledon.
Grace L.: I've been going to Wimbledon every summer since 1990. The courts felt strangely empty in 2025. Those men and women in uniform were part of the show—part of the history. Accuracy matters, but tennis is not just a math problem.
Ryo_K: Everyone is missing the point. The machine didn't fail; the people did. That's actually an argument for MORE technology, not less. Take away the off switch completely and let the system do its job.
* umpire 主審；serve 發球；accurate 準確的`,translation:`【文本 A】溫布頓向司線員說再見
將近 150 年來，司線員和草地球場、選手必須穿白色服裝的規定一樣，都是溫布頓的一部分。他們穿著體面的制服站在球場四周，只要球落在線外，就大喊「出界！」或「發球失誤！」。2025 年，他們的聲音消失了。所有 18 面球場的判線第一次全部由一套叫做 Hawk-Eye Live（鷹眼即時系統）的電腦系統負責：它用攝影機追蹤球，再播放預先錄好的聲音宣布判決。
支持這項改變的人說，機器就是比較準確。發球的球速可以超過每小時 200 公里，即使是最敏銳的人眼也可能誤差幾公釐。有了新系統，選手不再需要「挑戰」判決並等待重播。
然而，這套系統的第一年並不完美。在中央球場一場英國選手 Sonay Kartal 對俄羅斯選手 Anastasia Pavlyuchenkova 的第四輪比賽中，一顆明顯出界的球沒有被判出界，主審下令這一分重打。後來才發現，系統在球場的一部分被誤關了一整局，而且沒有人告訴主審。主辦的俱樂部向兩位選手道歉，把原因歸咎於「人為疏失」而不是科技，並修改規定，讓操作人員再也不能手動關閉系統。
這起事件留下了一個令人不安的問題：如果操作機器的人會犯錯，人為的錯誤真的被消除了嗎？還是只是被移到了選手看不到的地方？

【文本 B】讀者留言
TennisDad_88：我女兒參加青少年聯賽，關於判線的爭吵永遠吵不完，小孩哭、家長吼。如果由機器判，這些爭吵有一半根本不會發生。溫布頓做得好。
Grace L.：從 1990 年起我每年夏天都去溫布頓。2025 年的球場感覺空蕩蕩的，那些穿制服的男男女女是表演的一部分，也是歷史的一部分。準確很重要，但網球不只是一道數學題。
Ryo_K：大家都沒抓到重點。失敗的不是機器，是人。這其實是支持「更多」科技、而不是更少的理由。把關閉開關整個拿掉，讓系統好好做它的工作。`},{from:20,to:23,passage:`In April 2025, an American company called Colossal Biosciences made an announcement that sounded like something out of a movie: it had brought back the dire wolf, a large wolf that died out more than 10,000 years ago. Photos of three fluffy white pups—two males named Romulus and Remus, and a female named Khaleesi—quickly spread around the world.
How was it done? The company's scientists studied ancient DNA from two fossils: a tooth about 13,000 years old and a piece of ear bone about 72,000 years old. They compared it with the DNA of the gray wolf, which the company calls the dire wolf's closest living relative. Then, instead of putting ancient DNA into the animals, they made 20 changes to 14 genes in gray wolf cells, so that the pups would have some dire wolf features, such as a white coat, a larger head, and stronger shoulders. Dogs acted as mothers and carried the pups until they were born.
Not everyone was impressed. Many scientists pointed out that the pups are still gray wolves, just with a few changes. You cannot bring back a species, they argued, simply by making one animal look like another. Others noted that even if the pups look like dire wolves, there are no dire wolf parents to teach them how to live like one.
Colossal answered that it had never tried to make an exact copy. Its goal, the company said, was to create animals that could play the role dire wolves once played in nature.
So, are they dire wolves or not? The answer may depend on what we mean by "species." If a species is defined by how an animal looks, perhaps the answer is yes. If it is defined by its full set of genes, or by the way it lives and the knowledge that passes from parents to young, the answer is clearly no.
Perhaps the more important question is not whether we can bring extinct animals back, but whether we should spend so much money and attention doing so while many living species are disappearing today. In 2025, the company also said it had already used similar tools to make copies of the red wolf, a wolf so rare that it is in serious danger of dying out. Whether this kind of work can really help animals like that will tell us more about the value of the project than any photo of a cute white pup.
* dire wolf 恐狼；fossil 化石；species 物種；extinct 絕種的；gene 基因`,translation:`2025 年 4 月，美國一家叫 Colossal Biosciences 的公司發布了一則像是電影情節的消息：它讓恐狼復活了。恐狼是一種在一萬多年前就滅絕的大型狼。三隻毛茸茸的白色幼崽——兩隻雄的叫 Romulus 和 Remus，一隻雌的叫 Khaleesi——的照片很快傳遍全世界。
這是怎麼做到的？公司的科學家研究了兩件化石中的古代 DNA：一顆約 13,000 年前的牙齒和一塊約 72,000 年前的耳骨。他們把它和灰狼的 DNA 做比較——這家公司稱灰狼是恐狼現存最近的親戚。接著，他們沒有把古代 DNA 放進動物體內，而是在灰狼細胞的 14 個基因上做了 20 處修改，讓幼崽具有一些恐狼的特徵，例如白色的毛、較大的頭和較強壯的肩膀。由狗擔任代理孕母，懷著幼崽直到牠們出生。
並不是每個人都買帳。許多科學家指出，這些幼崽仍然是灰狼，只是做了一些修改。他們認為，光是讓一種動物長得像另一種動物，並不能讓一個物種復活。另有人指出，即使幼崽長得像恐狼，也沒有恐狼父母可以教牠們如何像恐狼一樣生活。
Colossal 回應說，它從來沒有打算做出一模一樣的複製品。公司表示，它的目標是創造出能在自然界中扮演恐狼過去角色的動物。
那麼，牠們到底是不是恐狼？答案可能取決於我們所說的「物種」是什麼意思。如果物種是由動物的外表來定義，答案或許是肯定的；如果是由全部的基因，或由牠的生活方式以及親代傳給下一代的知識來定義，答案顯然是否定的。
或許更重要的問題不是我們「能不能」讓絕種動物復活，而是在許多現存物種正在消失的今天，我們「該不該」花這麼多金錢和注意力去做這件事。2025 年，這家公司也說，它已經用類似的技術複製出紅狼——一種稀少到面臨嚴重滅絕危機的狼。這類工作是否真的能幫助這樣的動物，比任何一張可愛白色幼崽的照片，更能告訴我們這個計畫的價值。`},{from:24,to:28,passage:`The first time I walked into the repair café near my school, I was carrying a broken desk lamp and very low expectations. I was sure someone would tell me to throw it away and buy a new one. __24__, a white-haired man named Mr. Ho took it from me, turned it over, and smiled. "Let's see what's wrong with it," he said. "But you're going to do the work. I'll just tell you what to do."
He meant it. For the next forty minutes, Mr. Ho never once touched the lamp himself. __25__, he kept asking me questions: "What do you think this part does? What happens if you take this off?" Slowly, I opened, checked, and cleaned parts I never knew the lamp had. The problem turned out to be a tiny wire that was loose. When I finally switched the lamp on and it lit up, a few people at the next table actually clapped.
Repair cafés like this one are not really cafés. They are free events where volunteers help people fix their own things—clothes, toys, bikes, and small machines. The first one was held in Amsterdam in 2009, and by 2016 there were already more than a thousand around the world. The idea behind them is simple: many things we throw away are not truly broken; __26__ just need a little care and someone who knows how to help.
Since that day, I've gone back almost every month. I've fixed a fan, a pair of headphones, and my little sister's favorite toy car, and I've even started helping first-time visitors find the right tools. __27__, Mr. Ho says I'm almost ready to become a volunteer myself.
What I've learned, though, is bigger than how to use a screwdriver. Every time we fix something instead of replacing it, we save money and reduce waste. __28__, we change the way we look at the things around us: not as objects to use and throw away, but as things worth keeping.
* repair café 修理咖啡館；volunteer 志工；screwdriver 螺絲起子`,translation:`我第一次走進學校附近的修理咖啡館時，手裡拿著一盞壞掉的檯燈，心裡也不抱什麼期望。我確信會有人叫我把它丟掉、買一盞新的。出乎我意料的是，一位白髮的何先生從我手中接過檯燈，把它翻過來看了看，笑了。「我們來看看它哪裡壞了，」他說，「不過要動手的是你，我只負責告訴你怎麼做。」
他是說真的。接下來的四十分鐘，何先生一次都沒有自己碰檯燈，反而一直問我問題：「你覺得這個零件是做什麼的？把這個拆下來會怎樣？」我慢慢地把一些我從來不知道檯燈裡有的零件打開、檢查、清乾淨。問題原來是一條鬆掉的細電線。當我終於打開開關、檯燈亮起來時，隔壁桌有幾個人還真的鼓起掌來。
像這樣的修理咖啡館其實不是咖啡館，而是免費的活動，由志工幫助大家修理自己的東西——衣服、玩具、腳踏車和小型機器。第一場在 2009 年於阿姆斯特丹舉辦，到 2016 年，全世界就已經有一千多個。背後的理念很簡單：許多我們丟掉的東西其實並沒有真的壞掉，其中很多只需要一點照顧，以及一個懂得怎麼幫忙的人。
從那天起，我幾乎每個月都會回去。我修好了一台電扇、一副耳機，還有我妹妹最喜歡的玩具車，甚至開始幫第一次來的人找合適的工具。因此，何先生說我差不多可以自己當志工了。
不過，我學到的東西比怎麼用螺絲起子更重要。每當我們修理東西而不是換新的，我們就省了錢、減少了垃圾。更重要的是，我們改變了看待身邊事物的方式：它們不是用完就丟的物品，而是值得保留的東西。`},{from:29,to:32,passage:`On December 10, 2025, Australia became the first country in the world to ban children under 16 from having social media accounts. From that day on, platforms such as TikTok, Instagram, Facebook, Snapchat, and YouTube had to take "reasonable steps" to keep under-16s off their services—or face fines of up to 49.5 million Australian dollars. Messaging apps like WhatsApp and the game platform Roblox were not included, at least at first.
Supporters of the law argued that social media is designed to keep young people scrolling for as long as possible, and that parents alone cannot win a fight against some of the world's richest companies. Under the new law, it is the companies, not the children or their parents, that are punished if the rules are broken.
Critics, however, raised several concerns. Checking a user's age is not simple. Some platforms chose to estimate ages with AI tools that study a person's face in a photo; others asked users to upload an ID. Neither method is perfect, and some people worried about handing so much personal information to tech companies. Others feared that teenagers would simply move to corners of the internet that are even less safe.
The early results were mixed. The government said that millions of accounts belonging to children had been removed, turned off, or limited. Yet in March 2026, a check by the country's online safety office found that about 70 percent of children who had accounts on the day the ban began were still active on major platforms such as Facebook, Instagram, Snapchat, and TikTok. In June 2026, about six months after the ban started, the government announced plans to double the largest possible fine, saying it was "not seeing improvements."
What should we make of this? It would be easy to say the ban has failed. But laws often work slowly. Seat belt laws did not make every driver buckle up overnight; it took years of rules, checks, and changing habits. On the other hand, a law that many people ignore can teach the wrong lesson: that rules are only words on paper.
In 2026, other countries were watching closely. Whatever happens next in Australia, one thing is already clear: the question is no longer whether governments should do anything about young people and social media, but what—and how much—they should do.
* platform 平臺；fine 罰款；scroll 滑（螢幕）；buckle up 繫上安全帶`,translation:`2025 年 12 月 10 日，澳洲成為全世界第一個禁止 16 歲以下兒童擁有社群媒體帳號的國家。從那天起，TikTok、Instagram、Facebook、Snapchat 和 YouTube 等平臺必須採取「合理的措施」，不讓 16 歲以下的人使用服務，否則最高可罰 4,950 萬澳幣。WhatsApp 等通訊軟體和遊戲平臺 Roblox 不在名單內，至少一開始是如此。
支持這項法律的人認為，社群媒體的設計就是要讓年輕人盡可能一直滑下去，而光靠父母，是打不贏世界上一些最有錢的公司的。在新法之下，違反規定時受罰的是公司，而不是孩子或他們的父母。
然而，批評者提出了幾項疑慮。確認使用者的年齡並不簡單。有些平臺選擇用 AI 工具分析照片中的臉來估計年齡，有些則要求使用者上傳證件。兩種方法都不完美，也有人擔心要把這麼多個人資料交給科技公司。另外有人擔心，青少年只會轉移到網路上更不安全的角落。
初期的成效好壞參半。政府表示，已有數百萬個屬於兒童的帳號被刪除、停用或限制。然而，2026 年 3 月，該國網路安全主管機關的檢查發現，在禁令開始當天擁有帳號的兒童中，約有 70% 仍活躍於 Facebook、Instagram、Snapchat 和 TikTok 等主要平臺。2026 年 6 月，也就是禁令開始約六個月後，政府宣布計畫把罰款上限加倍，表示「沒有看到改善」。
我們該怎麼看待這種情況？說這項禁令失敗了很容易。但法律常常是慢慢發揮作用的。安全帶法規並沒有讓每個駕駛一夜之間就繫上安全帶，而是花了好幾年的規定、稽查和習慣的改變。另一方面，一條很多人都不遵守的法律，也可能教給人錯誤的一課：規定只是紙上的文字。
2026 年時，其他國家都在密切關注。不論澳洲接下來如何發展，有一件事已經很清楚：問題不再是政府「該不該」對年輕人與社群媒體做些什麼，而是該做「什麼」、做到「多少」。`},{from:33,to:36,passage:`Every morning for three years, my father handed me the same blue thermos at the door. "Corn soup," he would say, or "Fish soup today," as if it were news. I would nod, put it in my bag, and forget about it as soon as I got to school.
The truth is, I was a little embarrassed by it. My classmates bought bubble tea and sandwiches at the convenience store. Nobody else carried soup in a dented old thermos that their father had used since before they were born. Some days I didn't even open it. I just poured the soup out in the school garden on my way home, so that the thermos would be empty when I gave it back.
One night in December, I couldn't sleep. At around five in the morning, I heard noises in the kitchen and went to look. My father was standing at the stove, still in the uniform he wore for his night job at the hospital parking lot. His eyes were red. He was cutting carrots very slowly, the way people do when they are trying not to fall asleep.
"Why are you up?" he asked, surprised.
"Why are YOU up?" I said. "You just got home."
He shrugged. "Soup takes two hours. If I go to bed first, I won't wake up in time." Then he smiled. "Your grandma made soup for me every day when I was your age. I hated carrying it, too."
I didn't know what to say. I took a spoon and tasted the soup in the pot. It was sweet and warm, and it tasted like something I had forgotten.
That day at lunch, I opened the thermos for the first time in weeks. A classmate leaned over and asked what it was. "My dad's soup," I said, and for once, I didn't feel the need to explain.
The thermos is still blue and still dented. These days, though, I'm the one who gets up early on Sundays, so that my father can sleep in—and so that I can learn how the soup is made.
* thermos 保溫瓶；dented 有凹痕的；shrug 聳肩`,translation:`三年來，每天早上爸爸都會在門口遞給我同一個藍色保溫瓶。「玉米濃湯。」他會這樣說，或是「今天是魚湯」，好像在報告什麼新聞似的。我會點點頭，把它放進書包，一到學校就忘了它。
老實說，我有點覺得丟臉。我的同學都在便利商店買珍珠奶茶和三明治，沒有人會帶著一個舊得凹凹凸凸、爸爸在自己出生前就在用的保溫瓶裝湯。有些日子我連打開都沒有，只是在回家的路上把湯倒在學校的花園裡，好讓還給爸爸的時候保溫瓶是空的。
十二月的某個晚上，我睡不著。大約清晨五點，我聽見廚房有聲音，就過去看看。爸爸站在爐子前，身上還穿著他在醫院停車場上夜班時的制服。他的眼睛紅紅的，正很慢很慢地切著紅蘿蔔，就像努力不讓自己睡著的人那樣。
「你怎麼起來了？」他驚訝地問。
「『你』怎麼還沒睡？」我說，「你才剛回家。」
他聳聳肩。「湯要煮兩個小時。如果我先去睡，就來不及起來了。」接著他笑了笑。「我像你這麼大的時候，你奶奶每天都煮湯給我帶。我那時候也很討厭帶湯。」
我不知道該說什麼。我拿了一支湯匙，嚐了嚐鍋裡的湯。湯甜甜的、暖暖的，嚐起來像是某種我已經遺忘的東西。
那天午餐時，我好幾個星期以來第一次打開保溫瓶。一個同學湊過來問那是什麼。「我爸煮的湯。」我說。這一次，我不覺得需要解釋什麼。
保溫瓶還是藍色的，也還是凹凹凸凸的。不過現在，星期天早起的人換成了我，好讓爸爸可以睡晚一點——也好讓我學會這湯是怎麼煮的。`},{from:37,to:40,passage:`Science Fair Report: Does Music Help Plants Grow?
by Chen Yu-ching and Lai Po-han, Class 9-2
We had heard that playing music to plants makes them grow faster, so we decided to test it. We also wanted to find out whether the kind of music makes a difference. We planted 30 bean seeds in the same kind of pots with the same soil, divided them into three groups of 10, and gave every plant the same amount of water each day. Group A grew without music. Group B listened to classical music for three hours a day, and Group C listened to rock music for three hours a day. Because the music room was the only place where we could play music all afternoon, Groups B and C were kept there, next to a large sunny window. Group A was kept in a quiet storage room with one small lamp. Every evening, we checked the plants and wrote down anything unusual in a notebook. After three weeks, we measured the height of every plant with a ruler and worked out the average for each group.
| Group | Condition | Average height after 3 weeks |
| A | No music (storage room) | 11.2 cm |
| B | Classical music (music room) | 15.8 cm |
| C | Rock music (music room) | 15.1 cm |
Conclusion: Music helps plants grow, and classical music works a little better than rock music.

Teacher's comment:
This is an interesting question, and many people have wondered about it. You measured carefully, and your table is very clear. However, before you can say what you said in your conclusion, you need to think about one problem in the way the experiment was set up. Also, a difference of 0.7 cm between two groups of only 10 plants may not mean very much. I suggest that you repeat the experiment and see whether you get the same result.`,translation:`科展報告：音樂能幫助植物生長嗎？
九年二班 陳雨青、賴柏翰
我們聽說對植物播放音樂會讓它們長得比較快，所以決定來測試看看。我們也想知道音樂的種類會不會造成差別。我們把 30 顆豆子種在同款的盆子裡、用同樣的土，分成三組，每組 10 顆，每天給每株植物一樣多的水。A 組不聽音樂；B 組每天聽三小時古典音樂；C 組每天聽三小時搖滾樂。因為音樂教室是唯一能整個下午播放音樂的地方，B、C 兩組就放在那裡，靠近一扇陽光充足的大窗戶；A 組則放在一間只有一盞小燈的安靜儲藏室。每天傍晚，我們都會檢查植物，把任何不尋常的地方記在筆記本上。三週後，我們用尺量了每一株植物的高度，並算出每組的平均值。
組別｜條件｜三週後平均高度
A｜沒有音樂（儲藏室）｜11.2 公分
B｜古典音樂（音樂教室）｜15.8 公分
C｜搖滾樂（音樂教室）｜15.1 公分
結論：音樂能幫助植物生長，而且古典音樂的效果比搖滾樂稍好。

老師評語：
這是個有趣的問題，很多人都好奇過。你們測量得很仔細，表格也非常清楚。不過，在你們能下結論之前，需要想一想實驗設計上的一個問題。另外，兩組各只有 10 株植物，0.7 公分的差距可能說明不了什麼。我建議你們重做一次實驗，看看會不會得到相同的結果。`},{from:41,to:43,passage:`When people watch a great musician or athlete, they often say, "She's so talented." It sounds like praise, and it is usually meant as praise. But the word "talent" can hide more than it shows.
Think of a girl I'll call Mei, who won a national violin competition at fifteen. Reporters described her as "a natural." What they did not see were the eight years before that: the early mornings, the same short piece played two hundred times until her fingers stopped making mistakes, the competitions she lost, and the nights she cried after losing them. When we call Mei "talented," we turn all of that work into something that seems to have simply been given to her.
This matters for two reasons. First, it is unfair to people like Mei, because it ignores what they have done. Second, and more seriously, it can stop the rest of us from trying. If success comes from a gift that you either have or don't, then a beginner who struggles may decide, "I just don't have it," and quit—at exactly the point where people like Mei kept going. And since nobody is good at anything in the beginning, this way of thinking can stop people before they have really started.
None of this means that people are all the same. Some people really do learn certain skills faster than others, and pretending otherwise would be dishonest. But "faster" is not the same as "without effort." In most fields, the difference between those who get good and those who don't is less about where they start than about what they do next.
So the next time you are about to say that someone is talented, try asking a different question: "How did you get so good at that?" You may be surprised by the answer—and you may find that the road they walked is one you could walk, too.
* talent 天分；talented 有天分的；struggle 苦苦掙扎`,translation:`人們看到傑出的音樂家或運動員時，常會說：「她好有天分。」這聽起來像稱讚，通常也是出於稱讚。但「天分」這個詞所遮蓋的，可能比它說明的還多。
想想一個我稱她為小美的女孩，她十五歲時贏得全國小提琴比賽。記者形容她是「天生的」。他們沒看到的是在那之前的八年：一個個清晨、同一首短曲拉了兩百遍直到手指不再出錯、她輸掉的比賽，以及輸了之後哭泣的夜晚。當我們說小美「有天分」，就把那一切努力變成了好像只是上天直接給她的東西。
這件事之所以重要，有兩個原因。第一，這對像小美這樣的人不公平，因為它忽略了他們所付出的。第二，也是更嚴重的，它可能讓我們其他人不再嘗試。如果成功來自一種「有就有、沒有就沒有」的天賦，那麼一個學得很辛苦的初學者可能會認定「我就是沒有那個天分」而放棄——而這恰恰是像小美這樣的人堅持下去的時刻。既然沒有人一開始就擅長任何事，這種想法可能讓人在真正起步之前就停下來。
這並不表示每個人都一樣。有些人學某些技能確實比別人快，假裝不是這樣是不誠實的。但「比較快」不等於「不用努力」。在大多數領域，變得厲害的人和沒有變厲害的人之間的差別，與其說在於起點，不如說在於他們接下來怎麼做。
所以，下次你想說某人有天分時，試著換一個問題問：「你是怎麼變得這麼厲害的？」答案可能會讓你驚訝——你也可能發現，他們走過的那條路，你也走得了。`}],items:[{qNo:1,stem:`Kevin was disappointed with his test score, but he didn't make any excuses. ______, he asked his teacher which kinds of mistakes he should watch out for next time.`,options:[`Instead`,`Besides`,`Otherwise`,`Even so`],answer:`A`,explanation:`【中譯】Kevin 對自己的考試成績很失望，但他沒有找任何藉口，反而去問老師下次應該注意哪些錯誤。
【解析】「不找藉口」和「去問老師」是以後者取代前者的做法，用 Instead（反而、取而代之）。(B) Besides 表示「此外」，前句是「沒有做某事」，無法再「此外」；(C) Otherwise（否則）語意不通；(D) Even so（即使如此）表示讓步，但「不找藉口」和「去問老師」並不衝突。故選 (A)。`},{qNo:2,stem:`A: Is your new manager easy to work with?
B: Let's just say I've started reading job ads again.
A: ______`,options:[`Oh no. Is it really that bad?`,`Great! I'm happy for you.`,`So you'll get a promotion soon?`,`Then you must really love your job.`],answer:`A`,explanation:`【中譯】A：你的新主管好相處嗎？B：這麼說吧，我又開始看徵才廣告了。A：喔不，真的有那麼糟嗎？
【解析】B 沒有直接回答，而是說「又開始看徵才廣告」，暗示想換工作，也就是新主管很難相處。A 聽懂了弦外之音，才會說「真的那麼糟嗎」。(B) 表示替 B 高興，誤解了 B 的意思；(C) 升遷和想換工作無關；(D) 想換工作不可能是很愛這份工作。故選 (A)。`},{qNo:3,stem:`A: Could you lend me NT$500? I promise I'll pay you back tomorrow.
B: ______ You still owe me the NT$300 you borrowed last month.`,options:[`Of course. Here you go.`,`Don't worry about paying me back.`,`I'm sorry to hear that.`,`That's what you said last time.`],answer:`D`,explanation:`【中譯】A：可以借我 500 元嗎？我保證明天就還你。B：你上次也是這麼說的。你上個月借的 300 元都還沒還我。
【解析】B 接著提到 A 上個月借的錢還沒還，可見 B 不相信 A「明天就還」的保證，用 That's what you said last time.（你上次也是這麼說）表示懷疑。(A) 爽快借錢，與後句的抱怨矛盾；(B) 「不用還」更與「你還欠我錢」矛盾；(C) 是對壞消息表示同情，接不上借錢的請求。故選 (D)。`},{qNo:4,stem:`The red backpack costs NT$900, and the blue one costs NT$1,200. The green one costs less than the blue one but more than the red one, so the green one is ______.`,options:[`the cheapest of the three`,`neither the cheapest nor the most expensive`,`the most expensive of the three`,`as expensive as the blue one`],answer:`B`,explanation:`【中譯】紅色背包 900 元，藍色背包 1,200 元。綠色背包比藍色便宜、但比紅色貴，所以綠色背包既不是最便宜也不是最貴的。
【解析】綠色介於紅色（900）與藍色（1,200）之間，三者中排第二，所以「既不是最便宜，也不是最貴」。(A) 最便宜的是紅色；(C) 最貴的是藍色；(D) 綠色比藍色便宜，不可能一樣貴。故選 (B)。`},{qNo:5,stem:`It's starting to rain hard. We ______ take a taxi home, or we'll be completely wet by the time we get there.`,options:[`would rather not`,`don't have to`,`had better`,`used to`],answer:`C`,explanation:`【中譯】雨開始下大了，我們最好搭計程車回家，否則到家時會全身濕透。
【解析】「, or（否則）會濕透」表示搭計程車是該做的事，用 had better（最好）。(A) would rather not 是「寧可不要」，那就會淋濕，與 or 後面的警告矛盾；(B) don't have to 是「不必」，同樣說不通；(D) used to 是「過去常常」，不是對現在的建議。故選 (C)。`},{qNo:6,stem:`At first, the scientist was very ______ about her results. She repeated the experiment three times before she told anyone about her discovery.`,options:[`careless`,`proud`,`excited`,`cautious`],answer:`D`,explanation:`【中譯】一開始，這位科學家對她的結果非常謹慎。她把實驗重做了三次，才告訴別人她的發現。
【解析】「重做三次才告訴別人」表示她非常小心、不急著下結論，用 cautious（謹慎的）。(A) careless（粗心的）正好相反；(B) proud、(C) excited 的人通常會急著告訴別人，與「重做三次才說」不合。故選 (D)。`},{qNo:7,stem:`The road up to the mountain village is narrow and full of sharp turns. ______, buses run there every hour, and the drivers seem to know every curve by heart.`,options:[`As a result`,`That is`,`Instead`,`Even so`],answer:`D`,explanation:`【中譯】通往山上村莊的路又窄又多急轉彎。即使如此，那裡每小時都有公車，司機們似乎熟記每一個彎道。
【解析】路況很差，「卻」每小時都有公車——前後是讓步關係，用 Even so（即使如此）。(A) As a result：路窄多彎不會「造成」公車很多；(B) That is（也就是說）用於解釋前句，但後句不是在解釋路況；(C) Instead 表示取代，但公車並沒有取代道路。故選 (D)。`},{qNo:8,stem:`When our class first heard that every student had to take turns working in the school garden, almost everyone complained. ______ By the end of the semester, even the loudest complainers were proud of the vegetables our class grew.`,options:[`So the school decided to cancel the plan after just one day.`,`Within a few weeks, though, many of us began to look forward to our turn.`,`Besides, the garden was too far away from our classroom.`,`As a result, fewer and fewer students were willing to help.`],answer:`B`,explanation:`【中譯】我們班剛聽說每個學生都要輪流到學校菜園工作時，幾乎每個人都在抱怨。不過，幾個星期之內，很多人開始期待輪到自己。到學期末，連抱怨最大聲的人都對我們班種出的蔬菜感到驕傲。
【解析】空格前是「大家抱怨」，空格後是「學期末連最會抱怨的人都很驕傲」，中間需要一個「態度轉變」的句子，只有第一個選項（though 表轉折）接得上兩邊。(A) 計畫若第一天就取消，後面就不會有種出來的蔬菜；(C) 只是補充抱怨的理由，接不上後面的轉變；(D) 願意幫忙的人越來越少，與「連最會抱怨的人都很驕傲」矛盾。故選 (B)。`},{qNo:9,stem:`I have two brothers. ______ of them is good at cooking: Leo makes great beef noodles, and Sam bakes the best bread in town.`,options:[`Each`,`Neither`,`None`,`Both`],answer:`A`,explanation:`【中譯】我有兩個兄弟。他們每個都很會做菜：Leo 的牛肉麵很棒，Sam 烤的麵包是鎮上最好吃的。
【解析】冒號後說明兩人「各自」擅長的料理，表示兩個都很會做菜，用 Each of them is。(B) Neither 表示兩個都不會，與冒號後的說明矛盾；(C) None 用於三者以上，且同樣是否定；(D) Both 的意思雖然對，但 Both of them 是複數，動詞要用 are，與空格後的 is 不合——這題要同時看語意和主詞動詞一致。故選 (A)。`},{qNo:10,stem:`A sign at a swimming pool says: "Children under 12 must be with an adult at all times. Children under 6 may only use the small pool." Which of the following follows the rules?`,options:[`An 11-year-old boy swimming by himself in the big pool.`,`A 5-year-old boy swimming in the big pool with his mother.`,`A 10-year-old girl swimming in the big pool with her father.`,`A 9-year-old girl playing by herself in the small pool.`],answer:`C`,explanation:`【中譯】游泳池的告示寫著：「未滿 12 歲的兒童必須隨時由成人陪同。未滿 6 歲的兒童只能使用小池。」下列哪一個情況符合規定？
【解析】兩條規定要同時檢查：10 歲有爸爸陪同（符合第一條），10 歲不受「只能用小池」限制（符合第二條）。(A) 11 歲未滿 12 歲，不能自己游；(B) 5 歲未滿 6 歲，即使有媽媽陪也只能用小池；(D) 9 歲雖然在小池，但沒有成人陪同。故選 (C)。`},{qNo:11,stem:`______ you leave right now, you will still miss the last bus. It leaves in five minutes, and the bus stop is a fifteen-minute walk from here.`,options:[`Unless`,`As long as`,`Even if`,`Because`],answer:`C`,explanation:`【中譯】就算你現在馬上離開，還是會錯過末班公車。公車五分鐘後開，而公車站離這裡要走十五分鐘。
【解析】公車五分鐘後開，走到站要十五分鐘，所以「現在出發也趕不上」，要用讓步的 Even if（即使），句中的 still 也是線索。(A) Unless you leave now, you'll miss…表示「現在走就趕得上」，與第二句的時間計算矛盾，是最容易誤選的選項；(B) As long as（只要）表示「只要現在走就會錯過」，不合邏輯；(D) Because 表示「因為你現在走所以錯過」，因果不通。故選 (C)。`},{qNo:12,stem:`A sign at a café says: "Free Wi-Fi for customers—please ask for the password at the counter. When the café is busy, we kindly ask customers using laptops to stay no longer than two hours." What does the sign suggest?`,options:[`Anyone walking past the café can use the Wi-Fi without buying anything.`,`On a quiet afternoon, a customer may work on a laptop there for more than two hours.`,`Laptops cannot be used in the café when it is busy.`,`The Wi-Fi password is printed on the sign.`],answer:`B`,explanation:`【中譯】咖啡廳的告示寫著：「顧客可免費使用 Wi-Fi，請向櫃檯索取密碼。店內客滿時，敬請使用筆電的顧客停留不超過兩小時。」這個告示暗示什麼？
【解析】兩小時的限制只在「店內忙碌時」才適用，所以人少的時候，用筆電的顧客可以待超過兩小時。(A) Wi-Fi 是給「顧客」用的，路過的人不算；(C) 忙碌時是限制停留「兩小時」，不是不能用筆電，屬於過度推論；(D) 密碼要向櫃檯索取，並沒有寫在告示上。故選 (B)。`},{qNo:13,stem:`One of the most important skills that students need in the age of AI ______ the ability to check whether the information they find is true.`,options:[`are`,`be`,`is`,`being`],answer:`C`,explanation:`【中譯】在 AI 時代，學生最需要的重要技能之一，是查核所找到的資訊是否正確的能力。
【解析】主詞是 One（of the most important skills…），是單數，動詞用 is。中間的 skills、students 都是修飾語，不是主詞，這是最容易誤選 are 的陷阱。(A) are 誤把 skills 當主詞；(B) be、(D) being 都不能當句子的主要動詞。故選 (C)。`},{qNo:14,stem:`The movie started at 7:00 and lasted exactly two hours. Because my little brother felt sick, we left the theater twenty minutes ______ it ended, and we got home before nine.`,options:[`before`,`after`,`until`,`since`],answer:`A`,explanation:`【中譯】電影七點開始，正好演兩個小時。因為我弟弟不舒服，我們在電影結束前二十分鐘就離開戲院，九點前就到家了。
【解析】電影 9:00 結束；「九點前到家」表示一定是在結束「之前」離開（8:40 離開）。(B) after 是 9:20 才離開，不可能九點前到家，而且弟弟不舒服也不會多留；(C) until、(D) since 放在 twenty minutes ___ it ended 中語意不通。故選 (A)。`},{qNo:15,stem:`A: Why didn't you tell me the party was canceled?
B: I ______, but your phone was off all afternoon.`,options:[`forgot to`,`tried to`,`didn't want to`,`promised not to`],answer:`B`,explanation:`【中譯】A：你為什麼沒告訴我派對取消了？B：我有試著告訴你，但你的手機整個下午都關機。
【解析】but 後面說「你的手機關機」，是在解釋「想聯絡卻聯絡不上」，所以前面是 tried to（試著要告訴你）。(A) forgot to、(C) didn't want to、(D) promised not to 都表示 B 本來就沒打算或忘了聯絡，後面再說「但你的手機關機」就不合邏輯。故選 (B)。`},{qNo:16,stem:`What can be inferred about the umpire in the Kartal–Pavlyuchenkova match?`,options:[`The umpire knew that the system had been switched off.`,`The umpire turned off the system in order to make the calls himself.`,`The umpire was depending on the system to call balls that were out.`,`The umpire was punished by the club for the mistake.`],answer:`C`,explanation:`【中譯】關於 Kartal 對 Pavlyuchenkova 那場比賽的主審，可以推論出什麼？
【解析】一顆「明顯出界」的球主審卻沒有判，而文中說系統被誤關「而且沒有人告訴主審」——可見主審以為系統仍在運作，依賴它來判出界。(A) 文中明說沒有人告訴主審，他並不知道；(B) 系統是被「誤關」的，俱樂部歸咎於操作人員，不是主審自己關的；(D) 文中只說俱樂部道歉並修改規定，沒有提到處罰主審。故選 (C)。`},{qNo:17,stem:`What does the writer of Text A suggest with the question at the end?`,options:[`Line judges should be brought back to Wimbledon right away.`,`Players should be allowed to challenge the machine's calls again.`,`The technology itself was the real cause of the mistake.`,`Replacing line judges with machines has not completely removed the chance of human mistakes.`],answer:`D`,explanation:`【中譯】文本 A 的作者用最後的問句想表達什麼？
【解析】作者問「人為錯誤是真的被消除了，還是只是被移到選手看不到的地方？」——意思是機器仍由人操作，人為疏失並沒有因為換成機器而完全消失。(A) 作者只是提出疑問，並沒有主張立刻恢復司線員，屬於過度推論；(B) 文中沒有提到恢復挑戰制度；(C) 作者的問句是順著俱樂部「人為疏失」的說法提出的，並沒有說錯在科技本身。故選 (D)。`},{qNo:18,stem:`What does Grace L. mean by "tennis is not just a math problem"?`,options:[`Machines are not good at measuring where a ball lands.`,`Tennis players do not need to be good at math.`,`Getting every call exactly right is not the only thing that gives the sport its value.`,`Line judges made fewer mistakes than the new system.`],answer:`C`,explanation:`【中譯】Grace L. 說「網球不只是一道數學題」是什麼意思？
【解析】她先說「準確很重要」，再說「但網球不只是數學題」，並提到穿制服的司線員是表演和歷史的一部分——意思是判得準確並不是這項運動唯一的價值。(A) 她承認準確很重要，並沒有說機器量不準；(B) 只取字面意思；(D) 她沒有比較司線員和機器誰比較準。故選 (C)。`},{qNo:19,stem:`Which piece of information in Text A is most closely related to Ryo_K's suggestion?`,options:[`A serve can travel at more than 200 kilometers an hour.`,`The club changed its rules so that operators could no longer turn the system off by hand.`,`Players no longer need to "challenge" a call and wait for a replay.`,`The system plays a recorded voice to announce each call.`],answer:`B`,explanation:`【中譯】文本 A 中的哪一項資訊與 Ryo_K 的建議最相關？
【解析】Ryo_K 建議「把關閉開關整個拿掉」；文本 A 最後提到俱樂部已經修改規定，讓操作人員不能再「手動」關閉系統——等於已經做了他建議的一部分。這題要把留言和新聞的細節對起來。(A) 球速是支持機器判線的理由，與關閉開關無關；(C) 取消挑戰制度是新系統的好處，不是針對這次事件的改變；(D) 錄音宣判只是系統的運作方式。故選 (B)。`},{qNo:20,stem:`Which of the following is true according to the passage?`,options:[`The tooth that the scientists studied was about 72,000 years old.`,`Scientists agree that the gray wolf is the dire wolf's closest living relative.`,`The scientists changed some of the gray wolf's own genes instead of adding ancient DNA.`,`The scientists made 14 changes to 20 different genes.`],answer:`C`,explanation:`【中譯】根據本文，下列何者正確？
【解析】第二段說他們「沒有把古代 DNA 放進動物體內」，而是修改灰狼細胞的基因。(A) 牙齒約 13,000 年，72,000 年的是耳骨——數字對但東西錯；(B) 文中說灰狼是恐狼最近親屬是「公司的說法」(which the company calls)，並沒有說科學家都同意；(D) 是 14 個基因上的 20 處修改，數字前後顛倒。故選 (C)。`},{qNo:21,stem:`According to the fifth paragraph, who would be the most likely to call Romulus a real dire wolf?`,options:[`Someone who thinks a species is defined by its full set of genes.`,`Someone who thinks a species is defined by how an animal looks.`,`Someone who thinks young animals must learn how to live from their own parents.`,`Someone who agrees with the scientists in the third paragraph.`],answer:`B`,explanation:`【中譯】根據第五段，誰最可能把 Romulus 稱為真正的恐狼？
【解析】第五段說：如果物種是以「外表」定義，答案「或許是肯定的」；以全部基因或生活方式定義，答案「顯然是否定的」。(A) 以基因定義，答案是否定的；(C) 以親代傳授的生活方式定義，答案也是否定的；(D) 第三段的科學家認為幼崽仍是灰狼。故選 (B)。`},{qNo:22,stem:`What is the main purpose of the fifth paragraph ("So, are they dire wolves or not?")?`,options:[`To prove that the pups are real dire wolves.`,`To explain how the scientists chose which genes to change.`,`To give Colossal's answer to its critics.`,`To show that whether the pups are dire wolves depends on how "species" is defined.`],answer:`D`,explanation:`【中譯】第五段（So, are they dire wolves or not?）主要的作用是什麼？
【解析】第五段提出「答案取決於物種的定義」：以外表定義也許是，以基因或生活方式定義則不是，作用是說明爭議的關鍵在定義。(A) 作者說以基因或生活方式定義時「顯然不是」，並沒有證明牠們是真的恐狼；(B) 選擇基因的過程在第二段，第五段沒有談；(C) 公司的回應在第四段。故選 (D)。`},{qNo:23,stem:`Which best describes the writer's attitude toward the project?`,options:[`Doubtful that the pups are true dire wolves, but willing to judge the project by whether it helps endangered animals.`,`Excited, because the pups prove that extinct animals can now return.`,`Angry, because the company lied to the public on purpose.`,`Uninterested, because the writer thinks the topic is not worth discussing.`],answer:`A`,explanation:`【中譯】下列何者最能描述作者對這個計畫的態度？
【解析】作者在第五段指出以基因和生活方式來看「顯然不是」恐狼，表示懷疑；但最後一段說這類技術能否真正幫助紅狼等瀕危動物，才更能顯示計畫的價值——作者保留了以成果來評價的空間。(B) 作者並不認為幼崽證明絕種動物能回來；(C) 作者沒有指控公司故意說謊，而且有寫出公司的回應；(D) 作者花了整篇討論，還提出「更重要的問題」，並非不感興趣。故選 (A)。`},{qNo:24,stem:``,options:[`As I expected`,`In other words`,`To my surprise`,`As a result`],answer:`C`,explanation:`【解析】前句說「我確信有人會叫我把它丟掉」，結果何先生卻接過檯燈要幫我修——實際發生的事和預期相反，用 To my surprise（出乎我意料）。(A) As I expected（如我所料）與前句的預期正好相反；(B) In other words 是換句話說，但前後並不是同一件事；(D) As a result 表示因果，但我的預期不會「造成」何先生接手。故選 (C)。`},{qNo:25,stem:``,options:[`Besides`,`Otherwise`,`For example`,`Instead`],answer:`D`,explanation:`【解析】前句說何先生「一次都沒有自己碰檯燈」，後句說他「一直問我問題」，是用問問題「取代」親手修理，用 Instead。這也呼應第一段他說的「動手的是你，我只告訴你怎麼做」。(A) Besides（此外）要接同方向的補充，但前句是「沒有做」某事；(B) Otherwise（否則）語意不通；(C) 問問題不是「沒碰檯燈」的例子。故選 (D)。`},{qNo:26,stem:``,options:[`none of them`,`many of them`,`most of us`,`every one of them`],answer:`B`,explanation:`【解析】空格指的是前面的 many things we throw away（許多被丟掉的東西），「其中很多只需要一點照顧」，用 many of them，動詞 need 也和複數主詞一致。(A) none of them 表示「沒有一個只需要照顧」，與「並沒有真的壞掉」矛盾；(C) most of us 指人，但需要照顧的是東西；(D) every one of them 是單數，動詞要用 needs，而且說「每一件」都只需要照顧也太絕對。故選 (B)。`},{qNo:27,stem:``,options:[`As a result`,`Even so`,`On the other hand`,`For example`],answer:`A`,explanation:`【解析】空格前說作者已經修好很多東西，甚至開始幫第一次來的人找工具；空格後說何先生認為作者「差不多可以當志工了」——前面是原因，後面是結果，用 As a result（因此）。(B) Even so（即使如此）用於讓步，前句必須是不利的情況，但前句全是作者的進步；(C) On the other hand 用來提出相對的另一面，但前後方向一致，沒有對比；(D) 何先生的評語不是「修好很多東西」的例子，而是它帶來的結果。故選 (A)。`},{qNo:28,stem:``,options:[`In other words`,`Otherwise`,`More importantly`,`For example`],answer:`C`,explanation:`【解析】段落開頭說「我學到的東西比怎麼用螺絲起子『更重要』」，接著先講省錢、減少垃圾，再帶出「改變我們看待事物的方式」這個更深一層的收穫，用 More importantly（更重要的是）。(A) In other words 用來換句話說，但「改變看法」和「省錢減廢」不是同一件事；(B) Otherwise（否則）語意不通；(D) 改變看法不是省錢減廢的例子。故選 (C)。`},{qNo:29,stem:`Which of the following is NOT mentioned as a concern about the ban?`,options:[`Teachers would no longer be able to use online videos in class.`,`Age checks may sometimes get a user's age wrong.`,`Users may have to share personal information with companies.`,`Teenagers may move to less safe places online.`],answer:`A`,explanation:`【中譯】下列何者「不是」文中提到的對禁令的疑慮？
【解析】第三段批評者的疑慮有：年齡檢查方法不完美、要把個人資料交給科技公司、青少年轉移到更不安全的網路角落。文中完全沒有提到老師上課不能用影片。(B) 對應 Neither method is perfect；(C) 對應 handing so much personal information to tech companies；(D) 對應 move to corners of the internet that are even less safe。故選 (A)。`},{qNo:30,stem:`About how long after the ban began did the online safety office's check take place?`,options:[`About six months.`,`About one year.`,`About two weeks.`,`About three months.`],answer:`D`,explanation:`【中譯】網路安全主管機關的檢查大約是在禁令開始多久之後進行的？
【解析】禁令在 2025 年 12 月 10 日開始，檢查在 2026 年 3 月，相隔約三個月。(A) 「約六個月」是文中描述 2026 年 6 月政府宣布加重罰款的時間，不是檢查的時間——數字出現在文中，但對應的是另一件事；(B)、(C) 與日期不合。故選 (D)。`},{qNo:31,stem:`Why does the writer mention seat belt laws?`,options:[`To show that people always obey a law once it is checked strictly.`,`To argue that social media is as dangerous as driving without a seat belt.`,`To suggest that the ban should become a rule for parents instead.`,`To suggest that a law may need time before it changes people's behavior.`],answer:`D`,explanation:`【中譯】作者為什麼提到安全帶法規？
【解析】作者先說「法律常常是慢慢發揮作用的」，再舉安全帶法規花了好幾年才改變駕駛習慣為例，意思是不能因為成效還不好就斷定禁令失敗。(A) 作者說花了「好幾年」，而且下一句還提醒很多人不遵守的法律有害，「一定會遵守」是過度推論；(B) 作者比較的是「法律需要時間」，不是比較兩者的危險，這是只看字面的誤解；(C) 文中支持者強調受罰的是公司而非父母，作者也沒有提議改成管父母。故選 (D)。`},{qNo:32,stem:`Which best describes the writer's position?`,options:[`It is too early to call the ban a failure, but a law that many people ignore also has a cost.`,`The ban has not worked so far, so governments should give up on it and try something else.`,`Laws always take years to work, so the poor early results do not matter at all.`,`The ban will succeed only if the largest fine is doubled.`],answer:`A`,explanation:`【中譯】下列何者最能描述作者的立場？
【解析】第五段作者一方面說「說它失敗很容易，但法律常常慢慢發揮作用」，另一方面又說「很多人不遵守的法律可能教給人錯誤的一課」，兩面都顧及。(B) 只對一半：作者承認成效不佳，但正好反對急著說它失敗、放棄；(C) 作者說的是 often（常常），不是 always，而且他也提醒被忽視的法律有代價，並非「完全不重要」；(D) 加倍罰款是政府的計畫，作者沒有說只有這樣才會成功。故選 (A)。`},{qNo:33,stem:`On some days, the writer poured the soup out on the way home and gave the father an empty thermos. What did the writer want the empty thermos to make the father believe?`,options:[`That the writer was embarrassed to carry soup.`,`That the soup had been eaten at school.`,`That the soup had gone bad by the afternoon.`,`That the writer no longer wanted any soup.`],answer:`B`,explanation:`【中譯】有些日子，作者在回家路上把湯倒掉，把空的保溫瓶還給爸爸。作者想用空保溫瓶讓爸爸相信什麼？
【解析】第二段說倒掉湯是為了「還給爸爸時保溫瓶是空的」——空瓶子會讓爸爸以為湯在學校被喝掉了。(A) 覺得丟臉是作者「不喝湯」的真正原因，文中確實有寫，但這正是作者想「隱瞞」的事，不是想讓爸爸相信的事，這是本題的陷阱；(C) 文中沒有說湯壞了，而且空瓶子也無法讓人相信湯壞了；(D) 空瓶子傳達的正好相反——看起來像是全部喝光了。故選 (B)。`},{qNo:34,stem:`What do the father's words "I hated carrying it, too" suggest?`,options:[`He wanted the writer to stop taking soup to school.`,`He had probably guessed how the writer felt about carrying the soup.`,`His own mother had never made soup for him.`,`He was angry that the writer had poured the soup away.`],answer:`B`,explanation:`【中譯】爸爸說「我那時候也很討厭帶湯」暗示了什麼？
【解析】too（也）表示「和你一樣」：爸爸在作者什麼都沒說的情況下就這樣說，可見他大概早就猜到作者不喜歡帶湯，卻仍然每天熬夜煮。(A) 他說完還笑了，並沒有要作者別帶，而且他說熬夜是為了來得及煮好；(C) 他明明說奶奶每天都煮湯給他；(D) 文中沒有跡象顯示他知道湯被倒掉，他的語氣也不是生氣。故選 (B)。`},{qNo:35,stem:`Which of the following is NOT true according to the story?`,options:[`The writer's grandmother made soup for the writer every day.`,`The father usually started making the soup after coming home from work.`,`The writer had not opened the thermos for weeks before that December day.`,`The thermos had been used since before the writer was born.`],answer:`A`,explanation:`【中譯】根據故事，下列何者「不」正確？
【解析】爸爸說「我像你這麼大的時候，你奶奶每天都煮湯給『我』帶」——奶奶是煮給爸爸，不是煮給作者，細節對但人物錯。(B) 作者說「你才剛回家」，爸爸說「如果先去睡就來不及」，可見他下班回家後才開始煮湯，正確；(C) 那天作者「好幾個星期以來第一次」打開保溫瓶，正確；(D) 第二段說這是爸爸在作者出生前就在用的保溫瓶，正確。故選 (A)。`},{qNo:36,stem:`What does the last paragraph suggest?`,options:[`The writer has come to value the soup and wants to give something back to the father.`,`The writer now makes the soup every day so that the father can rest.`,`The writer plans to buy a new thermos to replace the old one.`,`The writer still feels embarrassed but hides it better now.`],answer:`A`,explanation:`【中譯】最後一段暗示了什麼？
【解析】作者現在週日早起，讓爸爸能睡晚一點，也學著煮這道湯——表示作者已經珍惜這份湯和其中的心意，想回報爸爸。(B) 作者只說「星期天」早起，「每天」是過度推論；(C) 保溫瓶「還是藍色的、還是凹凹的」，作者並沒有要換新的；(D) 午餐時作者「不覺得需要解釋」，已經不再難為情。故選 (A)。`},{qNo:37,stem:`What does the teacher mean by saying that "a difference of 0.7 cm between two groups of only 10 plants may not mean very much"?`,options:[`The students measured the plants in the wrong unit.`,`Rock music made the plants in Group C 0.7 cm shorter on purpose.`,`Groups B and C should have been given 0.7 cm more water.`,`Such a small difference could happen by chance, even if the kind of music had no effect.`],answer:`D`,explanation:`【中譯】老師說「兩組各只有 10 株植物，0.7 公分的差距可能說明不了什麼」是什麼意思？
【解析】每組植物不多，差距又很小，就算音樂種類根本沒有影響，兩組也可能因為偶然（例如個別種子的差異）而相差 0.7 公分，所以不能據此說古典音樂比較好。(A) 老師稱讚他們「測量得很仔細」，沒有說單位錯；(B) 只是把數字套進去，文中沒有這樣的說法；(C) 水量不是用公分計算，而且各組水量本來就相同。故選 (D)。`},{qNo:38,stem:`What "problem in the way the experiment was set up" does the teacher most likely mean?`,options:[`The students used bean seeds instead of flowers.`,`The rock music was played louder than the classical music.`,`The plants were measured after only three weeks.`,`Group A got much less light than Groups B and C.`],answer:`D`,explanation:`【中譯】老師說的「實驗設計上的一個問題」最可能是指什麼？
【解析】B、C 組放在陽光充足的窗邊，A 組放在只有一盞小燈的儲藏室——除了音樂之外，「光線」也不同，所以 A 組長得矮可能是因為光線不足，而不是沒有音樂。(A) 用豆子做實驗沒有問題；(B) 報告中沒有提到音量，這是無中生有；(C) 三組都在三週後測量，時間相同，不會造成組間差異。故選 (D)。`},{qNo:39,stem:`Based on the report and the teacher's comment, which statement is best supported?`,options:[`The students cannot yet say whether classical music works better than rock music.`,`Music clearly makes bean plants grow faster.`,`Plants in a quiet room always grow more slowly.`,`Rock music is harmful to the growth of plants.`],answer:`A`,explanation:`【中譯】根據報告和老師的評語，哪一個說法最有根據？
【解析】老師指出 B、C 兩組只差 0.7 公分，每組又只有 10 株，「可能說明不了什麼」，建議重做；所以目前還不能說古典音樂比搖滾樂有效。(B) 因為光線條件不同，還不能確定是音樂造成的，用 clearly 太武斷；(C) A 組矮可能是光線不足，而且 always 是過度推論；(D) C 組（搖滾樂）長得比 A 組高，資料並不支持「有害」。故選 (A)。`},{qNo:40,stem:`Which change would best solve the problem in the way the experiment was set up?`,options:[`Giving Group A more water so that it can catch up.`,`Playing music to Group A as well.`,`Keeping all three groups in places with the same amount of light.`,`Adding a fourth group that listens to pop music.`],answer:`C`,explanation:`【中譯】哪一種改變最能解決實驗設計上的問題？
【解析】問題在於 A 組的光線比 B、C 組少，只要讓三組的光線相同，除了音樂之外其他條件都一樣，才能看出音樂的影響。(A) 改變水量會多出另一個不同的條件，讓問題更嚴重；(B) A 組也聽音樂，就沒有「不聽音樂」的對照組了；(D) 多加一組並不能解決 A 組光線不足的問題。故選 (C)。`},{qNo:41,stem:`What is the main function of the second paragraph?`,options:[`To prove that Mei was born with a special gift.`,`To give an example of the hard work that the word "talent" can hide.`,`To explain how violin competitions are judged.`,`To show that losing competitions makes people quit.`],answer:`B`,explanation:`【中譯】第二段的主要作用是什麼？
【解析】第一段說「天分」這個詞會遮蓋很多東西；第二段用小美的例子說明，記者只看到「天生的」，卻沒看到她八年的苦練——是用實例支持第一段的論點。(A) 作者正好要說明她的成功不只是天賦；(C) 文中沒有談比賽怎麼評分；(D) 小美輸了還是繼續練習，並沒有因此放棄。故選 (B)。`},{qNo:42,stem:`According to the writer, what is the "more serious" problem with calling people talented?`,options:[`It ignores the hard work that successful people have done.`,`It may lead beginners to give up when they find something difficult.`,`It makes successful people proud and lazy.`,`It makes beginners learn new skills more slowly.`],answer:`B`,explanation:`【中譯】根據作者，說別人「有天分」比較嚴重的問題是什麼？

【解析】女子說 Artemis II 的太空人「飛得比以前任何人都遠，連阿波羅太空人都比不上」，男子也說阿波羅太空人「不再保有那項紀錄」，所以 (A) 正確。(B) 爺爺在黑白電視上看的是五十多年前阿波羅太空人登月，不是 Artemis II 發射；(C) 在佛羅里達現場看發射的是女子的表姊（堂姊），在教室看大螢幕的才是男子的班級。（Artemis II 於 2026 年 4 月 1 日發射，繞月未登月，創下人類離地球最遠的紀錄。）故選 (A)。`,transcript:[[`M`,`My grandpa says he watched astronauts walk on the moon on a black-and-white TV when he was a kid.`],[`W`,`That was the Apollo program, more than fifty years ago. Did you follow Artemis Two in April 2026?`],[`M`,`A little. Our teacher showed the launch on the big screen in class.`],[`W`,`My cousin watched it in person in Florida. She said she could feel the ground shake.`],[`M`,`Lucky her! Did the astronauts land on the moon this time?`],[`W`,`No, they only flew around it. It was a test for a landing in the future. But they still went farther from Earth than any people before them, even the Apollo astronauts.`],[`M`,`So my grandpa's astronauts don't hold that record anymore.`],[`W`,`Not that one. But they're still the only people who have ever walked on the moon.`],[`Q`,`Which of the following is true?`]]},{qNo:14,stem:``,options:[`Their hotel in Barcelona was fully booked.`,`From Barcelona, they could not have seen the sun completely covered.`,`They wanted to watch the sunset from a hill.`],answer:`B`,explanation:`【聽力稿】W: How was your eclipse trip to Spain?

Question: Why did the man's family go to Zaragoza?
【中譯】女：你們去西班牙看日食的旅行怎麼樣？男：差點就搞砸了。我們幾個月前就訂了巴塞隆納的飯店，結果出發前一個星期，我爸看到巴塞隆納剛好在太陽會被完全遮住的範圍外面。女：喔不，所以你們只看到一部分？男：不是。前一天我們搭火車到了薩拉戈薩（Zaragoza），那裡就在全食帶上。女：真聰明。是在下午嗎？男：是在傍晚，日落前不到一小時，所以太陽非常低。我們得爬到一座山丘上，確定沒有建築物擋住。女：天黑了多久？男：不到兩分鐘。我妹妹眨了一下眼，就說她錯過了。女：哈！你還會再去嗎？男：當然。但下次訂飯店前我會先看地圖。問題：男子一家人為什麼去薩拉戈薩？
【解析】男子說巴塞隆納「剛好在太陽會被完全遮住的範圍外」，留在那裡只能看到日偏食，所以前一天改搭火車到「就在全食帶上」的薩拉戈薩。(A) 他們幾個月前就「訂好了」巴塞隆納的飯店，沒有說客滿；(C) 爬山丘是到了薩拉戈薩之後，為了不讓建築物擋住低空的太陽，不是去薩拉戈薩的原因，他們也不是去看日落。（2026 年 8 月 12 日日全食的全食帶經過西班牙北部，巴塞隆納剛好在全食帶外，全食發生在日落前不到一小時。旅行經過為虛構情境。）故選 (B)。`,transcript:[[`W`,`How was your eclipse trip to Spain?`],[`M`,`It almost went wrong. We booked a hotel in Barcelona months ago. Then, a week before the trip, my dad read that Barcelona was just outside the area where the sun would be completely covered.`],[`W`,`Oh no. So you only saw part of it?`],[`M`,`No. The day before, we took a train to Zaragoza. It was right in the path.`],[`W`,`Smart. Was it in the afternoon?`],[`M`,`In the evening, less than an hour before sunset, so the sun was really low. We had to climb a hill to make sure no buildings were in the way.`],[`W`,`And how long did it stay dark?`],[`M`,`Less than two minutes. My little sister blinked and said she missed it.`],[`W`,`Ha! Would you go again?`],[`M`,`Of course. But next time I'll check the map before we book a hotel.`],[`Q`,`Why did the man's family go to Zaragoza?`]]},{qNo:15,stem:``,options:[`It's too much for him to try right now.`,`He should find someone to ride with him.`,`Five days is too long for the trip.`],answer:`A`,explanation:`【聽力稿】M: I've decided to ride my bike around Taiwan this summer. In five days!

Question: What does the woman really think of the man's plan?

【解析】女子沒有直說「你做不到」，但她用「很勇敢」委婉帶過，又算出一天要騎兩百公里（男子最多只騎過三十公里），還建議先從短程開始、「不用急」，可見她認為這個計畫目前對他來說太勉強。(B) 男子已經說他的表（堂）兄弟姊妹會一起去，女子並沒有建議要找人同行；(C) 女子的意思正好相反：一千公里五天騎完是「太趕」，不是天數太多。故選 (A)。`,transcript:[[`M`,`I've decided to ride my bike around Taiwan this summer. In five days!`],[`W`,`Five days? Well, that's certainly... brave. How far have you ridden in one day before?`],[`M`,`About thirty kilometers. To my grandma's house and back.`],[`W`,`And the whole trip is almost a thousand kilometers, isn't it? That's about two hundred a day.`],[`M`,`I'll train hard. And my cousin's going with me.`],[`W`,`Hmm. Maybe the two of you could start with something shorter first, like a weekend ride around Sun Moon Lake.`],[`M`,`You don't think I can do it?`],[`W`,`I didn't say that. I'm just saying there's no hurry.`],[`Q`,`What does the woman really think of the man's plan?`]]},{qNo:16,stem:``,options:[`In her classroom.`,`In the auditorium.`,`On the playground.`],answer:`A`,explanation:`【聽力稿】Good morning, everyone. As you know, the Asian Games in Aichi and Nagoya, Japan, ended on October fourth. Mr. Lee, our P.E. teacher, worked there as a volunteer on one of the cruise ships where some of the athletes stayed, and he'll tell us about it at next Monday's assembly. Usually, our assembly is on the playground at seven fifty, but the playground is being repaired, so this time it will be in the auditorium. The auditorium can't hold all of us at once, so seventh and eighth graders will go first, at eight. Ninth graders will have their turn at eight forty, after the younger students leave. Until then, ninth graders should stay in their classrooms and read quietly.
Question: It is eight fifteen next Monday. Where should a ninth grader be?

【解析】這次朝會改在禮堂，而且分兩梯：七、八年級八點進場，九年級要到八點四十分才進場，在那之前「留在教室」。8:15 時九年級還沒輪到，所以應該在教室。(B) 8:15 在禮堂的是七、八年級，九年級要 8:40 才去；(C) 平常朝會在操場，但操場整修中，這次不在操場。（2026 愛知–名古屋亞運於 9 月 19 日至 10 月 4 日舉行，部分選手住在郵輪上。）故選 (A)。`,transcript:[[`N`,`Good morning, everyone. As you know, the Asian Games in Aichi and Nagoya, Japan, ended on October fourth. Mr. Lee, our P.E. teacher, worked there as a volunteer on one of the cruise ships where some of the athletes stayed, and he'll tell us about it at next Monday's assembly. Usually, our assembly is on the playground at seven fifty, but the playground is being repaired, so this time it will be in the auditorium. The auditorium can't hold all of us at once, so seventh and eighth graders will go first, at eight. Ninth graders will have their turn at eight forty, after the younger students leave. Until then, ninth graders should stay in their classrooms and read quietly.`],[`Q`,`It is eight fifteen next Monday. Where should a ninth grader be?`]]},{qNo:17,stem:``,options:[`720 dollars.`,`880 dollars.`,`780 dollars.`],answer:`C`,explanation:`【聽力稿】M: Four tickets for the seven o'clock show, please.

某研究小組（虛構情境）建立一個「假設模型」：2025 年以後，每一年的出生數都是前一年的 r 倍，r 等於 2025 年出生數 ÷ 2024 年出生數。依此模型，哪一年的出生數會第一次少於 2016 年出生數的四分之一？`,options:[`2028 年`,`2032 年`,`2029 年`,`2030 年`],answer:`C`,explanation:`【解析】2016 年的四分之一＝208,440÷4＝52,110。r＝107,812÷134,856≈0.7995，每過一年乘以 r：2026 年≈86,192、2027 年≈68,907、2028 年≈55,089（仍多於 52,110）、2029 年≈44,041（少於 52,110），所以是 2029 年。(A) 是改用「每年減少相同人數 27,044」的等差模型（2028 年 26,680），不是題目的等比模型；(B) 是把四分之一的基準弄成 2025 年（107,812÷4），而不是 2016 年；(D) 是多算了一年（2029 年就已經少於 52,110）。故選 (C)。`},{qNo:5,stem:`有 9 張數字卡，分別寫著 1～9。小明從中任意抽出 2 張（不放回），第一張當十位數字、第二張當個位數字，組成一個二位數。他看了一眼後說：「十位數字比個位數字大。」在這個條件下，這個二位數是 4 的倍數的機率為何？`,options:[`1/9`,`4/9`,`1/4`,`2/9`],answer:`D`,explanation:`【解析】已知十位數字比個位數字大，可能的結果只剩：從 1～9 任取兩個不同數字、大的當十位，共 9×8÷2＝36 種，機會相等。其中是 4 的倍數的有 32、52、64、72、76、84、92、96，共 8 個（12、16、24、28、36、48、56、68 雖然也是 4 的倍數，但十位比個位小，不符合條件）。機率＝8/36＝2/9。(A) 是分母仍用全部的 9×8＝72 種，沒有把已知條件納入；(B) 是分子用了全部 16 個 4 的倍數，沒有排除十位比個位小的；(C) 是以為「每 4 個整數有 1 個 4 的倍數」。故選 (D)。`},{qNo:6,stem:`某隧道的截面是拋物線形（如附圖），兩側牆腳相距 16 公尺，路面中央畫有中線。工程人員在距離右側牆腳水平 2 公尺處，量得隧道頂部離地面 3.5 公尺。一輛寬 3 公尺、車頂為水平的貨車要在右側車道通過，車身必須與中線至少保持 1 公尺，而且車頂與隧道頂部之間在鉛直方向至少要留 0.5 公尺。這輛貨車的高度最多可以是多少公尺？`,options:[`6 公尺`,`5.5 公尺`,`7.375 公尺`,`約 3.72 公尺`],answer:`B`,explanation:`【解析】以地面中點為原點，兩牆腳是 (−8, 0)、(8, 0)，設 y＝a(64 − x²)。距右牆腳 2 公尺處 x＝6，3.5＝a(64 − 36)，a＝1/8，y＝8 − x²/8（最高 8 公尺）。隧道越往外越低，貨車應盡量靠中線行駛：車身左側在 x＝1、右側在 x＝4，限制車高的是右側 x＝4 處的高度 8 − 2＝6，再留 0.5 公尺，車高最多 5.5 公尺。(A) 是忘了保留 0.5 公尺；(C) 是用車身左側 x＝1 的高度計算，但右側的隧道比較低，會撞到；(D) 是讓貨車走在車道正中央（x＝2.5 到 5.5），右側只有 8 − 5.5²/8≈4.22 公尺高，這不是最好的行駛位置。故選 (B)。`,figure:`ai/903/math/q06_tunnel.png`},{qNo:7,stem:`如附圖，△ABC 中，AB＝13、AC＝15、BC＝14，I 是△ABC 的內心。過 I 作一直線平行 BC，分別交 AB、AC 於 D、E 兩點。DE 的長度為何？`,options:[`28/3`,`7`,`14/3`,`8`],answer:`A`,explanation:`【解析】作 A 到 BC 的高 AH，設 BH＝x：13² − x²＝15² − (14 − x)²，得 x＝5，AH＝√(13² − 5²)＝12，△ABC 面積＝14×12÷2＝84。內心到三邊的距離都是內切圓半徑 r，把△ABC 分成△IBC、△ICA、△IAB 三塊：84＝r×(13＋14＋15)÷2，r＝4。DE∥BC 且 DE 與 BC 的距離是 r＝4，所以 A 到 DE 的距離是 12 − 4＝8。△ADE 與△ABC 相似，DE：BC＝8：12，DE＝14×2/3＝28/3。(B) 是誤以為 DE 是中位線（I 不一定在高的中點）；(C) 是把相似比用成 r：AH＝4：12；(D) 是把 A 到 DE 的距離 8 當成 DE 的長。故選 (A)。`,figure:`ai/903/math/q07_incenter.png`},{qNo:8,stem:`如附圖，△ABC 的面積是 60。D 在 BC 上且 BD：DC＝2：1，E 是 AD 的中點，直線 BE 與 AC 交於 F 點。四邊形 EDCF（著色部分）的面積為何？`,options:[`15`,`50/3`,`16`,`40/3`],answer:`C`,explanation:`【解析】先求 AF：FC。過 D 作 DG∥BF 交 AC 於 G。在△CBF 中，DG∥BF，所以 CG：GF＝CD：DB＝1：2；在△ADG 中，E 是 AD 中點且 EF∥DG，所以 F 是 AG 中點，AF＝FG。設 CG＝k，則 GF＝2k、AF＝2k，AF：FC＝2k：3k＝2：3。△ADC 的面積＝60×1/3＝20（DC 是 BC 的 1/3）。△AEF 與△ADC 共用 ∠A，面積比＝(AE/AD)×(AF/AC)＝1/2×2/5＝1/5，所以△AEF＝4，四邊形 EDCF＝20 − 4＝16。(A) 是誤以為 F 也是 AC 的中點（AF：FC＝1：1，△AEF＝5）；(B) 是誤用 AF：FC＝1：2（△AEF＝10/3）；(D) 是誤用 AF：FC＝2：1（△AEF＝20/3）。故選 (C)。`,figure:`ai/903/math/q08_cevian.png`},{qNo:9,stem:`如附圖，正方形紙片 ABCD 的邊長為 12，M 是 CD 的中點。將紙片摺疊，使 A 點落在 M 點上，摺痕 EF 的兩端 E、F 分別在 AD、BC 上。摺痕 EF 的長度為何？`,options:[`3√5`,`12`,`15/2`,`6√5`],answer:`D`,explanation:`【解析】摺痕 EF 是 AM 的垂直平分線。設 DE＝y，則 EA＝12 − y，EM²＝y²＋6²，由 EA＝EM 得 (12 − y)²＝y²＋36，y＝4.5；同理設 CF＝z，FA²＝12²＋(12 − z)²、FM²＝6²＋z²，得 z＝10.5。E、F 的高度差 10.5 − 4.5＝6，水平距離 12，EF＝√(12²＋6²)＝6√5。（另解：正方形中，一條連接一組對邊的線段若垂直於另一條連接另一組對邊的線段，兩者等長，所以 EF＝AM＝√(12²＋6²)＝6√5。）(A) 是 AM 的一半；(B) 是誤以為摺痕和邊一樣長（水平方向的長度）；(C) 是 AE 的長 12 − 4.5＝7.5。故選 (D)。`,figure:`ai/903/math/q09_squarefold.png`},{qNo:10,stem:`如附圖，四邊形 ABCD 的四個頂點都在同一個圓上，AB＝AD，對角線 AC 與 BD 交於 E 點。若 ∠AEB＝70°、∠CBD＝30°，則 ∠BAD 的度數為何？`,options:[`100°`,`80°`,`110°`,`140°`],answer:`A`,explanation:`【解析】∠AEB 是△EBC 的外角：∠AEB＝∠EBC＋∠ECB，所以 ∠ACB＝70° − 30°＝40°。AB＝AD，等弦所對的圓周角相等，∠ACD＝∠ACB＝40°（AC 平分 ∠BCD），∠BCD＝80°。圓內接四邊形對角互補，∠BAD＝180° − 80°＝100°。(B) 是 ∠BCD，忘了要求的是它的對角；(C) 是 180° − 70°，把 ∠BAD 誤當成 ∠AEB 的補角；(D) 是 2×70°，把 ∠AEB 誤當成圓周角再換成圓心角。故選 (A)。`,figure:`ai/903/math/q10_cyclic.png`},{qNo:11,stem:`如附圖，甲、乙兩村在一條筆直河岸的同一側，甲村到河岸的距離是 3 公里，乙村到河岸的距離是 5 公里，H、K 分別是兩村在河岸上的垂足，HK＝6 公里。自來水公司要在河岸上設一個抽水站 P，再分別鋪設直線水管到兩村，提出兩個方案：方案一：P 的位置使兩條水管的總長最短；方案二：P 的位置使 P 到兩村的距離相等。兩個方案中 P 的位置相距多少公里？`,options:[`3/4 公里`,`7/12 公里`,`4/3 公里`,`25/12 公里`],answer:`D`,explanation:`【解析】方案一：作甲村對河岸的對稱點甲′，P甲＋P乙＝P甲′＋P乙 ≥ 甲′乙，P 在甲′乙與河岸的交點時最短。兩個直角三角形相似，HP：PK＝3：5，HP＝6×3/8＝9/4。方案二：設 HP＝x，P 到甲村的距離平方＝x²＋3²，P 到乙村的距離平方＝(6 − x)²＋5²，兩者相等：x²＋9＝x² − 12x＋61，x＝13/3。兩個 P 都在 H 的同一側，相距 13/3 − 9/4＝25/12 公里。(A) 是把方案二的 P 誤取為 HK 的中點 3（算成 3 − 9/4），但兩村到河岸的距離不同，中點到兩村並不等距；(B) 是方案一的比例弄反（HP：PK＝5：3，HP＝15/4）；(C) 是把方案一的 P 誤取為 HK 中點（13/3 − 3）。故選 (D)。`,figure:`ai/903/math/q11_river.png`},{qNo:12,stem:`一個無蓋的長方體玻璃容器，內部長 30 公分、寬 20 公分、高 40 公分，平放在桌上時水深 10 公分。現在以容器底面一條長 20 公分的邊 P 為轉軸，慢慢把容器向這一側傾斜（轉軸始終貼著桌面），直到水面恰好碰到這一側容器口的邊緣 Q 為止（如附圖，為傾斜後的側面圖）。此時水面與容器底面的交線 R 和轉軸 P 的距離 PR 是多少公分？`,options:[`30 公分`,`15/2 公分`,`15 公分`,`10 公分`],answer:`C`,explanation:`【解析】水量＝30×20×10＝6000 立方公分。若水面還蓋滿整個底面，側面看是梯形，一側水深 40、另一側水深 h，則 (40＋h)×30÷2×20＝6000，h＝−20＜0，不可能，所以底面只被蓋住一部分，側面的水是直角三角形 PQR（∠P＝90°，PQ＝40）。40×PR÷2×20＝6000，PR＝15 公分。(A) 是以為水還蓋滿整個底面；(B) 是三角形面積忘了除以 2；(D) 是以為傾斜後 PR 仍等於原來的水深。故選 (C)。`,figure:`ai/903/math/q12_tilt.png`},{qNo:13,stem:`某攤販（虛構情境）賣每份成本 30 元的炒麵。他記錄了不同售價時一天「想買的份數」：
| 售價（元） | 50 | 55 | 60 | 65 |
| 想買的份數 | 200 | 190 | 180 | 170 |
假設想買的份數與售價的關係一直維持表中的規律（售價每提高 1 元，想買的份數就減少相同的數量），售價為整數元。但他每天最多只能準備 100 份炒麵，賣完就收攤。售價訂為多少時，一天的利潤最大？最大利潤是多少？`,options:[`每份 100 元，每天利潤 7000 元`,`每份 90 元，每天利潤 7200 元`,`每份 90 元，每天利潤 6000 元`,`每份 75 元，每天利潤 4500 元`],answer:`A`,explanation:`【解析】想買的份數 q＝300 − 2p（每提高 5 元少 10 份，即每提高 1 元少 2 份），實際賣出的份數是 q 與 100 中較小的那個。(1) 售價 p ≤ 100 時，q ≥ 100，每天都賣完 100 份，利潤＝100(p − 30)，p 越大越多，p＝100 時 7000 元。(2) 售價 p ≥ 100 時，q ≤ 100，利潤＝(p − 30)(300 − 2p)＝−2(p − 90)²＋7200，頂點 p＝90 不在這個範圍內，p 越大利潤越小，所以也是 p＝100 時最大，(70)(100)＝7000 元。因此售價 100 元，最大利潤 7000 元。(B) 是忽略每天只能準備 100 份，直接用頂點 p＝90（那時有 120 人想買，但只能賣 100 份）；(C) 售價 90 元時實際只賣 100 份，利潤 6000 元，不是最大；(D) 是用「營收 p(300 − 2p) 最大」的售價 75 元，賣 100 份只賺 4500 元。故選 (A)。`},{qNo:14,stem:`農場要用總長 40 公尺的圍籬圍出一塊長方形菜園，菜園的一邊靠著一面長 18 公尺的牆（靠牆的那一邊不用圍籬，且不能超出牆的長度），另外三邊用圍籬圍起來，並在與牆平行的那一邊留一個寬 2 公尺的門（門的部分不用圍籬），如附圖。菜園的面積最大是多少平方公尺？`,options:[`441/2 平方公尺`,`200 平方公尺`,`198 平方公尺`,`216 平方公尺`],answer:`D`,explanation:`【解析】設垂直於牆的邊長為 x，與牆平行的邊長為 y。圍籬用在兩個 x 和扣掉門的 y：2x＋(y − 2)＝40，y＝42 − 2x。面積＝x(42 − 2x)＝−2(x − 10.5)²＋220.5，頂點在 x＝10.5，但那時 y＝21 超過牆長 18，不可行。限制 y ≤ 18 即 x ≥ 12，在 x ≥ 12 的範圍內面積隨 x 增大而變小，所以 x＝12、y＝18 時最大，面積 12×18＝216 平方公尺。(A) 是只看頂點、忽略牆長只有 18 公尺；(B) 是忘了門與牆長的條件，用 y＝40 − 2x 的頂點；(C) 是考慮了牆長卻忘了門不用圍籬（y＝40 − 2x ≤ 18，x＝11 時 11×18）。故選 (D)。`,figure:`ai/903/math/q14_fence.png`},{qNo:15,stem:`A、B 兩地相距 12 公里。附圖是甲、乙兩人某天上午離 A 地的距離與時刻的關係圖：甲從 A 地出發步行前往 B 地，途中休息了一段時間；乙騎自行車從 B 地出發前往 A 地。乙到達 A 地後，立刻以原來的速率掉頭往 B 地方向騎，而甲則一直依圖中休息後的速率繼續走。從 8:30 到 10:30，兩人恰好相距 2 公里的時刻共有幾個？`,options:[`3 個`,`2 個`,`5 個`,`4 個`],answer:`D`,explanation:`【解析】由圖：甲每小時走 4 公里，9:00～9:30 在 4 公里處休息，之後每小時 4 公里；乙 8:30 從 12 公里處出發，每小時 12 公里，9:30 到 A 後掉頭。分段看兩人的距離：(1) 8:30～9:00 兩人相向，距離由 10 公里每小時減少 16 公里，9:00 時恰為 2 公里（甲在 4、乙在 6）。(2) 9:00～9:30 甲休息，乙繼續往 A，9:10 兩人相遇，之後乙越離越遠，9:20 時乙在 2 公里處，又相距 2 公里；9:30 相距 4 公里。(3) 9:30 以後乙掉頭追甲，距離每小時縮小 8 公里，9:45 相距 2 公里，10:00 追上；之後乙超前，10:15 又相距 2 公里，10:30 相距 4 公里。共 9:00、9:20、9:45、10:15 四個時刻。(A) 多半是漏了 9:20（以為甲休息時兩人不會再拉開）或漏了 10:15（以為追上後就結束）；(B) 只算了兩人「接近」時的 9:00 與 9:45；(C) 是把 9:00 算了兩次（它同時是第一段的終點和第二段的起點）。故選 (D)。`,figure:`ai/903/math/q15_travel.png`},{qNo:16,stem:`某班（虛構情境）15 位同學的數學小考成績登記如下：

後來發現 2 號同學的成績應為 85 分，被誤登記成 35 分。更正後，下列哪一個統計量與更正前相同？（四分位數的求法：資料由小到大排列，中位數以下的資料的中位數為第一四分位數，中位數以上的資料的中位數為第三四分位數。）`,options:[`四分位距`,`平均數`,`中位數`,`全距`],answer:`A`,explanation:`【解析】更正前由小到大：35、55、58、61、64、68、70、72、75、78、80、82、86、90、98，中位數 72，第一四分位數＝前 7 筆的中位數 61，第三四分位數＝後 7 筆的中位數 82，四分位距 21，全距 98 − 35＝63。更正後：55、58、61、64、68、70、72、75、78、80、82、85、86、90、98，中位數 75，第一四分位數 64，第三四分位數 85，四分位距仍是 85 − 64＝21，全距變成 98 − 55＝43。雖然兩個四分位數都改變了，但它們都恰好增加 3，差不變。(B) 總分增加 50，平均數增加 50/15；(C) 85 移到中位數的上方，中位數由 72 變成 75；(D) 最小值由 35 變成 55，全距變小。故選 (A)。`},{qNo:17,stem:`2026 年 4 月，美國 NASA 的 Artemis II 任務載著 4 名太空人繞過月球，飛越月球背面時與月球表面最近的距離約 6,545 公里。已知月球直徑約 3,470 公里，地球直徑約 12,740 公里；地球中心到月球中心的距離以平均值約 384,400 公里估算。看一個遠方的球體時，它「看起來的大小」可以用這個方法比較：在眼睛前方固定距離處放一片透明板，球體直徑在板上投影的長度，與「球體直徑 ÷ 球體中心到眼睛的距離」成正比（相似三角形）。假設在最接近月球時，太空船、月球中心、地球中心恰好在同一直線上（太空船在月球外側）。從太空船上看，月球看起來的大小約是地球看起來大小的幾倍？`,options:[`約 16 倍`,`約 47 倍`,`約 13 倍`,`約 0.27 倍`],answer:`C`,explanation:`【解析】太空船到月球中心＝6,545＋3,470÷2＝8,280 公里；到地球中心＝8,280＋384,400＝392,680 公里。月球的投影長度與 3,470÷8,280 成正比，地球的與 12,740÷392,680 成正比，兩者相比＝(3,470÷8,280)÷(12,740÷392,680)≈0.419÷0.0324≈12.9，約 13 倍，所以月球會把地球完全擋住。(A) 是把太空船到月面的 6,545 公里當成到月球中心的距離（沒有加上月球半徑）；(B) 只比較了距離 392,680÷8,280，忘了兩個球的大小不同；(D) 只比較了直徑 3,470÷12,740，忘了距離的影響。故選 (C)。`},{qNo:18,stem:`2026 年米蘭－科爾蒂納冬季奧運共有 116 個比賽項目。下表是官方獎牌榜的前六名（官方排名：先比金牌數，相同再比銀牌數，再比銅牌數）：

若只就這六國，改用「金牌 x 分、銀牌 2 分、銅牌 1 分」（x 是大於 2 的整數）的積分由高到低排名。要讓荷蘭的積分排在這六國的第 3 名（只低於兩國、且不與他國同分），x 最小是多少？`,options:[`x 最小是 6`,`無論 x 是多少，荷蘭都不可能排在第 3 名`,`x 最小是 4`,`x 最小是 10`],answer:`B`,explanation:`【解析】荷蘭的積分 10x＋2×7＋3＝10x＋17，義大利的積分 10x＋2×6＋14＝10x＋26。兩國金牌數相同，x 不論多大，金牌部分都一樣多，義大利永遠比荷蘭多 9 分；挪威（18 金）與美國（12 金、12 銀、9 銅，積分 12x＋33）也一定比荷蘭高。所以荷蘭前面至少有挪威、美國、義大利三國，不可能排第 3 名。(A) 只和德國比較（10x＋17＞8x＋28，x＞5.5），忘了義大利；(C) 只和法國比較（10x＋17＞8x＋24，x＞3.5）；(D) 是以為 x 只要大於兩國銀、銅積分的差 9 就能反超，但兩國金牌一樣多，提高 x 並不會拉開差距。故選 (B)。`},{qNo:19,stem:`小安一年內預計去游泳 n 次。若只比較「年度會員」與「十次券和單次票的最省搭配」兩種做法，n 最少要是多少，年度會員才會比另一種做法省錢（而且次數再多也都是會員較省）？`,options:[`16 次`,`14 次`,`11 次`,`13 次`],answer:`B`,explanation:`【解析】十次券＋單次票的最省搭配：10 次 1000 元，超過 10 次的部分若不到 9 次就用單次票（9 次單次票 1080 元已超過一本十次券）。13 次：1000＋3×120＝1360 元，會員 600＋13×60＝1380 元，還是十次券省；14 次：1000＋4×120＝1480 元，會員 600＋840＝1440 元，會員較省，逐一檢查 14～23 次都是會員較省；之後次數每多 10 次，十次券搭配單次票要多付 1000 元（多買一本），會員只多付 600 元，差距每 10 次再拉大 400 元，所以會員一直比較省。n 至少 14。(A) 是把十次券看成每次 100 元連續計算（600＋60n＜100n，n＞15），忽略剩下的次數要用較貴的單次票；(C) 只和單次票比較；(D) 13 次時十次券搭配單次票仍便宜 20 元。故選 (B)。`},{qNo:20,stem:`小傑一年中只在 6、7、8 月去游泳（季卡可以涵蓋這 3 個月），每個月都去 k 次。若要「買季卡」比其他任何做法（任何方案或搭配）都省錢，k 最小是多少？`,options:[`10`,`8`,`11`,`7`],answer:`C`,explanation:`【解析】3 個月共 3k 次。季卡 2400 元固定。與年度會員比：600＋60×3k＞2400，k＞10，k＝10 時兩者都是 2400 元，一樣貴，季卡沒有比較省，所以 k 至少 11。與十次券搭配比：k＝11 時 33 次要 3000＋3×120＝3360 元，季卡較省；單次票更貴。所以 k 最小是 11。(A) 是 k＝10 時季卡與會員同價，並不是「比較省」；(B) 只和十次券比較（k＝8 時 24 次要 2480 元）而忘了年度會員；(D) 只和單次票比較（360k＞2400）。故選 (C)。`},{qNo:21,stem:`依上述規則，四位同學由前到後的排序為何？`,options:[`丁、甲、丙、乙`,`丁、丙、乙、甲`,`丙、乙、甲、丁`,`丁、乙、甲、丙`],answer:`B`,explanation:`【解析】總積分：甲 7＋6＋6＋5＋7＝31，加寫作 0.8 得 31.8；乙 6＋7＋7＋6＋5＝31，31.8；丙 7＋7＋4＋7＋6＝31，31.8；丁 6＋6＋7＋6＋6＝31，加寫作 1 得 32.0。丁總積分最高排第一（比序只在總積分相同時才用）。甲、乙、丙同為 31.8：A++ 科數丙 3 科、甲 2 科、乙 2 科，丙在前；甲乙再比數學，乙 A++（7 點）＞甲 A+（6 點），乙在前。所以是丁、丙、乙、甲。(A) 是把比序的順序倒過來，從 (3) 國文開始比（甲、丙國文 A++ 在前，再比數學甲在丙前）；(C) 是忘了加寫作分數，四人五科都是 31 點，全部進入比序；(D) 是把比序 (1)(2) 的順序弄反，先比數學。故選 (B)。`},{qNo:22,stem:`另一位同學戊的國文 A++、英語 A+、自然 A+、社會 A，數學等級與寫作級分都還沒公布。後來戊和上表四人一起排序，結果戊恰好排在丙之後、乙之前。戊的數學等級與寫作級分可能是下列何者？`,options:[`數學 A++，寫作 6 級分`,`數學 A+，寫作 6 級分`,`數學 A++，寫作 5 級分`,`數學 A++，寫作 4 級分`],answer:`C`,explanation:`【解析】戊其他四科 7＋6＋6＋5＝24 點。乙、丙的總積分都是 31.8，丙 A++ 3 科排在乙前面。戊要在丙之後、乙之前，總積分只能也是 31.8，再靠比序夾在中間。數學 A++、寫作 5 級分：24＋7＋0.8＝31.8。和丙比：A++ 科數戊 2 科（國文、數學）＜丙 3 科，戊在丙之後；和乙比：A++ 都是 2 科、數學都是 7 點，國文戊 A++＞乙 A+，戊在乙之前，符合。(A) 總積分 32.0，高於丙，會排在丙之前（甚至在丁之前，因為和丁同分時 A++ 科數 2＞1）；(B) 總積分 24＋6＋1＝31.0，低於乙；(D) 總積分 24＋7＋0.6＝31.6，也低於乙。故選 (C)。`},{qNo:23,stem:`依上述賽制，整屆比賽（含分組賽與淘汰賽）共有幾場？`,options:[`47 場`,`48 場`,`51 場`,`87 場`],answer:`A`,explanation:`【解析】每組 5 隊單循環：5×4÷2＝10 場，4 組共 40 場。淘汰賽：八強賽 4 場、四強賽 2 場、冠軍賽 1 場，共 7 場（8 隊淘汰到剩冠軍要淘汰 7 隊）。全部 40＋7＝47 場。(B) 是多算了季軍戰，但題目說沒有季軍戰；(C) 是把八強賽算成 8 場（40＋8＋2＋1＝51），但 8 隊兩兩一場只有 4 場；(D) 是把每組算成 5×4＝20 場，每場被兩隊各算了一次。故選 (A)。`},{qNo:24,stem:`依上表計算三隊的「失分 ÷ 防守出局數」，下列敘述何者正確？`,options:[`韓國的比值最小，澳洲次之，中華最大`,`韓國的比值最小，澳洲與中華的比值相同`,`三隊的比值都相同`,`韓國與中華的比值相同，都比澳洲小`],answer:`B`,explanation:`【解析】韓國：失分 5（對中華）＋2（對澳洲）＝7，出局數 30＋27＝57，比值 7/57；澳洲：失分 0＋7＝7，出局數 27＋27＝54，比值 7/54；中華：失分 3＋4＝7，出局數 24＋30＝54，比值 7/54。三隊失分都是 7，韓國防守出局數最多，比值最小，排第 2 晉級八強；澳洲與中華同為 7/54（之後再以自責分比序）。(A) 是把中華對韓國那場自己的得分 5 誤當成失分（3＋5＝8，比值 8/54）；(C) 是只比失分（都是 7 分），忽略出局數；(D) 是沒看表中的出局數，以為打 9 局就是 27 個出局數，把中華算成 27＋30＝57（中華對澳洲那場只防守 24 個出局數，因為主隊澳洲領先，9 局下半不用打）。故選 (B)。`},{qNo:25,stem:`回到 3 月 9 日韓國與澳洲比賽開打之前（前兩場結果如上表）。假設這場打滿 9 局、雙方的防守出局數都是 27，且澳洲得 2 分。韓國至少要得幾分，才能依此規則確定排在澳洲與中華的前面？`,options:[`3 分`,`7 分`,`6 分`,`8 分`],answer:`B`,explanation:`【解析】設韓國得 k 分（k ≥ 3 才會贏球，三隊才會同為 2 勝 2 敗）。韓國比值＝(5＋2)/(30＋27)＝7/57；中華比值＝7/54，不受這場影響；澳洲比值＝(0＋k)/(27＋27)＝k/54。韓國要比澳洲小：7/57＜k/54，k＞54×7/57≈6.63，所以 k 至少 7（7/57 也小於中華的 7/54）。實際比賽韓國正好以 7：2 獲勝而晉級。(A) 是以為只要贏球就好，但 3：2 時澳洲比值 3/54 比韓國小；(C) 是把 6.63 無條件捨去成 6，k＝6 時澳洲 6/54≈0.111 仍比韓國 7/57≈0.123 小；(D) 8 分當然也可以，但不是「至少」。故選 (B)。`}],verification:[`2026-10-09 依 SPEC_AI2_AI3.md 出題；每題答案由 tools/ai_sets/ai3_math.py 以精確運算求得並以 check 驗證，9 張附圖依數據繪製。第一版兩個模型盲解 25/25 一致，但以 114 年真題校準後難度與 AI-2 相同（Opus 3.36），改寫 9 題加難（第 3、4、5、6、10、11、15、18、22 題）並重繪第 6 題圖。`,`2026-10-09 加難後重新獨立作答：Claude Opus 25/25、Claude Sonnet 25/25 與答案卷一致，0 題有異議；兩者皆實測 9 張附圖與數據相符。難度（同一評分標準）：AI-1 1.76、114 年真題 2.76、AI-2 3.36、本卷 Opus 3.48／Sonnet 3.60。`,`2026-10-09 獨立事實查核：2026 世界棒球經典賽 C 組戰績與同分排名規則、米蘭冬奧獎牌榜前六名、Artemis II 最近月距離、台灣出生數逐筆以網路來源確認；第 17 題註明以地月平均距離估算。tools/check_ai_set.py 0 問題。`,`2026-10-09 最終複查（定稿前）：獨立稽核者（Claude Opus）拿答案與解析逐題核對（答案唯一性、計算、事實、附圖、文字），另由 Claude Opus 與 Claude Sonnet 各自重新盲解全卷，答案全部與答案卷一致；稽核指出的解析措辭、誘答與解析不一致、真實事件的相對時間（改為確切年份）與文言異文（以多版本比對後採通行本）均已修正，修正過的題目再由兩個模型重新盲解一致；答案卷未變動。`]},ro={set:`AI-3`,year:903,subject:`自然`,title:`AI-3 自然模擬卷（挑戰）`,difficulty:`挑戰`,note:`由 AI 依會考自然科（生物、理化、地科）命題範圍編寫的挑戰卷，非會考真題，難度接近會考最難的題型。題目以長篇材料、多來源圖表整合、實驗設計評估、陌生情境的遷移應用與跨科整合為主，並以 2025–2026 年的真實科學新聞為素材（來源見 topics）；誘答選項取自常見迷思。數值題答案由程式計算驗證（tools/ai_sets/ai3_science.py），附圖由程式依題目數據繪製。`,topics:[`2025/3/28 緬甸規模 7.7 地震（USGS；震源深度約 10 km；實皆斷層、緬甸板塊與巽他板塊水平錯動；曼谷約 1000 km 外興建中大樓倒塌、軟弱黏土放大長週期搖晃）: https://en.wikipedia.org/wiki/2025_Myanmar_earthquake`,`阿提米絲 2 號（2026/4/1 升空；4/6 距月面最近約 6545 km；離地球最遠約 406771 km，超越阿波羅 13 號 400171 km；月球背面通訊中斷約 40 分鐘；4/10 降落太平洋）: https://en.wikipedia.org/wiki/Artemis_II`,`NOAA 茂納羅亞大氣二氧化碳年平均濃度 2015–2025: https://gml.noaa.gov/webdata/ccgg/trends/co2/co2_annmean_mlo.txt`,`WMO（2026/1）確認 2025 年全球均溫比 1850–1900 年高約 1.44°C、名列第二或第三熱，2023–2025 為最熱三年，年初與年末為反聖嬰: https://wmo.int/news/media-centre/wmo-confirms-2025-was-one-of-warmest-years-record`,`星際彗星 3I/ATLAS（2025/7/1 發現；速率約 22.1 萬→24.6 萬 km/h；近日點約 2.1 億 km、1.4 AU；最接近地球約 2.7 億 km）: https://science.nasa.gov/solar-system/comets/3i-atlas/3i-atlas-facts-and-faqs/`,`馬太鞍溪堰塞湖（薇帕颱風後崩塌形成；天然壩高約 200 m、壩體約 2 億 m³、最大蓄水約 9100 萬 m³）: https://www.cna.com.tw/news/ahel/202509230031.aspx`,`馬太鞍溪堰塞湖 9/23 溢流後壩頂下切約 80 m、蓄水量由 9100 萬噸降至約 2300 萬噸（農業部水保署）: https://newtalk.tw/news/view/2025-09-24/995468`,`2025 諾貝爾生理學或醫學獎：周邊免疫耐受、調節性 T 細胞、FOXP3: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12646648/`,`2026/8/12 日全食（全食帶經格陵蘭、冰島西部、西班牙北部；食甚約 17:47 UTC，西班牙接近日落）: https://en.wikipedia.org/wiki/Solar_eclipse_of_August_12,_2026`],groups:[{from:26,to:28,passage:`2025 年 3 月 28 日中午 12 時 50 分（當地時間），緬甸中部發生規模 7.7 的地震（美國地質調查所資料），震源深度約 10 公里。地震發生在實皆斷層上：這條斷層大致呈南北走向，是緬甸板塊與巽他板塊的交界，兩側的岩塊沿著斷層 下列推論何者最合理？`,options:[`膽汁中含有分解脂肪的酵素，所以試管二的 pH 值下降最多`,`pH 值下降越多，表示被分解的脂肪越少`,`膽汁本身不能分解脂肪，但能使脂肪酶分解脂肪的速率加快`,`比較試管一和試管三，可知膽汁能加速脂肪的分解`],answer:`C`,explanation:`【解析】試管三只有膽汁，pH 不變，表示膽汁本身不能分解脂肪；試管二（脂肪酶＋膽汁）比試管一（只有脂肪酶）的 pH 下降更多，表示產生的脂肪酸較多，膽汁使脂肪酶的作用變快（膽汁能把大油滴乳化成小油滴，增加與酵素接觸的面積）。(A) 若膽汁含有分解脂肪的酵素，試管三的 pH 應該下降；(B) 脂肪酸越多 pH 越低，pH 下降越多表示分解的脂肪越多；(D) 試管一和三，一支只有脂肪酶、一支只有膽汁，兩個條件都不同，應比較試管一和二。故選 (C)。`},{qNo:8,stem:`右圖是某島上一種捕食者與其主要獵物（被捕食者）20 年間族群數量的變化。下列推論何者最合理？`,options:[`兩種動物的數量同時增加、同時減少`,`捕食者數量的高峰約比被捕食者的高峰晚 2 年出現，因為獵物增加後捕食者的食物充足，才大量繁殖`,`捕食者數量最多的時候，被捕食者的數量也最多`,`被捕食者數量下降的原因，一定是牠們的食物（植物）大量減少`],answer:`B`,explanation:`【解析】被捕食者的高峰約在第 2、10、18 年，捕食者的高峰約在第 4、12 年，每次都晚約 2 年。獵物多時捕食者食物充足而增加；捕食者增加後吃掉較多獵物，獵物減少，捕食者隨後也因食物不足而減少。(A) 兩條曲線的高峰時間錯開，不是同時增減；(C) 捕食者最多時（例如第 4 年），被捕食者已在減少，不是最多；(D) 圖中顯示捕食者增加時獵物減少，被捕食的壓力也是可能原因，不能斷定「一定」是食物減少。故選 (B)。`,figure:`ai/903/science/q08.png`},{qNo:9,stem:`某地大面積種植同一個品種的香蕉，所有植株都是用母株地下莖長出的「吸芽」分株繁殖而來。後來一種由土壤傳播的真菌病害侵入，短時間內使大片蕉園的植株幾乎全部枯萎。下列四項推論：

下列推論何者正確？`,options:[`所需時間越長，表示反應速率越快`,`第三組比第一組快，是因為溫度升高使最後生成的硫的總量變多`,`比較第三組和第四組，可以得知溫度對反應速率的影響`,`在 25°C 時，硫代硫酸鈉濃度加倍，所需時間約減半，表示反應速率約加倍`],answer:`D`,explanation:`【解析】第四、一、二組都在 25°C，濃度（每公升 0.05→0.1→0.2 莫耳）依序加倍，所需時間 120→60→30 秒依序減半；「×」消失代表生成了一定量的硫，所需時間減半表示反應速率加倍。(A) 生成相同量的硫，所需時間越短反應越快；(B) 溫度升高使反應變快，但硫代硫酸鈉的量相同，最後生成的硫總量不會因溫度而增加；(C) 第三組和第四組的濃度與溫度都不同，有兩個變因，無法判斷溫度的影響，應比較第一組和第三組。故選 (D)。`},{qNo:18,stem:`在海平面附近做托里切利實驗，水銀柱的垂直高度為 76 公分。小傑到某座高山上重做，水銀柱的垂直高度變為 60 公分。若在這座高山上改用水代替水銀做同樣的實驗（水銀的密度是水的 13.6 倍，不考慮水蒸氣的影響），管內水柱的垂直高度約為多少？`,options:[`約 10.3 公尺`,`約 4.4 公分`,`約 0.6 公尺`,`約 8.2 公尺`],answer:`D`,explanation:`【解析】液柱產生的壓力＝高度 × 密度，必須等於當地的大氣壓力。山上大氣壓力相當於 60 公分水銀柱；水的密度只有水銀的 1/13.6，水柱高度要是水銀柱的 13.6 倍：60 × 13.6＝816 公分，約 8.2 公尺。(A) 10.3 公尺是海平面附近（76 公分水銀柱）的水柱高度，山上氣壓較小；(B) 換成密度較小的液體，液柱要更高才能產生相同壓力，不是除以 13.6；(C) 液柱高度與液體密度有關，水柱不會和水銀柱一樣高。故選 (D)。`},{qNo:19,stem:`甲、乙兩個燈泡分別標示「110 V，100 W」和「110 V，40 W」。把兩個燈泡串聯後接在 110 V 的電源上（假設燈泡的電阻不隨溫度改變），下列敘述何者正確？`,options:[`甲燈泡比乙燈泡亮，因為甲燈泡的標示功率較大`,`兩個燈泡一樣亮，因為串聯時通過兩燈泡的電流相同`,`乙燈泡比甲燈泡亮，因為串聯時電流相同，電阻較大的乙消耗的電功率較大`,`甲燈泡比乙燈泡亮，因為甲燈泡的電阻較大`],answer:`C`,explanation:`【解析】由 P＝V²／R，甲的電阻＝110² ÷ 100＝121 Ω，乙的電阻＝110² ÷ 40＝302.5 Ω。串聯時電流相同，P＝I²R，電阻大的乙消耗的電功率較大，所以乙比較亮（約 20.4 W 對 8.2 W），兩者都比標示功率小。(A) 標示功率是在 110 V 下單獨使用時的功率，串聯時兩燈泡都分不到 110 V；(B) 電流相同但電阻不同，消耗的電功率不同，亮度也不同；(D) 標示功率較大的甲，電阻反而較小。故選 (C)。`},{qNo:20,stem:`工人用平行斜面、大小 300 牛頓的拉力，把重 600 牛頓的箱子沿著長 5 公尺、高 2 公尺的斜面等速拉到頂端。工人對箱子作的功比箱子增加的重力位能多，多出的能量都用於克服斜面的摩擦力。箱子沿斜面滑動時受到的摩擦力約為多少？`,options:[`300 牛頓`,`0 牛頓`,`240 牛頓`,`60 牛頓`],answer:`D`,explanation:`【解析】工人作功＝300 × 5＝1500 焦耳；箱子增加的重力位能＝600 × 2＝1200 焦耳；克服摩擦力所作的功＝1500 − 1200＝300 焦耳。摩擦力 × 移動距離＝300，摩擦力＝300 ÷ 5＝60 牛頓。(A) 300 牛頓是工人的拉力，拉力同時要克服重力沿斜面的分量和摩擦力；(B) 等速運動只表示合力為 0，並不表示沒有摩擦力；(C) 240 牛頓是箱子重力沿斜面方向的分量（600 × 2 ÷ 5），拉力 300 牛頓減去它才是摩擦力。故選 (D)。`},{qNo:21,stem:`小昕把質量都是 100 公克的金屬塊甲、乙放在沸水中加熱到 100°C，再分別放入兩個各裝有 100 公克、20°C 水的保溫杯中。達到熱平衡後，放甲的那杯水溫為 24°C，放乙的那杯水溫為 30°C（不計熱量散失，水的比熱為 1 cal/g·°C）。下列敘述何者正確？`,options:[`乙的比熱較大，約為甲的 2.7 倍`,`甲的比熱較大，約為乙的 2.7 倍`,`乙的比熱較大，約為甲的 2.5 倍`,`乙的比熱較大，約為甲的 1.25 倍`],answer:`A`,explanation:`【解析】金屬放出的熱量＝水吸收的熱量。甲：100 × s甲 × (100 − 24)＝100 × 1 × (24 − 20)，s甲＝4 ÷ 76 ≈ 0.053；乙：100 × s乙 × (100 − 30)＝100 × 1 × (30 − 20)，s乙＝10 ÷ 70 ≈ 0.143。s乙 ÷ s甲 ≈ 2.71，約 2.7 倍。(B) 使水溫升高較少的甲放出的熱量較少，比熱較小，說反了；(C) 2.5 是只比較水吸收的熱量（10 ÷ 4），忽略了兩金屬降溫的幅度不同（76°C 與 70°C）；(D) 1.25 是直接比較最後的溫度（30 ÷ 24），溫度比不是比熱比。故選 (A)。`},{qNo:22,stem:`將 200 公克濃度 10% 的食鹽水與 300 公克濃度 20% 的食鹽水混合，再加熱蒸發掉 100 公克的水（過程中沒有晶體析出）。最後溶液的重量百分濃度為多少？`,options:[`20%`,`16%`,`15%`,`30%`],answer:`A`,explanation:`【解析】溶質：200 × 10%＋300 × 20%＝20＋60＝80 公克；蒸發後溶液：200＋300 − 100＝400 公克。濃度＝80 ÷ 400 × 100%＝20%。(B) 16% 是 80 ÷ 500，忘了扣除蒸發掉的水；(C) 15% 是直接平均兩個濃度，忽略兩者質量不同，也沒有考慮蒸發；(D) 濃度不能直接相加。故選 (A)。`},{qNo:23,stem:`某颱風由東向西移動，經過某測站附近。颱風影響期間，測站依序記錄到的風向為：東北風 → 東風 → 東南風 → 南風。已知北半球颱風的風以逆時針方向繞著中心旋轉吹入。颱風中心最可能從測站的哪一側通過？`,options:[`從測站的北側通過`,`從測站的南側通過`,`正好通過測站上空`,`無法判斷，因為颱風各處的風向都相同`],answer:`B`,explanation:`【解析】逆時針旋轉的颱風，在中心北側吹東風、東側吹南風、西側吹北風、南側吹西風。颱風由東向西前進，若中心從測站南側通過：起初中心在測站東南方，測站位於中心的西北側，吹東北風；中心經過測站正南方時，吹東風；中心移到測站西南方時，測站位於中心的東北側，吹東南風；最後測站在中心東側，吹南風，與紀錄相符（風向依順時針方向轉變）。(A) 若中心從北側通過，測站位於中心南側，風向會依序為西北風→西風→西南風，以逆時針方向轉變；(C) 中心通過時會經歷風力突然減弱的颱風眼，前後風向幾乎相反，不會是逐步轉變；(D) 颱風的風繞中心旋轉，不同位置的風向不同，正可用來判斷中心的位置。故選 (B)。`},{qNo:24,stem:`2026 年 8 月 12 日發生日全食，全食帶經過格陵蘭、冰島西部和西班牙北部；西班牙看到全食時，太陽已接近西方地平線。這次日食的「食甚」約發生在世界標準時間 17 時 47 分，臺灣時間比世界標準時間快 8 小時。下列敘述何者正確？`,options:[`這天的月相接近滿月；臺灣看不到這次日食，因為食甚時臺灣正值深夜`,`這天的月相接近新月；日全食發生時，地球上所有正值白天的地區都能看到太陽被完全遮住`,`這天的月相接近新月；臺灣看不到這次日食，因為食甚時臺灣正值 8 月 13 日凌晨約 1 時 47 分`,`這天的月相接近新月；臺灣看不到這次日食，是因為食甚發生在臺灣時間 8 月 12 日上午 9 時 47 分，太陽太低`],answer:`C`,explanation:`【解析】日食發生時月球位於太陽與地球之間，月球亮面背向地球，月相為新月。世界標準時間 17:47 加 8 小時為臺灣時間 01:47，已跨到 8 月 13 日凌晨，臺灣處於地球的夜半球，看不到太陽，當然看不到日食。(A) 滿月時地球位於太陽和月球之間，可能發生的是月食；(B) 月球的本影在地面只掃過一條狹窄的「全食帶」，帶外的白天地區最多只看到日偏食，甚至完全看不到；(D) 臺灣時間比世界標準時間快 8 小時，應加 8 小時而不是減 8 小時。故選 (C)。`},{qNo:25,stem:`甲、乙兩地的岩層由下而上依序如下表（兩地岩層都沒有倒轉）。化石 B 是分布很廣、但只在很短的地質年代中生存的生物（標準化石），兩地含 B 的頁岩可視為同一時期沉積。

下列哪一項推論「可以確定」成立？`,options:[`甲地的石灰岩，比乙地含化石 D 的砂岩先沉積`,`甲地含化石 A 的砂岩，比乙地含化石 D 的砂岩先沉積`,`乙地的礫岩，一定比甲地的石灰岩晚沉積`,`甲、乙兩地的頁岩是在不同的年代沉積的`],answer:`B`,explanation:`【解析】依疊置定律，同一地點下層較老。甲地的 A 砂岩在 B 頁岩之下，比 B 時期早；乙地的 D 砂岩在 B 頁岩之上，比 B 時期晚，所以 A 砂岩一定比 D 砂岩先沉積。(A) 甲地石灰岩和乙地 D 砂岩都在 B 頁岩之上，只知道兩者都比 B 晚，無法比較彼此先後；(C) 乙地礫岩和甲地石灰岩也都只能確定比 B 晚，先後無法確定；(D) 兩地頁岩含相同的標準化石 B，可視為同一時期沉積。故選 (B)。`},{qNo:26,stem:`實皆斷層所在的板塊交界屬於哪一種類型？這類交界有什麼特徵？`,options:[`聚合性板塊交界；一個板塊隱沒到另一個板塊下方，地震多為深源`,`錯動性板塊交界；兩板塊水平錯開，地震多為淺源，通常不會形成海溝`,`張裂性板塊交界；兩板塊互相分離，岩漿上湧形成新的地殼`,`錯動性板塊交界；兩板塊互相擠壓，形成高山與海溝`],answer:`B`,explanation:`【解析】文中說兩側岩塊沿斷層「水平錯動」，屬於錯動性板塊交界。這類交界沒有板塊隱沒，地震多發生在淺處（本次震源深度約 10 公里），也不會形成海溝。(A) 隱沒是聚合性交界的特徵，與「水平錯動」不符，本次震源深度也很淺；(C) 兩板塊分離是張裂性交界；(D) 錯動性交界的兩板塊是水平錯開，不是互相擠壓，擠壓形成高山或海溝是聚合性交界的特徵。故選 (B)。`},{qNo:27,stem:`根據上文，有人提出下列四項推論：
