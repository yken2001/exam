——《世說新語·德行》`,translation:`管寧和華歆一起在園子裡鋤菜，看見地上有一塊金子，管寧照樣揮動鋤頭，把它當成瓦片石頭一樣看待；華歆卻把金子撿起來，再丟掉。又有一次，兩人同坐在一張蓆子上讀書，有坐著華麗車子、戴著官帽的貴人從門前經過，管寧照舊讀書，華歆卻丟下書跑出去看。管寧就把蓆子割開，分開坐，說：「你不是我的朋友。」`},{from:27,to:28,passage:`閱讀下文，回答 27～28 題：
陳太丘與友期行，期日中，過中不至，太丘舍去，去後乃至。元方時年七歲，門外戲。客問元方：「尊君在不？」答曰：「待君久不至，已去。」友人便怒曰：「非人哉！與人期行，相委而去。」元方曰：「君與家君期日中，日中不至，則是無信；對子罵父，則是無禮。」友人慚，下車引之。元方入門不顧。
——《世說新語·方正》`,translation:`陳太丘和朋友約好一起出門，約在中午。過了中午朋友還沒來，陳太丘就先走了，他走了以後朋友才到。陳太丘的兒子元方當時七歲，正在門外玩耍。客人問元方：「你父親在家嗎？」元方回答：「等您很久您都沒來，他已經走了。」朋友就生氣地說：「真不是人啊！和別人約好一起走，卻丟下別人自己先走了。」元方說：「您和我父親約在中午，中午沒到，就是不守信用；對著兒子罵他的父親，就是沒有禮貌。」朋友感到慚愧，下車想拉元方，元方走進家門，頭也不回。`},{from:29,to:30,passage:`閱讀下文，回答 29～30 題：
夏天走在沒有樹的馬路上，腳下的柏油路面熱得發燙；轉進兩旁種滿大樹的巷子，卻好像走進了另一個季節。這不只是心理作用。研究人員在炎熱的午後測量發現，陽光直射的柏油路面溫度可以比樹蔭下的地面高出十幾度。
樹木降溫的祕密有兩個：一是樹冠擋住了陽光，讓地面不容易被曬熱；二是葉子會把水分散發到空氣中，水分蒸發時帶走熱量，就像我們流汗時會覺得涼快一樣。
因此，許多城市開始把「種樹」當作對抗高溫的方法。與其在熱浪來時開更強的冷氣，不如讓城市多一些綠蔭。`},{from:31,to:32,passage:`下表為紫外線指數的分級與防護建議，閱讀後回答 31～32 題：

外婆的菜園不大，就在老房子後面。小時候，我最喜歡跟著她去摘菜。她總是彎著腰，一邊拔草一邊對著菜說話：「今天長得真好。」那時我覺得好笑，菜又聽不懂。
後來外婆的腳不好，菜園慢慢荒了，長滿了野草。去年暑假，我和媽媽回去，把雜草一根一根拔掉，種下外婆最愛的空心菜。每天傍晚，我學著她的樣子，蹲在菜旁邊澆水，也小聲地說：「今天長得真好。」
空心菜長大的那天，我們炒了一盤端到外婆床前。她吃了一口，笑得眼睛都瞇成一條線。我忽然明白，外婆當年說給菜聽的話，其實也是說給自己聽的——那是對生活最溫柔的期待。`},{from:36,to:37,passage:`閱讀下列新詩，回答 36～37 題：

有人說，現在有了 AI，學生再也不必辛苦讀書了。我不同意這種看法。
AI 確實很方便，它能在幾秒內整理資料、回答問題，甚至寫出一篇文章。但是，如果我們只是把答案抄下來，就像請別人替我們上健身房：器材被用過了，肌肉卻沒有變強。學習的價值，本來就在思考的過程。
更重要的是，AI 不一定總是對的。它有時會用很有自信的語氣，說出錯誤的資訊。如果我們沒有足夠的知識，就無法判斷它說的是對是錯。
所以，AI 應該是我們學習的幫手，而不是代替我們學習的人。懂得提出好問題、懂得查證答案的人，才能真正讓 AI 為自己所用。`}],items:[{qNo:1,stem:`下列文句，何者用字完全正確？`,options:[`大家迫不急待地想知道比賽結果。`,`他在比賽中再接再厲，終於拿下冠軍。`,`做事要按步就班，不可以急躁。`,`謊言被拆穿後，他反而變本加利地狡辯。`],answer:`B`,explanation:`【解析】「再接再厲」正確。「迫不急待」應為「迫不及待」；「按步就班」應為「按部就班」；「變本加利」應為「變本加厲」。故選 (B)。`},{qNo:2,stem:`下列文句中的成語，何者使用最恰當？`,options:[`他的歌聲繞梁三日，讓觀眾聽得昏昏欲睡。`,`弟弟做事三心二意，所以每件事都完成得很好。`,`同學遇到困難時，他袖手旁觀，真是見義勇為。`,`颱風過後，看著滿目瘡痍的果園，農民一籌莫展。`],answer:`D`,explanation:`【解析】「一籌莫展」指一點辦法也沒有，符合農民面對災損的情境。「繞梁三日」是稱讚歌聲美妙，與「昏昏欲睡」矛盾；「三心二意」是做事不專心，與「完成得很好」矛盾；「袖手旁觀」與「見義勇為」意思相反。故選 (D)。`},{qNo:3,stem:`下列「」中的「花」字，何者的意思與其他三者不同？`,options:[`學校的「花」園裡開滿了杜鵑`,`他「花」了三年才完成這本書`,`這件衣服「花」掉我一個月的零用錢`,`做這份報告很「花」時間`],answer:`A`,explanation:`【解析】「花園」的「花」指植物的花；其他三個「花」都是「耗費、用掉」的意思。故選 (A)。`},{qNo:4,stem:`下列文句，何者使用了「譬喻」的修辭？`,options:[`窗外的風輕輕地唱著歌。`,`他餓得可以吞下一頭牛。`,`她的笑容像春天的陽光一樣溫暖。`,`人生的意義是什麼？就是不斷地學習。`],answer:`C`,explanation:`【解析】以「像」連接，把笑容比喻成春天的陽光，是譬喻。「風唱著歌」是擬人；「吞下一頭牛」是誇飾；先提問再自己回答是設問。故選 (C)。`},{qNo:5,stem:`下列文句，何者使用了「擬人」的修辭？`,options:[`小草從土裡探出頭來，好奇地看著這個世界。`,`月亮像一艘彎彎的小船。`,`他的嗓門大得全校都聽得見。`,`天空為什麼是藍色的？因為陽光被空氣散射了。`],answer:`A`,explanation:`【解析】小草「探出頭來」「好奇地看著」，把小草當成人來描寫，是擬人。「月亮像小船」是譬喻；「全校都聽得見」是誇飾；先提問再自己回答是設問。故選 (A)。`},{qNo:6,stem:`下列文句，何者標點符號的使用完全正確？`,options:[`你喜歡吃蘋果，還是香蕉。`,`我買了書、筆、和橡皮擦。`,`他說：我明天一定會來。`,`老師問：「你們準備好了嗎？」`],answer:`D`,explanation:`【解析】引用別人說的話，要用冒號加引號，問句結尾用問號，(老師問：「你們準備好了嗎？」)正確。「還是」的選擇問句結尾應用問號；「、和」不應連用，應寫成「書、筆和橡皮擦」；引用說話內容缺少引號。故選 (D)。`},{qNo:7,stem:`下列文句，何者沒有語病？`,options:[`經過老師的指導，使我的作文進步了很多。`,`經過老師的指導，我的作文進步了很多。`,`我們要避免不再犯同樣的錯誤。`,`這本書的內容大約有三百頁左右。`],answer:`B`,explanation:`【解析】「經過……，使……」會造成句子缺少主語；「避免不再犯」是「避免」和「不再」重複否定，意思變成要再犯；「大約」與「左右」意思重複。故選 (B)。`},{qNo:8,stem:`朋友新開了一家診所，下列哪一個題辭最適合用來祝賀他？`,options:[`美輪美奐`,`百年好合`,`妙手回春`,`春風化雨`],answer:`C`,explanation:`【解析】「妙手回春」稱讚醫術高明，適合祝賀診所開業或醫師。「美輪美奐」用於新居落成；「百年好合」用於婚禮；「春風化雨」用於稱讚教師。故選 (C)。`},{qNo:9,stem:`寫信給老師時，信末的結尾敬辭最適合用下列何者？`,options:[`敬請　教安`,`敬請　福安`,`順頌　時綏`,`祝　生意興隆`],answer:`A`,explanation:`【解析】寫給師長的結尾敬辭用「敬請　教安」。「敬請　福安」用於祖父母、父母等尊長；「順頌　時綏」多用於平輩或一般往來；「祝　生意興隆」用於商界。故選 (A)。`},{qNo:10,stem:`關於唐代的近體詩，下列敘述何者正確？`,options:[`近體詩不講究平仄和押韻`,`絕句每首四句，律詩每首八句`,`律詩每首只有四句`,`絕句一定是每句七個字`],answer:`B`,explanation:`【解析】近體詩包括絕句和律詩，講究平仄、押韻；絕句每首四句，律詩每首八句，每句可以是五言或七言。故選 (B)。`},{qNo:11,stem:`《論語·學而》：子曰：「學而時習之，不亦說乎？有朋自遠方來，不亦樂乎？人不知而不慍，不亦君子乎？」其中「人不知而不慍」的意思是下列何者？`,options:[`自己不懂的事，也不必在乎`,`別人不知道的事，不要隨便說出去`,`不懂道理的人，常常容易生氣`,`別人不了解我，我也不生氣怨恨`],answer:`D`,explanation:`【解析】「人不知」指別人不了解自己，「慍」是生氣、怨恨。整句的意思是：別人不了解我，我也不生氣怨恨，這不也是君子嗎？故選 (D)。`},{qNo:12,stem:`《論語·學而》「學而時習之，不亦說乎」中的「說」字，意思是下列何者？`,options:[`說話、講述`,`解說、說明`,`高興、喜悅`,`勸說、說服`],answer:`C`,explanation:`【解析】「說」在這裡通「悅」，是高興、喜悅的意思：學習之後時常複習，不也是一件快樂的事嗎？故選 (C)。`},{qNo:13,stem:`「這家小店的蛋糕，吃過的人都說好，只是每天排隊的人實在太多了。」根據這段話，最能推論出下列何者？`,options:[`這家店的蛋糕很受歡迎`,`這家店的蛋糕很便宜`,`這家店每天都很早關門`,`這家店的蛋糕不好吃`],answer:`A`,explanation:`【解析】吃過的人都說好，而且每天排很多人，可以推論蛋糕很受歡迎。文中沒有提到價格和營業時間。故選 (A)。`},{qNo:14,stem:`下列哪一個成語，和「一石二鳥」的意思最接近？`,options:[`一波三折`,`一落千丈`,`一言為定`,`一舉兩得`],answer:`D`,explanation:`【解析】「一石二鳥」比喻做一件事得到兩種好處，和「一舉兩得」意思相近。「一波三折」比喻事情進行不順利；「一落千丈」比喻地位或情況急遽下降；「一言為定」表示說定了不再改變。故選 (D)。`},{qNo:15,stem:`「與其坐在那裡抱怨，不如起身動手去做。」這句話的意思最接近下列何者？`,options:[`抱怨和行動一樣重要`,`實際行動比抱怨更好`,`應該先抱怨再行動`,`最好什麼都不要做`],answer:`B`,explanation:`【解析】「與其……不如……」表示比較之後選擇後者，所以說話者認為起身行動比抱怨更好。故選 (B)。`},{qNo:16,stem:`「河上有一（　）古老的石橋。」空格中最適合填入哪一個量詞？`,options:[`首`,`匹`,`座`,`棵`],answer:`C`,explanation:`【解析】橋、山、城等用「座」。「首」用於詩歌，「匹」用於馬、布，「棵」用於樹木。故選 (C)。`},{qNo:17,stem:`下列哪一組詞語的意思相反？`,options:[`凝視／注視`,`寧靜／安靜`,`驕傲／自滿`,`慷慨／吝嗇`],answer:`D`,explanation:`【解析】「慷慨」是大方、不吝惜財物，「吝嗇」是小氣，兩者意思相反。其他三組都是意思相近的詞。故選 (D)。`},{qNo:18,stem:`「他說話很有分寸，從不讓人難堪。」句中「有分寸」的意思最接近下列何者？`,options:[`說話很大聲`,`說話做事恰當，不過分`,`說話很有趣`,`常常說別人的壞話`],answer:`B`,explanation:`【解析】「分寸」指說話做事的適當標準或限度，「有分寸」就是恰到好處、不過分，所以不會讓人難堪。故選 (B)。`},{qNo:19,stem:`下列文句，何者使用了「誇飾」的修辭？`,options:[`我等你等到頭髮都白了。`,`天上的星星一閃一閃地眨著眼睛。`,`她的眼睛像兩顆明亮的星星。`,`春天來了，花開了，鳥叫了。`],answer:`A`,explanation:`【解析】等一個人不可能等到頭髮變白，是故意誇大等待時間很長，屬於誇飾。「星星眨眼睛」是擬人；「眼睛像星星」是譬喻；最後一句是排比式的描寫。故選 (A)。`},{qNo:20,stem:`「杞人憂天」這個成語，最適合用來形容下列哪一種人？`,options:[`關心國家大事的人`,`喜歡觀察天象的人`,`為不可能發生的事情而擔心的人`,`做事小心謹慎的人`],answer:`C`,explanation:`【解析】「杞人憂天」出自杞國有人擔心天會塌下來，比喻不必要的、多餘的憂慮。故選 (C)。`},{qNo:21,stem:`「閱讀不只是為了考試。一本好書能帶我們走進別人的生命，看見從未去過的地方，也讓我們更了解自己。」這段話的主旨是下列何者？`,options:[`閱讀最主要的目的是考試`,`只有旅行才能看見世界`,`讀書太多會讓人不了解自己`,`閱讀能開闊視野，也能幫助認識自己`],answer:`D`,explanation:`【解析】作者說閱讀「不只是為了考試」，還能認識別人、看見新地方、了解自己，主旨是閱讀的多重價值。故選 (D)。`},{qNo:22,stem:`下列哪一個詞語，用來形容「非常專心、沒有分心」最恰當？`,options:[`心不在焉`,`全神貫注`,`東張西望`,`漫不經心`],answer:`B`,explanation:`【解析】「全神貫注」指集中全部精神在一件事上。「心不在焉」「漫不經心」都是不專心；「東張西望」是到處張望。故選 (B)。`},{qNo:23,stem:`「這次的比賽，我們雖然輸了，卻學到了團隊合作的重要。」句中「雖然……卻……」表示前後文句是哪一種關係？`,options:[`因果關係`,`並列關係`,`轉折關係`,`假設關係`],answer:`C`,explanation:`【解析】「雖然……卻……」表示前後意思相反或出乎意料，是轉折關係：輸了比賽，但仍有收穫。故選 (C)。`},{qNo:24,stem:`下列文句中的（　），何者應填入「的」？`,options:[`這是一本很有趣（　）書。`,`他跑（　）很快。`,`大家都在安靜（　）看書。`,`他高興（　）跳了起來。`],answer:`A`,explanation:`【解析】「的」用在名詞前面修飾名詞（有趣的書）。「跑得很快」用「得」連接補語；「安靜地看書」用「地」修飾動作；「高興（　）跳了起來」可以填「地」（高興地跳）或「得」（高興得跳了起來），但不能填「的」。故選 (A)。`},{qNo:25,stem:`管寧為什麼要「割席分坐」？`,options:[`他覺得蓆子太小，兩個人坐不下`,`他認為華歆看重名利，讀書也不專心，志趣和自己不同`,`華歆把撿到的金子據為己有`,`華歆鋤菜時不小心傷了他`],answer:`B`,explanation:`【解析】華歆看到金子會撿起來（又丟掉），看到達官貴人經過就放下書去看，表示他羨慕名利、讀書不專心。管寧認為兩人志趣不同，所以割席絕交。文中說華歆「捉而擲去之」，是撿起來又丟掉，並沒有據為己有。故選 (B)。`},{qNo:26,stem:`從文中管寧的表現，最能看出他具有下列哪一種人格特質？`,options:[`貪圖富貴，喜歡熱鬧`,`粗心大意，不拘小節`,`重視朋友，寬容大度`,`淡泊名利，專心向學`],answer:`D`,explanation:`【解析】管寧看見金子「與瓦石不異」，看見貴人經過仍「讀如故」，表現出不受名利誘惑、專心讀書的品格。他因志趣不同而割席，並不是寬容大度。故選 (D)。`},{qNo:27,stem:`元方認為父親的朋友犯了哪兩項過錯？`,options:[`太早到達，而且說話太小聲`,`忘了帶禮物，而且遲到`,`沒有信用，而且沒有禮貌`,`不肯等待，而且大聲喧嘩`],answer:`C`,explanation:`【解析】元方說：「日中不至，則是無信；對子罵父，則是無禮。」朋友遲到是無信，當著兒子的面罵父親是無禮。故選 (C)。`},{qNo:28,stem:`文中友人說「相委而去」，意思最接近下列何者？`,options:[`丟下別人，自己先離開`,`互相推託，不肯出門`,`委託別人代為前往`,`彼此約定，一同離去`],answer:`A`,explanation:`【解析】「委」是捨棄、丟下的意思，「相委而去」指丟下我（朋友自己）先走了，所以朋友才會生氣。故選 (A)。`},{qNo:29,stem:`這篇文章主要在說明什麼？`,options:[`柏油路面的製作方法`,`夏天應該多開冷氣`,`流汗對身體的好處`,`樹木能讓城市降溫的原因與重要性`],answer:`D`,explanation:`【解析】文章先說明樹蔭下比較涼，再解釋樹木降溫的兩個原因，最後提出城市應該多種樹，主旨是樹木的降溫作用。故選 (D)。`},{qNo:30,stem:`文中把「葉子散發水分」比作「我們流汗」，主要是為了說明下列何者？`,options:[`樹木也需要喝水`,`水分蒸發時會帶走熱量`,`人流汗時容易口渴`,`葉子會像人一樣走路`],answer:`B`,explanation:`【解析】作者用流汗會覺得涼快，來類比葉子散發水分的降溫原理：水分蒸發時會帶走熱量。故選 (B)。`},{qNo:31,stem:`某天中午的紫外線指數是 9，依照上表，屬於哪一個等級？`,options:[`中量級`,`高量級`,`過量級`,`危險級`],answer:`C`,explanation:`【解析】指數 9 落在「8～10」的範圍，屬於過量級。故選 (C)。`},{qNo:32,stem:`承上題，當天小明想在中午十二時到操場打球。依照上表的建議，下列做法何者最恰當？`,options:[`中午天氣好，正適合去曬太陽`,`改到下午四時以後再去打球，並做好防曬`,`只要戴帽子就可以中午在操場打球`,`紫外線指數 9 不需要任何防護`],answer:`B`,explanation:`【解析】過量級除了戴帽子、撐陽傘、擦防曬乳外，還要避免在上午十時至下午二時外出曬太陽。中午十二時正在這段時間內，所以最好改到下午較晚的時間，並做好防曬。故選 (B)。`},{qNo:33,stem:`這篇文章主要在表達作者對外婆的哪一種情感？`,options:[`責怪外婆沒有照顧好菜園`,`羨慕外婆有很大的菜園`,`擔心外婆吃不慣空心菜`,`懷念與體會外婆對生活的溫柔態度`],answer:`D`,explanation:`【解析】作者回憶跟外婆摘菜，後來重整菜園、學外婆對菜說話，最後體會外婆對生活溫柔的期待，表達的是懷念與體會。故選 (D)。`},{qNo:34,stem:`文中作者也對菜說「今天長得真好」，這個舉動最主要表現出什麼？`,options:[`作者延續了外婆照顧菜園的心意`,`作者覺得對菜說話很好笑`,`作者想讓菜長得比外婆種的大`,`作者在模仿外婆開玩笑`],answer:`A`,explanation:`【解析】小時候作者覺得外婆對菜說話很好笑，長大後自己也這樣做，表示作者理解並延續了外婆用心照顧、期待生活的心意。故選 (A)。`},{qNo:35,stem:`文末「笑得眼睛都瞇成一條線」，主要是在描寫外婆的什麼？`,options:[`外婆的視力變差了`,`外婆覺得菜太鹹了`,`外婆感到非常開心、欣慰`,`外婆想睡覺了`],answer:`C`,explanation:`【解析】「笑得眼睛都瞇成一條線」形容笑得很開心。外婆吃到作者親手種的菜，感到開心又欣慰。故選 (C)。`},{qNo:36,stem:`這首詩把「時間」比喻成什麼？`,options:[`一條看不見的河`,`一扇窗口`,`外公的黑髮`,`一隻手掌`],answer:`A`,explanation:`【解析】第一句「時間是一條看不見的河」，以「是」把時間比喻成河流，強調時間不停流逝。故選 (A)。`},{qNo:37,stem:`詩的最後說「卻只撈到／一掌心的　今天」，最能表達作者的哪一種體會？`,options:[`河水很冷，不適合游泳`,`昨天比今天更重要`,`只要努力就能讓時間倒流`,`過去無法挽回，應該珍惜現在`],answer:`D`,explanation:`【解析】作者想撈回流走的過去（外公的黑髮、自己的童年），卻只能握住「今天」，表示過去留不住，能把握的只有現在，所以要珍惜當下。故選 (D)。`},{qNo:38,stem:`小芳在活動期間讀完了 12 本不同的書，每本都寫了符合規定的心得。依照規定，她可以兌換的最高一級獎勵是下列何者？`,options:[`一張書籤`,`在頒獎典禮上接受表揚`,`一本精美筆記本`,`一本新書`],answer:`C`,explanation:`【解析】12 本書可以蓋 12 個章，已達到 10 個章的標準，最高可兌換精美筆記本；還不到 20 個章，無法在頒獎典禮上受表揚。公告中沒有「新書」這項獎勵。故選 (C)。`},{qNo:39,stem:`下列哪一種做法，符合這個活動的規定？`,options:[`同一本書讀三次，請老師蓋三個章`,`讀完一本書後，自己寫下 60 字的心得請老師蓋章`,`把網路上別人的心得抄下來交給老師`,`在明年 2 月讀完書後再領取護照`],answer:`B`,explanation:`【解析】規定每讀完一本書寫 50 字以上的心得、自己撰寫，60 字的自寫心得符合規定。同一本書只能蓋一個章；不可抄襲；活動只到 12 月 31 日。故選 (B)。`},{qNo:40,stem:`作者對「有了 AI，學生就不必讀書」這個說法，抱持什麼態度？`,options:[`非常贊同`,`沒有表示意見`,`認為學生應該完全不使用 AI`,`不贊同，認為學生仍需要自己學習`],answer:`D`,explanation:`【解析】作者開頭就說「我不同意這種看法」，並主張 AI 是學習的幫手，不能代替我們學習。作者並沒有反對使用 AI。故選 (D)。`},{qNo:41,stem:`文中「就像請別人替我們上健身房」這個比喻，主要是為了說明下列何者？`,options:[`只抄答案而不思考，自己的能力不會進步`,`上健身房很浪費時間`,`AI 可以幫我們鍛鍊身體`,`健身器材容易損壞`],answer:`A`,explanation:`【解析】別人替我們運動，我們的肌肉不會變強；同樣地，只抄 AI 的答案、自己不思考，能力也不會進步。故選 (A)。`},{qNo:42,stem:`根據本文，下列哪一種人最能「讓 AI 為自己所用」？`,options:[`完全相信 AI 所有答案的人`,`會提出好問題，並且會查證答案的人`,`只用 AI 寫作業的人`,`從不使用任何科技產品的人`],answer:`B`,explanation:`【解析】文末說「懂得提出好問題、懂得查證答案的人，才能真正讓 AI 為自己所用」。故選 (B)。`}],verification:[`2026-09-26 文言文逐字取自維基文庫：《世說新語·德行》管寧割席、《世說新語·方正》陳太丘與友期、《論語·學而》首章；《呂氏春秋》刻舟求劍因維基文庫僅有轉引版本、字句不一，未採用。`,`2026-09-26 自我檢查後修正：第 24 題（的／得／地）原誘答選項也可填「的」→ 換掉；第 12 題原為「承上題」→ 改為獨立題；第 38 題用詞改為「最高一級獎勵」。`,`2026-09-26 獨立作答者 1（Claude Opus，看不到答案）42/42 與答案卷一致，0 題有異議；提醒第 5 題誘答選項「書是我們最好的朋友」可能被部分老師視為擬人 → 換成設問句。`,`2026-09-26 獨立作答者 2（Claude Sonnet）42/42 一致；標記第 25 題原文應為「出觀」→ 查證維基文庫全文：「歆廢書出看」26 筆（含《世說新語》本書、《太平御覽》《藝文類聚》《北堂書鈔》），「出觀」0 筆，原文無誤，不修改。`,`2026-09-26 修改後第 5 題：獨立作答者 3（Claude Opus）通過。tools/check_ai_set.py 0 問題。`,`2026-10-09 最終複查（定稿前）：獨立稽核者（Claude Opus）拿答案與解析逐題核對（答案唯一性、計算、事實、附圖、文字），另由 Claude Opus 與 Claude Sonnet 各自重新盲解全卷，答案全部與答案卷一致；稽核指出的解析措辭、誘答與解析不一致、真實事件的相對時間（改為確切年份）與文言異文（以多版本比對後採通行本）均已修正，修正過的題目再由兩個模型重新盲解一致；答案卷未變動。`]},Ha={set:`AI-1`,year:901,subject:`英文`,title:`AI-1 英語（閱讀）模擬卷`,note:`由 AI 依心測中心英語科命題架構（單題：語言成分；題組：篇章理解，含克漏字）與素養導向原則（取材於生活經驗與時事）編寫，非會考真題。`,topics:[`太陽能海水淡化：https://www.sciencedaily.com/news/earth_climate/environmental_science/`,`巴布亞企鵝為四個物種（DNA 研究）：https://www.sciencedaily.com/`,`2026 國際少年運動會（花蓮）：https://en.wikipedia.org/wiki/List_of_sporting_events_in_Taiwan`,`臺北國際龍舟錦標賽、學生使用 AI、手機使用時間、高溫與行道樹：生活議題`],groups:[{from:20,to:21,passage:`Wenhua Junior High School Library

Nina：哈！好，那我就穿我那件舊的藍色 T 恤。`},{from:24,to:26,passage:`About one out of four people in the world does not have enough clean water to drink. The ocean has plenty of water, but it is too salty to drink. Turning seawater into fresh water is called desalination. It is not a new idea, but most desalination plants use a lot of electricity. They also leave behind very salty water, called brine. When brine goes back into the sea, it can hurt the fish and plants living there.
Recently, scientists have been working on a new kind of machine that uses only sunlight. The sun heats the seawater, and the water turns into steam. The steam then cools down and becomes fresh water. What makes the machine special is what happens to the salt. Instead of staying in the water, the salt turns into solid pieces that can be collected easily. So almost no brine is left.
The machine is still small, and it cannot make as much water as a big plant yet. But the scientists believe it could one day help islands and villages that are near the sea but far from power lines.`,translation:`全世界大約每四個人就有一個人沒有足夠的乾淨飲用水。海洋裡有很多水，但太鹹了不能喝。把海水變成淡水叫做「海水淡化」。這不是新的想法，但大部分的海水淡化廠要用很多電，而且會留下非常鹹的水，叫做「鹵水」。鹵水排回海裡時，可能會傷害住在那裡的魚和植物。
最近，科學家正在研發一種只用陽光的新機器。太陽把海水加熱，水變成水蒸氣，水蒸氣冷卻後就變成淡水。這台機器特別的地方在於鹽的去向：鹽不會留在水裡，而是變成容易收集的固體，所以幾乎不會留下鹵水。
這台機器目前還很小，產水量還比不上大型的淡化廠。但科學家相信，有一天它可以幫助那些靠近海邊、卻離電線很遠的島嶼和村莊。`},{from:27,to:28,passage:`Dear Jun,
Guess what? My city, Hualien, is hosting the International Children's Games in August 2026! Young athletes from many countries will come here to take part in sports like swimming and table tennis. My school asked students to be volunteers, and I said yes right away.
My job is to help visitors find their way around the stadium. I've been practicing my English every night, and I've also learned to say "welcome" in five languages. My teacher says the most important thing is to smile, because a smile needs no translation.
You told me your cousin plays table tennis. If she comes to Taiwan for the Games, tell her to look for me. I'll be the one in the yellow volunteer shirt!
Your friend,
Pei-yu`,translation:`親愛的 Jun：

我的工作是幫訪客在體育館裡找路。我每天晚上都在練英文，也學會用五種語言說「歡迎」。老師說最重要的是微笑，因為微笑不需要翻譯。
你說過你的表姊（妹）打桌球。如果她來臺灣參加比賽，叫她來找我。我會是穿黃色志工衣的那一個！
你的朋友
佩瑜`},{from:29,to:31,passage:`Last month, Class 8-3 asked 120 students at their school how many hours (counted in whole hours) they spend on their phones on a school day. They also asked what the students mostly use their phones for.
| Hours a day | Number of students |
| Less than 1 hour | 18 |
| 1–2 hours | 42 |
| 3–4 hours | 39 |
| 5 hours or more | 21 |
Top uses: 1. Watching videos 2. Chatting with friends 3. Playing games 4. Doing homework
After seeing the results, the class started a "Phone-Free Dinner" challenge. For two weeks, students put their phones in another room during dinner. Many of them said they talked more with their families. One student said, "I found out my dad was a great singer in high school! I never knew that before."`,translation:`上個月，八年三班詢問了學校的 120 位學生，上學日每天花幾個小時（以整數小時計）使用手機，也問了他們主要用手機做什麼。
每天使用時數｜學生人數
少於 1 小時｜18
1–2 小時｜42
3–4 小時｜39
5 小時以上｜21
最常見的用途：1. 看影片 2. 和朋友聊天 3. 玩遊戲 4. 寫作業
看到結果後，這個班級發起了「無手機晚餐」挑戰。兩個星期內，學生吃晚餐時把手機放在另一個房間。很多人說他們和家人聊得更多了。有一位學生說：「我發現我爸爸高中時是很厲害的歌手！我以前從來都不知道。」`},{from:32,to:34,passage:`For a long time, people thought all gentoo penguins belonged to one species. Gentoos are easy to spot: they have a white patch above each eye and a bright orange beak. They live on islands near Antarctica.
But a new study shows that the story is not so simple. Scientists studied the DNA of gentoos from different islands. They found four groups that are different enough to be called separate species. One of them lives only on a few far-away islands in the Indian Ocean. The groups look almost the same, but they have lived apart for a very long time, so their genes have slowly changed.
This discovery is not just interesting; it is also important. If there are four species instead of one, each species has fewer members than scientists thought. That means some of them may need more protection. "You can't protect something if you don't know it exists," one scientist said.
* species 物種；DNA 去氧核醣核酸（生物的遺傳物質）；genes 基因；beak 鳥嘴`,translation:`長久以來，人們認為所有的巴布亞企鵝都屬於同一個物種。巴布亞企鵝很好認：牠們每隻眼睛上方都有一塊白斑，還有鮮橘色的嘴巴。牠們住在南極附近的島嶼上。
但一項新研究顯示事情沒有那麼簡單。科學家研究了來自不同島嶼的巴布亞企鵝的 DNA，發現其中有四個族群彼此差異大到可以算是不同的物種。其中一種只住在印度洋上幾座遙遠的島嶼。這些族群外表幾乎一樣，但牠們已經分開生活了非常久，所以基因慢慢改變了。
這項發現不只有趣，也很重要。如果是四個物種而不是一個，每個物種的數量就比科學家原本以為的少，這表示其中有些可能需要更多保護。一位科學家說：「如果你不知道某樣東西存在，你就無法保護它。」`},{from:35,to:39,passage:`More and more students are using AI chatbots to help them with homework. Some teachers worry that students will just copy the answers __35__ thinking for themselves. Others believe AI can be a useful tool if students use it in the right way.
Ms. Lin, an English teacher, lets her students use AI, but she has one rule: "Ask the AI to explain, not to write." For example, if a student __36__ understand a grammar point, the student can ask the chatbot for more examples. But the student __37__ write the essay on his or her own.
Ms. Lin also reminds her students that AI is not always right. "Sometimes AI gives wrong answers in a very confident way," she says. "So you should always check __38__ answers with a book or a website you can trust."
Most of her students agree with her rule. "Using AI this way is like having a patient tutor," says one student. "It never gets angry, __39__ I ask the same question ten times."`,translation:`越來越多學生用 AI 聊天機器人幫忙寫作業。有些老師擔心學生只會照抄答案，而不是自己思考。也有人認為，只要學生用對方法，AI 可以是很有用的工具。
英文老師林老師讓學生使用 AI，但她有一條規則：「請 AI 解釋，不要請它代寫。」例如，如果學生不懂某個文法觀念，可以請聊天機器人多舉一些例子，但作文還是必須自己寫。
林老師也提醒學生，AI 不一定是對的。她說：「AI 有時會用非常有自信的口氣給出錯誤的答案，所以你一定要用書本或可信的網站查證它的答案。」
她的學生大多同意這條規則。一位學生說：「這樣用 AI 就像有一位很有耐心的家教。就算我把同一個問題問十次，它也從不生氣。」`},{from:40,to:43,passage:`Last summer was the hottest summer in my town's history. On some days, the temperature went above 38°C, and older people were told to stay at home in the afternoon. My grandfather, who loves taking walks, felt like a bird in a cage.
One evening, he took me to the small park near our home. "Feel this," he said, standing under a big tree. It was much cooler there. "When I was your age, this whole street was full of trees like this one. Then the city cut most of them down to make the road wider."
That night, I searched online and learned that the shade from trees keeps the ground much cooler than the ground in the sun. Trees also give off water through their leaves, and this cools the air around them. I told my class about it, and we wrote a letter to the mayor. We asked the city to plant more trees on our street.
To our surprise, the mayor wrote back. This spring, workers planted thirty young trees along the street. They are still small, but my grandfather says they will grow big "just in time for your children to enjoy them."`,translation:`去年夏天是我們鎮上有史以來最熱的夏天。有幾天氣溫超過 38 度，老人家被建議下午待在家裡。我那很愛散步的爺爺，覺得自己像一隻關在籠子裡的鳥。
有一天傍晚，他帶我到家附近的小公園。他站在一棵大樹下說：「你感覺一下。」那裡涼快多了。「我像你這麼大的時候，整條街都是像這樣的樹。後來市政府為了拓寬馬路，把大部分的樹都砍掉了。」
那天晚上，我上網查資料，知道樹蔭下的地面比太陽下的地面涼快很多，樹也會透過葉子散發水分，讓周圍的空氣變涼。我把這件事告訴全班，我們一起寫了一封信給市長，請市政府在我們這條街上多種一些樹。
讓我們驚喜的是，市長回信了。今年春天，工人沿著這條街種了三十棵小樹。它們現在還很小，但爺爺說它們長大時「剛好可以讓你的孩子享受」。`}],items:[{qNo:1,stem:`Look at those dark clouds in the sky. It ______ rain soon. We'd better go home now.`,options:[`was`,`has`,`is going to`,`did`],answer:`C`,explanation:`【中譯】看看天空那些烏雲，快要下雨了，我們最好現在回家。

請根據上表回答下列問題。`}],items:[{qNo:1,stem:`計算 (−3)×4 − (−18)÷6 之值為何？`,options:[`−15`,`−5`,`−9`,`9`],answer:`C`,explanation:`【解析】先乘除後加減：(−3)×4＝−12，(−18)÷6＝−3，所以 −12 − (−3)＝−12＋3＝−9。故選 (C)。`},{qNo:2,stem:`計算 3/4 − (5/6) ÷ (5/2) 之值為何？`,options:[`5/12`,`−1/30`,`1/6`,`7/12`],answer:`A`,explanation:`【解析】先算除法：5/6 ÷ 5/2＝5/6 × 2/5＝1/3，再算 3/4 − 1/3＝9/12 − 4/12＝5/12。若由左往右先減再除，會得到 −1/30，這是錯誤的運算順序。故選 (A)。`},{qNo:3,stem:`人體一顆紅血球的直徑約為 0.0000075 公尺。若以科學記號表示，下列何者正確？`,options:[`7.5 × 10⁻⁵ 公尺`,`7.5 × 10⁻⁷ 公尺`,`7.5 × 10⁻⁴ 公尺`,`7.5 × 10⁻⁶ 公尺`],answer:`D`,explanation:`【解析】0.0000075 的小數點要向右移 6 位才得到 7.5，所以 0.0000075＝7.5 × 10⁻⁶。故選 (D)。`},{qNo:4,stem:`化簡 √48 − √12 的結果為何？`,options:[`6`,`2√3`,`4√3`,`6√3`],answer:`B`,explanation:`【解析】√48＝√(16×3)＝4√3，√12＝√(4×3)＝2√3，所以 √48 − √12＝4√3 − 2√3＝2√3。注意 √48 − √12 不等於 √(48−12)＝6。故選 (B)。`},{qNo:5,stem:`計算 (2³)² ÷ 2⁴ 之值為何？`,options:[`4`,`16`,`32`,`1/4`],answer:`A`,explanation:`【解析】(2³)²＝2⁶，2⁶ ÷ 2⁴＝2⁶⁻⁴＝2²＝4。故選 (A)。`},{qNo:6,stem:`解一元一次方程式 3(x − 2)＝x＋8，得 x＝？`,options:[`5`,`1`,`7`,`−1`],answer:`C`,explanation:`【解析】3(x − 2)＝x＋8 → 3x − 6＝x＋8 → 2x＝14 → x＝7。驗算：3×(7−2)＝15，7＋8＝15。故選 (C)。`},{qNo:7,stem:`文具店裡每支筆的價格都相同，每本筆記本的價格也都相同。小美買 2 支筆和 3 本筆記本共付 130 元；小華買 4 支筆和 1 本筆記本共付 110 元。請問一本筆記本多少元？`,options:[`20 元`,`30 元`,`25 元`,`35 元`],answer:`B`,explanation:`【解析】設筆每支 x 元、筆記本每本 y 元：2x＋3y＝130，4x＋y＝110。由第二式得 y＝110 − 4x，代入第一式：2x＋3(110 − 4x)＝130 → −10x＝−200 → x＝20，y＝110 − 80＝30。所以筆記本一本 30 元（20 元是筆的價格）。故選 (B)。`},{qNo:8,stem:`某張地圖的比例尺是 1：25000。地圖上兩地相距 6 公分，則兩地的實際距離是多少公里？`,options:[`15 公里`,`0.15 公里`,`150 公里`,`1.5 公里`],answer:`D`,explanation:`【解析】實際距離＝6 × 25000＝150000 公分。1 公里＝100000 公分，所以 150000 公分＝1.5 公里。故選 (D)。`},{qNo:9,stem:`坐標平面上，直線 L 通過 (0, 2) 與 (4, 0) 兩點，如附圖所示。直線 L 的方程式為何？`,options:[`2x＋y＝4`,`x − 2y＝4`,`x＋2y＝4`,`2x − y＝−4`],answer:`C`,explanation:`【解析】斜率＝(0 − 2)/(4 − 0)＝−1/2，y 截距為 2，所以 y＝−(1/2)x＋2，同乘 2 移項得 x＋2y＝4。驗算：(0, 2)：0＋4＝4；(4, 0)：4＋0＝4。故選 (C)。`,figure:`ai/901/math/f09.png`},{qNo:10,stem:`若一元二次方程式 x² − 5x＋6＝0 的兩根為 a、b，且 a＞b，則 a − 2b 之值為何？`,options:[`−1`,`1`,`−4`,`7`],answer:`A`,explanation:`【解析】x² − 5x＋6＝(x − 2)(x − 3)＝0，兩根為 3 和 2。因為 a＞b，所以 a＝3、b＝2，a − 2b＝3 − 4＝−1。若把 a、b 對調會得到 2 − 6＝−4。故選 (A)。`},{qNo:11,stem:`下列何者是多項式 x² − 9x＋20 的因式？`,options:[`x＋4`,`x − 4`,`x − 2`,`x＋5`],answer:`B`,explanation:`【解析】x² − 9x＋20 要找兩數相乘為 20、相加為 −9，即 −4 和 −5，所以 x² − 9x＋20＝(x − 4)(x − 5)，x − 4 是它的因式。故選 (B)。`},{qNo:12,stem:`一個等差數列的第 3 項是 11，第 7 項是 23，則此數列的第 20 項是多少？`,options:[`59`,`65`,`68`,`62`],answer:`D`,explanation:`【解析】第 3 項到第 7 項相差 4 個公差：23 − 11＝4d，d＝3。首項＝11 − 2×3＝5，第 20 項＝5＋19×3＝62。故選 (D)。`},{qNo:13,stem:`學校禮堂的第一排有 20 個座位，之後每一排都比前一排多 2 個座位，共有 15 排。這個禮堂共有多少個座位？`,options:[`510 個`,`480 個`,`540 個`,`328 個`],answer:`A`,explanation:`【解析】各排座位數是首項 20、公差 2 的等差數列，第 15 排有 20＋14×2＝48 個。總和＝(20＋48)×15÷2＝510 個。故選 (A)。`},{qNo:14,stem:`如附圖，△ABC 中，∠A＝50°，∠B＝70°，延長 BC 到 D 點。則 ∠ACD 的度數為何？`,options:[`60°`,`110°`,`120°`,`130°`],answer:`C`,explanation:`【解析】三角形的外角等於不相鄰的兩個內角和，所以 ∠ACD＝∠A＋∠B＝50°＋70°＝120°。（60° 是 ∠ACB 的度數。）故選 (C)。`,figure:`ai/901/math/f14.png`},{qNo:15,stem:`一支長 5 公尺的梯子斜靠在垂直的牆上，梯腳離牆 1.4 公尺，如附圖所示。梯子頂端離地面多少公尺？`,options:[`3.6 公尺`,`4.8 公尺`,`4.6 公尺`,`5.2 公尺`],answer:`B`,explanation:`【解析】牆、地面和梯子形成直角三角形，梯子是斜邊。由畢氏定理，高度＝√(5² − 1.4²)＝√(25 − 1.96)＝√23.04＝4.8 公尺。故選 (B)。`,figure:`ai/901/math/f15.png`},{qNo:16,stem:`同一時間在陽光下，身高 160 公分的小安影子長 120 公分，旗桿的影子長 9 公尺。旗桿高多少公尺？`,options:[`6.75 公尺`,`10.5 公尺`,`15 公尺`,`12 公尺`],answer:`D`,explanation:`【解析】同一時間，物體的高度和影長成正比：160：120＝旗桿高：9，旗桿高＝9 × 160/120＝12 公尺。若寫成 120：160 會算出 6.75，比例放反了。故選 (D)。`},{qNo:17,stem:`如附圖，A、B、C 三點在圓 O 上，且 ∠ACB＝35°。則 ∠AOB 的度數為何？`,options:[`70°`,`35°`,`110°`,`145°`],answer:`A`,explanation:`【解析】∠AOB 是圓心角，∠ACB 是對同一弧 AB 的圓周角。圓心角是同弧所對圓周角的 2 倍，所以 ∠AOB＝2 × 35°＝70°。故選 (A)。`,figure:`ai/901/math/f17.png`},{qNo:18,stem:`如附圖，直線 L₁ 與 L₂ 平行，一條直線與它們相交。若 ∠1＝65°，則 ∠x 的度數為何？`,options:[`65°`,`25°`,`115°`,`130°`],answer:`C`,explanation:`【解析】∠1 和 ∠x 位在兩平行線之間、截線的同一側，是同側內角。兩平行線的同側內角互補，所以 ∠x＝180° − 65°＝115°。故選 (C)。`,figure:`ai/901/math/f18.png`},{qNo:19,stem:`二次函數 y＝x² − 2x − 3 的圖形頂點坐標為何？`,options:[`(−1, −4)`,`(1, 4)`,`(−1, 0)`,`(1, −4)`],answer:`D`,explanation:`【解析】配方：y＝x² − 2x＋1 − 1 − 3＝(x − 1)² − 4，所以頂點坐標是 (1, −4)。故選 (D)。`},{qNo:20,stem:`下表是某班 10 位同學一分鐘跳繩的次數：

運動神經傳到肌肉，不經過大腦判斷，所以速度很快，可以保護身體。故選 (D)。`},{qNo:11,stem:`科學家研究南極附近不同島嶼上的巴布亞企鵝，發現牠們外形幾乎一樣，卻可以分成四個不同的物種。科學家最可能是比較下列哪一項資料，而得到這個結論？`,options:[`牠們細胞中的遺傳物質（DNA）`,`牠們的體型大小`,`牠們羽毛的顏色`,`牠們居住島嶼的面積`],answer:`A`,explanation:`【解析】外形幾乎一樣的生物，無法只靠外觀判斷是不是同一種。比較細胞中的遺傳物質（DNA）可以看出族群之間的差異程度，是判斷物種的重要依據。故選 (A)。`},{qNo:12,stem:`使用複式顯微鏡觀察洋蔥表皮細胞時，目鏡上標示「10×」，物鏡上標示「40×」。此時的放大倍率是多少倍？`,options:[`50 倍`,`4 倍`,`400 倍`,`4000 倍`],answer:`C`,explanation:`【解析】複式顯微鏡的放大倍率＝目鏡倍率 × 物鏡倍率＝10 × 40＝400 倍。故選 (C)。`},{qNo:13,stem:`細胞需要能量才能進行各種生命活動。細胞分解養分、釋放能量的呼吸作用主要在哪一種構造中進行？`,options:[`葉綠體`,`細胞壁`,`液胞`,`粒線體`],answer:`D`,explanation:`【解析】粒線體是細胞進行呼吸作用、分解養分釋放能量的主要場所；葉綠體進行的是光合作用。故選 (D)。`},{qNo:14,stem:`圖(一) 是某種酵素在不同溫度下的作用速率。根據此圖，下列敘述何者正確？`,options:[`溫度越高，此酵素的作用速率一定越快`,`此酵素在約 37°C 時作用速率最快`,`此酵素在 0°C 時作用速率最快`,`溫度對此酵素的作用速率沒有影響`],answer:`B`,explanation:`【解析】由圖可知，作用速率在約 37°C 時最高，溫度再升高時速率反而快速下降，因為過高的溫度會使酵素變性。所以不是溫度越高越快。故選 (B)。`,figure:`ai/901/science/f14.png`},{qNo:15,stem:`接種疫苗可以預防某些傳染病。接種疫苗後，身體主要會產生下列哪一種變化？`,options:[`身體直接獲得醫生注射的抗體`,`血液中的紅血球數量大量增加`,`免疫系統產生對抗此病原體的抗體`,`病原體會在體內大量繁殖`],answer:`C`,explanation:`【解析】疫苗含有減毒、死亡的病原體或其部分成分，能刺激人體的免疫系統自己產生抗體和記憶，之後遇到真正的病原體時能快速對抗。直接注射抗體是血清，不是疫苗。故選 (C)。`},{qNo:16,stem:`植物從根部吸收的水分，主要經由莖中的哪一種構造運送到葉子？`,options:[`木質部`,`韌皮部`,`氣孔`,`表皮`],answer:`A`,explanation:`【解析】維管束中的木質部負責運輸水分和礦物質（由下往上）；韌皮部運輸葉子製造的養分；氣孔是葉片上氣體進出和水分散失的通道。故選 (A)。`},{qNo:17,stem:`人類的受精作用通常發生在女性生殖系統的哪一個部位？`,options:[`卵巢`,`輸卵管`,`子宮`,`陰道`],answer:`B`,explanation:`【解析】卵巢排出的卵進入輸卵管，精子若在輸卵管與卵相遇就完成受精，受精卵再移到子宮著床發育。卵巢負責產生卵。故選 (B)。`},{qNo:18,stem:`某金屬塊的質量是 54 公克，體積是 20 立方公分。此金屬的密度是多少？`,options:[`0.37 g/cm³`,`34 g/cm³`,`1080 g/cm³`,`2.7 g/cm³`],answer:`D`,explanation:`【解析】密度＝質量 ÷ 體積＝54 ÷ 20＝2.7 g/cm³（這是鋁的密度）。故選 (D)。`},{qNo:19,stem:`在一大氣壓下，將一杯水持續加熱到沸騰後繼續加熱。沸騰過程中水的溫度如何變化？`,options:[`溫度持續上升`,`溫度逐漸下降`,`溫度維持在約 100°C 不變`,`溫度先下降再上升`],answer:`C`,explanation:`【解析】水沸騰時，吸收的熱量用來使液態水變成水蒸氣（改變狀態），所以在一大氣壓下溫度維持在約 100°C 不變，直到水完全汽化。故選 (C)。`},{qNo:20,stem:`將 20 公克的食鹽完全溶解在 80 公克的水中。此食鹽水的重量百分濃度是多少？`,options:[`20%`,`25%`,`80%`,`16%`],answer:`A`,explanation:`【解析】重量百分濃度＝溶質質量 ÷ 溶液質量 × 100%＝20 ÷ (20＋80) × 100%＝20%。若用 20 ÷ 80 會得到 25%，是把分母誤當成溶劑。故選 (A)。`},{qNo:21,stem:`下表是四種常見液體在室溫下的 pH 值：
| 液體 | 檸檬汁 | 白醋 | 純水 | 肥皂水 |
| pH 值 | 2 | 3 | 7 | 10 |
其中哪一種液體呈鹼性？`,options:[`檸檬汁`,`白醋`,`純水`,`肥皂水`],answer:`D`,explanation:`【解析】室溫下 pH＜7 為酸性、pH＝7 為中性、pH＞7 為鹼性。肥皂水 pH 為 10，呈鹼性；檸檬汁和白醋是酸性；純水是中性。故選 (D)。`},{qNo:22,stem:`12 公克的碳在充足的氧氣中完全燃燒，恰好與 32 公克的氧氣完全反應，只生成二氧化碳。生成的二氧化碳是多少公克？`,options:[`20 公克`,`44 公克`,`32 公克`,`12 公克`],answer:`B`,explanation:`【解析】依質量守恆定律，反應前後物質的總質量不變：生成物質量＝12＋32＝44 公克。故選 (B)。`},{qNo:23,stem:`某原子的原子核內有 11 個質子和 12 個中子。此原子的質量數是多少？`,options:[`11`,`12`,`23`,`1`],answer:`C`,explanation:`【解析】質量數＝質子數＋中子數＝11＋12＝23（這是鈉原子）。原子序等於質子數 11。故選 (C)。`},{qNo:24,stem:`在週期表中，同一族（同一縱行）的元素，通常具有下列哪一個特性？`,options:[`質量數相同`,`中子數相同`,`都是金屬元素`,`化學性質相似`],answer:`D`,explanation:`【解析】同一族元素的最外層電子排列相似，所以化學性質相似，例如第 1 族的鈉和鉀都會和水劇烈反應。它們的質量數、中子數都不同，也不一定都是金屬。故選 (D)。`},{qNo:25,stem:`鐵釘放在潮濕的空氣中一段時間後會生鏽。關於鐵生鏽，下列敘述何者正確？`,options:[`鐵與氧發生了氧化反應`,`鐵生鏽是一種物理變化`,`鐵生鏽時失去了氧`,`鐵放在乾燥的空氣中生鏽最快`],answer:`A`,explanation:`【解析】鐵生鏽是鐵與空氣中的氧和水作用，生成新的物質（鐵鏽），屬於氧化反應，是化學變化。潮濕的環境會加快生鏽，乾燥時生鏽較慢。故選 (A)。`},{qNo:26,stem:`小安騎腳踏車，30 分鐘騎了 9 公里。他的平均速率是每小時多少公里？`,options:[`4.5 公里／小時`,`18 公里／小時`,`27 公里／小時`,`0.3 公里／小時`],answer:`B`,explanation:`【解析】30 分鐘＝0.5 小時，平均速率＝路程 ÷ 時間＝9 ÷ 0.5＝18 公里／小時。故選 (B)。`},{qNo:27,stem:`行駛中的公車突然緊急煞車時，站著的乘客身體會向前傾。這個現象可以用下列哪一個概念解釋？`,options:[`摩擦力消失`,`作用力與反作用力`,`慣性`,`萬有引力`],answer:`C`,explanation:`【解析】公車煞車時，乘客的腳隨車子減速，但上半身由於慣性仍保持原來向前的運動，所以會向前傾。故選 (C)。`},{qNo:28,stem:`一塊長 20 公分、寬 10 公分、高 5 公分、重量為 2 公斤重的磚塊，放在水平地面上。以哪一個面朝下放置時，磚塊對地面的壓力（單位面積上所受的力）最大？`,options:[`長 20 公分、寬 10 公分的面`,`寬 10 公分、高 5 公分的面`,`長 20 公分、高 5 公分的面`,`三種放法的壓力都一樣大`],answer:`B`,explanation:`【解析】壓力＝垂直作用力 ÷ 接觸面積。三種放法的作用力都是磚塊的重量 2 公斤重，接觸面積越小壓力越大。10×5＝50 平方公分最小，所以這一面朝下時壓力最大。故選 (B)。`},{qNo:29,stem:`小明用 50 牛頓的水平力推著箱子，沿著力的方向移動了 4 公尺。小明對箱子作了多少功？`,options:[`12.5 焦耳`,`54 焦耳`,`46 焦耳`,`200 焦耳`],answer:`D`,explanation:`【解析】功＝力 × 沿力方向移動的距離＝50 × 4＝200 焦耳。故選 (D)。`},{qNo:30,stem:`將 2 歐姆和 4 歐姆的兩個電阻串聯後，接在 6 伏特的電池上（電池內電阻不計）。通過電路的電流是多少安培？`,options:[`1 安培`,`3 安培`,`4.5 安培`,`0.5 安培`],answer:`A`,explanation:`【解析】串聯電路的總電阻＝2＋4＝6 歐姆，由歐姆定律 I＝V ÷ R＝6 ÷ 6＝1 安培。故選 (A)。`},{qNo:31,stem:`兩個相同的燈泡並聯後，接在 3 伏特的電池上。每個燈泡兩端的電壓是多少？`,options:[`1.5 伏特`,`6 伏特`,`3 伏特`,`0 伏特`],answer:`C`,explanation:`【解析】並聯電路中，各支路兩端的電壓都等於電源電壓，所以每個燈泡兩端都是 3 伏特。串聯時電壓才會分配。故選 (C)。`},{qNo:32,stem:`中午時，在陽光照射下的海灘，沙子摸起來比海水燙得多。主要的原因是下列何者？`,options:[`沙子的比熱比水大，吸收相同熱量時溫度上升較多`,`水不會吸收太陽的熱`,`沙子會自己產生熱`,`沙子的比熱比水小，吸收相同熱量時溫度上升較多`],answer:`D`,explanation:`【解析】比熱越小的物質，吸收相同熱量時溫度變化越大。沙子的比熱比水小很多，所以在相同日照下沙子升溫比海水快。故選 (D)。`},{qNo:33,stem:`小美站在平面鏡前照鏡子。她在鏡中看到的像具有下列哪一種性質？`,options:[`倒立、與物體等大的實像`,`正立、與物體等大的虛像`,`正立、比物體小的實像`,`倒立、比物體大的虛像`],answer:`B`,explanation:`【解析】平面鏡成像是由反射光的延長線所形成的虛像，像是正立的、大小與物體相同，像到鏡面的距離等於物體到鏡面的距離。故選 (B)。`},{qNo:34,stem:`把筷子斜插入裝水的玻璃杯中，從旁邊看，筷子在水面處好像「彎折」了。這是因為光發生了下列哪一種現象？`,options:[`折射`,`反射`,`散射`,`直線前進`],answer:`A`,explanation:`【解析】光從水進入空氣時，因為在兩種介質中的速率不同，行進方向會偏折，這就是折射，所以筷子看起來在水面處彎折。故選 (A)。`},{qNo:35,stem:`聲音在下列哪一種物質中傳播的速率最快？`,options:[`空氣`,`水`,`鋼鐵`,`真空`],answer:`C`,explanation:`【解析】一般來說，聲音在固體中傳播最快，液體次之，氣體最慢；真空中沒有介質，聲音無法傳播。鋼鐵是固體，所以傳播最快。故選 (C)。`},{qNo:36,stem:`小華用漆包線繞在鐵釘上，接上電池做成電磁鐵。在電流大小不變的情況下，下列哪一種做法可以使電磁鐵的磁力變強？`,options:[`把鐵釘換成木棒`,`增加線圈纏繞的圈數`,`把漆包線拉直不纏繞`,`把電池正負極對調`],answer:`B`,explanation:`【解析】電磁鐵的磁力和線圈圈數、電流大小以及是否有鐵心有關。圈數越多磁力越強；換成木棒（沒有鐵心）磁力變弱；正負極對調只會改變磁極方向。故選 (B)。`},{qNo:37,stem:`近年科學家研發出只利用陽光就能把海水變成淡水的裝置：陽光使海水受熱變成水蒸氣，水蒸氣再冷卻成淡水。在這個過程中，水依序發生了哪兩種狀態變化？`,options:[`先凝固，再熔化`,`先凝結，再蒸發`,`先熔化，再昇華`,`先蒸發（汽化），再凝結（液化）`],answer:`D`,explanation:`【解析】海水受熱由液態變成氣態的水蒸氣是蒸發（汽化）；水蒸氣冷卻由氣態變回液態是凝結（液化）。鹽不會跟著蒸發，所以得到的是淡水。故選 (D)。`},{qNo:38,stem:`用彈簧秤吊著一個物體，在空氣中讀數為 50 公克重；把物體完全沒入水中（未碰到容器）時，讀數變成 30 公克重。物體在水中受到的浮力是多少？`,options:[`20 公克重`,`30 公克重`,`50 公克重`,`80 公克重`],answer:`A`,explanation:`【解析】浮力＝物體在空氣中的重量 − 在水中的視重＝50 − 30＝20 公克重。故選 (A)。`},{qNo:39,stem:`兩人玩蹺蹺板並保持水平平衡。體重 30 公斤重的小安坐在離支點 1.5 公尺處，體重 45 公斤重的哥哥應坐在離支點多遠的地方？（蹺蹺板本身的重量不計）`,options:[`1.5 公尺`,`1 公尺`,`2.25 公尺`,`0.5 公尺`],answer:`B`,explanation:`【解析】槓桿平衡時，兩邊的力 × 力臂相等：30 × 1.5＝45 × 距離，距離＝45 ÷ 45＝1 公尺。故選 (B)。`},{qNo:40,stem:`農曆十五（望日）的晚上，如果天氣晴朗，我們最可能看到哪一種月相？`,options:[`新月`,`上弦月`,`下弦月`,`滿月`],answer:`D`,explanation:`【解析】農曆十五左右，月球、地球、太陽大致排成一直線，月球在地球外側，被太陽照亮的一面完全朝向地球，所以看到滿月。新月約在農曆初一。故選 (D)。`},{qNo:41,stem:`地球上會有四季變化，主要的原因是下列何者？`,options:[`地球和太陽的距離一年中變化很大`,`地球自轉的速度有時快、有時慢`,`地球自轉軸傾斜，且地球繞太陽公轉`,`太陽本身發出的熱量一年中變化很大`],answer:`C`,explanation:`【解析】地球自轉軸相對公轉軌道面傾斜約 23.5 度，地球繞太陽公轉時，各地太陽直射的角度和白天長短會隨時間改變，因而產生四季。季節主要不是由距離遠近造成的。故選 (C)。`},{qNo:42,stem:`關於這次地震，下列敘述何者正確？`,options:[`同一次地震只有一個規模，但各地的震度可以不同`,`甲、乙、丙三地的地震規模都不一樣`,`甲地的地震規模是 5`,`震度越大表示地震釋放的能量越少`],answer:`A`,explanation:`【解析】地震規模代表地震本身釋放能量的大小，一次地震只有一個規模（6.2）；震度是各地感受到搖晃的程度，會因地點不同而不同。故選 (A)。`},{qNo:43,stem:`根據表中甲、乙、丙三地的資料，最能推論出下列哪一個結論？`,options:[`距離震央越遠，震度越大`,`一般來說，距離震央越遠，震度越小`,`震度和距離震央的遠近沒有關係`,`距離震央越遠，地震規模越小`],answer:`B`,explanation:`【解析】甲地最近（20 公里）震度 5 級，乙地 80 公里 3 級，丙地 150 公里 2 級，可見大致上離震央越遠，震度越小。規模只有一個，不會隨距離改變。故選 (B)。`},{qNo:44,stem:`根據圖(二)，這一天的最高氣溫大約出現在什麼時候？`,options:[`中午 12 時左右`,`上午 8 時左右`,`清晨 4 時左右`,`下午 2 時左右`],answer:`D`,explanation:`【解析】由圖可知，14 時（下午 2 時）的氣溫約 33°C 最高；清晨 4 時左右氣溫最低。故選 (D)。`},{qNo:45,stem:`太陽在中午時位置最高，但這一天的最高氣溫卻不是出現在中午。最合理的解釋是下列何者？`,options:[`中午時太陽發出的熱比下午少`,`空氣會直接吸收大部分的陽光，所以中午時氣溫最低`,`地面吸收陽光後再把熱傳給空氣需要時間，所以氣溫在午後才達到最高`,`下午時地球離太陽比較近`],answer:`C`,explanation:`【解析】陽光主要先加熱地面，地面再把熱傳給上方的空氣。中午後地面持續吸收的熱仍多於散失的熱，氣溫繼續上升，所以最高氣溫出現在午後約 2 時。故選 (C)。`},{qNo:46,stem:`比較第一組和第二組的結果，最主要是在探討哪一個因素對反應速率的影響？`,options:[`反應物的接觸面積（顆粒大小）`,`鹽酸的濃度`,`反應的溫度`,`大理石的質量`],answer:`A`,explanation:`【解析】第一組和第二組只有大理石的形狀不同（塊狀與粉末），其他條件都相同，所以探討的是接觸面積對反應速率的影響。粉末的接觸面積大，反應較快。故選 (A)。`},{qNo:47,stem:`根據表中的結果，若改用 5 公克粉末狀的大理石、1 M 鹽酸，在 40°C 下進行實驗，收集 50 毫升氣體所需的時間最可能是下列何者？`,options:[`120 秒`,`少於 30 秒`,`60 秒`,`多於 120 秒`],answer:`B`,explanation:`【解析】由第一、二組可知粉末比塊狀快；由第一、三組可知 40°C 比 25°C 快。同時用粉末又提高溫度，反應會比第二組（30 秒）更快，所以所需時間最可能少於 30 秒。故選 (B)。`},{qNo:48,stem:`根據表中資料，日照時數與收集到的淡水量之間有什麼關係？`,options:[`日照時數越長，收集到的淡水量越少`,`日照時數與淡水量沒有關係`,`日照 4 小時以後，淡水量就不再增加`,`日照時數越長，收集到的淡水量越多，且大致成正比`],answer:`D`,explanation:`【解析】日照 2、4、6、8 小時分別收集到 110、220、330、440 公克，日照時數變成 2 倍、3 倍、4 倍時，淡水量也變成 2 倍、3 倍、4 倍，大致成正比。故選 (D)。`},{qNo:49,stem:`日照 8 小時後，裝置中剩下的鹽水比原來的海水更鹹。原因是下列何者？`,options:[`陽光使鹽的質量增加`,`水蒸氣冷卻後又流回裝置中`,`水被蒸發帶走，鹽留在裝置中，溶質不變而溶劑減少`,`鹽和水一起蒸發了`],answer:`C`,explanation:`【解析】蒸發時只有水變成水蒸氣離開，鹽不會蒸發。鹽（溶質）的量不變，水（溶劑）減少，所以剩下的鹽水濃度變大、更鹹。故選 (C)。`},{qNo:50,stem:`原來的海水重量百分濃度是 3.5%。日照 8 小時、收集到 440 公克淡水後，裝置中剩下的鹽水重量百分濃度最接近下列何者？`,options:[`6.3%`,`3.5%`,`8.0%`,`4.4%`],answer:`A`,explanation:`【解析】剩下的鹽水質量＝1000 − 440＝560 公克，其中鹽仍有 35 公克。濃度＝35 ÷ 560 × 100%＝6.25%，約 6.3%。若用 35 ÷ 440 會得到約 7.95%（約 8.0%），把分母弄錯了。故選 (A)。`}],verification:[`2026-09-26 數值題答案由 tools/ai_sets/ai1_science.py 以程式計算並比對；附圖由程式依資料繪製。`,`2026-09-26 獨立作答者 1（Claude Opus，看不到答案，可看附圖）50/50 與答案卷一致，0 題有異議；確認 2 張附圖與題意相符。`,`2026-09-26 獨立作答者 2（Claude Sonnet，看不到答案，可看附圖）50/50 一致，0 題有異議，並自行驗算所有數值題。tools/check_ai_set.py 0 問題。`,`2026-10-09 最終複查（定稿前）：獨立稽核者（Claude Opus）拿答案與解析逐題核對（答案唯一性、計算、事實、附圖、文字），另由 Claude Opus 與 Claude Sonnet 各自重新盲解全卷，答案全部與答案卷一致；稽核指出的解析措辭、誘答與解析不一致、真實事件的相對時間（改為確切年份）與文言異文（以多版本比對後採通行本）均已修正，修正過的題目再由兩個模型重新盲解一致；答案卷未變動。`]},Ka={set:`AI-1`,year:901,subject:`社會`,title:`AI-1 社會模擬卷`,note:`由 AI 依會考社會科（地理、歷史、公民）命題範圍與素養導向原則（資料判讀、生活情境、時事）編寫，非會考真題；時事素材經查證（2026 國際少年運動會：教育部、花蓮縣政府新聞），計算題答案由程式驗證（tools/ai_sets/ai1_social.py）。`,groups:[{from:44,to:45,passage:`聯合國的定義：65 歲以上人口占總人口的比例達到 7% 為「高齡化社會」，達到 14% 為「高齡社會」，達到 20% 為「超高齡社會」。下表是甲國的人口資料（2030 年為推估值）：

請根據上述資料回答問題。`},{from:46,to:48,passage:`以下是一段描述 19 世紀初歐洲某個工業城市的文字（改寫）：
「清晨五點，工廠的汽笛響起，許多剛從鄉村搬來的男人、女人和孩子，走進煙霧瀰漫的紡織工廠。工廠裡的機器由蒸汽推動，一整天不停地轉動。工人每天工作超過十二個小時，工資卻很低。城市的人口快速增加，住宅十分擁擠，街道髒亂，傳染病經常流行。」`},{from:49,to:51,passage:`小芬在網路商店買了一個 1,200 元的背包，商品宅配到家。收到後第 5 天，她發現背包的樣式和想像中不一樣，想要退貨。賣家回覆：「商品一經拆封，一律不退不換。」
請根據我國《消費者保護法》的相關規定回答問題。`},{from:52,to:54,passage:`2026 年 8 月，第 58 屆國際少年運動會在花蓮舉行，來自世界各地許多城市的 12 到 15 歲青少年選手參加田徑、游泳、桌球等比賽，這也是臺灣第三次主辦這項賽會。花蓮縣境內有花東縱谷的田園風光，也有以壯觀峽谷地形聞名的太魯閣國家公園。`}],items:[{qNo:1,stem:`臺灣經常發生地震，主要的原因是下列何者？`,options:[`臺灣位在歐亞板塊與菲律賓海板塊的交界帶`,`臺灣四面環海，海浪經常拍打陸地`,`臺灣的河川短小流急`,`臺灣位在熱帶與溫帶的交界`],answer:`A`,explanation:`【解析】臺灣位於歐亞板塊與菲律賓海板塊的交界，兩個板塊互相擠壓，地殼活動旺盛，所以地震頻繁。故選 (A)。`},{qNo:2,stem:`下列哪一條緯線通過臺灣本島？`,options:[`赤道`,`北極圈`,`北回歸線`,`南回歸線`],answer:`C`,explanation:`【解析】北回歸線（北緯約 23.5 度）通過臺灣本島的嘉義和花蓮一帶，當地都設有北回歸線標誌。故選 (C)。`},{qNo:3,stem:`臺灣採用東經 120 度的標準時間，英國倫敦採用經度 0 度的標準時間（不考慮日光節約時間）。當臺灣是上午 10 時，倫敦是幾時？`,options:[`下午 6 時`,`凌晨 2 時`,`上午 8 時`,`晚上 10 時`],answer:`B`,explanation:`【解析】經度每差 15 度，時間相差 1 小時。東經 120 度與 0 度相差 120 度，即 8 小時；倫敦在臺灣的西邊，時間較晚，所以是 10 − 8＝2，凌晨 2 時。故選 (B)。`},{qNo:4,stem:`臺灣冬季時，北部和東北部（例如基隆、宜蘭）經常陰雨綿綿，主要是受到哪一種風的影響？`,options:[`西南季風`,`颱風`,`焚風`,`東北季風`],answer:`D`,explanation:`【解析】冬季盛行的東北季風從海上帶來水氣，遇到北部與東北部的山地抬升而降雨，所以基隆有「雨港」之稱。西南季風主要在夏季帶來南部的降雨。故選 (D)。`},{qNo:5,stem:`在等高線地形圖上，等高線排列得越密集的地方，代表下列何者？`,options:[`坡度越平緩`,`坡度越陡`,`海拔越低`,`一定是河流經過的地方`],answer:`B`,explanation:`【解析】等高線越密集，表示在很短的水平距離內高度變化很大，也就是坡度越陡；等高線稀疏則表示坡度平緩。故選 (B)。`},{qNo:6,stem:`與世界上的大河相比，臺灣的河川普遍具有下列哪一種特色？`,options:[`河川長且流速緩慢`,`一年四季流量都很穩定`,`河川短小流急，流量隨季節變化大`,`大多數河川可以讓大型船隻航行`],answer:`C`,explanation:`【解析】臺灣島嶼面積小、中央山脈高聳，河川從高山直接流入海，所以短小流急；又因降雨集中在夏季，豐水期與枯水期的流量差異很大，大多不利航運。故選 (C)。`},{qNo:7,stem:`某地一年四季都很炎熱，而且幾乎每天午後都會下大雨。這個地方最可能位於下列哪一個區域？`,options:[`赤道附近`,`北極圈附近`,`溫帶大陸的內部`,`沙漠地區`],answer:`A`,explanation:`【解析】終年高溫多雨是熱帶雨林氣候的特色，主要分布在赤道附近，例如新加坡、亞馬遜河流域。故選 (A)。`},{qNo:8,stem:`波斯灣沿岸的許多國家，例如沙烏地阿拉伯、科威特，經濟發展主要依靠下列哪一種資源？`,options:[`稻米`,`森林木材`,`漁業`,`石油`],answer:`D`,explanation:`【解析】波斯灣沿岸蘊藏豐富的石油，是世界主要的產油區之一，許多國家以出口石油作為主要的收入來源。故選 (D)。`},{qNo:9,stem:`東南亞中南半島的河川下游平原（例如湄公河三角洲）盛產稻米，主要的自然條件是下列何者？`,options:[`氣候寒冷乾燥，適合耐寒作物`,`地勢高聳，多為高山地形`,`氣候高溫多雨，且有河川沖積而成的平原`,`全年都不下雨，需要大量灌溉`],answer:`C`,explanation:`【解析】稻米需要高溫和充足的水分。中南半島屬於季風氣候，高溫多雨，河川下游又有肥沃的沖積平原，因此非常適合種稻。故選 (C)。`},{qNo:10,stem:`新竹科學園區發展出許多半導體等高科技產業。下列何者是高科技產業選擇在此發展的重要原因？`,options:[`鄰近大學和研究機構，容易取得專業人才與技術`,`當地礦產豐富，可以就地取得大量原料`,`當地農業發達，可以提供大量糧食`,`距離海港很遠，可以避免颱風`],answer:`A`,explanation:`【解析】高科技產業最需要的是人才與研發能力。新竹附近有多所大學與研究機構，能提供專業人才和技術支援，交通也便利，所以成為高科技產業的聚集地。故選 (A)。`},{qNo:11,stem:`一家跨國企業在甲國設計產品、在乙國生產零件、在丙國組裝，再賣到全世界。這種現象最能說明下列哪一個概念？`,options:[`自給自足的經濟`,`全球化下的國際分工`,`閉關自守的政策`,`只在本國生產的產業`],answer:`B`,explanation:`【解析】企業依各國的優勢，把研發、生產、組裝分散在不同國家進行，再銷售到全球，這就是全球化下的國際分工。故選 (B)。`},{qNo:12,stem:`大量人口移入都市後，都市最可能出現下列哪一種問題？`,options:[`農地大量增加`,`學校與醫院過剩`,`人口老化使勞動力不足`,`交通擁擠、房價上漲`],answer:`D`,explanation:`【解析】都市化使人口集中在都市，容易造成交通擁擠、住宅不足和房價上漲、環境污染等問題。故選 (D)。`},{qNo:13,stem:`臺灣許多偏遠鄉村的年輕人移居到都市。下列哪一項是吸引他們移入都市的主要原因（拉力）？`,options:[`都市的工作機會和發展機會較多`,`鄉村空氣比較好`,`都市的房價比較便宜`,`鄉村交通比較方便`],answer:`A`,explanation:`【解析】人口遷移常受「推力」與「拉力」影響。都市有較多的工作機會、教育和醫療資源，是吸引人口移入的拉力。故選 (A)。`},{qNo:14,stem:`全球暖化最可能造成下列哪一種影響？`,options:[`南北極的冰層逐漸變厚`,`冰川融化、海水受熱膨脹，使海平面上升`,`全球的降雨都平均增加`,`臺灣的冬天會越來越冷`],answer:`B`,explanation:`【解析】全球暖化使陸地上的冰川融化流入海洋，海水溫度升高也會膨脹，因此海平面上升，低窪的沿海地區可能被淹沒。故選 (B)。`},{qNo:15,stem:`甲地圖的比例尺是 1：5000，乙地圖的比例尺是 1：50000。若兩張地圖的紙張大小相同，下列敘述何者正確？`,options:[`乙地圖的比例尺較大，表示的內容較詳細`,`甲地圖表示的實際範圍比乙地圖大`,`兩張地圖的內容詳細程度相同`,`甲地圖的比例尺較大，表示的內容較詳細`],answer:`D`,explanation:`【解析】1/5000 比 1/50000 大，所以甲地圖的比例尺較大。比例尺越大，同樣大小的紙張能表示的實際範圍越小，但內容越詳細。故選 (D)。`},{qNo:16,stem:`17 世紀時，荷蘭人在大員（今臺南安平）建立城堡，作為統治和貿易的中心。這座城堡是下列何者？`,options:[`熱蘭遮城`,`億載金城`,`臺北府城`,`恆春古城`],answer:`A`,explanation:`【解析】荷蘭人於 1624 年來到大員，興建熱蘭遮城（今安平古堡一帶）。億載金城、臺北府城和恆春古城都是清朝時期才興建的。故選 (A)。`},{qNo:17,stem:`1662 年鄭成功率軍擊敗荷蘭人，開始在臺灣建立政權。鄭氏經營臺灣的主要目的是下列何者？`,options:[`協助荷蘭人發展貿易`,`把臺灣獻給清朝`,`以臺灣作為反清復明的基地`,`建立日本的殖民地`],answer:`C`,explanation:`【解析】明朝滅亡後，鄭成功以「反清復明」為號召，攻下臺灣作為對抗清朝的根據地，並推動屯田、發展經濟。故選 (C)。`},{qNo:18,stem:`清朝在 1684 年將臺灣正式納入版圖。當時臺灣在行政上隸屬於哪一個省？`,options:[`廣東省`,`浙江省`,`臺灣省`,`福建省`],answer:`D`,explanation:`【解析】清朝把臺灣納入版圖後設一府三縣，隸屬福建省；直到 1885 年（清光緒年間）才建立臺灣省。故選 (D)。`},{qNo:19,stem:`清朝在甲午戰爭戰敗後，與日本簽訂條約，將臺灣割讓給日本。這個條約是下列何者？`,options:[`馬關條約`,`南京條約`,`北京條約`,`天津條約`],answer:`A`,explanation:`【解析】1895 年清朝甲午戰爭戰敗，與日本簽訂馬關條約，割讓臺灣、澎湖，臺灣從此進入日本統治時期。南京條約是鴉片戰爭後簽訂的。故選 (A)。`},{qNo:20,stem:`日治時期由八田與一主導興建，大大改善嘉南平原灌溉條件的水利工程是下列何者？`,options:[`瑠公圳`,`嘉南大圳`,`八堡圳`,`曹公圳`],answer:`B`,explanation:`【解析】嘉南大圳（包括烏山頭水庫）在日治時期完成，使嘉南平原成為重要的稻米和甘蔗產區。瑠公圳、八堡圳、曹公圳都是清朝時期開鑿的水圳。故選 (B)。`},{qNo:21,stem:`1987 年臺灣宣布解除戒嚴。解嚴之後，最可能出現下列哪一種變化？`,options:[`政府加強報紙和書籍的審查`,`人民不能自由出國觀光`,`禁止人民組織任何團體`,`人民集會、結社的自由擴大，可以依法組織新的政黨`],answer:`D`,explanation:`【解析】戒嚴時期人民的集會、結社、言論等自由受到限制。解嚴後，這些自由逐步開放，人民可以依法組織政黨，報禁也在 1988 年解除。故選 (D)。`},{qNo:22,stem:`秦始皇統一中國後，為了便於統治，推行了許多措施。下列何者是秦始皇的措施？`,options:[`派鄭和下西洋`,`開放五口通商`,`統一文字和度量衡`,`派張騫出使西域`],answer:`C`,explanation:`【解析】秦始皇統一六國後，統一文字、貨幣和度量衡，方便各地的行政與交流。張騫出使西域是漢朝，鄭和下西洋是明朝，五口通商是清朝鴉片戰爭後。故選 (C)。`},{qNo:23,stem:`漢朝時張騫出使西域，之後逐漸形成連接中國與西方的貿易路線。這條路線對東西方最主要的影響是下列何者？`,options:[`使中國停止與外國往來`,`促進東西方的貿易和文化交流`,`讓歐洲人發現美洲新大陸`,`使中國開始進行工業革命`],answer:`B`,explanation:`【解析】張騫通西域後，逐漸形成「絲路」，中國的絲綢等商品向西運送，西方的物產、宗教和文化也傳入中國，促進了東西方的交流。故選 (B)。`},{qNo:24,stem:`明朝初年，鄭和率領龐大的船隊多次出海遠航。這些航行最遠到達下列哪一個地區？`,options:[`非洲東岸`,`美洲大陸`,`澳洲`,`南極洲`],answer:`A`,explanation:`【解析】鄭和七次下西洋（15 世紀初），船隊經過東南亞、印度洋，最遠到達非洲東岸，展現了當時中國的航海能力。故選 (A)。`},{qNo:25,stem:`清朝在鴉片戰爭中戰敗，於 1842 年與英國簽訂南京條約。下列何者是南京條約的內容？`,options:[`割讓臺灣給日本`,`允許日本在臺灣駐軍`,`割讓香港島給英國`,`把東北割讓給俄國`],answer:`C`,explanation:`【解析】南京條約的主要內容包括割讓香港島、開放五口通商、賠款等，是中國近代第一個不平等條約。割讓臺灣是馬關條約的內容。故選 (C)。`},{qNo:26,stem:`14 世紀開始，歐洲出現「文藝復興」運動，重視人的價值和現世生活。這個運動最早從哪一個地區開始？`,options:[`英國`,`俄國`,`美國`,`義大利`],answer:`D`,explanation:`【解析】文藝復興最早開始於義大利，當地商業繁榮、城市富裕，又保存許多古希臘、羅馬的文化，出現達文西、米開朗基羅等藝術家。故選 (D)。`},{qNo:27,stem:`18 世紀後期，瓦特改良了蒸汽機，機器生產逐漸取代手工生產。這個重大的轉變稱為什麼？最早在哪一國發生？`,options:[`工業革命，最早發生在中國`,`工業革命，最早發生在英國`,`文藝復興，最早發生在英國`,`宗教改革，最早發生在法國`],answer:`B`,explanation:`【解析】以機器取代人力和獸力的生產方式轉變稱為工業革命，18 世紀後期最早在英國發生，瓦特改良蒸汽機提供了強大的動力。故選 (B)。`},{qNo:28,stem:`1789 年法國大革命期間，國民議會發表了《人權宣言》。這份宣言最主要的主張是下列何者？`,options:[`人生而自由平等，享有基本權利`,`國王的權力來自上天，不可反抗`,`只有貴族才能擁有財產`,`教會應該管理國家的政治`],answer:`A`,explanation:`【解析】《人權宣言》主張人生而自由、平等，享有自由、財產、安全和反抗壓迫等權利，主權屬於全體國民，影響了後來世界各國的民主發展。故選 (A)。`},{qNo:29,stem:`第二次世界大戰結束後，世界出現長期的「冷戰」局勢。冷戰主要是哪兩個國家（集團）之間的對抗？`,options:[`英國與法國`,`中國與日本`,`德國與義大利`,`美國與蘇聯`],answer:`D`,explanation:`【解析】二次大戰後，以美國為首的民主陣營和以蘇聯為首的共產陣營，在政治、軍事、經濟上長期對立，但雙方沒有直接大規模開戰，所以稱為「冷戰」。故選 (D)。`},{qNo:30,stem:`在我國，法律案必須經過哪一個機關審議通過？`,options:[`行政院`,`司法院`,`立法院`,`考試院`],answer:`C`,explanation:`【解析】立法院是國家最高立法機關，負責審議並通過法律案和預算案。行政院負責執行政策，司法院負責審判與解釋憲法。故選 (C)。`},{qNo:31,stem:`言論自由受到憲法保障，但也有界線。下列哪一種行為最可能因侵害他人權利而需要負法律責任？`,options:[`在社群網站上發表對新政策的意見`,`在網路上散布不實的訊息，損害他人的名譽`,`寫信給市長提出公共建設的建議`,`在班會中發言反對同學的提案`],answer:`B`,explanation:`【解析】言論自由不能侵害他人的權利。在網路上散布不實訊息、毀損他人名譽，可能觸犯刑法的誹謗罪或需負民事賠償責任。表達意見、提出建議或反對提案都是正當的言論自由。故選 (B)。`},{qNo:32,stem:`依照我國現行的民法規定，滿幾歲才算成年？`,options:[`18 歲`,`16 歲`,`20 歲`,`21 歲`],answer:`A`,explanation:`【解析】我國民法自 2023 年 1 月 1 日起，將成年年齡由 20 歲下修為 18 歲。成年人可以獨立完成訂立契約等法律行為。故選 (A)。`},{qNo:33,stem:`刑法有「罪刑法定主義」。下列哪一項敘述最符合這個原則？`,options:[`法官可以依個人的看法決定處罰`,`只要大多數人覺得不對，就可以處罰`,`行為後才制定的法律可以用來處罰之前的行為`,`行為時法律沒有明文規定要處罰的行為，就不能處罰`],answer:`D`,explanation:`【解析】罪刑法定主義是指犯罪和刑罰都必須由行為時的法律明文規定，法律沒有規定就不能處罰，也不能用事後制定的法律處罰先前的行為，以保障人民的自由。故選 (D)。`},{qNo:34,stem:`阿明因為在路邊丟垃圾，被縣政府環保局依法處以罰鍰（行政處分）。他認為這項處分不合理，最適合先透過下列哪一種方式尋求救濟？`,options:[`提起刑事告訴`,`依法提起訴願`,`向法院提起民事訴訟`,`直接不繳罰款就好`],answer:`B`,explanation:`【解析】人民認為行政機關的行政處分違法或不當，損害自己的權益時，可以依法提起訴願，若不服訴願決定，還可以再提起行政訴訟。故選 (B)。`},{qNo:35,stem:`我國的直轄市長，例如臺北市長，是如何產生的？`,options:[`由總統直接任命`,`由立法委員投票選出`,`由市民直接投票選舉產生`,`由行政院長指派`],answer:`C`,explanation:`【解析】依地方制度法，直轄市長、縣（市）長都由當地居民直接投票選舉產生，這是地方自治的重要表現。故選 (C)。`},{qNo:36,stem:`小明星期六下午有三個選擇：去打工可以賺 800 元、陪家人看電影、去補習班上課。他覺得打工比看電影更有價值，最後選擇去補習。小明選擇補習的機會成本是下列何者？`,options:[`補習班的學費`,`陪家人看電影的快樂`,`打工和看電影兩者的價值總和`,`放棄打工可以賺到的 800 元`],answer:`D`,explanation:`【解析】機會成本是做選擇時，所放棄的選項中價值最高的那一個。小明放棄了打工和看電影，其中他認為打工比較有價值，所以機會成本是放棄打工可以賺的 800 元，不是兩者相加。故選 (D)。`},{qNo:37,stem:`颱風過後，許多菜園受損，市場上的蔬菜價格大幅上漲。這種現象最主要的原因是下列何者？`,options:[`蔬菜的供給減少`,`蔬菜的需求減少`,`蔬菜的供給增加`,`民眾都不再吃蔬菜`],answer:`A`,explanation:`【解析】颱風使蔬菜產量減少，市場上的供給減少；在需求變化不大的情況下，供給減少會使價格上漲。故選 (A)。`},{qNo:38,stem:`當一個國家發生「通貨膨脹」時，最可能出現下列哪一種現象？`,options:[`物價持續下跌，錢變得更有價值`,`所有商品的價格都不變`,`物價持續上漲，同樣的錢能買到的東西變少`,`人民的存款利息一定會大幅增加`],answer:`C`,explanation:`【解析】通貨膨脹是一般物價水準持續上漲，貨幣的購買力下降，同樣金額的錢能買到的商品和服務變少了。故選 (C)。`},{qNo:39,stem:`甲國生產稻米的機會成本較低，乙國生產電子產品的機會成本較低。兩國各自專門生產自己相對擅長的產品，再互相交換。這種做法所依據的是下列哪一個概念？`,options:[`絕對平均`,`自給自足`,`通貨膨脹`,`比較利益`],answer:`D`,explanation:`【解析】各國專門生產機會成本相對較低（具有比較利益）的產品，再透過貿易互相交換，雙方都能得到更多利益，這就是比較利益原則。故選 (D)。`},{qNo:40,stem:`小華在通訊軟體上收到一則轉傳訊息：「每天喝熱水可以預防所有病毒，趕快分享！」小華最適當的做法是下列何者？`,options:[`立刻轉傳給所有親友`,`先查證訊息的來源和內容是否正確，再決定是否分享`,`只要是很多人轉傳的訊息就一定是真的`,`把訊息改寫得更誇張再分享`],answer:`B`,explanation:`【解析】面對網路訊息要有媒體識讀的能力：先查證來源是否可靠（例如衛生福利部、事實查核中心），確認內容正確後再決定是否分享，避免散播錯誤訊息。故選 (B)。`},{qNo:41,stem:`某公司招募會計人員時，在徵才廣告上寫著「限男性」，但這份工作的內容和性別完全無關。這個廣告最可能違反下列哪一個原則？`,options:[`公司有權利任意決定員工的工資`,`契約自由，所以一定合法`,`工作上不得因性別而有差別待遇`,`只有公務機關才需要遵守性別平等`],answer:`C`,explanation:`【解析】依性別平等工作法，雇主在招募、僱用員工時，不得因性別而有差別待遇（除非工作性質確實需要）。會計工作與性別無關，「限男性」屬於性別歧視。故選 (C)。`},{qNo:42,stem:`下列哪一個國際組織主要負責國際間的公共衛生事務，例如傳染病的防治？`,options:[`世界衛生組織（WHO）`,`世界貿易組織（WTO）`,`國際奧林匹克委員會（IOC）`,`石油輸出國家組織（OPEC）`],answer:`A`,explanation:`【解析】世界衛生組織（WHO）是聯合國下負責國際公共衛生的專門機構，協調各國防治傳染病。WTO 處理國際貿易，IOC 負責奧運，OPEC 是產油國的組織。故選 (A)。`},{qNo:43,stem:`聯合國提出「永續發展目標（SDGs）」，希望滿足現在的需求，又不損害後代的發展。下列哪一種日常行為最符合永續發展的精神？`,options:[`大量購買便宜的衣服，穿一次就丟`,`自備購物袋和餐具，減少使用一次性塑膠製品`,`冷氣溫度調到最低並整天開著`,`把垃圾全部混在一起丟棄`],answer:`B`,explanation:`【解析】永續發展強調兼顧環境、經濟與社會，減少資源浪費。自備購物袋和餐具可以減少塑膠垃圾；其他選項都會浪費資源或增加污染。故選 (B)。`},{qNo:44,stem:`依照聯合國的定義，甲國在 2030 年將屬於下列哪一個階段？`,options:[`高齡化社會`,`高齡社會`,`尚未進入高齡化社會`,`超高齡社會`],answer:`D`,explanation:`【解析】2030 年甲國 65 歲以上人口比例為 22%，已達到 20% 以上，屬於超高齡社會。故選 (D)。`},{qNo:45,stem:`根據表中資料，甲國在 2030 年時的人口變化最可能是下列何者？`,options:[`出生率高於死亡率，人口自然增加`,`出生率等於死亡率，人口不增不減`,`出生率低於死亡率，人口自然減少`,`65 歲以上人口比例下降`],answer:`C`,explanation:`【解析】自然增加率＝出生率 − 死亡率＝7‰ − 11‰＝−4‰，小於 0，表示出生的人比死亡的人少，人口會自然減少。故選 (C)。`},{qNo:46,stem:`這段文字所描述的景象，最能反映下列哪一個歷史發展？`,options:[`工業革命`,`文藝復興`,`地理大發現`,`宗教改革`],answer:`A`,explanation:`【解析】文中出現蒸汽推動的機器、紡織工廠、大量工人進入城市等景象，都是工業革命時期的特徵。故選 (A)。`},{qNo:47,stem:`文中提到「許多剛從鄉村搬來的男人、女人和孩子」，反映出當時社會的哪一種變化？`,options:[`城市人口大量移往鄉村`,`大量人口從農村移往城市，都市化加快`,`人們都回到農村從事農業`,`工廠只雇用成年男性`],answer:`B`,explanation:`【解析】工廠集中在城市，吸引大量鄉村人口移入尋找工作，使城市人口快速增加，都市化加快。文中也提到女人和孩子進工廠工作，所以不是只雇用成年男性。故選 (B)。`},{qNo:48,stem:`針對文中工人的處境，後來歐洲各國最可能出現下列哪一種改善措施？`,options:[`政府下令關閉所有工廠`,`取消所有工人的工資`,`工人組織工會，政府立法限制工時和童工`,`禁止人民搬到城市居住`],answer:`C`,explanation:`【解析】工業革命後勞工工時長、工資低、童工普遍，工人逐漸組織工會爭取權益，各國也陸續制定法律限制工作時數、禁止或限制童工，改善勞動條件。故選 (C)。`},{qNo:49,stem:`小芬透過網路購買、商品宅配到家，這種消費方式在消費者保護法中屬於下列哪一種交易？`,options:[`訪問交易`,`現場交易`,`分期付款買賣`,`通訊交易`],answer:`D`,explanation:`【解析】消費者沒有機會事先檢視商品，透過網路、電視、型錄等方式購買的交易，屬於消費者保護法所稱的「通訊交易」。故選 (D)。`},{qNo:50,stem:`依照消費者保護法，小芬可不可以退貨？`,options:[`不可以，因為商品已經拆封`,`可以，收到商品後 7 日內可以解除契約，不必說明理由`,`不可以，因為是她自己選購的`,`可以，但一定要超過 30 天才能退`],answer:`B`,explanation:`【解析】消費者保護法規定，通訊交易的消費者在收到商品後 7 日內，可以退回商品或以書面通知解除契約，不需要說明理由，也不用負擔任何費用（有少數法定例外，例如易腐敗的商品）。小芬在第 5 天提出，可以退貨。故選 (B)。`},{qNo:51,stem:`賣家「商品一經拆封，一律不退不換」的約定，在法律上的效力為何？`,options:[`違反消費者保護法的規定，此約定無效`,`賣家已經寫明，所以有效`,`只要小芬同意過，就一定有效`,`只有在實體商店才有效`],answer:`A`,explanation:`【解析】消費者保護法規定，違反 7 日內可解除契約規定的約定是無效的。拆封本來就是消費者檢查商品的必要行為，賣家不能用這種約定排除消費者的權利。故選 (A)。`},{qNo:52,stem:`文中提到的花東縱谷，位於下列哪兩座山脈之間？`,options:[`雪山山脈與玉山山脈`,`阿里山山脈與中央山脈`,`海岸山脈與雪山山脈`,`中央山脈與海岸山脈`],answer:`D`,explanation:`【解析】花東縱谷位於臺灣東部，西側是中央山脈，東側是海岸山脈，是一條狹長的谷地。故選 (D)。`},{qNo:53,stem:`太魯閣國家公園內的峽谷地形，主要是如何形成的？`,options:[`海浪長期拍打海岸`,`火山噴發的熔岩冷卻`,`河流長期向下侵蝕堅硬的岩層`,`冰河移動刨蝕`],answer:`C`,explanation:`【解析】太魯閣一帶的地層不斷隆起，河流（立霧溪）長期向下切割堅硬的大理岩，形成兩側陡峭、谷底狹窄的峽谷地形。故選 (C)。`},{qNo:54,stem:`花蓮主辦國際少年運動會，對當地最可能帶來下列哪一種影響？`,options:[`使花蓮的人口立刻大量減少`,`帶動觀光發展，並增加與各國的交流`,`讓花蓮不再發生地震`,`讓花蓮的農業全部停止`],answer:`B`,explanation:`【解析】舉辦國際賽會能吸引各國選手、家長和遊客前來，帶動住宿、餐飲和觀光等產業，也讓各國青少年透過運動和文化活動互相交流。故選 (B)。`}],verification:[`2026-09-26 時事素材查證：2026 國際少年運動會（第 58 屆，8 月 1–6 日，花蓮，臺灣第三次主辦）見教育部、花蓮縣政府新聞。計算題（時區、人口）由程式驗證。`,`2026-09-26 獨立作答者 1（Claude Opus，看不到答案）54/54 與答案卷一致；指出第 34 題「罰單」可能被理解為交通罰單、第 52–54 題文章中太魯閣（2024 年地震後部分封閉）的描述需修正 → 第 34 題改為環保局罰鍰、文章改為一般介紹。`,`2026-09-26 獨立作答者 2（Claude Sonnet）54/54 一致，0 題有異議。`,`2026-09-26 修改後：獨立作答者 3（Claude Opus）第 34、52–54 題通過，建議替換過於明顯的誘答選項並移除第 53 題正確選項中的提示字 → 已修改；獨立作答者 4（Claude Sonnet）第 34、53 題通過。tools/check_ai_set.py 0 問題。`,`2026-10-09 最終複查（定稿前）：獨立稽核者（Claude Opus）拿答案與解析逐題核對（答案唯一性、計算、事實、附圖、文字），另由 Claude Opus 與 Claude Sonnet 各自重新盲解全卷，答案全部與答案卷一致；稽核指出的解析措辭、誘答與解析不一致、真實事件的相對時間（改為確切年份）與文言異文（以多版本比對後採通行本）均已修正，修正過的題目再由兩個模型重新盲解一致；答案卷未變動。`]},qa={set:`AI-2`,year:902,subject:`國文`,title:`AI-2 國文模擬卷（進階）`,difficulty:`進階`,note:`由 AI 依會考國文科題型與 SPEC_AI2_AI3.md 編寫（難度：進階，以閱讀理解與推論為主），非會考真題；文言文逐字依維基文庫原文（《列子·說符》《韓非子·外儲說左上》《夢溪筆談·權智》《說苑·建本》），白話文章、新詩與論說文為原創，時事題材（2025 雙北世壯運、臺灣邁入超高齡社會、花蓮光復鄉「鏟子超人」）已查證，來源見 topics（tools/ai_sets/ai2_chinese.py）。`,topics:[`《列子·說符》楊布打狗: https://zh.wikisource.org/w/index.php?title=%E5%88%97%E5%AD%90/%E8%AA%AA%E7%AC%A6%E7%AF%87&action=raw`,`《韓非子·外儲說左上》郢書燕說: https://zh.wikisource.org/w/index.php?title=%E9%9F%93%E9%9D%9E%E5%AD%90/%E5%A4%96%E5%84%B2%E8%AA%AA%E5%B7%A6%E4%B8%8A&action=raw`,`《夢溪筆談·權智》林廣守大順城（卷十三）: https://zh.wikisource.org/w/index.php?title=%E5%A4%A2%E6%BA%AA%E7%AD%86%E8%AB%87/%E5%8D%B713&action=raw`,`《說苑·建本》伯俞泣杖: https://zh.wikisource.org/w/index.php?title=%E8%AA%AA%E8%8B%91/%E5%8D%B703&action=raw`,`2025 雙北世界壯年運動會（5/17–5/30，最年長選手 105 歲）: https://udn.com/news/story/124493/8774982`,`臺灣 2025 年底 65 歲以上人口 20.06%，邁入超高齡社會（年齡結構、縣市數、新生兒數）: https://udn.com/news/story/7266/9254576`,`臺灣 2018 年 3 月底 65 歲以上人口 14.05%，進入高齡社會: https://mohw.gov.tw/cp-16-42571-1.html`,`臺灣 1993 年 65 歲以上人口超過 7%，成為高齡化社會（遠見雜誌）: https://www.gvm.com.tw/article/26734`,`2025 年 9 月 23 日馬太鞍溪堰塞湖溢流，花蓮光復鄉受災，「鏟子超人」志工湧入: https://www.cna.com.tw/news/aloc/202509270241.aspx`],groups:[{from:19,to:20,passage:`閱讀下文，回答問題：
楊朱之弟曰布，衣素衣而出。天雨，解素衣，衣緇衣而反。其狗不知，迎而吠之。楊布怒，將扑之。楊朱曰：「子無扑矣！子亦猶是也。嚮者使汝狗白而往，黑而來，豈能無怪哉？」

（注：遺：送。過：誤。尚：崇尚。白：稟告。）`,translation:`有個郢都人寫信給燕國的宰相，夜裡寫信時燈火不夠亮，就對拿蠟燭的人說：「把蠟燭舉高。」嘴裡說著，竟誤把「舉燭」兩字寫進了信裡。「舉燭」並不是信的本意。燕國宰相收到信後解釋說：「舉燭，就是崇尚光明；崇尚光明，就是要選拔賢能的人並任用他們。」燕相把這個意思告訴燕王，燕王非常高興，照著做，國家因此治理得很好。治理好是治理好了，但並不是信的本意。現在的學者，大多像這個樣子。`},{from:24,to:28,passage:`閱讀下文，回答問題：
〈第九十秒〉
報名世壯運志工的時候，我只是想湊滿服務時數。表格上「壯年」兩個字，在我腦中自動換成了「退休」：一群叔叔阿姨在跑道上慢慢走，跑完再一起吃便當，大概就是這樣。
二〇二五年五月，雙北舉辦世界壯年運動會，我被分到田徑場的終點區，工作是遞水和毛巾。第一天早上，組長發給我們一張表，上面列著各組別的年齡，從三十多歲一路排到一百歲以上。我盯著最後一格看了很久。聽說這屆最年長的選手已經一百零五歲，我心裡想的卻是：一百歲還跑什麼？
下午是一場年長女子組的長距離賽跑。槍聲一響，八位選手出發，步伐比我想像的快。前面幾位陸續衝線後，只剩一位穿藍色背心的阿姨還在場上，和倒數第二名差了將近兩圈。觀眾席漸漸空了，下一項比賽的選手在場邊熱身，有人低頭看了看手錶。我手裡的紙杯被捏得有點變形，心裡只想著：她為什麼不乾脆退賽？
我會這樣想，是有原因的。國二那年的校運會，我在一千五百公尺跑到一半就被套圈。全班在看台上喊我的名字，那聲音一圈比一圈小，最後變成一片安靜。我沒有跑完，在彎道上蹲下來，假裝鞋帶鬆了。從那天起，我把跑鞋收進鞋櫃最底層，再也沒穿過。
藍背心阿姨跑進最後一圈時，場上忽然有了聲音。先是終點區的計時裁判拍手，接著是在場邊熱身的選手，然後是早就跑完、披著毛巾的那幾位阿姨。她們站在跑道邊，一個接一個喊她的名字。那聲音和我記憶裡的不一樣，它一圈比一圈大。
阿姨衝過終點時，大會螢幕上的成績比第一名慢了將近十分鐘。我把水遞給她，她喝了一口，喘著氣笑：「比去年在家附近練跑時，快了九十秒。」我愣住了。原來她一直在和一個我看不見的對手比賽——去年的自己。我忽然想起鞋櫃底層那雙鞋：那一天，我在意的是看台上的人，從來不是我自己跑了多遠。
比賽結束後，我在志工手冊的空白頁寫下一句話：「最後一名，不是跑得最慢的人，是被大家看見最久的人。」寫完，又把它劃掉了。阿姨不需要被誰看見，她要的那九十秒，在她自己的手錶上。
回家那天晚上，我把跑鞋從鞋櫃底層拿出來，鞋底的灰還在。我還沒有決定要不要回田徑隊，只是把它放在門口，離門檻近一點的地方。
（本文以 2025 年雙北世壯運為背景，人物與比賽情節為虛構。）`},{from:29,to:31,passage:`閱讀下列資料，回答問題：

〈讓孩子摔一跤〉
（一）近年許多公園把溜滑梯改矮、把攀爬架拆掉，地上鋪滿軟墊，理由只有一個：安全。保護孩子當然沒有錯，但我認為，一座完全沒有風險的遊戲場，反而可能讓孩子更不安全。
（二）孩子學會判斷危險，靠的不是大人的叮嚀，而是一次次的嘗試。爬到某個高度覺得腿軟，他就知道自己的極限在哪裡；從低處跳下扭到腳，下次就懂得先看清楚落地的位置。這些經驗，必須在可以承受的小風險中累積。
（三）有人會說：「萬一受傷了，誰負責？」這樣的擔心可以理解。我主張的並不是放任孩子冒險，而是讓風險「看得見、可承受」：高度有限、地面有緩衝、設施定期檢修。危險應該被管理，而不是被消滅。
（四）如果孩子在遊戲場裡從來沒有機會失手，他們終究會在別處——馬路邊、溪流旁、更陡的山坡上——第一次面對真正的危險，而那時，他們手上沒有任何經驗可用。

常常言過其實`],answer:`A`,explanation:`【解析】「說話從不打折扣」看似稱讚守信，但舉的例子是「說會遲到十分鐘，就絕不會只遲到五分鐘」——他兌現的承諾正是遲到，可見是以稱讚的口吻反諷他總是遲到。（B）他承諾的內容是遲到，不是守時；（C）「事先告知」只是字面上的訊息，同學們用打趣的口吻點出他的毛病，並沒有要肯定他；（D）他「絕不會只遲到五分鐘」，說到做到，問題不在說話誇大。故選 (A)。`},{qNo:7,stem:`小安要寫信給住在鄉下的祖父。下列信中的提稱語、結尾敬辭與自稱，哪一組搭配最恰當？`,options:[`祖父大人膝下……敬請　教安……孫　小安　敬上`,`祖父大人膝下……敬請　福安……孫　小安　敬上`,`祖父大人函丈……敬請　福安……孫　小安　敬上`,`祖父大人膝下……順頌　時綏……孫　小安　敬上`],answer:`B`,explanation:`【解析】寫給祖父母、父母，提稱語用「膝下」，結尾敬辭用「敬請　福安」，自稱「孫」，三者搭配恰當。（A）「敬請　教安」用於師長；（C）「函丈」是寫給師長的提稱語；（D）「順頌　時綏」多用於平輩或一般往來，不適合對祖父。故選 (B)。`},{qNo:8,stem:`閱讀下文，回答問題：

（注：熙寧：宋神宗年號。党項：古代民族名。拒守：抵抗守城。虜：指敵軍。度：估計。叢射：集中射擊。潰：潰散。）
林廣先用「弱弓弩」、後改用「強弓勁弩」，用意是什麼？`,options:[`先用弱弓節省箭矢，等敵軍久圍疲憊後再全力反擊`,`先用射程短的弓弩試探敵軍兵力多寡，再決定是否出城作戰`,`先示弱讓敵軍誤判射程而逼近城下，再以強弩在近距離集中殺傷`,`弱弓射不遠，敵軍以為守軍將降而撤圍，林廣再趁機追擊`],answer:`C`,explanation:`【解析】「虜度其勢之所及，稍稍近城」：敵軍根據弱弓的射程，估計自己站在射不到的地方，於是逐漸靠近城牆；林廣這時才換上強弓勁弩集中射擊，敵軍因此多死而潰散。關鍵在讓敵人誤判射程。（A）「節省箭矢」「等敵軍疲憊」都是文中沒有的理由，敵軍是因誤判而靠近，不是因疲憊而敗；（B）林廣始終守城，文中沒有試探兵力或出城作戰；（D）敵軍不是撤圍，而是「稍稍近城」，被強弩射殺後才潰散。故選 (C)。`},{qNo:9,stem:`「蜜蜂找到花蜜後，會回到蜂巢跳『搖擺舞』告訴同伴。舞蹈中直線前進的那一段，與垂直向上方向的夾角，就等於花叢方向與太陽方向的夾角；直線段搖擺的時間愈長，代表花叢離蜂巢愈遠。如果花叢就在蜂巢附近，蜜蜂則改跳『圓圈舞』，只告訴同伴『附近有食物』，不指出方向。」根據這段文字，下列推論何者正確？`,options:[`直線段搖擺的時間愈短，表示花叢離太陽愈近`,`同伴看到圓圈舞，就能同時知道花叢的方向與距離`,`同一處花叢，不論上午或下午去採蜜，跳出的直線段方向都會完全相同`,`若搖擺舞的直線段正好垂直向上，表示花叢位在太陽所在的方向`],answer:`D`,explanation:`【解析】直線段與垂直向上的夾角等於花叢與太陽方向的夾角；直線段垂直向上，夾角為 0，表示花叢就在太陽的方向。（A）搖擺時間代表花叢離「蜂巢」的遠近，不是離太陽的遠近；（B）圓圈舞只表示附近有食物，不指出方向；（C）太陽的方向上午、下午不同，花叢與太陽方向的夾角也會改變，直線段的方向因此不同。故選 (D)。`},{qNo:10,stem:`學校規定：「凡是報名科展的同學，都必須先繳交研究計畫；研究計畫必須有指導老師的簽名，才算完成繳交。」若這項規定確實執行，下列推論何者一定正確？`,options:[`小芸的研究計畫有指導老師簽名，可知她已經報名科展`,`小凱沒有報名科展，可知他沒有繳交研究計畫`,`小安已經報名科展，可知他的研究計畫有指導老師的簽名`,`小明的研究計畫沒有簽名，但他仍有可能已經報名科展`],answer:`C`,explanation:`【解析】報名科展→必須已繳交研究計畫→繳交完成的計畫必定有簽名，所以已報名的小安，計畫一定有簽名。（A）有簽名只表示完成繳交的條件之一，不代表她一定去報名；（B）沒報名的人也可能已繳交計畫，只是後來沒報名，不能反推；（D）沒有簽名就不算完成繳交，也就不可能報名，與規定矛盾。故選 (C)。`},{qNo:11,stem:`小芸把題目為〈我的志願〉的作文拿給哥哥看。哥哥讀完說：「開頭那段寫外婆的手，寫得真好，好到我差點以為整篇都在寫外婆。」小芸聽了，默默把稿子拿回房間。哥哥的話，最可能是在暗示這篇作文的哪一個問題？`,options:[`開頭著墨太多，喧賓奪主，模糊了〈我的志願〉的主題`,`寫外婆的那段描寫還不夠生動具體，應該再多加一些細節`,`題目應該改成寫外婆，才能發揮小芸的長處`,`文章的開頭與結尾沒有互相呼應`],answer:`A`,explanation:`【解析】題目是〈我的志願〉，哥哥卻說「差點以為整篇都在寫外婆」，表面稱讚，其實指出開頭寫得太多、搶走了主題；小芸「默默把稿子拿回房間」，也顯示她聽出了批評。（B）哥哥稱讚那段「寫得真好」，問題不在不夠生動；（C）哥哥並沒有建議改題目，這是把字面意思當真；（D）哥哥的話與首尾呼應無關。故選 (A)。`},{qNo:12,stem:`閱讀下文，回答問題：
伯俞有過，其母笞之泣，其母曰：「他日笞子未嘗見泣，今泣何也？」對曰：「他日俞得罪笞嘗痛，今……不能使痛，是以泣。」——《說苑·建本》
（注：笞：用竹板、荊條打。他日：從前。「……」表示節略。）
伯俞這次挨打時哭泣，原因是什麼？`,options:[`自知這次犯下的過錯特別嚴重，心中愧疚，忍不住哭泣`,`從母親打人不再疼痛，察覺母親年老力衰而傷心`,`母親這次打得特別重，痛得忍不住哭泣`,`怨母親不再像從前一樣嚴格管教自己`],answer:`B`,explanation:`【解析】伯俞說：「他日俞得罪笞嘗痛，今……不能使痛，是以泣。」從前挨打會痛，現在母親同樣責打卻已打不痛他，可知母親的力氣衰弱了，他由此體會母親老了，因而傷心落淚。（A）文中只說「有過」，沒有說這次特別嚴重，哭的原因他已說明；（C）正好相反，這次是「不能使痛」；（D）伯俞是心疼母親，不是埋怨管教不嚴。故選 (B)。`},{qNo:13,stem:`「與其說他是不會，不如說他是不想。」這句話的意思，最接近下列何者？`,options:[`他其實有能力做到，只是缺乏意願`,`他既沒有能力，也沒有意願`,`他很想做，只是能力還不夠`,`他有能力也有意願，只是時間不夠`],answer:`A`,explanation:`【解析】「與其說甲，不如說乙」表示乙比甲更貼切：說他「不會」不如說他「不想」，意思是問題不在能力，而在意願。（B）句子否定的是「不會」這個說法，並未說他沒有能力；（C）方向相反，句子認為他不缺能力，缺的是意願；（D）句子明白指出他「不想」，並非有意願。故選 (A)。`},{qNo:14,stem:`下列文句，何者使用了「轉化」修辭，把物當成人來描寫？`,options:[`遠方的山，彷彿一頭睡著的牛。`,`秋風一吹，整排銀杏都害羞地低下了頭。`,`她的笑聲像一串風鈴，在走廊裡叮叮噹噹地響。`,`這座城市是一本翻不完的書。`],answer:`B`,explanation:`【解析】銀杏會「害羞地低下了頭」，賦予植物人的情態與動作，是轉化中的擬人。（A）以「彷彿」連接山與牛，是譬喻；（C）以「像」連接笑聲與風鈴，是譬喻；（D）以「是」連接城市與書，是譬喻。故選 (B)。`},{qNo:15,stem:`「螞蟻出門覓食時，會沿路留下氣味。（甲）後面的同伴循著氣味前進，找到食物後，回程時再留下一次氣味。（乙）走短路的螞蟻往返得快，同一段時間內留下氣味的次數也多；（丙）因此，少有螞蟻走的遠路，氣味愈來愈淡，最後幾乎沒有螞蟻再走。（丁）」「相較之下，走遠路的螞蟻往返得慢，路上的氣味又會隨時間慢慢散去；」這句話放在文中哪一處最恰當？`,options:[`（甲）`,`（乙）`,`（丙）`,`（丁）`],answer:`C`,explanation:`【解析】「相較之下」要和前面已經說過的情況比較，所以必須接在「走短路的螞蟻往返得快……次數也多」之後；它補上「遠路往返慢、氣味會散去」這個條件，下一句「因此，少有螞蟻走的遠路，氣味愈來愈淡」才有根據。所以應放在（丙）。（A）（甲）之前只說螞蟻沿路留下氣味，還沒有出現可以比較的「短路」；（B）（乙）之前也還沒談到短路，「相較之下」沒有比較的對象；（D）（丁）在「因此……」的結論之後，結論已經說完，再補上原因顯得多餘，句末的「；」也無法收束全段。故選 (C)。`},{qNo:16,stem:`「這款手機的電池容量更大，（　）機身並沒有因此變重；（　）它的價格比舊款還低，難怪一上市就賣到缺貨。」（　）中依序填入哪一組詞語最恰當？`,options:[`然而／甚至`,`因此／但是`,`而且／所以`,`但是／因為`],answer:`A`,explanation:`【解析】電池變大，一般人會以為機身變重，「然而」並沒有，是轉折；價格還比舊款低，優點更進一層，用「甚至」表示遞進，最後才說「難怪」熱賣。（B）電池變大不是機身沒變重的原因，「因此」不合；（C）機身不重與價格低之間沒有因果，「所以」不合；（D）第一格用「但是」雖然可以，但第二格填「因為」，會變成「因為它的價格比舊款還低，難怪……」，「因為」與「難怪」搭配不當，也少了由一個優點推進到另一個優點的遞進語氣。故選 (A)。`},{qNo:17,stem:`某校調查全校學生的閱讀習慣，結果如下：「每天閱讀 30 分鐘以上的學生占 42%，去年同一調查為 35%；每天閱讀時間不到 30 分鐘的學生占 58%。」根據這項結果，下列哪一個說法無法得到支持？`,options:[`超過四成的學生每天閱讀 30 分鐘以上`,`將近六成的學生每天完全不閱讀`,`每天閱讀 30 分鐘以上的學生比例比去年高`,`每天閱讀 30 分鐘以上的學生比例比去年增加了 7 個百分點`],answer:`B`,explanation:`【解析】58% 的學生是每天閱讀「不到 30 分鐘」，其中可能有人讀了 10 分鐘、20 分鐘，不能說成「完全不閱讀」。（A）42% 超過四成，可以支持；（C）由 35% 增為 42%，比例提高，可以支持；（D）42 − 35 = 7，增加了 7 個百分點，可以支持。故選 (B)。`},{qNo:18,stem:`下列公告文字，何者完全沒有錯別字？`,options:[`如遇雨天，活動將順沿一週舉行。`,`歡迎各位家長湧躍參加親職講座。`,`本講座名額有限，請有興趣的家長儘速報名，以免向偶。`,`本館自即日起暫停開放，造成不便，敬請見諒。`],answer:`D`,explanation:`【解析】「暫停開放」「敬請見諒」都正確。（A）往後延期應作「順延」；（B）情緒熱烈、爭先恐後應作「踴躍」；（C）比喻得不到機會而失望應作「向隅」。故選 (D)。`},{qNo:19,stem:`關於本文，下列敘述何者最恰當？`,options:[`楊布換上緇衣是為了避雨，狗卻誤以為他是盜賊`,`楊朱認為狗是忠心看家，楊布不該責打忠心的狗`,`楊朱假設狗的毛色改變，讓楊布明白狗的反應是常情`,`楊布出門時穿緇衣，回家時改穿素衣，狗因此認不出他`],answer:`C`,explanation:`【解析】楊朱說「嚮者使汝狗白而往，黑而來，豈能無怪哉」，以狗變色的假設讓楊布換位思考：自己換了衣服，狗認不出而吠叫，是正常反應。（A）文中只說「其狗不知」，沒有說狗把他當成盜賊；（B）楊朱的理由是「子亦猶是也」，並沒有談到狗的忠心；（D）顏色顛倒了：出門穿「素衣」（白），回家穿「緇衣」（黑）。故選 (C)。`},{qNo:20,stem:`楊朱勸楊布的道理，最適合用來勸告下列何人？`,options:[`志明把房間重新布置後，半夜起床時一不小心撞上了書桌，懊惱自己太粗心`,`小芬一再提醒弟弟出門前要關燈，弟弟卻總是忘記，她為此生氣`,`阿哲剪了平頭又戴上新眼鏡，鄰居一時沒認出他而沒打招呼，他便抱怨鄰居冷漠`,`阿凱的狗一見到陌生的郵差就狂吠，阿凱只好把狗拴在院子裡`],answer:`C`,explanation:`【解析】楊布的情況是：自己的外表改變了，對方因而認不出、反應異常，自己卻怪罪對方。阿哲自己改變外貌，鄰居沒認出，他卻責怪鄰居，情況相同，正可勸他「換作是你，也會認不出來」。（A）雖然也是自己的改變帶來意外，但志明沒有責怪別人，談不上要他體諒對方；（B）是弟弟健忘的問題，與「因對方改變而認不出」無關；（D）只有「狗吠」表面相似，狗吠的是真正的陌生人，也沒有人被錯怪。故選 (C)。`},{qNo:21,stem:`根據本文，燕國能夠「國以治」，真正的原因是什麼？`,options:[`郢人在信中建議燕國舉用賢人，燕王讀信後照著實行`,`燕相把誤寫的「舉燭」引申為舉用賢人，燕王採納並加以推行`,`燕王夜裡點燭批閱公文，勤於政事，使國家得到治理`,`持燭者把蠟燭舉高，郢人才得以把重要的建議寫清楚`],answer:`B`,explanation:`【解析】「舉燭」是郢人口中對持燭者說的話，誤寫進信裡；燕相把它解讀成「尚明」「舉賢而任之」，告訴燕王，燕王照著做，國家因而得治。可見國家治理好，靠的是燕相的引申與燕王的推行，與信的本意無關。（A）作者再三強調「非書意也」，舉賢並不是郢人信中的建議；（C）把「舉燭」當成字面上的點燭，文中沒有燕王夜裡批公文的情節；（D）舉燭只是郢人寫信時的照明，信中真正的內容文中並未交代，與燕國得治無關。故選 (B)。`},{qNo:22,stem:`關於作者的態度，下列敘述何者最恰當？`,options:[`認為燕相誤解原意，所以燕國最後並沒有真正治理好`,`讚賞燕相能從無心之語中領悟治國之道，值得學者效法`,`批評郢人寫信粗心，才使燕相誤解，造成燕國的混亂`,`承認燕國因此得治，但仍批評這種解讀背離了原意`],answer:`D`,explanation:`【解析】「治則治矣，非書意也」先讓步承認國家確實治理好了，再強調那不是信的本意；末句把這種情形比作「今世舉學者」，可見作者批評的是穿鑿附會的解讀方式。（A）作者明說「治則治矣」，承認燕國治理好了；（B）作者用「非書意也」兩度否定，並以此批評學者，不是讚賞；（C）燕國是「國以治」，並未混亂；作者批評的重點也不是郢人的粗心。故選 (D)。`},{qNo:23,stem:`作者說「今世舉學者多似此類」。下列哪一種情形，最符合作者所批評的「此類」？`,options:[`引用名人的一句話，抽離原本的上下文，再加上自己的引申來支持論點`,`把老師上課時口誤說錯的公式原封不動抄進筆記，考試時照著寫而答錯`,`讀古文遇到不懂的字，查了字典才弄懂整句的意思`,`讀完一篇文章後，寫出與作者相同的結論`],answer:`A`,explanation:`【解析】燕相把無意中寫錯的「舉燭」，自行引申為「舉賢而任之」，結果與原意無關。抽離上下文再自行引申名言，正是過度解讀、背離原意的做法。（B）照抄錯誤像郢人「過書」的失誤，但作者批評的對象是燕相那樣的解讀者，不是寫錯的人；（C）查字典理解原意，正是作者所期待的讀法；（D）與作者結論相同，表示讀懂原意，與穿鑿附會相反。故選 (A)。`},{qNo:24,stem:`關於第三段「我」的心情，下列敘述何者最恰當？`,options:[`「我」希望阿姨退賽，其實是把自己過去被套圈的難堪投射到阿姨身上`,`「我」捏扁紙杯，是因為觀眾離場、比賽拖延，工作時間被迫拉長而煩躁`,`「我」擔心阿姨年紀大、體力不支，出於關心而希望她退賽`,`「我」此時已理解阿姨堅持跑完的意義，只是不知道該怎麼替她加油`],answer:`A`,explanation:`【解析】第三段「她為什麼不乾脆退賽」之後，第四段立刻說「我會這樣想，是有原因的」，接著回憶自己被套圈、半途放棄的難堪，可見希望她退賽，是因為從她身上看到了當年的自己。（B）文中沒有提到工作時間拉長，忽略了第四段交代的真正原因；（C）作者交代的原因是自己的經驗，不是擔心阿姨的體力；（D）「我」的理解發生在第六段聽到「九十秒」之後，此時尚未明白。故選 (A)。`},{qNo:25,stem:`第四段與第五段都寫到喊名字的聲音，關於這兩段的安排，下列敘述何者最恰當？`,options:[`兩段的喊聲都來自看台上的觀眾，說明觀眾對落後者的態度前後大不相同`,`第五段的喊聲愈來愈大，是因為阿姨愈跑愈快、即將追上前面的選手`,`作者藉兩段的喊聲，說明國二時的同學不如世壯運的選手有運動精神`,`以「一圈比一圈小」與「一圈比一圈大」對照，觸動「我」反省過去`],answer:`D`,explanation:`【解析】兩段用相反的句子形成對照：記憶中的喊聲漸漸消失，眼前的喊聲愈來愈大，「那聲音和我記憶裡的不一樣」一句，正是讓「我」開始反省過去的轉折。（A）第三段說觀眾席「漸漸空了」，第五段的喊聲來自裁判、熱身的選手和已跑完的阿姨，不是觀眾席；（B）阿姨落後將近兩圈，最後仍比第一名慢了將近十分鐘，並未追上；（C）作者藉對照反省自己，並沒有評比同學與選手的精神高下。故選 (D)。`},{qNo:26,stem:`關於「九十秒」，下列敘述何者最恰當？`,options:[`阿姨比第一名只慢了九十秒，可見她的表現其實不差`,`阿姨進步了九十秒，是全場進步最多的選手，因此得到眾人的掌聲`,`「我」聽了這句話以後，決定回到田徑隊，和過去的自己比賽`,`阿姨衡量自己的標準，是和過去的自己相比，與名次無關`],answer:`D`,explanation:`【解析】阿姨說「比去年在家附近練跑時，快了九十秒」，「我」隨即領悟「她一直在和……去年的自己」比賽，她在意的是自己的進步，不是名次。（A）她比第一名慢了「將近十分鐘」，九十秒是與去年的自己相比；（B）眾人的喊聲出現在她說出九十秒之前，文中也沒有比較誰進步最多；（C）末段說「我還沒有決定要不要回田徑隊」。故選 (D)。`},{qNo:27,stem:`第七段「我」寫下一句話之後「又把它劃掉了」，最可能的原因是什麼？`,options:[`這句話把阿姨說成跑得最慢的人，對阿姨不夠尊重`,`這句話仍以「被看見」衡量價值，與阿姨在乎的自我進步不同`,`「我」發現這句話太過美化，認為最後一名其實不值得被大家看見`,`「我」發現阿姨並不是最後一名，這句話不符合事實`],answer:`B`,explanation:`【解析】劃掉後緊接著說「阿姨不需要被誰看見，她要的那九十秒，在她自己的手錶上」：「被大家看見最久」仍是從旁人的目光出發，與阿姨和自己比賽的心意不同。（A）那句話說的正是「不是跑得最慢的人」，並沒有這樣說阿姨；（C）與全文肯定阿姨堅持跑完的態度相反；（D）阿姨落後將近兩圈、最後一個衝線，確實是最後一名。故選 (B)。`},{qNo:28,stem:`關於本文的寫作手法，下列敘述何者正確？`,options:[`第一段對「壯年」的誤解，在第二段看到年齡分組表時就完全消除了`,`第五段以觀眾逐漸離場的冷清，反襯阿姨的孤單`,`結尾把跑鞋從鞋櫃拿出來放在門口，表示「我」已經決定重回田徑隊`,`第四段收進鞋櫃的跑鞋，在第六段、第八段再度出現，串起「我」心境的轉變`],answer:`D`,explanation:`【解析】跑鞋在第四段被「收進鞋櫃最底層」，第六段「我」想起「鞋櫃底層那雙鞋」，第八段把鞋拿出來放在門口，一件物品貫串前後，呈現「我」由逃避到開始鬆動的轉變。（A）第二段「我」看完分組表後仍想著「一百歲還跑什麼」，誤解並未消除；（B）觀眾席「漸漸空了」寫在第三段；第五段寫的是愈來愈大的喊聲；（C）作者明說「還沒有決定」，放在門口只表示心態開始鬆動。故選 (D)。`},{qNo:29,stem:`根據表一，下列敘述何者正確？`,options:[`由 7% 升到 14% 花了約二十五年，可推知由 14% 升到 20% 也需要約二十年`,`2018 年 3 月底時，65 歲以上人口已占總人口的兩成`,`由 14% 升到 20% 所花的時間不到八年，比由 7% 升到 14% 所花的時間短得多`,`1993 年時，65 歲以上人口比率已經超過「高齡社會」的門檻`],answer:`C`,explanation:`【解析】2018 年 3 月到 2025 年 12 月不到八年，1993 年到 2018 年約二十五年，後一段明顯短得多，表示老化速度加快。（A）以前一段的速度推估後一段，與表中實際只花不到八年不符；（B）2018 年 3 月底是 14.05%，約七分之一，還不到兩成；（D）1993 年跨過的是 7% 的「高齡化社會」門檻，不是 14% 的「高齡社會」。故選 (C)。`},{qNo:30,stem:`綜合表二與文字資料，下列推論何者正確？`,options:[`0～14 歲人口的比率，大約是 65 歲以上人口比率的三分之一`,`把 15～64 歲視為工作年齡人口，則約每 3.4 位對應 1 位 65 歲以上長者`,`全國 22 個縣市中，65 歲以上人口比率超過 20% 的還不到一半`,`依 467 萬 3155 人占 20.06% 推算，全國總人口大約是 2000 萬人`],answer:`B`,explanation:`【解析】68.43% ÷ 20.06% ≈ 3.4，約每 3.4 位工作年齡人口對應 1 位長者。（A）11.51% ÷ 20.06% ≈ 0.57，約為五分之三，不是三分之一；（C）14 個縣市已超過一半（22 的一半是 11）；（D）467 萬 ÷ 0.2006 ≈ 2330 萬人，不是 2000 萬人。故選 (B)。`},{qNo:31,stem:`某報想根據這些資料下一則新聞標題。下列標題，何者最能被資料支持而沒有誇大或錯誤？`,options:[`從高齡社會到超高齡社會　臺灣只花五年`,`長者破兩成　臺灣正式邁入超高齡社會`,`全臺過半縣市　長者比率仍未達兩成`,`長者人數已是兒童的三倍以上`],answer:`B`,explanation:`【解析】2025 年底 65 歲以上人口占 20.06%，超過兩成，符合「超高齡社會」的標準。（A）2018 年 3 月到 2025 年 12 月將近八年，不是五年；（C）已有 14 個縣市超過兩成，未達兩成的只有 8 個，不到一半；（D）20.06% ÷ 11.51% ≈ 1.7，長者約是兒童的 1.7 倍，不到三倍。故選 (B)。`},{qNo:32,stem:`關於甲、乙兩文，下列敘述何者最恰當？`,options:[`甲文批評正式救災系統的動作太慢，乙文則替救災系統的調度方式辯護`,`兩文都認為前往災區的志工人數愈多，清淤救災的效果就會愈好`,`乙文建議志工自備便當與飲水，以免造成災區的負擔`,`甲文以志工抵達之快肯定民間力量，乙文在肯定之餘，提醒熱心須配合協調`],answer:`D`,explanation:`【解析】甲文稱志工是「最珍貴的力量」、熱情「最快抵達」；乙文先「感謝每一位前來的志工」，再提醒「熱心需要方法」。（A）甲文只說救災系統「還在調度」，用來襯托民間的快，並未批評；乙文也沒有替救災系統辯護；（B）乙文正是擔心大批志工同時湧入會塞住道路；（C）乙文要志工自備的是手套、雨鞋與飲水，沒有提到便當，細節不符。故選 (D)。`},{qNo:33,stem:`若乙文作者要回應甲文「民間的熱情總是最快抵達」這句話，下列哪一種說法最符合乙文的觀點？`,options:[`快固然可貴，但若缺乏協調，抵達的熱情也可能成為災區的負擔`,`熱情抵達得愈快，災區就愈容易陷入混亂，所以應該減少志工`,`只要志工都自備裝備，就不會對災區造成任何負擔`,`專業救災人員才是唯一能真正幫上忙的人，民間志工其實不必前往`],answer:`A`,explanation:`【解析】乙文不否定志工的熱忱與速度，而是提醒「熱心需要方法」，沒有分配時「熱情就可能變成災區額外的負擔」。（B）乙文主張的是登記與分派，不是減少志工，也沒有說「快」本身造成混亂；（C）乙文提到的負擔還包括道路堵塞、廁所與休息空間，自備裝備只是其中一項建議，「不會造成任何負擔」過度推論；（D）乙文感謝志工，並未主張民間不必前往。故選 (A)。`},{qNo:34,stem:`小婷看了兩篇文章後，也想到災區幫忙。下列哪一種做法，最符合乙文的建議？`,options:[`先向負責單位登記，依分派的時間地點前往，並自備雨鞋、手套與飲水`,`看到網路號召就立刻出發，到現場再找需要幫忙的地方`,`自行採買大量便當開車送進災區，讓大家自由取用`,`號召全班同學一起請假，搭火車前往災區，人愈多愈能幫上忙`],answer:`A`,explanation:`【解析】乙文建議出發前先登記、依分派前往、自備裝備與飲水並聽從指揮，正符合這個做法。（B）未經協調就前往，正是乙文擔心的情況；（C）自行開車送物資，可能造成道路堵塞，也沒有經過分配；（D）乙文提醒人潮過多反而會堵塞道路，「人愈多愈好」與其觀點相反。故選 (A)。`},{qNo:35,stem:`關於這首詩，下列敘述何者最恰當？`,options:[`紙面最後乾乾淨淨，表示「我」已經不再犯錯`,`「像什麼也沒發生」說明那些錯誤其實從來不曾存在`,`橡皮擦愈盡責，紙面愈乾淨，它的付出也就愈不容易被看見`,`「它一生都在後退」暗示橡皮擦遇到困難時總是退縮、不敢面對`],answer:`C`,explanation:`【解析】橡皮擦「走過的路」就是被擦乾淨的地方，它把自己磨小，換來紙上「像什麼也沒發生」；工作做得愈好，痕跡愈少，所以「我」要到它「小得握不住」時才發現它的付出。（A）紙面乾淨是因為錯誤被擦掉，不代表不再犯錯；（B）「像」字表示只是看起來沒發生，錯誤曾經存在、被收回了；（D）「後退」寫的是擦拭的動作與自我消耗，不是退縮。故選 (C)。`},{qNo:36,stem:`若用這首詩來比喻人，最適合比喻哪一種人？`,options:[`勇於承認自己的錯誤，並且不斷改進自己的人`,`替別人隱瞞錯誤、不讓真相曝光的人`,`默默替別人收拾錯誤、消耗自己卻不留下名聲的人`,`事先教導別人如何避免犯錯、懂得防患未然的人`],answer:`C`,explanation:`【解析】橡皮擦「把自己磨掉」「替我收回」錯誤，成果卻「乾淨得像什麼也沒發生」，正像默默為人付出、不求被看見的人。（A）詩中犯錯的是「我」，橡皮擦是替人收拾，不是自己認錯改進；（B）把「不敢讓人看見」解讀成隱瞞真相，忽略了詩中溫暖感念的語氣；（D）橡皮擦是在錯誤發生「之後」收回，不是事先預防。故選 (C)。`},{qNo:37,stem:`本文的主要論點是什麼？`,options:[`遊戲場應保留可承受的風險，讓孩子在嘗試中學會判斷危險`,`遊戲場的風險愈高，孩子學會判斷危險的速度就愈快`,`為了讓孩子學會判斷危險，大人應該減少對孩子的叮嚀`,`孩子在遊戲場裡受傷本來就在所難免，家長不必追究任何責任`],answer:`A`,explanation:`【解析】第一段提出「完全沒有風險的遊戲場，反而可能讓孩子更不安全」，第三段限定為「看得見、可承受」的風險，第五段總結「不如讓它保留一點坡度」。（B）作者只主張保留「可承受」的小風險，並未說風險愈高愈好；（C）第二段說判斷危險不是靠叮嚀，是為了強調嘗試的重要，並沒有主張減少叮嚀；（D）第三段承認「誰負責」的擔心可以理解，並未說不必追究。故選 (A)。`},{qNo:38,stem:`第三段在全文論證中的作用是什麼？`,options:[`以反問句強化論點，指出受傷的責任應由設施的設計者承擔`,`先承認反方的顧慮，再限定自己主張的範圍，以化解可能的誤解`,`提出折衷方案，在安全與冒險之間各退一步，不再堅持原本的論點`,`舉出現行的設計規範為例，證明目前的遊戲場已經足夠安全`],answer:`B`,explanation:`【解析】第三段先引出「萬一受傷了，誰負責？」並說「這樣的擔心可以理解」（讓步），再說明自己主張的是「看得見、可承受」的風險，而非放任冒險，澄清立場。（A）這個問句是反方的質疑，作者沒有藉它討論責任歸屬；（C）作者的確提出管理風險的做法，但第五段仍主張「保留一點坡度」，並未放棄原本的論點；（D）「高度有限、地面有緩衝」是作者心目中的做法，不是用來證明現況已經安全，作者正是不滿現況。故選 (B)。`},{qNo:39,stem:`第四段的推論要能成立，必須先接受下列哪一個前提？`,options:[`遊戲場鋪設的軟墊，反而會讓孩子跌倒時更容易受傷`,`孩子只要在遊戲場受過一次傷，以後就再也不會犯同樣的錯`,`馬路邊與溪流旁的各種危險，都可以在遊戲場裡完整地模擬出來`,`孩子遲早會遇到真正的危險，而應付危險的能力需要事先累積經驗`],answer:`D`,explanation:`【解析】第四段說孩子「終究會在別處」面對危險，而那時「沒有任何經驗可用」，隱含的前提是：危險終究會遇到，且判斷危險的能力要靠事先的經驗累積。（A）作者沒有說軟墊有害，只是反對完全消除風險；（B）第二段說經驗要「一次次」累積，「受一次傷就不再犯」過度簡化，也不是第四段需要的前提；（C）作者只需要經驗能累積、能遷移，不需要遊戲場「完整模擬」真正的危險，這個前提過強。故選 (D)。`},{qNo:40,stem:`下列哪一項研究發現若成立，最能削弱本文的主張？`,options:[`在保留適度高度的遊戲場裡，孩子受輕傷的次數略有增加`,`許多公園鋪設的軟墊容易磨損，每年都需要花費大筆經費更新`,`孩子在遊戲場跌倒的經驗，無助於他們在馬路或溪邊判斷危險`,`問卷顯示，多數家長仍希望孩子在遊戲場裡玩得更安全`],answer:`C`,explanation:`【解析】本文的推論建立在「遊戲場累積的經驗，能幫助孩子面對別處的真正危險」之上；若這種經驗無法遷移，第四段的推論就失去根據，主張也隨之動搖。（A）作者本來就承認「偶爾摔一跤」，小傷略增在他的預期之內，削弱不了主張；（B）軟墊經費與孩子能否學會判斷危險無關；（D）家長的期望是意見，不能證明作者的推論錯誤，第三段也已回應這種擔心。故選 (C)。`},{qNo:41,stem:`陳先生（40 歲）用一個帳號，替自己、5 歲還沒上學的女兒、出示學生證的國中生兒子，以及 70 歲的父親報名。依照須知，他應付的總金額是多少？`,options:[`150 元`,`250 元`,`300 元`,`350 元`],answer:`B`,explanation:`【解析】陳先生 100 元；5 歲女兒沒有學生證，須知中也沒有兒童免費的規定，付全額 100 元；兒子出示學生證半價 50 元；70 歲父親免費。共 100 + 100 + 50 + 0 = 250 元，四人也沒有超過一個帳號 4 人的上限。（A）誤以為兒童免費（100 + 0 + 50 + 0）；（C）漏算兒子的學生半價（100 + 100 + 100 + 0）；（D）把父親也算成全額（100 + 100 + 50 + 100）。故選 (B)。`},{qNo:42,stem:`某次活動訂在週六舉行。下列四組報名者各自的情形，何者實際拿回的退費金額最多？`,options:[`三位出示學生證的國中生在週四上網取消`,`三位成人與一位出示學生證的學生在週五上網取消`,`兩位成人在週三上網取消`,`四位成人因當天改為星象劇場，決定不去而沒有到場`],answer:`C`,explanation:`【解析】須知寫明週六的活動須在週三或更早取消才全額退費，週三取消可拿回 2 × 100 = 200 元。（A）週四取消只退一半：3 × 50 ÷ 2 = 75 元；（B）週五取消只退一半：（3 × 100 + 50）÷ 2 = 175 元，比 200 元少；（D）改為星象劇場不另行退費，未到場也不退費：0 元。故選 (C)。`}],verification:[`2026-10-09 第一版經兩個模型盲解（Opus 42/42、Sonnet 41/42，第 18 題「坐無虛席」有異體爭議），以 114 年真題校準後難度低於真題（真題 Opus 2.67；本卷 2.50），依 SPEC_AI2_AI3.md 重寫多數單題與題組題，並改正「正解常是最長選項」的線索。`,`2026-10-09 重寫版獨立作答 Opus 42/42、Sonnet 42/42；第 21 題「說之」注本分歧（解釋／通悅）改問郢書燕說的寓意；第 42 題退費規則寫明日期；第 12 題伯俞泣杖跳過各版本有出入的「（之）力（衰）」以「……」節略。`,`2026-10-09 修正後重新獨立作答：Claude Opus 42/42、Claude Sonnet 42/42 與答案卷一致，0 題有異議。難度（同一評分標準）：114 年真題 2.67、本卷 Opus 2.60／Sonnet 2.64。`,`2026-10-09 文言文（列子、韓非子、夢溪筆談、說苑）由獨立查核者以維基文庫原文逐字比對一致；時事（世壯運、超高齡社會、馬太鞍溪與鏟子超人）以網路來源確認。tools/check_ai_set.py 0 問題。`,`2026-10-09 最終複查（定稿前）：獨立稽核者（Claude Opus）拿答案與解析逐題核對（答案唯一性、計算、事實、附圖、文字），另由 Claude Opus 與 Claude Sonnet 各自重新盲解全卷，答案全部與答案卷一致；稽核指出的解析措辭、誘答與解析不一致、真實事件的相對時間（改為確切年份）與文言異文（以多版本比對後採通行本）均已修正，修正過的題目再由兩個模型重新盲解一致；答案卷未變動。`]},Ja={set:`AI-2`,year:902,subject:`英文`,title:`AI-2 英語（閱讀）模擬卷（進階）`,difficulty:`進階`,note:`由 AI 依會考英語科架構編寫（單題：需讀懂前後文的字彙語法；題組：篇章理解，含克漏字與雙文本），難度較會考略高：推論、指涉、作者目的、整合文字與表格、把文章的規則套用到新情況，並以 2025–2026 年真實事件為素材；非會考真題。`,topics:[`Alex Honnold 徒手攀登台北 101（2026-01-25，因雨延後一天、約 1.5 小時、Netflix 延遲約 10 秒直播；Alain Robert 2004 年用安全繩約 4 小時；台北 101 在 2010 年杜拜哈里發塔啟用前為世界最高）：https://en.wikipedia.org/wiki/Skyscraper_Live_(2026)`,`Honnold 攀登時間約 1 小時 31 分：https://scmp.com/sport/outdoor/extreme-sports/article/3341157/us-climber-hopes-ascent-taipei-101-inspires-others-use-time-most-meaningful-way`,`星際彗星 3I/ATLAS（2025-07-01 智利 ATLAS 望遠鏡發現、第三個星際天體、距地球最近約 2.7 億公里、火星軌道探測器觀測）：https://science.nasa.gov/solar-system/comets/3i-atlas/`,`3I/ATLAS 速度約每秒 60 公里、前兩個星際天體 2017 ʻOumuamua、2019 Borisov：https://www.sci.news/astronomy/interstellar-object-3i-atlas-14041.html`,`珍古德 2025-10-01 逝世（91 歲、美國巡迴演講中）、1960 年 26 歲赴坦尚尼亞 Gombe、無大學學位、為黑猩猩命名、工具使用發現、1991 年創 Roots & Shoots（多年來擴及一百多國）：https://en.wikipedia.org/wiki/Jane_Goodall`,`Gombe 黑猩猩研究至 2025 年持續 65 年：https://news.janegoodall.org/2025/07/08/gombe-chimpanzee-research-65-year/`,`珍古德逝世報導：https://www.scrippsnews.com/obituaries/primatologist-jane-goodall-has-died-at-age-91`,`科學博物館夜間活動、農場體驗廣告與 email、學習手語、圖書館留言、營養午餐廚餘實驗、「無聊」的好處：虛構生活情境`],groups:[{from:16,to:17,passage:`Riverside Science Museum

• 門票可在網路或服務臺購買。網路購票須在活動當天下午 3:00 前完成。`},{from:18,to:20,passage:`On the morning of January 25, 2026, people around the world held their breath as American climber Alex Honnold began to climb the outside of Taipei 101—without a rope. The 508-meter building was the tallest in the world until the Burj Khalifa opened in Dubai in 2010, and in 2026 it was still the tallest in Taiwan.
Honnold, then 40, is famous for "free soloing": climbing with only his hands and feet and no safety equipment at all. In 2017, he became the first person to free solo El Capitan, a huge rock wall in the United States. Before Taipei 101, almost all of his famous climbs had been on natural rock, so a skyscraper of glass and metal was a very different kind of challenge. The climb was planned for January 24, but it was put off for a day because of rain.
The climb was shown live on Netflix. However, the broadcast was not completely "live." It ran about ten seconds behind real time. That way, the people running the show could stop the pictures if anything terrible happened.
Honnold reached the top in about an hour and a half. He was not the first person to climb the building, though. In 2004, French climber Alain Robert had done it too, but he used a safety rope, and it took him about four hours in heavy rain.
Not everyone enjoyed the show. Some viewers said that watching one man climb for ninety minutes became boring after a while, and others complained that the hosts talked too much. Still, for many people in Taiwan, it was a proud moment to see a building they knew so well become the stage for one of the world's most famous climbers.
* skyscraper 摩天大樓；broadcast 播出的節目`,translation:`2026 年 1 月 25 日早上，美國攀岩家艾力克斯．霍諾德開始在不用繩索的情況下攀爬台北 101 的外牆，全世界的人都屏住了呼吸。這棟 508 公尺高的大樓在 2010 年杜拜的哈里發塔啟用之前是世界最高的建築，2026 年時仍是臺灣最高的大樓。
當時 40 歲的霍諾德以「徒手獨攀」聞名：只用手和腳攀爬，完全不用任何安全裝備。2017 年，他成為第一個徒手獨攀美國巨大岩壁「酋長岩」的人。在台北 101 之前，他著名的攀登幾乎都是在天然岩壁上，所以一棟由玻璃和金屬構成的摩天大樓是完全不同的挑戰。這次攀登原訂在 1 月 24 日，但因為下雨延後了一天。
這次攀登在 Netflix 上直播。不過，這個節目並不是完全「即時」的，它比實際時間晚大約十秒播出。這樣一來，萬一發生可怕的事，製作節目的人就能把畫面切掉。
霍諾德大約花了一個半小時登頂。不過，他並不是第一個爬上這棟大樓的人。2004 年，法國攀岩家亞倫．羅伯特也爬過，但他用了安全繩，而且在大雨中花了大約四個小時。
並不是每個人都喜歡這個節目。有些觀眾說，看一個人爬九十分鐘，看久了會覺得無聊；也有人抱怨主持人話太多。儘管如此，對許多臺灣人來說，看到一棟自己這麼熟悉的大樓成為世界知名攀岩家的舞臺，是令人驕傲的一刻。`},{from:21,to:23,passage:`[Advertisement]

Hannah`},{from:24,to:26,passage:`On July 1, 2025, a telescope in Chile spotted a faint object moving across the night sky. At first, it looked like an ordinary comet—a ball of ice and dust that grows a bright tail as it gets close to the Sun. But when scientists worked out its path, they realized something surprising: it did not belong to our solar system at all. It had come from the space between the stars.
The comet was named 3I/ATLAS. The "I" stands for "interstellar," which means "between the stars," and the "3" shows that it is only the third such visitor ever found. The first, 'Oumuamua, was discovered in 2017, and the second, Borisov, in 2019. ATLAS is the name of the telescope system that found it.
Why do visitors like this excite scientists so much? Every comet carries material from the place where it was formed. The comets of our own solar system tell us how our Sun and planets were born. 3I/ATLAS, however, was formed around a different star, perhaps billions of years ago. Studying it is a little like opening a letter from a faraway place that no one can travel to.
The comet was moving at about 60 kilometers per second—far too fast for the Sun's gravity to hold on to it. It will never come back. That gave scientists only a few months to study it before it disappeared into deep space, so telescopes on Earth and even spacecraft around Mars were turned toward it.
Some people online worried that it might hit Earth. It never came close: even at its nearest, it was about 270 million kilometers away.
* comet 彗星；gravity 重力；spacecraft 太空船`,translation:`2025 年 7 月 1 日，智利的一座望遠鏡發現一個黯淡的天體在夜空中移動。一開始，它看起來像一顆普通的彗星——一團冰和塵埃，靠近太陽時會長出明亮的尾巴。但科學家算出它的路徑後，發現了一件令人驚訝的事：它根本不屬於我們的太陽系，而是來自恆星與恆星之間的太空。
這顆彗星被命名為 3I/ATLAS。「I」代表 interstellar，意思是「星際的」；「3」表示它是有史以來發現的第三個這樣的訪客。第一個是 2017 年發現的 'Oumuamua，第二個是 2019 年發現的 Borisov。ATLAS 則是發現它的望遠鏡系統的名稱。
為什麼這樣的訪客讓科學家這麼興奮？每顆彗星都帶著它形成之處的物質。我們太陽系的彗星能告訴我們太陽和行星是怎麼誕生的；然而 3I/ATLAS 是在另一顆恆星周圍形成的，可能是在數十億年前。研究它有點像打開一封從沒有人能去的遠方寄來的信。
這顆彗星以每秒大約 60 公里的速度移動，快到太陽的重力根本抓不住它，它永遠不會再回來。這讓科學家只有幾個月的時間可以在它消失於深太空之前研究它，所以地球上的望遠鏡，甚至環繞火星的太空船都轉向了它。
網路上有些人擔心它會撞上地球。它從來沒有靠近過：即使在最近的時候，它離地球也大約有 2 億 7 千萬公里。`},{from:27,to:31,passage:`When Yi-ting joined our class last fall, most of us didn't know how to talk to her. She was born deaf, and she uses Taiwanese Sign Language. At first, we just smiled and waved whenever we saw her. __27__, a smile alone is not enough to build a real friendship, and after a few weeks she usually ate lunch by herself.
One day, I asked her to teach me a few signs. She looked surprised, and then she laughed. __28__ The first sign she taught me was "friend," and I practiced it all the way home.
After that, a few other classmates started joining us at lunch. Yi-ting was a patient teacher, but she was also strict. If we made a sign too quickly or carelessly, she made us do it again. Later we found out why: __29__.
By the end of the semester, ten of us could have simple conversations with her. Our homeroom teacher was so impressed that she invited a sign language teacher to give the whole class a lesson.
Now, whenever I see people signing to each other on the MRT, I no longer look away. __30__, I try to catch a word or two that I know. I used to think Yi-ting was the one who needed to learn how to fit in with us. Now I know it was the other way around: __31__.
* deaf 聽障的；sign 手語的手勢；sign language 手語`,translation:`去年秋天怡婷轉進我們班的時候，我們大多數人都不知道怎麼跟她說話。她天生聽障，使用臺灣手語。一開始，我們每次看到她都只是微笑、揮手。然而，光靠微笑不足以建立真正的友誼，幾個星期後，她午餐通常都是一個人吃。
有一天，我請她教我幾個手語。她看起來很驚訝，接著笑了出來。後來她告訴我，以前從來沒有同學這樣問過她。她教我的第一個手語是「朋友」，我一路練習到回家。
在那之後，又有幾個同學開始在午餐時加入我們。怡婷是個有耐心的老師，但也很嚴格。如果我們比得太快或太隨便，她就會要我們重做。後來我們才知道原因：手的形狀只要稍微改變，就可能把一個詞變成完全不同的另一個詞。
到學期結束時，我們有十個人能和她進行簡單的對話。我們的導師非常佩服，還請了一位手語老師來幫全班上一堂課。
現在，每當我在捷運上看到有人用手語交談，我不再把視線移開；相反地，我會試著看懂一兩個我認得的詞。我以前以為怡婷才是需要學習如何融入我們的人。現在我知道事實正好相反：我們才是需要學習如何走近她的人。`},{from:32,to:34,passage:`When Jane Goodall arrived at Gombe in Tanzania in July 1960, she was 26 years old and had no university degree. Many scientists did not take her seriously. They believed that only well-trained researchers could do real science.
Goodall, however, had something else: patience. Day after day, she sat quietly in the forest, waiting for the shy chimpanzees to get used to her. It took months before they let her come close. Then one day, she saw a chimpanzee push a long piece of grass into a termite hill and pull it out, covered with termites to eat. Later, she saw chimpanzees take the leaves off small branches to make the same kind of tool. At that time, most scientists believed that only humans made and used tools. Her discovery changed that belief.
Goodall also did something that other scientists didn't like. Instead of giving the chimpanzees numbers, she gave them names, such as David Greybeard, and wrote about their personalities and feelings. Some experts said this was not scientific. Today, however, many researchers agree that animals do have personalities.
In her later years, Goodall spent less time in the forest and more time traveling—sometimes nearly 300 days a year—to speak about protecting animals and the environment. In 1991, she started Roots & Shoots, a program for young people that began with just 12 teenagers in Tanzania and, over the years, spread to more than 100 countries.
She was on a speaking tour in the United States when she died on October 1, 2025, at the age of 91. The research she started at Gombe was still going on in 2025, 65 years after it began.
* chimpanzee 黑猩猩；termite 白蟻；personality 個性`,translation:`1960 年 7 月，珍．古德抵達坦尚尼亞的 Gombe 時，她 26 歲，沒有大學學位。許多科學家並不把她當一回事，他們認為只有受過良好訓練的研究人員才能做真正的科學研究。
然而，古德擁有別的東西：耐心。她日復一日安靜地坐在森林裡，等待害羞的黑猩猩習慣她的存在。過了好幾個月，牠們才讓她靠近。後來有一天，她看到一隻黑猩猩把一根長草伸進白蟻丘，再拉出來，上面沾滿了可以吃的白蟻。之後她又看到黑猩猩把小樹枝上的葉子拔掉，做成同樣的工具。在那個年代，大多數科學家認為只有人類會製造和使用工具，她的發現改變了這個看法。
古德還做了一件其他科學家不喜歡的事。她沒有給黑猩猩編號，而是幫牠們取名字，例如「灰鬍子大衛」，並描寫牠們的個性和情感。有些專家說這樣不科學。然而今天，許多研究者都同意動物確實有個性。
晚年的古德待在森林的時間變少，花更多時間到各地旅行——有時一年將近 300 天——宣講保護動物與環境。1991 年，她創立了「根與芽」，一個為年輕人設立的計畫，一開始只有坦尚尼亞的 12 個青少年，多年來擴展到一百多個國家。
2025 年 10 月 1 日她過世時，正在美國進行巡迴演講，享壽 91 歲。她在 Gombe 開始的研究到 2025 年仍在進行，已經持續了 65 年。`},{from:35,to:37,passage:`Every Tuesday after school, Wei-lun went to the city library to study. One afternoon, he took an old book about birds off the shelf, and a small piece of paper fell out. On it, someone had written: "If you found this, you must love birds too. Page 87 has the best picture in the book."
Wei-lun turned to page 87. It showed a small bird with a bright yellow chest, sitting on a branch in the rain. Under the message, he wrote his own: "Agreed! But page 112 is even better." He put the note back and returned the book to the shelf.
The next Tuesday, he couldn't wait to check. The note was still there, and a new line had been added: "You're right. Have you ever seen one in real life? I saw one at the river park last spring."
For two months, Wei-lun and the stranger wrote to each other in the book. They talked about birds, school, and their favorite places in the city. Wei-lun never tried to find out who the writer was. He was afraid that if he did, the magic would disappear.
Then one Tuesday, the book was gone. Someone had borrowed it. Wei-lun felt surprisingly sad. When it came back two weeks later, he opened it with shaking hands. The note was still there, with one last line: "My family and I are moving to Tainan. Thank you for being my friend this year. —Grandpa Lin, the man who reads by the window"
Wei-lun looked up. The chair by the window, where an old man had sat every Tuesday, was empty.`,translation:`每個星期二放學後，偉倫都會到市立圖書館讀書。有一天下午，他從書架上拿下一本關於鳥類的舊書，一張小紙條掉了出來。上面有人寫著：「如果你找到這張紙條，你一定也喜歡鳥。第 87 頁有這本書裡最棒的圖。」
偉倫翻到第 87 頁，上面是一隻胸前亮黃色的小鳥，在雨中停在樹枝上。他在那段話下面寫了自己的留言：「同意！不過第 112 頁更棒。」他把紙條放回去，把書放回書架。
下個星期二，他迫不及待地去看。紙條還在，而且多了一行字：「你說得對。你在現實中看過這種鳥嗎？我去年春天在河濱公園看過一隻。」
兩個月來，偉倫和這位陌生人在書裡互相寫信。他們聊鳥、聊學校，也聊他們在城市裡最喜歡的地方。偉倫從來沒有試著查出寫字的人是誰，他怕一旦知道了，那種魔力就會消失。
後來有一個星期二，那本書不見了，有人把它借走了。偉倫感到出乎意料地難過。兩個星期後書回來了，他用顫抖的手打開。紙條還在，上面多了最後一行：「我要和家人搬到臺南了。謝謝你這一年當我的朋友。——林爺爺，那個在窗邊看書的人」
偉倫抬起頭。窗邊那張每個星期二都坐著一位老先生的椅子，空著。`},{from:38,to:40,passage:`Last semester, the student council at Hsin-yi Junior High noticed that a lot of school lunch was ending up in the trash. To find out why, they first asked 600 students to fill out a survey. Only 15% said the food did not taste good. The most common answers were "I don't have enough time to finish" and "They give me too much rice."
Next, the council tested three changes, each for three weeks. Each change was tested on its own: when a new change started, the one before it stopped. Every day, they weighed the food that was thrown away after lunch. To keep the test fair, the school served the same weekly menu for all twelve weeks.
| Weeks | What was different | Food waste (kg per day) |
| 1–3 | Nothing (normal lunch) | 48 |
| 4–6 | Students chose a small, medium, or large serving of rice | 39 |
| 7–9 | Lunch time was 10 minutes longer | 41 |
| 10–12 | Vegetables were served before the meat | 46 |
In their report, the council suggested keeping the two changes that had worked best. The principal agreed to one of them right away. The other, she said, would be harder, because all the afternoon classes would have to start later, and the school buses would have to leave later, too.`,translation:`上學期，信義國中的學生會注意到很多營養午餐最後都進了垃圾桶。為了找出原因，他們先請 600 名學生填寫問卷，只有 15% 說飯菜不好吃，最常見的回答是「我沒有足夠的時間吃完」和「他們給我太多飯了」。
接著，學生會測試了三種改變，每種為期三週。每種改變都單獨測試：新的改變開始時，前一個就停止。每天午餐後，他們都秤量被倒掉的食物。為了讓測試公平，學校這十二週都供應同一套每週菜單。
週次｜不同之處｜廚餘量（每天公斤數）
1–3｜沒有改變（一般午餐）｜48
4–6｜學生可以選擇小、中、大份的飯｜39
7–9｜午餐時間延長 10 分鐘｜41
10–12｜先供應蔬菜，再供應肉類｜46
在報告中，學生會建議保留效果最好的兩項改變。校長立刻同意了其中一項；至於另一項，她說比較困難，因為下午所有的課都必須延後開始，校車也得延後發車。`},{from:41,to:43,passage:`Last summer, my parents made a strange rule: for one hour every afternoon, I could not use any screens, and they would not give me anything to do. "Just be bored," my mom said. I thought it was the worst idea I had ever heard.
For the first few days, I lay on the sofa and complained. The clock seemed to stop. But near the end of the first week, something changed. Because there was nothing to fill the time, my mind started to fill it by itself. I began to notice things: the sound of the neighbor's radio, the way the light moved slowly across the wall. One afternoon, I picked up a pencil and started drawing the old tree outside our window. I didn't stop for two hours.
Some scientists say this is no accident. When we are bored, our brains do not simply switch off. Instead, they begin to wander, and this "wandering" can lead to new ideas. If we reach for our phones the moment we feel bored, we may never give our minds the chance to wander far enough.
I'm not saying screens are bad. I still watch videos and play games online with my friends. But I've learned that boredom is not an enemy to run away from. It is more like an empty room: at first it feels uncomfortable, but it is also the only place where something new can be built.
By the way, I'm still drawing. My sketchbook is almost full.

【解析】時間和地點各改了一次：班機改了，時間從星期四下午改成「星期五早上」；那天早上體育館有排球賽，地點從體育館改到「圖書館」。(A) 地點對了，但星期四下午是原本的時間；(B) 時間對了，但體育館那天早上要比排球，已改到圖書館。（COP30 聯合國氣候大會於 2025 年 11 月在巴西貝倫舉行。）故選 (C)。`,transcript:[[`N`,`Good afternoon, students. In November 2025, a big United Nations meeting on climate change was held in Belém, a city in the Amazon area of Brazil. Dr. Lin, a scientist who went to the meeting, will visit our school to tell us what she saw there. The talk was planned for Thursday afternoon in the gym. However, Dr. Lin's flight has been changed, so the talk will now be on Friday morning at ten. And because the volleyball games will be held in the gym that morning, the talk will move to the library. The library has only eighty seats, so please sign up at the school office by Wednesday. Students who don't get a seat can watch the talk on the TV in their classroom.`],[`Q`,`When and where will the talk be held?`]]},{qNo:16,stem:``,options:[`Add the Paralympics and Milo to her poster.`,`Take Tina off her poster and use Milo instead.`,`Change the dates of the Olympics on her poster.`],answer:`A`,explanation:`【聽力稿】W: I'm making a poster about the Winter Olympics in Italy. Can you help me find a picture of the mascot?

【解析】男子先後說「功課很多」「可能下雨」，都被女子一一推翻；女子追問「真正的原因」，他才承認是不會游泳、怕被大家笑。(A) 功課只是藉口，女子說這星期只有一張學習單；(C) 下雨也是藉口，女子說整個週末都是晴天。故選 (B)。`,transcript:[[`W`,`You're not coming to the beach with us on Saturday? Everyone's going.`],[`M`,`I'd like to, but I have a lot of homework.`],[`W`,`Homework? We only have one worksheet this week.`],[`M`,`Well... and it might rain.`],[`W`,`It's going to be sunny all weekend. Come on. What's the real reason?`],[`M`,`OK, OK. I never learned to swim, and I don't want everyone to laugh at me.`],[`W`,`Is that all? I can teach you. My little brother learned in one afternoon.`],[`Q`,`Why didn't the man want to go to the beach?`]]},{qNo:20,stem:``,options:[`At 9:15.`,`At 9:30.`,`At 9:45.`],answer:`C`,explanation:`【聽力稿】Attention, ninth graders. Tomorrow's trip to the science park will go ahead as planned. However, because one of the roads was damaged in last week's typhoon, the bus ride will take about thirty minutes longer than the usual one hour. The buses will still leave at eight fifteen, so please be at the school gate by eight. Lunch will be served at the park, and we will start back to school at two.
